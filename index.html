<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="description" content="JLPT N3 · 每日做题与双人随身听" />
<meta name="theme-color" content="#F5F2EB" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+JP:wght@500;600&display=swap" rel="stylesheet" />
<title>N3</title>
<style>
  :root {
    /* Traditional Japanese Pigments (日本の伝統色): 生成り · 白練 · 墨 · 苔色 · 黄土 · 弁柄 */
    --washi: #F5F2EB;
    --sheet: #FCFBF8;
    --sumi: #1C1B18;
    --ink-2: #48443C;
    --ink-3: #847E72;
    --hairline: rgba(28, 27, 24, 0.09);
    --hairline-strong: rgba(28, 27, 24, 0.18);
    --track: #E5E0D5;
    --moss: #2B5F49;
    --moss-soft: rgba(43, 95, 73, 0.10);
    --ochre: #B07D3A;
    --bengara: #9E3E36;
    /* Editorial Bilingual Pairing: Japanese Literary Mincho + Clean Chinese Humanist Sans */
    --sans: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", -apple-system, BlinkMacSystemFont, sans-serif;
    --serif-jp: "Hiragino Mincho ProN", "YuMincho", "Noto Serif JP", serif;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--washi);
    color: var(--sumi);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    /* Eliminate Android Chrome Touch-to-Search Google bar on word tap */
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: calc(15px + env(safe-area-inset-top)) 28px calc(18px + env(safe-area-inset-bottom));
  }

  .zen-shell {
    width: 100%;
    max-width: 496px;
    height: 100%;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  @media (min-width: 860px) {
    body { padding: 34px 48px 34px; }
    .zen-shell { max-width: 590px; }
    .zen-shell.wide-mode { max-width: 800px; }
  }

  button {
    font-family: inherit;
    white-space: nowrap;
    background: none;
    border: none;
    padding: 0;
    color: inherit;
    cursor: pointer;
  }

  /* ================= 1. STRICT GRID HEADER ================= */
  .zen-header {
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--hairline);
  }

  .zen-brand {
    font-size: 15px;
    font-weight: 500;
    color: var(--ink-3);
    letter-spacing: 0.06em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .zen-brand strong {
    font-weight: 600;
    color: var(--sumi);
    margin: 0 2px;
  }

  .zen-nav {
    display: flex;
    align-items: baseline;
    gap: 24px;
  }
  .nav-link {
    font-size: 16.5px;
    font-weight: 500;
    color: var(--ink-3);
    letter-spacing: 0.04em;
    padding-bottom: 5px;
    position: relative;
    transition: color 0.2s ease;
  }
  .nav-link.active {
    color: var(--sumi);
    font-weight: 600;
  }
  .nav-link.active::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -15px;
    height: 1.5px;
    background: var(--sumi);
  }
  .nav-link.is-playing {
    color: var(--moss);
  }

  /* ================= 2. THREE ZEN ENSO DAILY RITUALS (円相 · 无字打卡) ================= */
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  .zen-horizon {
    flex-shrink: 0;
    padding: 10px 0 9px;
    border-bottom: 1px solid var(--hairline);
    cursor: pointer;
  }
  .horizon-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--ink-3);
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
    gap: 12px;
  }
  .horizon-meta b {
    font-weight: 600;
    color: var(--sumi);
  }
  .horizon-meta b.moss {
    color: var(--moss);
  }
  .enso-trio {
    display: flex;
    align-items: center;
    gap: 11px;
  }
  .enso-btn {
    width: 30px;
    height: 30px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    padding: 0;
    transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease;
  }
  .enso-btn:active {
    transform: scale(0.91);
  }
  .enso-svg {
    width: 26px;
    height: 26px;
    display: block;
    overflow: visible;
  }
  .enso-btn.is-done .enso-svg {
    animation: ensoSettle 0.38s cubic-bezier(0.22, 1, 0.36, 1);
  }
  @keyframes ensoSettle {
    0% { transform: scale(0.88); opacity: 0.72; }
    65% { transform: scale(1.04); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  .horizon-score {
    white-space: nowrap;
    line-height: 1;
  }
  .horizon-track {
    display: none;
  }

  /* ================= 3. OPEN WASHI STAGE (余白 MA) ================= */
  .zen-panel {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .zen-panel.hidden {
    display: none;
  }

  .stage-wrap {
    position: relative;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding-top: 16px;
    animation: fadeTurn 0.18s ease-out;
  }
  @keyframes fadeTurn {
    from { opacity: 0.48; }
    to { opacity: 1; }
  }

  .meta-bar {
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    min-height: 28px;
    gap: 12px;
  }
  .overline {
    font-size: 14.5px;
    font-weight: 500;
    letter-spacing: 0.05em;
    color: var(--ink-3);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .overline.ok { color: var(--moss); font-weight: 600; }
  .overline.ng { color: var(--bengara); font-weight: 600; }
  .overline.warm { color: var(--ochre); }

  .quiet-actions {
    display: flex;
    align-items: center;
    gap: 18px;
    flex-shrink: 0;
  }
  .text-btn {
    font-size: 14.5px;
    font-weight: 500;
    color: var(--ink-2);
    letter-spacing: 0.03em;
    font-variant-numeric: tabular-nums;
    padding: 4px 0;
  }
  .text-btn.playing {
    color: var(--moss);
    font-weight: 600;
  }

  /* Center focal space on quiz/done; pin reading views (teach/result) cleanly from the top */
  .focal-space {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding: 20px 0 26px;
    scrollbar-width: none;
    -webkit-mask-image: linear-gradient(to bottom, #000 0, #000 calc(100% - 26px), transparent 100%);
    mask-image: linear-gradient(to bottom, #000 0, #000 calc(100% - 26px), transparent 100%);
  }
  .focal-space::-webkit-scrollbar { display: none; }
  .stage-quiz .focal-space > :first-child,
  .stage-done .focal-space > :first-child { margin-top: auto; }
  .stage-quiz .focal-space > :last-child,
  .stage-done .focal-space > :last-child { margin-bottom: auto; }

  .action-dock {
    flex-shrink: 0;
    padding-top: 12px;
  }

  /* Desktop vs Mobile Ergonomics:
     - Mobile (<860px): Content starts cleanly from top, interactive controls stay in bottom one-hand thumb zone.
     - Desktop (>=860px): Quiz centers optically; reading views stay anchored from top so tapping words shifts 0px. */
  @media (min-width: 860px) {
    #tutor-view .stage-wrap {
      justify-content: flex-start;
    }
    #tutor-view .focal-space {
      flex: 0 1 auto;
      justify-content: flex-start;
      padding: 22px 0 2px;
      -webkit-mask-image: none;
      mask-image: none;
    }
    #tutor-view .stage-quiz .focal-space,
    #tutor-view .stage-done .focal-space {
      margin-top: auto;
    }
    #tutor-view .action-dock {
      padding-top: 26px;
    }
    #tutor-view .stage-quiz .action-dock,
    #tutor-view .stage-done .action-dock {
      margin-bottom: auto;
    }
  }

  /* -------- TEACH VIEW -------- */
  .point-heading {
    margin: 0 0 20px;
    font-family: var(--serif-jp);
    font-size: 27.5px;
    font-weight: 600;
    line-height: 1.38;
    letter-spacing: 0.03em;
    color: var(--sumi);
  }
  .zen-pair {
    border-top: 1px solid var(--hairline);
    border-bottom: 1px solid var(--hairline);
    margin-bottom: 20px;
  }
  .zen-pair-row {
    padding: 15px 0;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .zen-pair-row + .zen-pair-row {
    border-top: 1px solid var(--hairline);
  }
  .zp-ja {
    font-family: var(--serif-jp);
    font-size: 22px;
    font-weight: 600;
    color: var(--sumi);
    letter-spacing: 0.025em;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .zp-dot {
    width: 6.5px;
    height: 6.5px;
    border-radius: 50%;
    background: var(--moss);
    flex-shrink: 0;
  }
  .zp-dot.muted {
    background: transparent;
    border: 1.5px solid var(--ink-3);
  }
  .zp-sub {
    padding-left: 16.5px;
    font-size: 16.5px;
    font-weight: 400;
    color: var(--ink-2);
    line-height: 1.6;
  }

  .example-line {
    font-family: var(--serif-jp);
    font-size: 22.5px;
    font-weight: 500;
    line-height: 1.76;
    letter-spacing: 0.03em;
    color: var(--sumi);
    white-space: pre-line;
  }
  .example-zh {
    margin: 8px 0 0;
    font-size: 17px;
    color: var(--ink-2);
    line-height: 1.62;
  }

  /* -------- QUIZ VIEW (Optimal Literary Reading Scale + Blind-Ear Listening) -------- */
  .quiz-focal {
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 116px;
  }
  .quiz-ja {
    margin: 0;
    font-family: var(--serif-jp);
    font-size: 27px;
    font-weight: 600;
    line-height: 1.74;
    letter-spacing: 0.035em;
    color: var(--sumi);
  }
  @media (min-width: 860px) {
    .quiz-ja { font-size: 30px; }
  }

  .listen-medallion-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 0;
  }
  .listen-medallion {
    width: 82px;
    height: 82px;
    border-radius: 50%;
    border: 1px solid var(--hairline-strong);
    background: var(--sheet);
    color: var(--sumi);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.2s ease, transform 0.15s ease;
  }
  .listen-medallion:active { transform: scale(0.96); }
  .listen-medallion.speaking {
    border-color: var(--moss);
    color: var(--moss);
  }
  .med-ic { width: 27px; height: 27px; margin-left: 2px; }
  .med-waves { display: none; align-items: center; gap: 3.5px; height: 24px; }
  .listen-medallion.speaking .med-ic { display: none; }
  .listen-medallion.speaking .med-waves { display: flex; }
  .med-waves span {
    width: 2.5px;
    height: 8px;
    background: var(--moss);
    animation: zenWave 0.9s ease-in-out infinite;
  }
  .med-waves span:nth-child(2) { animation-delay: 0.16s; }
  .med-waves span:nth-child(3) { animation-delay: 0.32s; }
  @keyframes zenWave {
    0%, 100% { height: 6px; opacity: 0.45; }
    50% { height: 20px; opacity: 1; }
  }

  .choice-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .zen-choice {
    width: 100%;
    min-height: 62px;
    padding: 14px 22px;
    background: var(--sheet);
    border: 1px solid var(--hairline-strong);
    border-radius: 8px;
    font-family: var(--serif-jp);
    font-size: 22.5px;
    font-weight: 500;
    color: var(--sumi);
    letter-spacing: 0.03em;
    line-height: 1.44;
    text-align: left;
    white-space: normal;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: border-color 0.16s ease, background 0.16s ease;
  }
  .zen-choice:active { background: #EDEAE1; }

  .listen-num-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }
  .listen-num-btn {
    min-height: 68px;
    background: var(--sheet);
    border: 1px solid var(--hairline-strong);
    border-radius: 8px;
    font-family: var(--serif-jp);
    font-size: 25px;
    font-weight: 600;
    color: var(--sumi);
    font-variant-numeric: tabular-nums;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.16s ease, background 0.16s ease;
  }
  .listen-num-btn:active { background: #EDEAE1; }

  .unsure-btn {
    margin-top: 12px;
    width: 100%;
    min-height: 46px;
    padding: 0 18px;
    border: 1px dashed var(--hairline-strong);
    border-radius: 8px;
    font-size: 15px;
    font-weight: 500;
    color: var(--ink-2);
    letter-spacing: 0.04em;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: border-color 0.16s ease, color 0.16s ease, background 0.16s ease;
  }
  .unsure-btn:active { background: #EDEAE1; }

  .kbd-tag, .desk-hint { display: none; }
  @media (min-width: 860px) {
    .zen-choice:hover, .listen-num-btn:hover { border-color: var(--sumi); background: #FFFFFF; }
    .unsure-btn:hover { border-color: var(--sumi); color: var(--sumi); background: rgba(252, 251, 248, 0.72); }
    .kbd-tag {
      display: inline-block;
      font-family: var(--sans);
      font-size: 13px;
      color: var(--ink-3);
      font-variant-numeric: tabular-nums;
    }
    .desk-hint {
      display: inline-block;
      font-size: 12.5px;
      font-weight: 400;
      opacity: 0.68;
      letter-spacing: 0.03em;
      margin-left: 10px;
    }
  }

  /* -------- RESULT VIEW (3-Step Human Clarity: 句意 -> 为什么用 -> 变形与辨析) -------- */
  .result-ja {
    margin: 0;
    font-family: var(--serif-jp);
    font-size: 22.5px;
    font-weight: 500;
    line-height: 1.68;
    letter-spacing: 0.03em;
    color: var(--sumi);
    white-space: pre-line;
  }
  .ans-hl {
    color: var(--moss);
    font-weight: 600;
  }
  .result-zh {
    margin: 6px 0 0;
    font-size: 15px;
    font-weight: 400;
    color: var(--ink-3);
    line-height: 1.58;
    letter-spacing: 0.012em;
  }
  .dlg {
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .dlg-row {
    display: grid;
    grid-template-columns: auto 1fr;
    column-gap: 10px;
    align-items: baseline;
  }
  .dlg-who {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-3);
    text-align: center;
    min-width: 24px;
    padding: 0 5px;
    box-sizing: border-box;
    white-space: nowrap;
    border: 1px solid var(--hairline);
    border-radius: 5px;
    line-height: 22px;
    height: 22px;
    transform: translateY(-2px);
  }
  .dlg-ja {
    font-family: var(--serif-jp);
    font-size: 19px;
    font-weight: 500;
    line-height: 1.58;
    letter-spacing: 0.02em;
    color: var(--sumi);
  }
  .dlg-row.is-ans .dlg-who {
    color: var(--moss);
    border-color: rgba(43, 95, 73, 0.35);
  }
  .dlg-zh {
    margin-top: 2px;
    font-size: 14px;
    font-weight: 400;
    color: var(--ink-3);
    line-height: 1.52;
    letter-spacing: 0.01em;
  }
  .res-cue {
    display: grid;
    grid-template-columns: auto 1fr;
    column-gap: 9px;
    align-items: baseline;
    margin-bottom: 10px;
  }
  .cue-tag {
    font-family: var(--sans);
    font-size: 11.5px;
    font-weight: 600;
    color: var(--ink-3);
    letter-spacing: 0.04em;
    border: 1px solid var(--hairline-strong);
    border-radius: 4px;
    padding: 1px 6px;
    line-height: 1.45;
    white-space: nowrap;
  }
  .cue-txt {
    font-size: 14.5px;
    font-weight: 400;
    color: var(--ink-2);
    line-height: 1.56;
    letter-spacing: 0.01em;
  }
  .opt-breakdown {
    display: flex;
    flex-direction: column;
  }
  .opt-row {
    display: grid;
    grid-template-columns: 20px 1fr;
    column-gap: 9px;
    padding: 9px 0;
    border-top: 1px dashed rgba(28, 27, 24, 0.10);
    align-items: baseline;
  }
  .opt-breakdown.is-listen .opt-row {
    grid-template-columns: 34px 1fr;
  }
  .opt-row:first-child {
    border-top: none;
    padding-top: 2px;
  }
  .opt-row:last-child {
    padding-bottom: 2px;
  }
  .opt-mark {
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 700;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .opt-row.ok .opt-mark {
    color: #2D7A56;
  }
  .opt-row.ng .opt-mark {
    color: var(--bengara);
  }
  .opt-body {
    min-width: 0;
  }
  .opt-head {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px;
  }
  .opt-ja {
    font-family: var(--serif-jp);
    font-size: 17.5px;
    font-weight: 600;
    color: var(--sumi);
    line-height: 1.45;
  }
  .opt-row.ok .opt-ja {
    color: #266A4A;
  }
  .opt-row.ng .opt-ja {
    color: var(--bengara);
  }
  .opt-row.dim .opt-ja {
    font-weight: 500;
    color: var(--ink-2);
  }
  .opt-badge {
    font-family: var(--sans);
    font-size: 11.5px;
    font-weight: 600;
    padding: 1px 6px;
    border-radius: 4px;
    line-height: 1.4;
    letter-spacing: 0.03em;
  }
  .opt-badge.ok {
    color: #266A4A;
    background: rgba(45, 122, 86, 0.11);
  }
  .opt-badge.ng {
    color: var(--bengara);
    background: rgba(166, 61, 47, 0.10);
  }
  .opt-desc {
    margin-top: 2.5px;
    font-size: 14.5px;
    line-height: 1.56;
    color: var(--ink-2);
    letter-spacing: 0.01em;
  }
  .opt-row.dim .opt-desc {
    color: var(--ink-3);
  }

  /* Tappable Japanese words + Fixed-Geometry Zen Meaning Card (Zero Layout Shift, Zero Touch Flicker) */
  .w-tok {
    cursor: pointer;
    padding: 1px 0;
    border-radius: 3px;
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
  }
  .w-tok.active-tok {
    color: var(--moss);
    background: var(--moss-soft);
    box-shadow: inset 0 -1.5px 0 var(--moss);
  }

  .inline-lex {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 76px;
    z-index: 20;
    height: 114px;
    padding: 12px 14px;
    border-radius: 8px;
    background: var(--sheet);
    border: 1px solid var(--hairline-strong);
    box-shadow: 0 6px 20px rgba(28, 27, 24, 0.06);
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    gap: 3px;
    overflow: hidden;
  }
  #radio-inline-lex {
    bottom: 12px;
    box-shadow: none;
  }
  @media (min-width: 860px) {
    #tutor-inline-lex {
      position: static;
      margin-top: 18px;
      box-shadow: none;
    }
  }
  .inline-lex.empty {
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
  }
  .ilex-top {
    height: 26px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .ilex-head {
    min-width: 0;
    display: flex;
    align-items: baseline;
    gap: 8px;
    overflow: hidden;
    white-space: nowrap;
  }
  .ilex-surf {
    font-family: var(--serif-jp);
    font-size: 18px;
    font-weight: 600;
    color: var(--sumi);
    flex-shrink: 0;
  }
  .ilex-kana {
    font-size: 14.5px;
    color: var(--moss);
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .ilex-zh {
    height: 22px;
    line-height: 22px;
    font-size: 15.5px;
    font-weight: 500;
    color: var(--sumi);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ilex-meta {
    min-height: 36px;
    max-height: 36px;
    line-height: 18px;
    font-size: 13px;
    color: var(--ink-3);
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .ilex-speak {
    flex-shrink: 0;
    height: 26px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--moss);
    padding: 0 9px;
    border-radius: 5px;
    border: 1px solid rgba(43, 95, 73, 0.25);
  }

  .result-divider {
    height: 1px;
    background: var(--hairline);
    margin: 14px 0;
  }
  .result-logic {
    display: flex;
    flex-direction: column;
    gap: 11px;
  }
  .logic-line {
    margin: 0;
    font-size: 16px;
    font-weight: 400;
    color: var(--ink-2);
    line-height: 1.74;
    letter-spacing: 0.015em;
  }

  /* Architectural Sumi Buttons */
  .dock-row {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .sumi-btn {
    flex: 1;
    height: 54px;
    background: var(--sumi);
    color: var(--sheet);
    border-radius: 8px;
    font-size: 17px;
    font-weight: 500;
    letter-spacing: 0.08em;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ghost-btn {
    height: 54px;
    padding: 0 20px;
    border: 1px solid var(--hairline-strong);
    border-radius: 8px;
    font-size: 15.5px;
    font-weight: 500;
    color: var(--ink-2);
    letter-spacing: 0.04em;
  }

  /* ================= 4. TWO-COACH PODCAST SANCTUARY ("随身听") ================= */
  .radio-center {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding-top: 34px;
    gap: 16px;
  }
  .radio-chap {
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.12em;
    color: var(--moss);
  }
  .radio-topic {
    margin: 0;
    font-family: var(--serif-jp);
    font-size: 26px;
    font-weight: 600;
    line-height: 1.45;
    color: var(--sumi);
  }
  .radio-ja {
    margin: 0;
    font-family: var(--serif-jp);
    font-size: 22px;
    font-weight: 400;
    line-height: 1.76;
    color: var(--ink-2);
  }

  .radio-dock {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 20px;
    padding-top: 12px;
  }
  .scrub-wrap { width: 100%; }
  .zen-range {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 2px;
    background: var(--track);
    outline: none;
    margin: 10px 0;
    cursor: pointer;
  }
  .zen-range::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: var(--sumi);
    cursor: pointer;
  }
  .time-pair {
    display: flex;
    justify-content: space-between;
    font-size: 13.5px;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
  }

  .transport-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .step-time-btn {
    font-size: 15px;
    font-weight: 500;
    color: var(--ink-2);
    padding: 10px 6px;
    font-variant-numeric: tabular-nums;
  }
  .play-toggle-btn {
    min-width: 132px;
    height: 50px;
    border-radius: 8px;
    background: var(--sumi);
    color: var(--sheet);
    font-size: 16.5px;
    font-weight: 500;
    letter-spacing: 0.1em;
  }

  .chapter-strip {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    padding-top: 14px;
    border-top: 1px solid var(--hairline);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .chapter-strip::-webkit-scrollbar { display: none; }
  .chap-link {
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-3);
    letter-spacing: 0.04em;
    padding: 4px 2px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .chap-link.active {
    color: var(--sumi);
    font-weight: 600;
  }

  /* ================= 5. ZEN LEDGER ("总表") ================= */
  .ledger-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 16px 0 8px;
    scrollbar-width: none;
  }
  .ledger-scroll::-webkit-scrollbar { display: none; }

  @media (min-width: 860px) {
    .ledger-layout {
      display: grid;
      grid-template-columns: 270px 1fr;
      gap: 46px;
      align-items: start;
    }
  }

  .pillar-list { margin-bottom: 24px; }
  .pillar-row {
    padding: 14px 0;
    border-bottom: 1px solid var(--hairline);
    cursor: pointer;
    opacity: 0.62;
    transition: opacity 0.18s ease;
  }
  .pillar-row.active { opacity: 1; }
  .pillar-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }
  .pillar-name {
    font-size: 16.5px;
    font-weight: 600;
    color: var(--sumi);
    letter-spacing: 0.03em;
  }
  .pillar-stat {
    font-size: 13.5px;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }
  .pillar-line {
    height: 2px;
    background: var(--track);
    display: flex;
    overflow: hidden;
  }
  .seg-moss { background: var(--moss); }
  .seg-ochre { background: var(--ochre); }
  .seg-bengara { background: var(--bengara); }

  .ledger-controls {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--hairline);
    margin-bottom: 8px;
  }
  .tier-links { display: flex; gap: 20px; }
  .tier-link {
    font-size: 15px;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }
  .tier-link.active {
    color: var(--sumi);
    font-weight: 600;
  }
  .zen-search {
    width: 132px;
    border: none;
    border-bottom: 1px solid var(--hairline-strong);
    background: transparent;
    padding: 4px 0;
    font-family: inherit;
    font-size: 14.5px;
    color: var(--sumi);
    outline: none;
    -webkit-user-select: text;
    user-select: text;
  }
  .zen-search::placeholder { color: var(--ink-3); }

  .ledger-item {
    padding: 14px 0;
    border-bottom: 1px solid var(--hairline);
    cursor: pointer;
  }
  .li-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }
  .li-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .li-dot {
    width: 6.5px;
    height: 6.5px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .li-dot.todo { background: var(--bengara); }
  .li-dot.wip { background: var(--ochre); }
  .li-dot.done { background: var(--moss); }
  .li-name {
    font-family: var(--serif-jp);
    font-size: 18.5px;
    font-weight: 500;
    color: var(--sumi);
  }
  .li-right {
    display: flex;
    align-items: baseline;
    gap: 14px;
    flex-shrink: 0;
  }
  .li-sub {
    font-size: 14px;
    color: var(--ink-3);
    max-width: 138px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .li-act {
    font-size: 14px;
    color: var(--moss);
    font-weight: 500;
  }
  .li-note {
    margin-top: 9px;
    padding-left: 16.5px;
    font-size: 15px;
    color: var(--ink-2);
    line-height: 1.62;
  }

  /* ================= 6. PROGRESS & CROSS-DEVICE SYNC MODAL ================= */
  .modal-mask {
    position: fixed;
    inset: 0;
    background: rgba(28, 27, 24, 0.28);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 28px;
    z-index: 100;
  }
  .modal-mask.open { display: flex; }
  .modal-card {
    width: 100%;
    max-width: 380px;
    background: var(--sheet);
    border: 1px solid var(--hairline-strong);
    border-radius: 10px;
    padding: 26px;
  }
  .modal-h { margin: 0 0 12px; font-size: 18px; font-weight: 600; letter-spacing: 0.04em; }
  .modal-body { margin: 0 0 14px; font-size: 16px; color: var(--ink-2); line-height: 1.85; font-variant-numeric: tabular-nums; }
  .modal-promise { margin: 0 0 16px; padding-top: 12px; border-top: 1px solid var(--hairline); font-size: 14.5px; color: var(--moss); line-height: 1.65; font-weight: 500; }
  .sync-box {
    margin: 0 0 20px;
    padding: 12px 14px;
    border-radius: 8px;
    background: rgba(245, 242, 235, 0.7);
    border: 1px solid var(--hairline);
  }
  .sync-note {
    margin: 0 0 10px;
    font-size: 13.5px;
    color: var(--ink-2);
    line-height: 1.55;
  }
  .sync-btn {
    width: 100%;
    height: 40px;
    border: 1px solid var(--hairline-strong);
    border-radius: 6px;
    background: var(--sheet);
    font-size: 14px;
    font-weight: 600;
    color: var(--sumi);
    letter-spacing: 0.03em;
  }
  .sync-btn.copied {
    border-color: var(--moss);
    color: var(--moss);
  }

  /* ================= 7. BEDTIME VOCAB FLASHCARD SANCTUARY ================= */
  .night-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    padding: 13px 16px;
    margin-bottom: 18px;
    border-radius: 9px;
    background: var(--sheet);
    border: 1px solid var(--hairline-strong);
  }
  .night-bar-txt { min-width: 0; }
  .night-bar-title {
    font-size: 15.5px;
    font-weight: 600;
    color: var(--sumi);
    letter-spacing: 0.02em;
  }
  .night-bar-sub {
    margin-top: 3px;
    font-size: 13px;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }
  .night-go-btn {
    flex-shrink: 0;
    height: 38px;
    padding: 0 16px;
    border-radius: 7px;
    background: var(--sumi);
    color: var(--sheet);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.06em;
  }

  .flash-mask {
    position: fixed;
    inset: 0;
    background: var(--washi);
    display: none;
    flex-direction: column;
    align-items: center;
    padding: calc(16px + env(safe-area-inset-top)) 28px calc(20px + env(safe-area-inset-bottom));
    z-index: 120;
  }
  .flash-mask.open { display: flex; }
  .flash-shell {
    width: 100%;
    max-width: 496px;
    height: 100%;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .flash-top {
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--hairline);
  }
  .flash-prog {
    font-size: 14px;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
  }
  .flash-top-acts {
    display: flex;
    align-items: baseline;
    gap: 18px;
  }
  .flash-track {
    height: 2px;
    background: var(--track);
    flex-shrink: 0;
  }
  .flash-fill {
    height: 100%;
    background: var(--moss);
    transition: width 0.25s ease;
  }
  .flash-stage {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px 6px;
    cursor: pointer;
  }
  .flash-tag {
    font-size: 12.5px;
    color: var(--ink-3);
    letter-spacing: 0.08em;
    margin-bottom: 18px;
  }
  .flash-tag.marked { color: var(--bengara); font-weight: 600; }
  .flash-tag.mastered { color: var(--moss); font-weight: 600; }
  .flash-word {
    font-family: var(--serif-jp);
    font-size: 40px;
    font-weight: 500;
    color: var(--sumi);
    line-height: 1.3;
    letter-spacing: 0.03em;
    word-break: keep-all;
  }
  .flash-back {
    margin-top: 22px;
    min-height: 112px;
    max-width: 390px;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.22s ease, transform 0.22s ease;
    pointer-events: none;
  }
  .flash-back.shown {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .flash-kana {
    font-size: 18px;
    color: var(--ink-2);
    letter-spacing: 0.04em;
    margin-bottom: 10px;
  }
  .flash-zh {
    font-size: 21px;
    font-weight: 600;
    color: var(--sumi);
    line-height: 1.45;
  }
  .flash-tip {
    margin-top: 10px;
    font-size: 14.5px;
    color: var(--ink-3);
    line-height: 1.6;
  }
  .flash-hint {
    margin-top: 16px;
    font-size: 13px;
    color: var(--ink-3);
  }
  .flash-dock {
    flex-shrink: 0;
    padding-top: 14px;
    border-top: 1px solid var(--hairline);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .flash-SubRow {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 4px;
  }
  .flash-nav-btn {
    font-size: 14px;
    color: var(--ink-3);
    padding: 6px 4px;
  }
  .flash-mark-btn {
    height: 52px;
    padding: 0 18px;
    border-radius: 8px;
    border: 1px solid rgba(158, 62, 54, 0.34);
    color: var(--bengara);
    font-size: 15.5px;
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  .flash-mark-btn.done-mark {
    background: rgba(158, 62, 54, 0.09);
    border-color: var(--bengara);
  }
  .flash-ok-btn {
    height: 52px;
    padding: 0 18px;
    border-radius: 8px;
    border: 1px solid rgba(43, 95, 73, 0.34);
    color: var(--moss);
    font-size: 15.5px;
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  .flash-ok-btn.done-ok {
    background: rgba(43, 95, 73, 0.10);
    border-color: var(--moss);
  }
  .flash-play-btn {
    flex: 1;
    height: 52px;
    border-radius: 8px;
    background: var(--sumi);
    color: var(--sheet);
    font-size: 15.5px;
    font-weight: 500;
    letter-spacing: 0.06em;
  }
  .flash-play-btn.paused {
    background: var(--sheet);
    color: var(--sumi);
    border: 1px solid var(--hairline-strong);
  }
</style>
</head>
<body>

<div class="zen-shell" id="app-shell">
  <!-- 1. STRICT GRID HEADER (Zero Date / Zero Countdown) -->
  <header class="zen-header">
    <div class="zen-brand"><strong>N3</strong></div>
    <nav class="zen-nav">
      <button class="nav-link active" id="tab-tutor" onclick="switchMode('tutor')">做题</button>
      <button class="nav-link" id="tab-radio" onclick="switchMode('radio', true)">随身听</button>
      <button class="nav-link" id="tab-dash" onclick="switchMode('dash')">总表</button>
    </nav>
  </header>

  <!-- 2. THREE ZEN ENSO DAILY RITUALS (円相 · 无字打卡) -->
  <div class="zen-horizon" id="green-board" onclick="openSessionModal()">
    <div class="horizon-meta">
      <div class="enso-trio" id="enso-trio"></div>
      <span class="sr-only" id="gm-left-txt"></span>
      <span class="horizon-score" id="gm-right-txt">预计 <b>108分</b> · 冲120+</span>
    </div>
    <div class="horizon-track">
      <div class="horizon-fill" id="gm-fill" style="width:0%"></div>
    </div>
  </div>

  <!-- 3A. ADAPTIVE QUIZ STAGE -->
  <main class="zen-panel" id="tutor-view">
    <div class="stage-wrap" id="voice-card"></div>
  </main>

  <!-- 3B. THREE-HOST CULTURAL SALON SANCTUARY ("随身听") -->
  <section class="zen-panel hidden" id="radio-view">
    <div class="stage-wrap">
      <div class="meta-bar">
        <span class="overline" id="radio-date-pill">锵锵三人 · 文涛 · 文道 · 子东</span>
        <div class="quiet-actions">
          <button class="text-btn" id="radio-spd-btn" onclick="cycleRadioSpeed()">1.0x</button>
        </div>
      </div>

      <div class="radio-center">
        <div class="radio-chap" id="radio-chap-lbl">逐客茶</div>
        <h2 class="radio-topic" id="radio-live-title">日本文化夜话</h2>
        <p class="radio-ja" id="radio-live-ja"></p>
        <div class="inline-lex empty" id="radio-inline-lex" data-surface="">
          <div class="ilex-top">
            <div class="ilex-head"><span class="ilex-surf"></span><span class="ilex-kana"></span></div>
            <button class="ilex-speak" type="button">发音</button>
          </div>
          <div class="ilex-zh"></div>
          <div class="ilex-meta"></div>
        </div>
      </div>

      <div class="radio-dock">
        <div class="scrub-wrap">
          <input type="range" class="zen-range" id="radio-seek" min="0" max="2100" value="0" step="1" oninput="onRadioScrub(this.value)" />
          <div class="time-pair">
            <span id="radio-cur-time">00:00</span>
            <span id="radio-tot-time">35:00</span>
          </div>
        </div>

        <div class="transport-row">
          <button class="step-time-btn" onclick="seekRadioBy(-15)">-15s</button>
          <button class="play-toggle-btn" id="radio-play-btn" onclick="toggleRadioPlay()">播放</button>
          <button class="step-time-btn" onclick="seekRadioBy(15)">+15s</button>
        </div>

        <div class="chapter-strip" id="radio-chap-pills"></div>
      </div>
    </div>
  </section>

  <!-- 3C. ZEN LEDGER ("总表") -->
  <section class="zen-panel hidden" id="dash-view">
    <div class="ledger-scroll">
      <div id="night-flash-entry"></div>
      <div class="ledger-layout">
        <div class="pillar-list" id="dash-summary"></div>
        <div>
          <div class="ledger-controls">
            <div class="tier-links" id="tier-tabs"></div>
            <input type="search" class="zen-search" id="pt-search" placeholder="检索…" oninput="renderMasteryList()" />
          </div>
          <div id="point-list"></div>
        </div>
      </div>
    </div>
  </section>
</div>

<div class="modal-mask" id="app-modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-card" id="modal-content"></div>
</div>

<div class="flash-mask" id="flash-modal">
  <div class="flash-shell" id="flash-shell"></div>
</div>

<script>
const DATA = {"plan_date": "2026-11-15", "exam_date": "2026-12-06", "days_to_exam": 21, "done_audio": "./audio/done.mp3", "radio": {"date": "2026-11-15", "display_date": "锵锵三人", "days_left": 21, "script_sig": "0fca917f4877f1", "audio_url": "./audio/daily_radio.mp3?v=2026-11-15_0fca91", "duration_sec": 1848.2, "duration_label": "31 分钟", "hosts": "文涛 · 文道 · 子东", "chapters": [{"idx": 0, "title": "早高峰", "start": 0.0}, {"idx": 1, "title": "殉情与酒", "start": 305.8}, {"idx": 2, "title": "歌舞伎町", "start": 648.6}, {"idx": 3, "title": "外派大阪", "start": 950.5}, {"idx": 4, "title": "悄悄买单", "start": 1244.4}, {"idx": 5, "title": "黄金街", "start": 1515.8}], "segments": [{"chapter": 0, "point_id": "H-20261114-02", "point_ids": ["H-20261114-02", "G-20261114-11", "N3-H10", "H-20261114-07"], "title": "新宿站白手套推人官、淋雨受气包心态与逼死社恐的公司晨会", "ja_focus": "隣の人に足を踏まれて痛かった。みんなの前で、話させられた。", "start": 0.0, "end": 305.8}, {"chapter": 1, "point_id": "G-20261114-04", "point_ids": ["G-20261114-04", "N3-G21", "G-20261114-07"], "title": "太宰治的四次殉情荒诞剧、《失乐园》眼泪美学与宿醉清晨的后悔药", "ja_focus": "失楽園のラストシーンは、泣かずにはいられなかった。夜中に締めのラーメンを食べなければよかった。", "start": 305.8, "end": 648.6}, {"chapter": 2, "point_id": "G-20261114-01", "point_ids": ["G-20261114-01", "G-20261114-12", "N3-G20"], "title": "歌舞伎町牛郎店的香槟塔心理学：到底是谁成全了谁？", "ja_focus": "先輩がお酒のマナーを教えてくれた。君のおかげで、先月はナンバーワンになれたよ。", "start": 648.6, "end": 950.5}, {"chapter": 3, "point_id": "V-20261114-08", "point_ids": ["V-20261114-08", "N3-V09", "G-20261114-09", "G-20261114-08"], "title": "《半泽直树》的外派宿命：把去大阪出差念成宣示主权与单身赴任潜规则", "ja_focus": "来週から大阪へ出張します。来月から大阪支店へ行くことになりました。", "start": 950.5, "end": 1244.4}, {"chapter": 4, "point_id": "Q-20261114-005", "point_ids": ["Q-20261114-005", "G-20261114-02", "GQ-20261114-02", "N3-L06"], "title": "神保町拉面店的投币铁律、豚骨拉面与东京约会趁补妆悄悄买单术", "ja_focus": "今日は私が、払っておくよ。前もってレストランを予約しておけば、当日は安心だ。", "start": 1244.4, "end": 1515.8}, {"chapter": 5, "point_id": "V-20261114-05", "point_ids": ["V-20261114-05", "V-20261114-06", "V-20261114-01", "V-20261114-02"], "title": "新宿黄金街的六座深夜酒馆、村上春树的拟声密码与路边蹲着的成年人", "ja_focus": "平日の昼間は、電車ががらがらだ。子どもの目線に合わせて、しゃがんで話しかけた。", "start": 1515.8, "end": 1848.2}]}, "points": [{"id": "G-20261114-01", "subject": "语法", "point": "〜てくれる／もらう", "point_key": "〜てくれる／もらう", "family": "keigo_give", "modality": "both", "exam_weight": 3.0, "roi_score": 1.74, "teach": {"left": {"ja": "先輩に ＋ もらった", "sub": "我是主语（私は） · 我从前辈那儿「得到教导」"}, "right": {"ja": "先輩が ＋ くれた", "sub": "别人是主语（先輩が） · 前辈主动「教给了我」"}, "example_ja": "わからない問題があったので、私は先輩に解き方を教えてもらった。", "zh_meaning": "因为有不会的题，我请前辈教了我解法。", "audio": "./audio/G-20261114-01_exp.mp3?v=45fc72ef"}, "primary": {"id": "G-20261114-01", "prompt": "私は先輩に解き方を教えて（　　）。", "choices": ["もらった", "くれた"], "answer": "もらった", "full_ja": "わからない問題があったので、私は先輩に解き方を教えてもらった。", "zh_meaning": "因为有不会的题，我请前辈教了我解法。", "why_line": "整句话的主语是「我」，前辈后面标了「に」，是站在「我从前辈那里得到帮助」的角度在说。", "form_line": "我得到帮助接「もらった」（教えてもらった）；只有主语是前辈主动帮我（先輩が）才用「くれた」。", "opt_notes": {"もらった": "句中是「私は＋先輩に」，我作主语向对方请教受益，必用 てもらう。", "くれた": "要求别人作主语（「先輩が私に教えてくれた」），不能接在「私は先輩に」后面。"}, "q_audio": "./audio/G-20261114-01_q.mp3?v=aec3cb11", "exp_audio": "./audio/G-20261114-01_exp.mp3?v=45fc72ef", "is_listening": false}, "variants": [{"id": "VAR-G01", "prompt": "道に迷っていたら、親切な人が駅まで案内して（　　）。", "choices": ["くれた", "もらった"], "answer": "くれた", "full_ja": "道に迷っていたら、親切な人が駅まで案内してくれた。", "zh_meaning": "正迷路的时候，一位热心人主动带我去了车站。", "why_line": "句子主语是「親切な人が（热心人）」，别人主动向我伸出援手，站在对方给我的方向说。", "form_line": "「别人が＋てくれた」（别人主动帮我）对应「私が＋てもらった」（我请别人帮我）。", "opt_notes": {"くれた": "主语是「親切な人が」，对方主动为我带路，必用「てくれた」。", "もらった": "需要我作主语且搭配「親切な人に案内してもらった」。"}, "q_audio": "./audio/VAR-G01_q.mp3?v=0681bc35", "exp_audio": "./audio/VAR-G01_exp.mp3?v=68627df9", "is_listening": false}]}, {"id": "H-20261114-02", "subject": "活用", "point": "五段动词 受身形（词尾あ段＋れる）", "point_key": "V-032", "family": "voice_form", "modality": "both", "exam_weight": 3.0, "roi_score": 4.14, "teach": {"left": {"ja": "踏まれる（れ＝受身）", "sub": "受害被动：我倒霉被踩 · 隣の人に足を踏まれた"}, "right": {"ja": "踏ませる（せ＝使役）", "sub": "s音＝使唤/强迫别人做 · 逼别人去踩（意思全反了。）"}, "example_ja": "満員電車の中で、隣の人に足を踏まれて痛かった。", "zh_meaning": "在挤满人的电车里，被旁边的人踩了脚，很疼。", "audio": "./audio/H-20261114-02_exp.mp3?v=0dd1c820"}, "primary": {"id": "H-20261114-02", "prompt": "満員電車の中で、隣の人に足を（　　）痛かった。", "choices": ["踏まれて", "踏ませて"], "answer": "踏まれて", "full_ja": "満員電車の中で、隣の人に足を踏まれて痛かった。", "zh_meaning": "在挤满人的电车里，被旁边的人踩了脚，很疼。", "why_line": "我是倒霉挨踩的受害者，「被别人踩了脚」要用受身（被动），不可能是我指使别人来踩我。", "form_line": "五段动词「踏む」词尾「む」变あ段「ま」加「れる」，て形就是「踏まれて」；带「せ」的「踏ませて」是使役（让别人踩）。", "opt_notes": {"踏まれて": "踏む的受害受身形（踏まれる），「人に足を踏まれる」是日语最典型的受害被动句。", "踏ませて": "踏む的使役形（踏ませる），变成「我让/逼旁边的人踩我的脚」，逻辑荒谬。"}, "q_audio": "./audio/H-20261114-02_q.mp3?v=f28a70df", "exp_audio": "./audio/H-20261114-02_exp.mp3?v=0dd1c820", "is_listening": false}, "variants": [{"id": "VAR-H02", "prompt": "母は野菜嫌いの子どもにピーマンを（　　）。", "choices": ["食べさせた", "食べられた"], "answer": "食べさせた", "full_ja": "母は野菜嫌いの子どもにピーマンを食べさせた。", "zh_meaning": "妈妈让讨厌吃蔬菜的孩子把青椒吃下去了。", "why_line": "主语是「妈妈」，妈妈督促要求孩子去吃，属于「让别人做某事」的使役句。", "form_line": "一段动词「食べる」去掉「る」加「させる」，过去式就是「食べさせた」；「食べられた」是被动被吃掉。", "opt_notes": {"食べさせた": "使役形，表示妈妈让孩子吃青椒。", "食べられた": "受身形（被偷吃），语义不符。"}, "q_audio": "./audio/VAR-H02_q.mp3?v=095a1d22", "exp_audio": "./audio/VAR-H02_exp.mp3?v=8f30739a", "is_listening": false}]}, {"id": "V-20261114-07", "subject": "词汇", "point": "つい", "point_key": "つい", "family": "kana_adverb", "modality": "listen", "exam_weight": 2.1, "roi_score": 2.898, "teach": {"left": {"ja": "つい（食べてしまう）", "sub": "不知不觉、一时没忍住 · 本不想做却顺手犯了小错"}, "right": {"ja": "わざと（壊した）", "sub": "故意地、存心地 · 明知故犯、蓄意去做"}, "example_ja": "ダイエット中なのに、目の前にケーキがあるとつい食べてしまう。", "zh_meaning": "明明在减肥，眼前一有蛋糕还是没忍住吃掉了。", "audio": "./audio/V-20261114-07_exp.mp3?v=3b68775d"}, "primary": {"id": "V-20261114-07", "prompt": "ダイエット中なのに、目の前にケーキがあると（　　）食べてしまう。", "choices": ["つい", "やっと", "わざと"], "answer": "つい", "full_ja": "ダイエット中なのに、目の前にケーキがあるとつい食べてしまう。", "zh_meaning": "明明在减肥，眼前一有蛋糕还是没忍住吃掉了。", "why_line": "理智上不想吃，手却没管住，「不知不觉、不由自主」做了某事，常配「てしまう」。", "form_line": "「つい」是没忍住下意识做了；「やっと」是好不容易终于；「わざと」则是故意去做。", "opt_notes": {"つい": "表示「不知不觉、一时没忍住」，常与句尾「〜てしまう」呼应。", "やっと": "意为「好不容易终于（期盼的事终于实现）」，不能用于减肥破戒。", "わざと": "意为「故意地」，与「明明在减肥却没忍住」的后悔语气相反。"}, "q_audio": "./audio/V-20261114-07_q.mp3?v=bb877393", "exp_audio": "./audio/V-20261114-07_exp.mp3?v=3b68775d", "is_listening": false}, "variants": []}, {"id": "N3-L06", "subject": "听力", "point": "聴解「まず／後にして」顺序", "point_key": "N3L-087", "family": "listen_seq", "modality": "listen", "exam_weight": 3.0, "roi_score": 1.74, "teach": {"left": {"ja": "先に ／ まず ／ その前に", "sub": "第一顺位马上做（正确答案。）"}, "right": {"ja": "A は後にして", "sub": "陷阱。意思是「A先缓一缓晚点做」"}, "example_ja": "女：課長、会議室の準備と資料の印刷、どちらを先にしましょうか。\n男：会議室は後にして、先に資料を印刷してくれる？", "zh_meaning": "女：「课长，布置会议室和打印资料，先做哪个？」 男：「会议室先放后面，你先打印资料好吗？」", "audio": "./audio/N3-L06_exp.mp3?v=7fdc6489"}, "primary": {"id": "N3-L06", "prompt": "", "choices": ["会議室を準備する", "資料を印刷する", "課長にメールする"], "answer": "資料を印刷する", "full_ja": "女：課長、会議室の準備と資料の印刷、どちらを先にしましょうか。\n男：会議室は後にして、先に資料を印刷してくれる？", "zh_meaning": "女：「课长，布置会议室和打印资料，先做哪个？」 男：「会议室先放后面，你先打印资料好吗？」", "why_line": "听力顺序题盯紧「〜は後にして（这个先放后面）」，跟在「先に（先）」后面的动作才是第一顺位。", "form_line": "第 2 项打印资料最先做；第 1 项布置会议室排在后面；第 3 项发邮件未提及。", "opt_notes": {"会議室を準備する": "「布置会议室。」课长说 会議室は後にして（先放后面再弄）。", "資料を印刷する": "「打印资料。」课长明确指示 先に資料を印刷してくれる？（先印资料）。", "課長にメールする": "「给课长发邮件。」对话中未提及。"}, "q_audio": "./audio/N3-L06_q.mp3?v=5e504363", "exp_audio": "./audio/N3-L06_exp.mp3?v=7fdc6489", "is_listening": true}, "variants": [{"id": "VAR-L06", "prompt": "", "choices": ["銀行へ行く", "昼ご飯を食べる", "メールを返信する"], "answer": "メールを返信する", "full_ja": "男：先輩、先に銀行へ行ってきてもいいですか。\n女：あ、その前にこのメールだけ返信しといて。銀行はその後でね。", "zh_meaning": "男：「前辈，我可以先去趟银行吗？」 女：「啊，那之前先把这封邮件回一下，银行等那之后再去。」", "why_line": "抓顺序词：「その前に（在那之前）」后面跟的是第一顺位，「その後で（那之后）」排在第二顺位。", "form_line": "第 3 项先回复邮件；第 1 项去银行被推迟到后面；第 2 项吃午饭未提及。", "opt_notes": {"銀行へ行く": "「去银行。」前辈说 銀行はその後でね（排在回邮件之后）。", "昼ご飯を食べる": "「吃午饭。」对话中未提及。", "メールを返信する": "「回复邮件。」前辈要求 その前に（去银行前先把邮件回了）。"}, "q_audio": "./audio/VAR-L06_q.mp3?v=7d8f1279", "exp_audio": "./audio/VAR-L06_exp.mp3?v=898a894a", "is_listening": true}]}, {"id": "N3-G20", "subject": "语法", "point": "〜ことになっている", "point_key": "〜ことになっている", "family": "rule_decide", "modality": "both", "exam_weight": 2.9, "roi_score": 1.682, "teach": {"left": {"ja": "〜ことになっている", "sub": "校规/制度/日程（外部定好的规矩）"}, "right": {"ja": "〜ことにしている", "sub": "个人主观坚持的习惯（我每天跑步）"}, "example_ja": "この寮では、夜１１時以降は静かにすることになっている。", "zh_meaning": "这栋宿舍规定，晚上十一点以后要保持安静。", "audio": "./audio/N3-G20_exp.mp3?v=122b0088"}, "primary": {"id": "N3-G20", "prompt": "この寮では、夜１１時以降は静かにする（　　）。", "choices": ["ことになっている", "ことにしている"], "answer": "ことになっている", "full_ja": "この寮では、夜１１時以降は静かにすることになっている。", "zh_meaning": "这栋宿舍规定，晚上十一点以后要保持安静。", "why_line": "开头点明「この寮では（在这栋宿舍里）」，讲的是外部定好的公共规矩，不是个人习惯。", "form_line": "校规、制度等客观规定用「ことになっている」；个人主观坚持的日常习惯才用「ことにしている」。", "opt_notes": {"ことになっている": "表示宿舍客观规章制度「规定要保持安静」。", "ことにしている": "表示个人主观决定的日常习惯，不能用于集体规定。"}, "q_audio": "./audio/N3-G20_q.mp3?v=24dbca56", "exp_audio": "./audio/N3-G20_exp.mp3?v=122b0088", "is_listening": false}, "variants": [{"id": "VAR-G20", "prompt": "健康のために、私は毎日寝る前にストレッチをする（　　）。", "choices": ["ことにしている", "ことになっている"], "answer": "ことにしている", "full_ja": "健康のために、私は毎日寝る前にストレッチをすることにしている。", "zh_meaning": "为了健康，我养成习惯每天睡前做拉伸。", "why_line": "主语是「私は」，是为了健康自己给自己定下并坚持的日常习惯。", "form_line": "个人主动坚持的习惯用「ことにしている」；外部定下的公共规则才用「ことになっている」。", "opt_notes": {"ことにしている": "主观持续的个人习惯。", "ことになっている": "外部规章或客观安排，不用于个人养生习惯。"}, "q_audio": "./audio/VAR-G20_q.mp3?v=1d4f5981", "exp_audio": "./audio/VAR-G20_exp.mp3?v=1c3971fe", "is_listening": false}]}, {"id": "H-20261114-04", "subject": "活用", "point": "消える ↔ 消す", "point_key": "T-004", "family": "transitivity", "modality": "both", "exam_weight": 3.0, "roi_score": 1.74, "teach": {"left": {"ja": "火が 消えた", "sub": "が ＋ 自然に（自动词） · 风吹过来，火苗自己灭了"}, "right": {"ja": "火を 消した", "sub": "を ＋ す结尾（他动词） · 人伸手去，把火吹灭/关掉"}, "example_ja": "強い風が吹いて、ろうそくの火が自然に消えた。", "zh_meaning": "刮起一阵大风，蜡烛的火自然灭了。", "audio": "./audio/H-20261114-04_exp.mp3?v=f9a2ece6"}, "primary": {"id": "H-20261114-04", "prompt": "強い風が吹いて、ろうそくの火が自然に（　　）。", "choices": ["消えた", "消した"], "answer": "消えた", "full_ja": "強い風が吹いて、ろうそくの火が自然に消えた。", "zh_meaning": "刮起一阵大风，蜡烛的火自然灭了。", "why_line": "风吹过来之后「火苗自己熄灭了」，前面是主语「火が」加「自然に」，要用自动词。", "form_line": "「消える → 消えた」是自动词（火自己灭，配が）；带「す」的「消す → 消した」是他动词（人去把火弄灭，配を）。", "opt_notes": {"消えた": "自动词「消える」过去式，完美契合主语助词「火が」与副词「自然に（自然地熄灭）」。", "消した": "他动词「消す」过去式，需要人作主语且配「火を消した」（人为把火弄灭）。"}, "q_audio": "./audio/H-20261114-04_q.mp3?v=9d94e1a8", "exp_audio": "./audio/H-20261114-04_exp.mp3?v=f9a2ece6", "is_listening": false}, "variants": [{"id": "VAR-H04", "prompt": "寝る前に、部屋の電気をちゃんと（　　）ください。", "choices": ["消して", "消えて"], "answer": "消して", "full_ja": "寝る前に、部屋の電気をちゃんと消してください。", "zh_meaning": "睡觉前，请把房间的灯关好。", "why_line": "嘱咐对方伸手「把灯关掉」，前面有宾格助词「電気を」，必须用他动词。", "form_line": "他动词「消す → 消して」配「電気を」；自动词「消えて」表示灯自己灭了，不能用来让人关灯。", "opt_notes": {"消して": "他动词「消す」て形，搭配宾语「電気を」。", "消えて": "自动词不能带宾语「電気を」。"}, "q_audio": "./audio/VAR-H04_q.mp3?v=0a85d886", "exp_audio": "./audio/VAR-H04_exp.mp3?v=7ec63f5b", "is_listening": false}]}, {"id": "V-20261114-03", "subject": "词汇", "point": "内緒", "point_key": "内緒", "family": "kanji_reading", "modality": "memorize", "exam_weight": 2.2, "roi_score": 1.276, "teach": {"left": {"ja": "な・い・しょ", "sub": "3拍干脆收尾（无长音。） · 嘘🤫 保密要短促收声，绝不拖尾巴"}, "right": {"ja": "ないしょう / ないしゅ", "sub": "中文母语高频误读陷阱 · 「緒」在此处念短音 しょ，不带 う"}, "example_ja": "この話はみんなには内緒にしておいてね。", "zh_meaning": "这件事请替我向大家保密哦。", "audio": "./audio/V-20261114-03_exp.mp3?v=33a7a142"}, "primary": {"id": "V-20261114-03", "prompt": "この話はみんなには「内緒」にしておいてね。", "choices": ["ないしょ", "ないしょう"], "answer": "ないしょ", "full_ja": "この話はみんなには内緒にしておいてね。", "zh_meaning": "这件事请替我向大家保密哦。", "why_line": "「内緒にしておく」是日常高频表达「替我保密、别往外说」，考汉字「緒」的长短音。", "form_line": "「内緒」只有三拍，末尾是干脆的短音「しょ」（ないしょ），后面绝对没有长音「う」。", "opt_notes": {"ないしょ": "「内緒」标准读音（⓪型平调 3拍），尾音 しょ 短促利落，常搭「内緒にする（保密）」。", "ないしょう": "受中文后鼻音或「紹介（しょうかい）」干扰产生的典型长音误读，日语中无此读法。"}, "q_audio": "./audio/V-20261114-03_q.mp3?v=c33ed83a", "exp_audio": "./audio/V-20261114-03_exp.mp3?v=33a7a142", "is_listening": false}, "variants": []}, {"id": "Q-20261114-001", "subject": "听力", "point": "〜なきゃ", "point_key": "N3L-015", "family": "listen_contract", "modality": "listen", "exam_weight": 3.0, "roi_score": 1.74, "teach": {"left": {"ja": "夕飯の支度しないと！", "sub": "＝ しないと【いけない】 · 必须赶紧去做晚饭。（100%要做）"}, "right": {"ja": "作らなくていい", "sub": "〜なくていい · 这才是「不用做也可以」"}, "example_ja": "女：あ、もう五時だ。早く帰って、夕飯の支度しないと。\n男：ほんとだ、急いで帰ろう。", "zh_meaning": "女：「啊，都五点了！得赶紧回去准备晚饭了。」 男：「真的耶，赶紧回去吧。」", "audio": "./audio/Q-20261114-001_exp.mp3?v=231a602a"}, "primary": {"id": "Q-20261114-001", "prompt": "", "choices": ["じゃあ、今日は作らなくていいね。", "ほんとだ、急いで帰ろう。", "夕飯、おいしかったね。"], "answer": "ほんとだ、急いで帰ろう。", "full_ja": "女：あ、もう五時だ。早く帰って、夕飯の支度しないと。\n男：ほんとだ、急いで帰ろう。", "zh_meaning": "女：「啊，都五点了！得赶紧回去准备晚饭了。」 男：「真的耶，赶紧回去吧。」", "why_line": "女生看表催着赶紧回家做晚饭，口语句尾「〜しないと」省略了「いけない」，意思是必须赶紧做。", "form_line": "第 2 句附和赶紧回家；第 1 句把「しないと」听反成不用做；第 3 句过去式时态不对。", "opt_notes": {"じゃあ、今日は作らなくていいね。": "「那今天不用做了呢。」把口语 しないと（必须做）听反了。", "ほんとだ、急いで帰ろう。": "「真的耶，赶紧回去吧。」顺着女生催回家做晚饭自然回应。", "夕飯、おいしかったね。": "「晚饭真好吃呢。」时态不对，晚饭还没开始准备。"}, "q_audio": "./audio/Q-20261114-001_q.mp3?v=44c6dd4b", "exp_audio": "./audio/Q-20261114-001_exp.mp3?v=231a602a", "is_listening": true}, "variants": [{"id": "VAR-L01", "prompt": "", "choices": ["うん、今すぐ払わないとね。", "じゃあ、払わなくてもいいんだね。", "昨日もう払ったよ。"], "answer": "うん、今すぐ払わないとね。", "full_ja": "男：あ、電気代の支払い、今日までだった！早く払わなくちゃ。\n女：うん、今すぐ払わないとね。", "zh_meaning": "男：「啊，电费今天截止！得赶紧交才行。」 女：「嗯，得马上交了呢。」", "why_line": "「払わなくちゃ」和「払わないと」都是口语里的「必须赶紧交」（省略了いけない）。", "form_line": "第 1 句顺着附和马上交；第 2 句把「なくちゃ」听反成不用交；第 3 句与刚发现没交矛盾。", "opt_notes": {"うん、今すぐ払わないとね。": "「嗯，得马上交了呢。」用同义口语 払わないと 顺着附和。", "じゃあ、払わなくてもいいんだね。": "「那不用交了呢。」把口语 払わなくちゃ（必须交）听反了。", "昨日もう払ったよ。": "「昨天已经交了哦。」与男生刚发现还没交矛盾。"}, "q_audio": "./audio/VAR-L01_q.mp3?v=0f743c91", "exp_audio": "./audio/VAR-L01_exp.mp3?v=4a6a7c5f", "is_listening": true}]}, {"id": "G-20261114-05", "subject": "语法", "point": "〜にしたがって", "point_key": "〜にしたがって", "family": "change_flow", "modality": "both", "exam_weight": 2.8, "roi_score": 1.624, "teach": {"left": {"ja": "〜にしたがって", "sub": "↗ 伴随同步渐变 · 台风越近，风雨越强（配 だんだん）"}, "right": {"ja": "〜ついでに", "sub": "🚶 人顺手做第二件事 · 散步顺便寄封信（自然现象禁用。）"}, "example_ja": "台風が近づくにしたがって、風も雨もだんだん強くなってきた。", "zh_meaning": "随着台风靠近，风和雨都渐渐变大了。", "audio": "./audio/G-20261114-05_exp.mp3?v=240e1df8"}, "primary": {"id": "G-20261114-05", "prompt": "台風が近づく（　　）、風も雨も強くなってきた。", "choices": ["にしたがって", "ついでに"], "answer": "にしたがって", "full_ja": "台風が近づくにしたがって、風も雨もだんだん強くなってきた。", "zh_meaning": "随着台风靠近，风和雨都渐渐变大了。", "why_line": "台风越走越近，风雨也跟着越来越大，两边是同步渐变的关系。", "form_line": "动词原形接「にしたがって」表示随着一方变化另一方也跟着变；「ついでに」是人做一件事时顺手做另一件事，自然现象不能用。", "opt_notes": {"にしたがって": "表示随着前项推进，后项同步发生渐变，完美呼应后半句「だんだん強くなってきた」。", "ついでに": "意为「顺便…」，主语必须是有意识的人（如买菜顺便取快递），自然现象绝对禁用。"}, "q_audio": "./audio/G-20261114-05_q.mp3?v=b2c427d8", "exp_audio": "./audio/G-20261114-05_exp.mp3?v=240e1df8", "is_listening": false}, "variants": [{"id": "VAR-G05", "prompt": "スーパーへ買い物に行く（　　）、郵便局で手紙を出した。", "choices": ["ついでに", "にしたがって"], "answer": "ついでに", "full_ja": "スーパーへ買い物に行くついでに、郵便局で手紙を出した。", "zh_meaning": "去超市买东西的时候，顺便在邮局寄了封信。", "why_line": "去超市是主要行程，寄信只是半路顺手办的小事，属于「顺便做某事」。", "form_line": "动词原形接「ついでに」表示顺便；「にしたがって」则是随着一方变化另一方同步渐变。", "opt_notes": {"ついでに": "有意识的人在去超市途中顺便寄信。", "にしたがって": "表伴随同步渐变，不能用于顺便寄信。"}, "q_audio": "./audio/VAR-G05_q.mp3?v=d18d6e69", "exp_audio": "./audio/VAR-G05_exp.mp3?v=a18cfc1c", "is_listening": false}]}, {"id": "H-20261114-01", "subject": "活用", "point": "食べる／飲む → 召し上がる", "point_key": "K-003", "family": "keigo_give", "modality": "both", "exam_weight": 3.0, "roi_score": 0.6, "teach": {"left": {"ja": "召し上がる", "sub": "尊敬语（抬高老师/客人） · 老师您请吃：召し上がってください"}, "right": {"ja": "いただく", "sub": "谦让语（压低我自己） · 我开动领受了：いただきます"}, "example_ja": "先生、どうぞ温かいうちに召し上がってください。", "zh_meaning": "老师，请趁热吃。", "audio": "./audio/H-20261114-01_exp.mp3?v=420c993b"}, "primary": {"id": "H-20261114-01", "prompt": "先生、どうぞ温かいうちに（　　）ください。", "choices": ["召し上がって", "いただいて"], "answer": "召し上がって", "full_ja": "先生、どうぞ温かいうちに召し上がってください。", "zh_meaning": "老师，请趁热吃。", "why_line": "动嘴吃东西的人是「老师」，描述老师或长辈的动作，必须用抬高对方的尊敬语。", "form_line": "「食べる・飲む」的尊敬语是「召し上がる」，变成请求就是「召し上がってください」；「いただく」只能用于我自己吃喝。", "opt_notes": {"召し上がって": "食べる/飲む的尊敬语（含「上がる」向上抬高），请老师或长辈享用时必用。", "いただいて": "食べる/飲む/もらう的谦让语，主语只能是「我方」，对老师说会变成让老师自贬。"}, "q_audio": "./audio/H-20261114-01_q.mp3?v=7b15d1b6", "exp_audio": "./audio/H-20261114-01_exp.mp3?v=420c993b", "is_listening": false}, "variants": [{"id": "VAR-H01", "prompt": "先生のお宅で、珍しい日本のお茶を（　　）。", "choices": ["いただいた", "召し上がった"], "answer": "いただいた", "full_ja": "先生のお宅で、珍しい日本のお茶をいただいた。", "zh_meaning": "在老师家里，我有幸喝到了珍贵的日本茶。", "why_line": "去老师家做客，「喝茶」这个动作是「我自己」做的，对长辈要用压低自己的谦让语。", "form_line": "自己吃喝或领受长辈款待用谦让语「いただく → いただいた」；「召し上がった」只能用于老师喝。", "opt_notes": {"いただいた": "「飲む／もらう」的谦让语，主语是我自己时必用。", "召し上がった": "尊敬语只能用于老师的动作，绝不能用于自己喝茶。"}, "q_audio": "./audio/VAR-H01_q.mp3?v=2e0ee21b", "exp_audio": "./audio/VAR-H01_exp.mp3?v=d161ba36", "is_listening": false}]}, {"id": "N3-V11", "subject": "词汇", "point": "こっそり", "point_key": "こっそり", "family": "kana_adverb", "modality": "listen", "exam_weight": 2.0, "roi_score": 1.16, "teach": {"left": {"ja": "こっそり食べる／抜け出す", "sub": "瞒着别人悄悄地、偷偷地"}, "right": {"ja": "街でばったり会う", "sub": "转角迎面偶遇、撞个正着"}, "example_ja": "ダイエット中なのに、夜中にこっそりケーキを食べた。", "zh_meaning": "明明在减肥，半夜却背着人偷偷吃了蛋糕。", "audio": "./audio/N3-V11_exp.mp3?v=498ce3d5"}, "primary": {"id": "N3-V11", "prompt": "ダイエット中なのに、夜中に（　　）ケーキを食べた。", "choices": ["こっそり", "ばったり"], "answer": "こっそり", "full_ja": "ダイエット中なのに、夜中にこっそりケーキを食べた。", "zh_meaning": "明明在减肥，半夜却背着人偷偷吃了蛋糕。", "why_line": "怕被人看见，半夜「悄悄地、偷偷摸摸地」溜去吃。", "form_line": "「こっそり」表示悄悄、偷偷；「ばったり」则是在街上毫无防备偶遇熟人。", "opt_notes": {"こっそり": "表示不想被人发现、悄悄偷偷地做某事。", "ばったり": "表示毫无预兆地迎面偶遇（ばったり会う）。"}, "q_audio": "./audio/N3-V11_q.mp3?v=64653c3b", "exp_audio": "./audio/N3-V11_exp.mp3?v=498ce3d5", "is_listening": false}, "variants": [{"id": "VAR-V11", "prompt": "旅行先の京都で、大学の友達に（　　）会った。", "choices": ["ばったり", "こっそり"], "answer": "ばったり", "full_ja": "旅行先の京都で、大学の友達にばったり会った。", "zh_meaning": "在旅行地京都，居然迎面偶遇了大学朋友。", "why_line": "事先毫无约定，在外地街头「撞个正着、意外巧遇」。", "form_line": "「ばったり会う」是固定搭配（意外偶遇）；「こっそり」是背着别人偷偷摸摸。", "opt_notes": {"ばったり": "表示偶然迎面撞见。", "こっそり": "表示瞒着别人偷偷幽会，不符偶遇语境。"}, "q_audio": "./audio/VAR-V11_q.mp3?v=7869aa29", "exp_audio": "./audio/VAR-V11_exp.mp3?v=5f67c28b", "is_listening": false}]}, {"id": "Q-20261114-004", "subject": "听力", "point": "〜といて", "point_key": "N3L-007", "family": "listen_contract", "modality": "listen", "exam_weight": 3.0, "roi_score": 1.74, "teach": {"left": {"ja": "コピーしといてくれる？", "sub": "〜ておいて → 口语缩成 〜といて · 开会前能帮我「提前复印好」吗？"}, "right": {"ja": "はい、コピーしておきます", "sub": "下属还原成礼貌体回应 · 好的，我马上提前复印好"}, "example_ja": "男：会議の前に、この資料、人数分コピーしといてくれる？\n女：はい、すぐコピーしておきます。", "zh_meaning": "男：「开会前，能帮我把这份资料按人数提前复印好吗？」 女：「好的，我马上复印好。」", "audio": "./audio/Q-20261114-004_exp.mp3?v=158d2ff7"}, "primary": {"id": "Q-20261114-004", "prompt": "", "choices": ["昨日もう会議は終わりましたよ。", "コピー機は使いません。", "はい、すぐコピーしておきます。"], "answer": "はい、すぐコピーしておきます。", "full_ja": "男：会議の前に、この資料、人数分コピーしといてくれる？\n女：はい、すぐコピーしておきます。", "zh_meaning": "男：「开会前，能帮我把这份资料按人数提前复印好吗？」 女：「好的，我马上复印好。」", "why_line": "上司口语里的「しといて」就是「しておいて（提前准备好）」，拜托下属开会前印好资料。", "form_line": "第 3 句礼貌答应马上印好；第 1 句说昨天开完会时态矛盾；第 2 句说不用复印机答非所问。", "opt_notes": {"昨日もう会議は終わりましたよ。": "「昨天会已经开完了哦。」与上司说的「开会前」矛盾。", "コピー機は使いません。": "「不用复印机。」答非所问。", "はい、すぐコピーしておきます。": "「好的，我马上提前印好。」听懂口语缩音 しといて，得体承接任务。"}, "q_audio": "./audio/Q-20261114-004_q.mp3?v=4b5bd582", "exp_audio": "./audio/Q-20261114-004_exp.mp3?v=158d2ff7", "is_listening": true}, "variants": [{"id": "VAR-L04", "prompt": "", "choices": ["ホテルには泊まらないよ。", "旅行は楽しかったね。", "わかった、今すぐ予約しておくね。"], "answer": "わかった、今すぐ予約しておくね。", "full_ja": "女：来月の旅行、混む前にホテル予約しとかないとね。\n男：わかった、今すぐ予約しておくね。", "zh_meaning": "女：「下个月的旅行，趁还没订满得提前把酒店订好呢。」 男：「好，我马上提前订好。」", "why_line": "「予約しとかないと」融合了「ておく（提前做）」的口语缩音「とく」和「ないと（必须）」。", "form_line": "第 3 句答应马上提前订好；第 1 句答非所问；第 2 句用了过去式，旅行还没去。", "opt_notes": {"ホテルには泊まらないよ。": "「不住酒店哦。」答非所问。", "旅行は楽しかったね。": "「旅行真开心呢。」过去式错误，旅行在下个月还没去。", "わかった、今すぐ予約しておくね。": "「好，我现在就提前订好。」听懂口语缩音 しとかないと，回应马上订。"}, "q_audio": "./audio/VAR-L04_q.mp3?v=eadd7ec2", "exp_audio": "./audio/VAR-L04_exp.mp3?v=159cb44a", "is_listening": true}]}, {"id": "G-20261114-06", "subject": "语法", "point": "〜にしては", "point_key": "〜にしては", "family": "reason_contrast", "modality": "both", "exam_weight": 2.8, "roi_score": 1.624, "teach": {"left": {"ja": "〜にしては", "sub": "打破常规尺子（意外反差） · 只待半年，日语却意外地好"}, "right": {"ja": "〜にとって", "sub": "站在某人立场评价 · 对我来说（私にとって）很重要"}, "example_ja": "彼は日本に半年しかいなかったにしては、日本語がとても上手だ。", "zh_meaning": "他在日本只待了半年，日语却出乎意料地好。", "audio": "./audio/G-20261114-06_exp.mp3?v=8cc8e8ad"}, "primary": {"id": "G-20261114-06", "prompt": "日本に半年しかいなかった（　　）、日本語が上手だ。", "choices": ["にしては", "にとって"], "answer": "にしては", "full_ja": "彼は日本に半年しかいなかったにしては、日本語がとても上手だ。", "zh_meaning": "他在日本只待了半年，日语却出乎意料地好。", "why_line": "按「只待半年」这个标准原本以为水平一般，结果却非常好，属于打破预期的反差。", "form_line": "简体小句直接接「にしては」表示「就……而言却很意外」；「にとって」表示「对某人来说」，而且前面只能接名词。", "opt_notes": {"にしては": "既能接小句过去式「いなかった」，又精准表达「按只待半年的标准看却意外地好」。", "にとって": "意为「对于…来说」，前面只能接名词（如「私にとって」），语法上根本不能接动词过去式。"}, "q_audio": "./audio/G-20261114-06_q.mp3?v=edc4c993", "exp_audio": "./audio/G-20261114-06_exp.mp3?v=8cc8e8ad", "is_listening": false}, "variants": [{"id": "VAR-G06", "prompt": "このスマホは値段が高い（　　）、あまり使いやすくない。", "choices": ["にしては", "にとって"], "answer": "にしては", "full_ja": "このスマホは値段が高いにしては、あまり使いやすくない。", "zh_meaning": "这台手机价格挺贵的，用起来却不怎么顺手。", "why_line": "按「高价」这个标准原本以为很好用，结果却不好用，与预期标准相反。", "form_line": "い形容词「高い」直接接「にしては」表示就高价而言却不怎样；「にとって」只能接人或群体表立场。", "opt_notes": {"にしては": "接形容词「高い」，表达与高价预期不符的反差。", "にとって": "只能接名词表「对某人而言」，不能接「高い」。"}, "q_audio": "./audio/VAR-G06_q.mp3?v=9004ccc7", "exp_audio": "./audio/VAR-G06_exp.mp3?v=a727a8b8", "is_listening": false}]}, {"id": "H-20261114-03", "subject": "活用", "point": "落ちる ↔ 落とす", "point_key": "T-044", "family": "transitivity", "modality": "both", "exam_weight": 3.0, "roi_score": 0.6, "teach": {"left": {"ja": "鍵を 落とす", "sub": "を ＋ す结尾（他动词） · 人不小心「把钥匙弄掉了」"}, "right": {"ja": "鍵が 落ちる", "sub": "が ＋ る结尾（自动词） · 钥匙自己「掉下来了」"}, "example_ja": "走っている途中で、ポケットから鍵を落としてしまった。", "zh_meaning": "跑步途中，不小心把钥匙从口袋里弄掉了。", "audio": "./audio/H-20261114-03_exp.mp3?v=eb65d925"}, "primary": {"id": "H-20261114-03", "prompt": "ポケットから鍵を（　　）しまった。", "choices": ["落として", "落ちて"], "answer": "落として", "full_ja": "走っている途中で、ポケットから鍵を落としてしまった。", "zh_meaning": "跑步途中，不小心把钥匙从口袋里弄掉了。", "why_line": "前面紧跟着宾语「鍵を」，表达人不小心「把钥匙弄掉了」，必须配他动词。", "form_line": "带「す」尾的「落とす → 落として」是他动词（配を，把某物弄掉）；「落ちる → 落ちて」是自动词（配が，某物自己掉）。", "opt_notes": {"落として": "前面明确有「鍵を」，必须配他动词「落とす」，加「てしまう」表不小心弄丢的懊悔。", "落ちて": "自动词「落ちる」不能带宾语「鍵を」，只能说「ポケットから鍵が落ちた」。"}, "q_audio": "./audio/H-20261114-03_q.mp3?v=558cf7ff", "exp_audio": "./audio/H-20261114-03_exp.mp3?v=eb65d925", "is_listening": false}, "variants": [{"id": "VAR-H03", "prompt": "階段で手が滑って、スマホが下に（　　）しまった。", "choices": ["落ちて", "落として"], "answer": "落ちて", "full_ja": "階段で手が滑って、スマホが下に落ちてしまった。", "zh_meaning": "在楼梯上手一滑，手机掉下去了。", "why_line": "后半句主语是「スマホが（手机）」，客观描述手机滑落下去，要配自动词。", "form_line": "前面是「スマホが」必配自动词「落ちる → 落ちて」；前面若是「スマホを」才配他动词「落として」。", "opt_notes": {"落ちて": "自动词「落ちる」，与主语助词「スマホが」严格配对。", "落として": "他动词「落とす」，要求前面是「スマホを」。"}, "q_audio": "./audio/VAR-H03_q.mp3?v=a279ec92", "exp_audio": "./audio/VAR-H03_exp.mp3?v=d4cde5f4", "is_listening": false}]}, {"id": "V-20261114-01", "subject": "词汇", "point": "しゃがむ", "point_key": "しゃがむ", "family": "vocab_action", "modality": "listen", "exam_weight": 2.0, "roi_score": 1.16, "teach": {"left": {"ja": "しゃがむ → しゃがんで", "sub": "🦐 像「虾」弓身屈膝蹲下 · ひざを曲げてしゃがむ（弯膝蹲下）"}, "right": {"ja": "うなずく → うなずいて", "sub": "🙂 轻轻点头表赞同 · 首を縦に振ってうなずく（点头回应）"}, "example_ja": "小さな子どもと目線を合わせるために、ひざを曲げてしゃがんで話しかけた。", "zh_meaning": "为了和小朋友视线平齐，弯下膝盖蹲下来跟他说话。", "audio": "./audio/V-20261114-01_exp.mp3?v=9fe25785"}, "primary": {"id": "V-20261114-01", "prompt": "子どもと目線を合わせるために、ひざを曲げて（　　）話しかけた。", "choices": ["しゃがんで", "うなずいて"], "answer": "しゃがんで", "full_ja": "小さな子どもと目線を合わせるために、ひざを曲げてしゃがんで話しかけた。", "zh_meaning": "为了和小朋友视线平齐，弯下膝盖蹲下来跟他说话。", "why_line": "前面已经说了「弯下膝盖、和小孩平视」，对应的身体动作就是「蹲下」。", "form_line": "「しゃがむ（蹲下）」词尾「む」变て形发生拨音便，变成「しゃがんで」；「うなずいて」是点头。", "opt_notes": {"しゃがんで": "原形「しゃがむ」（蹲下），与前文「目線を合わせる（平视小孩）」「ひざを曲げて（弯膝）」画面完全重合。", "うなずいて": "原形「うなずく」（点头同意），跟弯曲膝盖降高度毫无关系。"}, "q_audio": "./audio/V-20261114-01_q.mp3?v=68fd7ea5", "exp_audio": "./audio/V-20261114-01_exp.mp3?v=9fe25785", "is_listening": false}, "variants": []}, {"id": "Q-20261114-003", "subject": "听力", "point": "〜んだって", "point_key": "N3L-025", "family": "listen_contract", "modality": "listen", "exam_weight": 2.9, "roi_score": 1.682, "teach": {"left": {"ja": "閉まっちゃうんだって", "sub": "ちゃった/ちゃう ＋ んだって · 听说要关门歇业了。（转告传闻）"}, "right": {"ja": "あそこ好きだったのに", "sub": "句尾 のに 表遗憾惋惜 · 诶真的假的？明明很喜欢那家的…"}, "example_ja": "女：ねえ、聞いた？駅前のパン屋さん、来月で閉まっちゃうんだって。\n男：えっ、本当？あそこ好きだったのに。", "zh_meaning": "女：「喂你听说了吗？车站前那家面包店听说下个月就要关门了。」 男：「啊真的假的？我明明很喜欢那家的。」", "audio": "./audio/Q-20261114-003_exp.mp3?v=283b71fd"}, "primary": {"id": "Q-20261114-003", "prompt": "", "choices": ["えっ、本当？あそこ好きだったのに。", "うん、私が閉めたんだよ。", "パン、買ってきてくれたの？"], "answer": "えっ、本当？あそこ好きだったのに。", "full_ja": "女：ねえ、聞いた？駅前のパン屋さん、来月で閉まっちゃうんだって。\n男：えっ、本当？あそこ好きだったのに。", "zh_meaning": "女：「喂你听说了吗？车站前那家面包店听说下个月就要关门了。」 男：「啊真的假的？我明明很喜欢那家的。」", "why_line": "「閉まっちゃう」是「閉まってしまう（遗憾歇业）」的口语缩约，句尾「〜んだって」表示听说。", "form_line": "第 1 句惊讶惋惜最自然；第 2 句把歇业听成了自己关门；第 3 句问买面包答非所问。", "opt_notes": {"えっ、本当？あそこ好きだったのに。": "「啊真的吗？我明明很喜欢那家的。」对老店歇业传闻的惊讶与惋惜。", "うん、私が閉めたんだよ。": "「嗯，是我把门关上的。」把店歇业（閉まる）听成了自己关门（閉めた）。", "パン、買ってきてくれたの？": "「你帮我买面包回来了吗？」答非所问。"}, "q_audio": "./audio/Q-20261114-003_q.mp3?v=aaa729cc", "exp_audio": "./audio/Q-20261114-003_exp.mp3?v=283b71fd", "is_listening": true}, "variants": []}, {"id": "G-20261114-10", "subject": "语法", "point": "〜はずだ", "point_key": "〜はずだ", "family": "hearsay_infer", "modality": "both", "exam_weight": 2.8, "roi_score": 1.624, "teach": {"left": {"ja": "あるはずなんですが", "sub": "按理说应该有（但却找不到） · 肯定预期＋转折"}, "right": {"ja": "あるはずない", "sub": "按理绝对不可能有 · 100%否定推测，与前半句矛盾"}, "example_ja": "さっき財布に入れたから、レシートはここにあるはずなのだが、見つからない。", "zh_meaning": "刚才明明放进钱包了，小票按理应该在这里，却找不到。", "audio": "./audio/G-20261114-10_exp.mp3?v=3e8fe3d8"}, "primary": {"id": "G-20261114-10", "prompt": "さっき財布に入れたから、レシートはここに（　　）が見つからない。", "choices": ["あるはずなのだが", "あるはずないのだが", "あるわけないのだが"], "answer": "あるはずなのだが", "full_ja": "さっき財布に入れたから、レシートはここにあるはずなのだが、見つからない。", "zh_meaning": "刚才明明放进钱包了，小票按理应该在这里，却找不到。", "why_line": "前半句有明确依据「刚才亲手放进去了」，后半句转折「却找不到」，中间必须是肯定推测「按理应该在」。", "form_line": "肯定推测「あるはずだ」接转折「が」时变为「あるはずなのだが」；若用「はずない」就变成「按理不在却找不到」，前后矛盾。", "opt_notes": {"あるはずなのだが": "「あるはずだ（按理应该在）」接转折「なのだが」，准确表达事与愿违。", "あるはずないのだが": "意为「按理绝不可能在」，与前半句「刚放进钱包」前后矛盾。", "あるわけないのだが": "「わけない」同样表示「绝不可能在」，与语境完全相反。"}, "q_audio": "./audio/G-20261114-10_q.mp3?v=a844d6ab", "exp_audio": "./audio/G-20261114-10_exp.mp3?v=3e8fe3d8", "is_listening": false}, "variants": [{"id": "VAR-G10", "prompt": "田中さんは今日海外出張中だから、会社にいる（　　）よ。", "choices": ["はずがない", "はずだ"], "answer": "はずがない", "full_ja": "田中さんは今日海外出張中だから、会社にいるはずがないよ。", "zh_meaning": "田中今天正在国外出差，绝不可能在公司里哦。", "why_line": "前面有铁证「人正在国外出差」，逻辑上完全排除他在公司的可能。", "form_line": "动词原形「いる」接「はずがない」表示按道理绝不可能在；「はずだ」是应该在，与在国外出差矛盾。", "opt_notes": {"はずがない": "根据正在海外出差的事实，断定绝不可能在公司。", "はずだ": "变成「应该在公司」，与海外出差矛盾。"}, "q_audio": "./audio/VAR-G10_q.mp3?v=a6ac337d", "exp_audio": "./audio/VAR-G10_exp.mp3?v=bf3bbb65", "is_listening": false}]}, {"id": "H-20261114-05", "subject": "活用", "point": "五段动词 使役形（词尾あ段＋せる）", "point_key": "V-037", "family": "voice_form", "modality": "both", "exam_weight": 3.0, "roi_score": 0.6, "teach": {"left": {"ja": "休ませていただけませんか", "sub": "使役（允许我休）＋いただく · 部长，能批准我请假吗？"}, "right": {"ja": "休んでいただけませんか", "sub": "漏掉使役させて · 变成：部长，请您去休息好吗？"}, "example_ja": "部長、来週の金曜日、私用で会社を休ませていただけないでしょうか。", "zh_meaning": "部长，下周五我有点私事，能不能请您准我休一天假？", "audio": "./audio/H-20261114-05_exp.mp3?v=4c91402d"}, "primary": {"id": "H-20261114-05", "prompt": "部長、来週の金曜日、私用で会社を（　　）でしょうか。", "choices": ["休ませていただけない", "休んでいただけない", "休まれていただけない"], "answer": "休ませていただけない", "full_ja": "部長、来週の金曜日、私用で会社を休ませていただけないでしょうか。", "zh_meaning": "部长，下周五我有点私事，能不能请您准我休一天假？", "why_line": "休假的人是「我自己」，是在请求上级放行「允许我去休假」，千万不能说成「请部长您去休假」。", "form_line": "先把「休む」变成使役形「休ませて（让我休）」，再接自谦请求「いただけないでしょうか」；漏掉「させて」就会变成请部长休假。", "opt_notes": {"休ませていただけない": "使役形「休ませて（让我休）」加自谦请求「いただけない」，得体请求准假。", "休んでいただけない": "漏掉了使役「させて」，意思变成「请部长您去休假」。", "休まれていただけない": "把受身形硬拼上去，日语中没有这种说法。"}, "q_audio": "./audio/H-20261114-05_q.mp3?v=c78eb665", "exp_audio": "./audio/H-20261114-05_exp.mp3?v=4c91402d", "is_listening": false}, "variants": [{"id": "VAR-H05", "prompt": "少し熱があるので、今日は早めに（　　）いただけませんか。", "choices": ["帰らせて", "帰って"], "answer": "帰らせて", "full_ja": "少し熱があるので、今日は早めに帰らせていただけませんか。", "zh_meaning": "我稍微有点发烧，今天能不能请您准我早点回去？", "why_line": "发烧想早退的人是「我自己」，向上级求批准「允许我先回去」。", "form_line": "五段动词「帰る」词尾「る」变あ段「ら」加「せて」，连成「帰らせていただけませんか」；漏掉「せて」就变成劝上级回家了。", "opt_notes": {"帰らせて": "使役＋ていただけませんか＝恳请准许我早退。", "帰って": "「帰っていただけませんか」意为请对方回去，对象完全搞反。"}, "q_audio": "./audio/VAR-H05_q.mp3?v=ff925f25", "exp_audio": "./audio/VAR-H05_exp.mp3?v=b6380278", "is_listening": false}]}, {"id": "V-20261114-05", "subject": "词汇", "point": "はっきり", "point_key": "はっきり", "family": "kana_adverb", "modality": "listen", "exam_weight": 2.0, "roi_score": 1.16, "teach": {"left": {"ja": "はっきり", "sub": "🔍 清晰明确（声音/视线/态度） · はっきり言う・富士山がはっきり見える"}, "right": {"ja": "うっかり", "sub": "💭 一走神犯迷糊 · うっかり忘れる・うっかり乗り過ごす"}, "example_ja": "後ろの席まで聞こえるように、もっと大きな声ではっきり返事をしてください。", "zh_meaning": "为了让后排座位也听得见，请更大声、更清楚地回答。", "audio": "./audio/V-20261114-05_exp.mp3?v=10a8c2b8"}, "primary": {"id": "V-20261114-05", "prompt": "後ろの席まで聞こえるように、もっと大きな声で（　　）返事をしてください。", "choices": ["はっきり", "うっかり"], "answer": "はっきり", "full_ja": "後ろの席まで聞こえるように、もっと大きな声ではっきり返事をしてください。", "zh_meaning": "为了让后排座位也听得见，请更大声、更清楚地回答。", "why_line": "要求声音洪亮、吐字「清清楚楚、明明白白」。", "form_line": "「はっきり」表示清楚分明；「うっかり」表示一时走神、疏忽大意。", "opt_notes": {"はっきり": "表示声音响亮清楚、轮廓清晰可见或态度明确果断（はっきり断る）。", "うっかり": "表示「一不留神、粗心大意」，只能搭配犯错/忘事，不能祈使别人「迷糊地回答」。"}, "q_audio": "./audio/V-20261114-05_q.mp3?v=c617d78e", "exp_audio": "./audio/V-20261114-05_exp.mp3?v=10a8c2b8", "is_listening": false}, "variants": []}, {"id": "Q-20261114-005", "subject": "听力", "point": "〜させていただきます", "point_key": "N3L-199", "family": "listen_intent", "modality": "listen", "exam_weight": 2.9, "roi_score": 0.58, "teach": {"left": {"ja": "休ませていただけませんか", "sub": "下属求批准：能让我休假吗？ · 对应回应：做好交接（引き継ぎ）就可以"}, "right": {"ja": "休んでいただけませんか", "sub": "劝对方休息：能请您休息吗？ · 选2就是故意调侃这种错法的陷阱项"}, "example_ja": "男：部長、実は来週の金曜日、私用で会社を休ませていただけないでしょうか。\n女：うん、引き継ぎをしておけば大丈夫だよ。", "zh_meaning": "男：「部长，其实下周五我有点私事，不知能否批我休假一天？」 女：「嗯，只要提前做好工作交接就没问题。」", "audio": "./audio/Q-20261114-005_exp.mp3?v=704b5ead"}, "primary": {"id": "Q-20261114-005", "prompt": "", "choices": ["うん、引き継ぎをしておけば大丈夫だよ。", "えっ、私に来週休んでほしいの？", "金曜日ならもう休みましたよ。"], "answer": "うん、引き継ぎをしておけば大丈夫だよ。", "full_ja": "男：部長、実は来週の金曜日、私用で会社を休ませていただけないでしょうか。\n女：うん、引き継ぎをしておけば大丈夫だよ。", "zh_meaning": "男：「部长，其实下周五我有点私事，不知能否批我休假一天？」 女：「嗯，只要提前做好工作交接就没问题。」", "why_line": "下属用「休ませていただけないでしょうか」请求批准自己下周五休假。", "form_line": "第 1 句准假并叮嘱交接工作；第 2 句把谁休假搞反；第 3 句把下周五听成了过去。", "opt_notes": {"うん、引き継ぎをしておけば大丈夫だよ。": "「嗯，只要提前做好工作交接就没问题。」部长准假并叮嘱交接。", "えっ、私に来週休んでほしいの？": "「咦，你要我下周休息吗？」把下属请假听反成了让部长休假。", "金曜日ならもう休みましたよ。": "「周五的话已经休过了哦。」时态错误，请的是下周五的假。"}, "q_audio": "./audio/Q-20261114-005_q.mp3?v=aa709a29", "exp_audio": "./audio/Q-20261114-005_exp.mp3?v=704b5ead", "is_listening": true}, "variants": []}, {"id": "GQ-20261114-02", "subject": "语法", "point": "〜ように言う", "point_key": "〜ように言う", "family": "hearsay_infer", "modality": "both", "exam_weight": 2.6, "roi_score": 1.508, "teach": {"left": {"ja": "飲むように言われた", "sub": "V原形/ない形 ＋ ように言う · 医生叮嘱/要求我「要按时吃药」"}, "right": {"ja": "飲んだそうだ", "sub": "简体句 ＋ そうだ / んだって · 传闻「听说他吃药了」"}, "example_ja": "医者に薬を飲むように言われた。", "zh_meaning": "被医生叮嘱要按时吃药。", "audio": "./audio/GQ-20261114-02_exp.mp3?v=5b7cae37"}, "primary": {"id": "GQ-20261114-02", "prompt": "医者に薬を飲むように言われた。", "choices": ["被医生叮嘱要吃药", "听说医生吃了药"], "answer": "被医生叮嘱要吃药", "full_ja": "医者に薬を飲むように言われた。", "zh_meaning": "被医生叮嘱要按时吃药。", "why_line": "这里的「ように言う」表示叮嘱、劝告、要求某人去做某事，并不是比喻也不是听说。", "form_line": "动词原形「飲む」加「ように」，再配被动形「言われた（我被医生告知）」，合起来就是医生嘱咐我要吃药。", "opt_notes": {"被医生叮嘱要吃药": "「医者に〜ように言われた」＝被医生嘱咐去做某事（间接命令/叮嘱的标准表达）。", "听说医生吃了药": "传闻「听说」要用「医者が薬を飲んだそうだ／んだって」，结构完全不同。"}, "q_audio": "./audio/GQ-20261114-02_q.mp3?v=af5bcc31", "exp_audio": "./audio/GQ-20261114-02_exp.mp3?v=5b7cae37", "is_listening": false}, "variants": []}, {"id": "N3-H09", "subject": "活用", "point": "五段可能形（え段＋る）", "point_key": "V-027", "family": "potential_form", "modality": "memorize", "exam_weight": 3.0, "roi_score": 0.6, "teach": {"left": {"ja": "読む → 読める", "sub": "五段可能形：词尾 u段 → e段＋る"}, "right": {"ja": "読む → 読まれる", "sub": "あ段＋れる 是受身/尊敬，不是能读"}, "example_ja": "辞書がなくても、日本の新聞が少し読めるようになった。", "zh_meaning": "就算不用词典，也渐渐能读懂一点日本报纸了。", "audio": "./audio/N3-H09_exp.mp3?v=d44544bd"}, "primary": {"id": "N3-H09", "prompt": "辞書がなくても、日本の新聞が少し（　　）ようになった。", "choices": ["読める", "読まれる"], "answer": "読める", "full_ja": "辞書がなくても、日本の新聞が少し読めるようになった。", "zh_meaning": "就算不用词典，也渐渐能读懂一点日本报纸了。", "why_line": "句尾接「ようになった」，描述个人能力从不会变成「能读了」，要用可能形。", "form_line": "五段动词「読む」把词尾う段「む」推到え段「め」加「る」＝「読める（能读）」；「読まれる」是被动或尊敬。", "opt_notes": {"読める": "「読む」的可能形，搭配「〜ようになった」表变得能读报纸了。", "読まれる": "「読む」的被动/尊敬形，不能表达个人阅读能力提升。"}, "q_audio": "./audio/N3-H09_q.mp3?v=dfc765fe", "exp_audio": "./audio/N3-H09_exp.mp3?v=d44544bd", "is_listening": false}, "variants": []}, {"id": "N3-V09", "subject": "词汇", "point": "書類（しょるい）", "point_key": "書類", "family": "kanji_reading", "modality": "memorize", "exam_weight": 2.2, "roi_score": 0.44, "teach": {"left": {"ja": "しょ・るい（書類）", "sub": "短音「しょ」。（同：辞書 じしょ、図書館 としょかん）"}, "right": {"ja": "しょうるい", "sub": "中文母语最爱误加长音 う"}, "example_ja": "大事な書類を封筒に入れた。", "zh_meaning": "把重要的文件装进了信封。", "audio": "./audio/N3-V09_exp.mp3?v=545a6402"}, "primary": {"id": "N3-V09", "prompt": "大事な「書類」を封筒に入れた。「書類」の読み方は？", "choices": ["しょるい", "しょうるい"], "answer": "しょるい", "full_ja": "大事な書類を封筒に入れた。", "zh_meaning": "把重要的文件装进了信封。", "why_line": "考「書類（文件、资料）」里汉字「書」在日语中的长短音。", "form_line": "中文「书」听感较长，但日语里的「書（しょ）」是一拍短音，合起来是「しょるい」，绝不加「う」。", "opt_notes": {"しょるい": "「書類」标准读音（⓪型），「書」为短音 しょ。", "しょうるい": "典型的多加长音误读。"}, "q_audio": "./audio/N3-V09_q.mp3?v=5bdeff50", "exp_audio": "./audio/N3-V09_exp.mp3?v=545a6402", "is_listening": false}, "variants": []}, {"id": "Q-20261114-002", "subject": "听力", "point": "「いいわ/いいよ(不要)」", "point_key": "N3L-071", "family": "listen_intent", "modality": "listen", "exam_weight": 2.8, "roi_score": 0.56, "teach": {"left": {"ja": "あ、袋はいいです", "sub": "✋ 委婉拒绝 ＝ いらない（不用了） · レシートはいいです / お茶はいいよ"}, "right": {"ja": "お願いします", "sub": "接受提议 ＝ ください（麻烦给我） · 想要袋子时绝不说「はいいです」"}, "example_ja": "店員：袋にお入れしましょうか？\n客：あ、袋はいいです。そのまま持って帰りますから。", "zh_meaning": "店员：「需要给您装袋吗？」 客人：「啊，袋子不用了，我就这样直接拿回去。」", "audio": "./audio/Q-20261114-002_exp.mp3?v=b4578e9f"}, "primary": {"id": "Q-20261114-002", "prompt": "", "choices": ["袋をもらう。", "袋はいらない。", "大きい袋に変える。"], "answer": "袋はいらない。", "full_ja": "店員：袋にお入れしましょうか？\n客：あ、袋はいいです。そのまま持って帰りますから。", "zh_meaning": "店员：「需要给您装袋吗？」 客人：「啊，袋子不用了，我就这样直接拿回去。」", "why_line": "店员询问要不要某物时，回答「袋はいいです／大丈夫です」是委婉谢绝，且后半句明确说直接拿回去。", "form_line": "第 2 项不要袋子正确；第 1 项误把「いいです」当成要；第 3 项换大袋子未提及。", "opt_notes": {"袋をもらう。": "「要袋子。」误把礼貌谢绝的 袋はいいです 按字面听成要。", "袋はいらない。": "「不要袋子。」客人谢绝装袋并说明直接拿回去。", "大きい袋に変える。": "「换成大袋子。」对话中未提及。"}, "q_audio": "./audio/Q-20261114-002_q.mp3?v=933aa9b4", "exp_audio": "./audio/Q-20261114-002_exp.mp3?v=b4578e9f", "is_listening": true}, "variants": []}, {"id": "N3-G16", "subject": "语法", "point": "〜しだい（一…就立即）", "point_key": "〜しだい", "family": "aspect_time", "modality": "memorize", "exam_weight": 2.6, "roi_score": 1.508, "teach": {"left": {"ja": "決まり ＋ しだい", "sub": "ます形词干 ＋ しだい ＝ 一…就立刻"}, "right": {"ja": "決まったしだい", "sub": "不能接过去式「た形」表一…就"}, "example_ja": "日程が決まりしだい、すぐメールでご連絡します。", "zh_meaning": "日程一定下来，我立刻发邮件联系您。", "audio": "./audio/N3-G16_exp.mp3?v=0c9c267b"}, "primary": {"id": "N3-G16", "prompt": "日程が（　　）、すぐメールでご連絡します。", "choices": ["決まりしだい", "決まったしだい"], "answer": "決まりしだい", "full_ja": "日程が決まりしだい、すぐメールでご連絡します。", "zh_meaning": "日程一定下来，我立刻发邮件联系您。", "why_line": "职场里礼貌表达「一旦前事落定，紧接着立刻去做下一步」，固定用「しだい」。", "form_line": "「しだい」前面必须接动词ます形去掉「ます」（決まります → 決まりしだい），绝不能接过去式「決まった」。", "opt_notes": {"決まりしだい": "ます形词干＋しだい，商务与通知高频句型，意为「一旦确定就立即…」。", "決まったしだい": "「た形＋しだいだ」是N2句尾说明原委，不能在句中表「一…就立即」。"}, "q_audio": "./audio/N3-G16_q.mp3?v=611ff9f9", "exp_audio": "./audio/N3-G16_exp.mp3?v=0c9c267b", "is_listening": false}, "variants": []}, {"id": "N3-H10", "subject": "活用", "point": "閉まる ↔ 閉める", "point_key": "T-002", "family": "transitivity", "modality": "both", "exam_weight": 3.0, "roi_score": 0.6, "teach": {"left": {"ja": "ドアが 閉まる", "sub": "が ＋ まる ＝ 门自己关上（自动）"}, "right": {"ja": "ドアを 閉める", "sub": "を ＋ める ＝ 人把门关上（他动）"}, "example_ja": "風が強くて、ドアが勝手に閉まった。", "zh_meaning": "风很大，门自己关上了。", "audio": "./audio/N3-H10_exp.mp3?v=58998dd3"}, "primary": {"id": "N3-H10", "prompt": "風が強くて、ドアが勝手に（　　）。", "choices": ["閉まった", "閉めた"], "answer": "閉まった", "full_ja": "風が強くて、ドアが勝手に閉まった。", "zh_meaning": "风很大，门自己关上了。", "why_line": "不是人去关门，而是风吹得「门自己关上了」，前面配「ドアが勝手に」，要用自动词。", "form_line": "「閉まる → 閉まった」是自动词（门自己关，配が）；「閉める → 閉めた」是他动词（人伸手关门，配を）。", "opt_notes": {"閉まった": "自动词「閉まる」过去式，搭配「ドアが勝手に（门自己）」。", "閉めた": "他动词「閉める」，必须搭配动作承受者「ドアを」。"}, "q_audio": "./audio/N3-H10_q.mp3?v=c7b4f97f", "exp_audio": "./audio/N3-H10_exp.mp3?v=58998dd3", "is_listening": false}, "variants": [{"id": "VAR-H10", "prompt": "エアコンをつけるから、窓を（　　）ください。", "choices": ["閉めて", "閉まって"], "answer": "閉めて", "full_ja": "エアコンをつけるから、窓を閉めてください。", "zh_meaning": "要开空调了，请把窗户关上。", "why_line": "请对方动手「把窗户关上」，前面有宾格助词「窓を」，必须配他动词。", "form_line": "他动词「閉める → 閉めて」配「窓を」；自动词「閉まって」是门窗自己关着。", "opt_notes": {"閉めて": "他动词「閉める」，配宾语「窓を」。", "閉まって": "自动词不能配「窓を」。"}, "q_audio": "./audio/VAR-H10_q.mp3?v=66b05431", "exp_audio": "./audio/VAR-H10_exp.mp3?v=651f97c0", "is_listening": false}]}, {"id": "V-20261114-04", "subject": "词汇", "point": "貯める", "point_key": "貯める", "family": "kanji_reading", "modality": "memorize", "exam_weight": 2.2, "roi_score": 0.44, "teach": {"left": {"ja": "貯める（ためる）", "sub": "单字带假名尾巴 → 训读 · お金をためる（把钱攒起来）"}, "right": {"ja": "貯金（ちょきん）", "sub": "双汉字合成词 → 音读 · 銀行にちょきんする（存款）"}, "example_ja": "将来のために毎月少しずつお金を貯める。", "zh_meaning": "为了将来，每个月一点一点存钱。", "audio": "./audio/V-20261114-04_exp.mp3?v=72015c06"}, "primary": {"id": "V-20261114-04", "prompt": "毎月少しずつお金を「貯める」。", "choices": ["ためる", "ちょめる"], "answer": "ためる", "full_ja": "将来のために毎月少しずつお金を貯める。", "zh_meaning": "为了将来，每个月一点一点存钱。", "why_line": "「お金を貯める」表示把钱或积分积攒起来，考单汉字动词的训读发音。", "form_line": "单独带假名尾巴「〜める」走训读「ためる」；只有组成双汉字名词「貯金」时才读音读「ちょきん」。", "opt_notes": {"ためる": "和语训读他动词（下一段），搭「お金／ポイントを貯める」（对应自动词：貯まる たまる）。", "ちょめる": "把音读「ちょ」硬拼上训读词尾「める」的错读（日语不存在 ちょめる 这个词）。"}, "q_audio": "./audio/V-20261114-04_q.mp3?v=1671becf", "exp_audio": "./audio/V-20261114-04_exp.mp3?v=72015c06", "is_listening": false}, "variants": []}, {"id": "N3-G17", "subject": "语法", "point": "〜どころか", "point_key": "〜どころか", "family": "reason_contrast", "modality": "both", "exam_weight": 2.6, "roi_score": 1.508, "teach": {"left": {"ja": "暇どころか…時間もない", "sub": "别说清闲了，甚至连吃饭都没空"}, "right": {"ja": "〜おかげで", "sub": "多亏了…（正面感谢原因）"}, "example_ja": "今週は暇どころか、昼ご飯を食べる時間もない。", "zh_meaning": "这周别说清闲了，连吃午饭的时间都没有。", "audio": "./audio/N3-G17_exp.mp3?v=df8bf45e"}, "primary": {"id": "N3-G17", "prompt": "今週は暇（　　）、昼ご飯を食べる時間もない。", "choices": ["どころか", "おかげで"], "answer": "どころか", "full_ja": "今週は暇どころか、昼ご飯を食べる時間もない。", "zh_meaning": "这周别说清闲了，连吃午饭的时间都没有。", "why_line": "前后反差极大：先推翻「清闲」的猜测，再甩出完全相反的事实「忙到没空吃饭」。", "form_line": "名词「暇」直接接「どころか」表示「别说……甚至正相反」；「おかげで」是正面感谢「多亏了」，意思完全不对。", "opt_notes": {"どころか": "强烈否定前项预期并给出极端事实，「别说闲了，连吃饭都没空」。", "おかげで": "意为「多亏了…」，表达正面感激，语义完全不通。"}, "q_audio": "./audio/N3-G17_q.mp3?v=b815fa7b", "exp_audio": "./audio/N3-G17_exp.mp3?v=df8bf45e", "is_listening": false}, "variants": []}, {"id": "H-20261114-06", "subject": "活用", "point": "五段使役受身短形（〜される）与正式形", "point_key": "V-045", "family": "voice_form", "modality": "memorize", "exam_weight": 2.9, "roi_score": 0.58, "teach": {"left": {"ja": "話す → 話させられた", "sub": "す结尾五段动词唯一正确形 · 不缩约，完整保留させられた"}, "right": {"ja": "話さされた", "sub": "す结尾严禁缩约 · ささ连撞拗口，日语严禁这样缩"}, "example_ja": "昨日のパーティーで、急にみんなの前で日本語でスピーチを話させられた。", "zh_meaning": "昨天派对上，突然在大家面前被迫用日语讲了话。", "audio": "./audio/H-20261114-06_exp.mp3?v=3d3698a9"}, "primary": {"id": "H-20261114-06", "prompt": "昨日のパーティーで、急にみんなの前で日本語でスピーチを（　　）。", "choices": ["話させられた", "話さされた", "話しさせられた"], "answer": "話させられた", "full_ja": "昨日のパーティーで、急にみんなの前で日本語でスピーチを話させられた。", "zh_meaning": "昨天派对上，突然在大家面前被迫用日语讲了话。", "why_line": "原本没打算上台，是被大家起哄推上去「被迫发言」，要用使役受身形。", "form_line": "五段动词「話す」以「す」结尾，变使役受身不能缩约，只能先变「話させ」再加「られた」＝「話させられた」。", "opt_notes": {"話させられた": "「す」结尾五段动词的使役受身不能缩约，只能用完整形「話させられた」。", "話さされた": "错误缩约：「す」结尾五段动词严禁缩成「〜さされた」。", "話しさせられた": "接续错误：误拿ます形词干「話し」去硬接「させられた」。"}, "q_audio": "./audio/H-20261114-06_q.mp3?v=dd2a5112", "exp_audio": "./audio/H-20261114-06_exp.mp3?v=3d3698a9", "is_listening": false}, "variants": [{"id": "VAR-H06", "prompt": "子どもの頃、母に嫌いな牛乳を毎日（　　）。", "choices": ["飲まされた", "飲みさせられた"], "answer": "飲まされた", "full_ja": "子どもの頃、母に嫌いな牛乳を毎日飲まされた。", "zh_meaning": "小时候，每天都被妈妈逼着喝讨厌的牛奶。", "why_line": "自己不想喝却被妈妈要求喝，「被迫做某事」要用使役受身形。", "form_line": "非「す」结尾的五段动词「飲む」，词尾「む」变あ段「ま」加缩约形「された」＝「飲まされた」，绝没有「飲みさせられた」。", "opt_notes": {"飲まされた": "「飲む」的标准使役受身缩约形（被迫喝）。", "飲みさせられた": "接续错误，五段动词不以ます干接させられる。"}, "q_audio": "./audio/VAR-H06_q.mp3?v=8b76be72", "exp_audio": "./audio/VAR-H06_exp.mp3?v=e64f9961", "is_listening": false}]}, {"id": "V-20261114-08", "subject": "词汇", "point": "出張", "point_key": "出張", "family": "kanji_reading", "modality": "memorize", "exam_weight": 2.2, "roi_score": 0.44, "teach": {"left": {"ja": "出張 → しゅっちょう", "sub": "有促音「っ」＋有长音「う」 · 出（しゅつ）遇ち音变促音＝出差"}, "right": {"ja": "主張 → しゅちょう", "sub": "无促音「っ」＋有长音「う」 · 漏掉促音就变成「主张观点」"}, "example_ja": "来週から三日間、大阪へ出張します。", "zh_meaning": "下周起要去大阪出差三天。", "audio": "./audio/V-20261114-08_exp.mp3?v=ffb30e10"}, "primary": {"id": "V-20261114-08", "prompt": "来週から三日間、大阪へ「出張」します。「出張」の読み方は？", "choices": ["しゅっちょう", "しゅちょう", "しゅっちょ"], "answer": "しゅっちょう", "full_ja": "来週から三日間、大阪へ出張します。", "zh_meaning": "下周起要去大阪出差三天。", "why_line": "考高频职场词「出張（出差）」的促音与长音组合。", "form_line": "「出（しゅっ）」带促音停顿，「張（ちょう）」带长音，合起来是「しゅっちょう」；漏掉促音念「しゅちょう」就变成「主張（主张观点）」。", "opt_notes": {"しゅっちょう": "中间促音「っ」与末尾长音「う」俱全，「出張（出差）」标准读音。", "しゅちょう": "漏掉中间促音，会变成另一个词「主張（主张观点）」。", "しゅっちょ": "漏掉了「張（ちょう）」末尾的长音「う」。"}, "q_audio": "./audio/V-20261114-08_q.mp3?v=163abd46", "exp_audio": "./audio/V-20261114-08_exp.mp3?v=ffb30e10", "is_listening": false}, "variants": []}, {"id": "N3-G18", "subject": "语法", "point": "〜めったに〜ない", "point_key": "〜めったに〜ない", "family": "star_syntax", "modality": "memorize", "exam_weight": 2.6, "roi_score": 1.508, "teach": {"left": {"ja": "めったに
