<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="screen-orientation" content="portrait" />
<meta name="x5-orientation" content="portrait" />
<meta name="description" content="JLPT N3 · 做题 · 随身听 · 单手记词" />
<meta name="theme-color" content="#F5F2EB" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+JP:wght@500;600&display=swap" rel="stylesheet" />
<title>N3</title>
<style>
  :root {
    /* Traditional Japanese Pigments (日本の伝統色): 生成り · 白練 · 墨 · 苔色 · 黄土 · 弁柄 */
    --washi: #F5F2EB;
    --sheet: #FCFBF8;
    --sumi: #1C1B18;
    --ink-2: #48443C;
    --ink-3: #847E72;
    --hairline: rgba(28, 27, 24, 0.09);
    --hairline-strong: rgba(28, 27, 24, 0.18);
    --track: #E5E0D5;
    --moss: #2B5F49;
    --moss-soft: rgba(43, 95, 73, 0.10);
    --ochre: #B07D3A;
    --bengara: #9E3E36;
    /* Editorial Bilingual Pairing: Japanese Literary Mincho + Clean Chinese Humanist Sans */
    --sans: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", -apple-system, BlinkMacSystemFont, sans-serif;
    --serif-jp: "Hiragino Mincho ProN", "YuMincho", "Noto Serif JP", serif;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--washi);
    color: var(--sumi);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    /* Eliminate Android Chrome Touch-to-Search Google bar on word tap */
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: calc(14px + env(safe-area-inset-top)) 26px calc(16px + env(safe-area-inset-bottom));
  }

  .zen-shell {
    width: 100%;
    max-width: 496px;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  @media (min-width: 860px) and (min-height: 521px) {
    body { padding: 34px 48px 34px; }
    .zen-shell { max-width: 590px; }
    .zen-shell.wide-mode { max-width: 800px; }
  }

  button {
    font-family: inherit;
    white-space: nowrap;
    background: none;
    border: none;
    padding: 0;
    color: inherit;
    cursor: pointer;
  }

  /* Portrait guard (phone only): counter-rotate the app when the OS rotates to landscape anyway */
  html.fp {
    width: var(--fp-w);
    height: var(--fp-h);
    overflow: hidden;
  }
  html.fp body {
    position: fixed;
    top: 0;
    left: 0;
    width: var(--fp-h) !important;
    height: var(--fp-w) !important;
    padding-left: 26px;
    padding-right: 26px;
    transform-origin: 0 0;
  }
  html.fp-90 body { transform: translateY(var(--fp-h)) rotate(-90deg); }
  html.fp-270 body { transform: translateX(var(--fp-w)) rotate(90deg); }
  html.fp #tutor-view,
  html.fp .focal-space { touch-action: manipulation; }

  /* ================= 1. STRICT GRID HEADER ================= */
  .zen-header {
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--hairline);
  }

  .zen-brand {
    font-size: 15px;
    font-weight: 500;
    color: var(--ink-3);
    letter-spacing: 0.06em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .zen-brand strong {
    font-weight: 600;
    color: var(--sumi);
    margin: 0 2px;
  }

  .zen-nav {
    display: flex;
    align-items: baseline;
    gap: 20px;
  }
  .nav-link {
    font-size: 16.5px;
    font-weight: 500;
    color: var(--ink-3);
    letter-spacing: 0.04em;
    padding: 6px 4px 5px;
    margin: -6px -4px 0;
    position: relative;
    transition: color 0.2s ease;
  }
  .nav-link.active {
    color: var(--sumi);
    font-weight: 600;
  }
  .nav-link.active::after {
    content: "";
    position: absolute;
    left: 4px;
    right: 4px;
    bottom: -15px;
    height: 1.5px;
    background: var(--sumi);
  }
  .nav-link.is-playing {
    color: var(--moss);
  }

  /* ================= 2. THREE ZEN ENSO DAILY RITUALS (円相 · 无字打卡) ================= */
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  .zen-horizon {
    flex-shrink: 0;
    padding: 10px 0 9px;
    border-bottom: 1px solid var(--hairline);
    cursor: pointer;
  }
  .horizon-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--ink-3);
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
    gap: 12px;
  }
  .horizon-meta b {
    font-weight: 600;
    color: var(--sumi);
  }
  .horizon-meta b.moss {
    color: var(--moss);
  }
  .enso-trio {
    display: flex;
    align-items: center;
    gap: 11px;
  }
  .enso-btn {
    width: 32px;
    height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    padding: 0;
    transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease;
  }
  .enso-btn:active {
    transform: scale(0.91);
  }
  .enso-svg {
    width: 26px;
    height: 26px;
    display: block;
    overflow: visible;
  }
  .enso-btn.is-done .enso-svg {
    animation: ensoSettle 0.38s cubic-bezier(0.22, 1, 0.36, 1);
  }
  @keyframes ensoSettle {
    0% { transform: scale(0.88); opacity: 0.72; }
    65% { transform: scale(1.04); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  .horizon-score {
    white-space: nowrap;
    line-height: 1;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--ink-3);
    padding: 8px 0 8px 10px;
    margin: -4px 0;
  }
  .horizon-score .ledger-tag {
    color: var(--ink-2);
    transition: color 0.18s ease;
  }
  .horizon-score.active-ledger .ledger-tag {
    color: var(--sumi);
    font-weight: 600;
  }
  .horizon-track {
    display: none;
  }

  /* ================= 3. OPEN WASHI STAGE (余白 MA + TINDER SWIPE ERGONOMICS) ================= */
  .zen-panel {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .zen-panel.hidden {
    display: none;
  }
  #tutor-view {
    touch-action: pan-y;
  }

  .stage-wrap {
    position: relative;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding-top: 14px;
    animation: fadeTurn 0.18s ease-out;
    will-change: transform, opacity;
  }
  @keyframes fadeTurn {
    from { opacity: 0.48; }
    to { opacity: 1; }
  }

  /* Tactile Tinder-style card physics on Result & Teach pages (frameless open Washi) */
  .stage-wrap.tutor-dragging {
    transition: none !important;
    animation: none !important;
  }
  .stage-wrap.tutor-settling {
    transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease;
  }
  .stage-wrap.tutor-fly-right {
    transform: translate3d(118%, 8px, 0) rotate(6.5deg) !important;
    opacity: 0 !important;
    transition: transform 0.21s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.19s ease !important;
  }
  .stage-wrap.tutor-fly-left {
    transform: translate3d(-118%, 8px, 0) rotate(-6.5deg) !important;
    opacity: 0 !important;
    transition: transform 0.21s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.19s ease !important;
  }
  .tutor-stamp {
    position: absolute;
    top: 46px;
    z-index: 30;
    padding: 4px 11px;
    border-radius: 5px;
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: 0.07em;
    opacity: 0;
    pointer-events: none;
  }
  .tutor-stamp.right {
    left: 2px;
    color: var(--moss);
    border: 1.5px solid var(--moss);
    background: rgba(252, 251, 248, 0.94);
  }
  .tutor-stamp.left {
    right: 2px;
    color: var(--bengara);
    border: 1.5px solid var(--bengara);
    background: rgba(252, 251, 248, 0.94);
  }
  .tutor-stamp.left.moss-tone {
    color: var(--moss);
    border-color: var(--moss);
  }

  .meta-bar {
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    min-height: 28px;
    gap: 12px;
  }
  .overline {
    font-size: 14.5px;
    font-weight: 500;
    letter-spacing: 0.05em;
    color: var(--ink-3);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .overline.ok { color: var(--moss); font-weight: 600; }
  .overline.ng { color: var(--bengara); font-weight: 600; }
  .overline.warm { color: var(--ochre); }

  .quiet-actions {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }
  .text-btn {
    font-size: 14.5px;
    font-weight: 500;
    color: var(--ink-2);
    letter-spacing: 0.03em;
    font-variant-numeric: tabular-nums;
    padding: 8px 5px;
    margin: -6px -5px;
  }
  .text-btn.playing {
    color: var(--moss);
    font-weight: 600;
  }

  /* Center focal space on quiz/done; pin reading views (teach/result) cleanly from the top */
  .focal-space {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding: 16px 0 22px;
    scrollbar-width: none;
    -webkit-mask-image: linear-gradient(to bottom, #000 0, #000 calc(100% - 22px), transparent 100%);
    mask-image: linear-gradient(to bottom, #000 0, #000 calc(100% - 22px), transparent 100%);
  }
  .focal-space > * { flex-shrink: 0; }
  .focal-space::-webkit-scrollbar { display: none; }
  .stage-quiz .focal-space > :first-child,
  .stage-done .focal-space > :first-child { margin-top: auto; }
  .stage-quiz .focal-space > :last-child,
  .stage-done .focal-space > :last-child { margin-bottom: auto; }

  .action-dock {
    flex-shrink: 0;
    padding-top: 10px;
  }

  /* Right-Handed Single-Hand Mobile Ergonomics (<860px) · 上看下点:
     The top of a tall phone is for READING only (zero taps needed there).
     Everything tappable lives in the right-thumb arc (~58-88% height) plus a quiet bottom-right nav,
     so the hand never shifts up to the top corners and never curls down into the bezel. */
  .thumb-nav { display: none; }
  @media (max-width: 859px), (max-height: 520px) {
    body {
      padding-bottom: calc(4px + env(safe-area-inset-bottom));
    }
    .zen-header { display: none; }
    .zen-horizon { padding-top: 4px; }
    .horizon-score .ledger-sep,
    .horizon-score .ledger-tag { display: none; }

    .thumb-nav {
      flex-shrink: 0;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      border-top: 1px solid var(--hairline);
    }
    .thumb-tabs {
      display: flex;
      align-items: stretch;
      margin-right: -10px;
    }
    .thumb-link {
      position: relative;
      height: 54px;
      min-width: 60px;
      padding: 0 11px;
      font-size: 16px;
      font-weight: 500;
      color: var(--ink-3);
      letter-spacing: 0.04em;
      transition: color 0.2s ease;
    }
    .thumb-link.active {
      color: var(--sumi);
      font-weight: 600;
    }
    /* Ink stroke resting on the hairline (mirror of the old header underline) */
    .thumb-link.active::before {
      content: "";
      position: absolute;
      top: -1px;
      left: 50%;
      width: 18px;
      margin-left: -9px;
      height: 1.5px;
      background: var(--sumi);
    }
    .thumb-link.is-playing { color: var(--moss); }
    .thumb-link:active { opacity: 0.6; }

    .ledger-back-fab { display: none !important; }
    .ledger-scroll { padding-bottom: 24px; }

    .action-dock,
    .radio-dock,
    .vc-dock {
      padding-bottom: clamp(16px, 4.4vh, 44px);
    }
    #tutor-view .stage-quiz .focal-space {
      justify-content: flex-end;
      padding-bottom: 24px;
      -webkit-mask-image: none;
      mask-image: none;
    }
    #tutor-view .stage-quiz .focal-space > :first-child,
    #tutor-view .stage-quiz .focal-space > :last-child {
      margin-top: 0;
      margin-bottom: 0;
    }
    #tutor-view .stage-quiz .quiz-focal {
      min-height: 92px;
      justify-content: flex-end;
    }
    #tutor-view .stage-quiz .listen-medallion-wrap {
      padding: 12px 0 8px;
    }
  }

  /* Desktop vs Mobile Ergonomics (>=860px):
     Quiz centers optically; reading views stay anchored from top so tapping words shifts 0px. */
  @media (min-width: 860px) and (min-height: 521px) {
    #tutor-view .stage-wrap {
      justify-content: flex-start;
    }
    #tutor-view .focal-space {
      flex: 0 1 auto;
      justify-content: flex-start;
      padding: 22px 0 2px;
      -webkit-mask-image: none;
      mask-image: none;
    }
    #tutor-view .stage-quiz .focal-space,
    #tutor-view .stage-done .focal-space {
      margin-top: auto;
    }
    #tutor-view .action-dock {
      padding-top: 26px;
    }
    #tutor-view .stage-quiz .action-dock,
    #tutor-view .stage-done .action-dock {
      margin-bottom: auto;
    }
  }

  /* -------- TEACH VIEW -------- */
  .point-heading {
    margin: 0 0 20px;
    font-family: var(--serif-jp);
    font-size: 27.5px;
    font-weight: 600;
    line-height: 1.38;
    letter-spacing: 0.03em;
    color: var(--sumi);
  }
  .zen-pair {
    border-top: 1px solid var(--hairline);
    border-bottom: 1px solid var(--hairline);
    margin-bottom: 20px;
  }
  .zen-pair-row {
    padding: 15px 0;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .zen-pair-row + .zen-pair-row {
    border-top: 1px solid var(--hairline);
  }
  .zp-ja {
    font-family: var(--serif-jp);
    font-size: 22px;
    font-weight: 600;
    color: var(--sumi);
    letter-spacing: 0.025em;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .zp-dot {
    width: 6.5px;
    height: 6.5px;
    border-radius: 50%;
    background: var(--moss);
    flex-shrink: 0;
  }
  .zp-dot.muted {
    background: transparent;
    border: 1.5px solid var(--ink-3);
  }
  .zp-sub {
    padding-left: 16.5px;
    font-size: 16.5px;
    font-weight: 400;
    color: var(--ink-2);
    line-height: 1.6;
  }

  .example-line {
    font-family: var(--serif-jp);
    font-size: 22.5px;
    font-weight: 500;
    line-height: 1.76;
    letter-spacing: 0.03em;
    color: var(--sumi);
    white-space: pre-line;
  }
  .example-zh {
    margin: 8px 0 0;
    font-size: 17px;
    color: var(--ink-2);
    line-height: 1.62;
  }

  /* -------- QUIZ VIEW (Optimal Literary Reading Scale + Blind-Ear Listening) -------- */
  .quiz-focal {
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 116px;
  }
  .quiz-ja {
    margin: 0;
    font-family: var(--serif-jp);
    font-size: 27px;
    font-weight: 600;
    line-height: 1.74;
    letter-spacing: 0.035em;
    color: var(--sumi);
  }
  @media (min-width: 860px) and (min-height: 521px) {
    .quiz-ja { font-size: 30px; }
  }

  .listen-medallion-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 0;
  }
  .listen-medallion {
    width: 82px;
    height: 82px;
    border-radius: 50%;
    border: 1px solid var(--hairline-strong);
    background: var(--sheet);
    color: var(--sumi);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.2s ease, transform 0.15s ease;
  }
  .listen-medallion:active { transform: scale(0.96); }
  .listen-medallion.speaking {
    border-color: var(--moss);
    color: var(--moss);
  }
  .med-ic { width: 27px; height: 27px; margin-left: 2px; }
  .med-waves { display: none; align-items: center; gap: 3.5px; height: 24px; }
  .listen-medallion.speaking .med-ic { display: none; }
  .listen-medallion.speaking .med-waves { display: flex; }
  .med-waves span {
    width: 2.5px;
    height: 8px;
    background: var(--moss);
    animation: zenWave 0.9s ease-in-out infinite;
  }
  .med-waves span:nth-child(2) { animation-delay: 0.16s; }
  .med-waves span:nth-child(3) { animation-delay: 0.32s; }
  @keyframes zenWave {
    0%, 100% { height: 6px; opacity: 0.45; }
    50% { height: 20px; opacity: 1; }
  }

  .choice-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .zen-choice {
    width: 100%;
    min-height: 62px;
    padding: 14px 22px;
    background: var(--sheet);
    border: 1px solid var(--hairline-strong);
    border-radius: 8px;
    font-family: var(--serif-jp);
    font-size: 22.5px;
    font-weight: 500;
    color: var(--sumi);
    letter-spacing: 0.03em;
    line-height: 1.44;
    text-align: left;
    white-space: normal;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: border-color 0.16s ease, background 0.16s ease;
  }
  .zen-choice:active { background: #EDEAE1; }

  .listen-num-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }
  .listen-num-btn {
    min-height: 68px;
    background: var(--sheet);
    border: 1px solid var(--hairline-strong);
    border-radius: 8px;
    font-family: var(--serif-jp);
    font-size: 25px;
    font-weight: 600;
    color: var(--sumi);
    font-variant-numeric: tabular-nums;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.16s ease, background 0.16s ease;
  }
  .listen-num-btn:active { background: #EDEAE1; }

  .unsure-btn {
    margin-top: 12px;
    width: 100%;
    min-height: 46px;
    padding: 0 18px;
    border: 1px dashed var(--hairline-strong);
    border-radius: 8px;
    font-size: 15px;
    font-weight: 500;
    color: var(--ink-2);
    letter-spacing: 0.04em;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: border-color 0.16s ease, color 0.16s ease, background 0.16s ease;
  }
  .unsure-btn:active { background: #EDEAE1; }

  /* Quiz aux row (簡素 · Kanso): two quiet ink words, no boxes.
     The option cards stay the ONLY objects on the page; 读题 rests on the right edge under the thumb. */
  .quiz-aux-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
  }
  .quiz-aux-row .unsure-btn,
  .quiz-aux-row .aux-read-btn {
    width: auto;
    height: 48px;
    min-height: 48px;
    margin: 0;
    border: none;
    border-radius: 0;
    background: transparent;
    font-size: 14.5px;
    font-weight: 500;
    letter-spacing: 0.05em;
    transition: opacity 0.15s ease, color 0.2s ease;
  }
  .quiz-aux-row .unsure-btn {
    flex: 0 1 auto;
    justify-content: flex-start;
    padding: 0 24px 0 2px;
    color: var(--ink-3);
  }
  .quiz-aux-row .aux-read-btn {
    flex-shrink: 0;
    padding: 0 2px 0 28px;
    color: var(--ink-2);
  }
  .quiz-aux-row .aux-read-btn.playing { color: var(--moss); font-weight: 600; }
  .quiz-aux-row .unsure-btn:active,
  .quiz-aux-row .aux-read-btn:active { background: transparent; opacity: 0.5; }

const DATA = {"plan_date": "2026-11-18", "exam_date": "2026-12-06", "days_to_exam": 18, "done_audio": "./audio/done.mp3", "radio": {"date": "2026-11-18", "radio_ver": "v32_real_qq_music", "display_date": "锵锵三人", "days_left": 18, "script_sig": "6e24bbc44ae2a2", "audio_url": "./audio/daily_radio.mp3?v=2026-11-18_6e24bb", "duration_sec": 2344.4, "duration_label": "39 分钟", "hosts": "文涛 · 文道 · 子东", "immersion_365": {"day_of_365": 4, "post_n3_day": 0, "ramp_days": 700, "phase": "n3_sprint", "ja_ratio": 0.1, "ja_sentence_rate": "-12%", "bilingual_framing": false}, "chapters": [{"idx": 0, "title": "今日时局", "start": 0.0}, {"idx": 1, "title": "派阀暗流", "start": 225.0}, {"idx": 2, "title": "福泽谕吉", "start": 421.1}, {"idx": 3, "title": "村上春树", "start": 640.6}, {"idx": 4, "title": "四重奏", "start": 850.5}, {"idx": 5, "title": "江户春画", "start": 1073.4}, {"idx": 6, "title": "名校就活", "start": 1257.9}, {"idx": 7, "title": "驻美围城", "start": 1436.2}, {"idx": 8, "title": "谢罪剧场", "start": 1626.4}, {"idx": 9, "title": "独居东京", "start": 1814.0}, {"idx": 10, "title": "吉祥寺夜色", "start": 1982.7}, {"idx": 11, "title": "表参道约", "start": 2173.3}], "segments": [{"chapter": 0, "point_id": "G-20261114-10", "point_ids": ["G-20261114-10", "N3-V22", "N3-G23"], "title": "冬季电费燃气补贴重开的猫腻、买菜篮子里的寒意，与十二月中产抢搭「故乡纳税」末班车奇观", "ja_focus": "補助金が再開されるから光熱費が安くなるはずなんですが、家計はだんだん苦しくなっている。手続きが面倒なわりに、今年の返礼品は量が少ない。", "start": 0.0, "end": 225.0}, {"chapter": 1, "point_id": "N3-G20", "point_ids": ["N3-G20", "N3-V24", "G-20261114-05"], "title": "自民党「派阀解散」为何名亡实存？扒开麻生派与赤坂酒店密室数人头的权力潜规则", "ja_focus": "表向きは派閥が解散したことになっている。総裁選が近づくにしたがって、夜の会合が増えていく。決選投票がいよいよ始まる。", "start": 225.0, "end": 421.1}, {"chapter": 2, "point_id": "G-20261114-06", "point_ids": ["G-20261114-06", "N3-G13", "N3-V30"], "title": "福泽谕吉《劝学篇》的百年悖论：高喊「一身独立而后一国独立」，为何养出了最抱团的公司社畜？", "ja_focus": "研究者の話によると、三百万部も売れたそうだ。福沢諭吉を敬ってきた国にしては、組織への同調圧力が強すぎる。輪を乱す者を決して許さない。", "start": 421.1, "end": 640.6}, {"chapter": 3, "point_id": "N3-G22", "point_ids": ["N3-G22", "N3-V27", "N3-V17"], "title": "从国分寺爵士酒吧老板到《挪威的森林》：村上春树为何在文坛甘当孤鸟，却抚平了一代都市人的孤独？", "ja_focus": "外野席で青空をぼんやり見上げていた。都会の夜に一人でいると寂しくてたまらない。傷ついた読者の心を静かに慰める。", "start": 640.6, "end": 850.5}, {"chapter": 4, "point_id": "N3-L08", "point_ids": ["N3-L08", "H-20261114-04", "V-20261114-05"], "title": "二零一七版坂元裕二《四重奏》轻井泽残酷物语：当定情诗集被垫在海鲜饭锅底，以及「爱她却不再迷恋她」", "ja_focus": "大切な詩集をパエリアの鍋敷きにしちゃった。気づいた時には、恋の気持ちが自然に消えていた。嫌だとはっきり言えばよかったのに。", "start": 850.5, "end": 1073.4}, {"chapter": 5, "point_id": "V-20261114-06", "point_ids": ["V-20261114-06", "N3-V23", "N3-V21"], "title": "江户浮世绘「春画」与葛饰北斋：原本出嫁压箱底的欢愉博物学，为何明治维新后突然羞于启齿？", "ja_focus": "北斎は緻密な描写にユーモアを加えた。明治政府が取り締まりをどんどん厳しくした。うっかり見落としていた江戸の大らかさ。", "start": 1073.4, "end": 1257.9}, {"chapter": 6, "point_id": "N3-L06", "point_ids": ["N3-L06", "H-20261114-07", "N3-H18"], "title": "大三全员黑西装的成人礼：扒开日本名企「学历筛子」暗门，与人事部握咖啡逼签内定的心理战", "ja_focus": "志望動機の暗記は後にして、その前に先輩訪問を済ませる。人事部長も君が欲しいとおっしゃっていましたよ。うちで就活を終わらせてくれないか。", "start": 1257.9, "end": 1436.2}, {"chapter": 7, "point_id": "H-20261114-03", "point_ids": ["H-20261114-03", "N3-V32", "N3-V25"], "title": "驻美日企精英的围城：外派旧金山硅谷拿美元补贴风光无限，为何调回东京总部反倒水土不服？", "ja_focus": "ドル建ての手当が厚くて毎月の生活費が少し余る。帰国して急に生活水準を落とすのはつらい。せっかく身につけたやり方が本社では通用しない。", "start": 1436.2, "end": 1626.4}, {"chapter": 8, "point_id": "N3-H17", "point_ids": ["N3-H17", "H-20261114-05", "N3-V26"], "title": "日本企业丑闻「谢罪记者会」的精密剧场：九十度鞠躬停几秒、禁系什么领带，与敬语里的太极拳", "ja_focus": "調査報告書をもうご覧になりましたか。私から経緯を説明させていただけないでしょうか。社長がわざわざ現地まで謝りに行く。", "start": 1626.4, "end": 1814.0}, {"chapter": 9, "point_id": "Q-20261114-001", "point_ids": ["Q-20261114-001", "N3-L14", "N3-V28"], "title": "东京超四成家庭只有一个人：不添「迷惑」的极致体面、深夜百元小份菜，与独自发烧的脆弱瞬间", "ja_focus": "冷めちゃう前に全部食べちゃおう。高熱が出てベッドの上でぐったりしている。薬局が閉まる前に薬を買いに行かないと。", "start": 1814.0, "end": 1982.7}, {"chapter": 10, "point_id": "N3-G30", "point_ids": ["N3-G30", "N3-L16", "G-20261114-03"], "title": "吉祥寺地下爵士吃茶店的黑胶唱针与苦咖啡：在算计不完的世道里，留出半小时发呆的余白", "ja_focus": "テーブルの上に飲みかけのコーヒーと読みかけの文庫本がある。レコードの音が心地よくてつい長居してしまう。世間がせわしないからこそ、心の余白を守る。", "start": 1982.7, "end": 2173.3}, {"chapter": 11, "point_id": "N3-L10", "point_ids": ["N3-L10", "N3-L11", "N3-L12", "N3-L09"], "title": "表参道买鞋的体面撤退术与东京男女散场前的暗号：「喝杯咖啡再走？」", "ja_focus": "今日はやめておくことにした。コーヒーでも飲んでかない？", "start": 2173.3, "end": 2344.4}]}, "points": [{"id": "G-20261114-05", "subject": "语法", "point": "〜にしたがって", "point_key": "〜にしたがって", "family": "change_flow", "modality": "both", "exam_weight": 2.8, "roi_score": 5.124, "teach": {"left": {"ja": "〜にしたがって", "sub": "↗ 伴随同步渐变 · 台风越近，风雨越强（配 だんだん）"}, "right": {"ja": "〜ついでに", "sub": "🚶 人顺手做第二件事 · 散步顺便寄封信（自然现象禁用。）"}, "example_ja": "スーパーへ買い物に行くついでに、郵便局で手紙を出した。", "zh_meaning": "去超市买东西的时候，顺便在邮局寄了封信。", "audio": "./audio/VAR-G05_exp.mp3?v=a18cfc1c"}, "primary": {"id": "VAR-G05", "prompt": "スーパーへ買い物に行く（　　）、郵便局で手紙を出した。", "choices": ["ついでに", "にしたがって"], "answer": "ついでに", "full_ja": "スーパーへ買い物に行くついでに、郵便局で手紙を出した。", "zh_meaning": "去超市买东西的时候，顺便在邮局寄了封信。", "why_line": "去超市是主要行程，寄信只是半路顺手办的小事，属于「顺便做某事」。", "form_line": "动词原形接「ついでに」表示顺便；「にしたがって」则是随着一方变化另一方同步渐变。", "opt_notes": {"ついでに": "有意识的人在去超市途中顺便寄信。", "にしたがって": "表伴随同步渐变，不能用于顺便寄信。"}, "q_audio": "./audio/VAR-G05_q.mp3?v=d18d6e69", "exp_audio": "./audio/VAR-G05_exp.mp3?v=a18cfc1c", "listen_parts": null, "is_listening": false}, "variants": [{"id": "G-20261114-05", "prompt": "台風が近づく（　　）、風も雨も強くなってきた。", "choices": ["にしたがって", "ついでに"], "answer": "にしたがって", "full_ja": "台風が近づくにしたがって、風も雨もだんだん強くなってきた。", "zh_meaning": "随着台风靠近，风和雨都渐渐变大了。", "why_line": "台风越走越近，风雨也跟着越来越大，两边是同步渐变的关系。", "form_line": "动词原形接「にしたがって」表示随着一方变化另一方也跟着变；「ついでに」是人做一件事时顺手做另一件事，自然现象不能用。", "opt_notes": {"にしたがって": "表示随着前项推进，后项同步发生渐变，完美呼应后半句「だんだん強くなってきた」。", "ついでに": "意为「顺便…」，主语必须是有意识的人（如买菜顺便取快递），自然现象绝对禁用。"}, "q_audio": "./audio/G-20261114-05_q.mp3?v=b2c427d8", "exp_audio": "./audio/G-20261114-05_exp.mp3?v=240e1df8", "listen_parts": null, "is_listening": false}, {"id": "VAR4-G05", "prompt": "駅前の開発が進む（　　）、新しい店が次々に増えてきた。", "choices": ["にしたがって", "ついでに"], "answer": "にしたがって", "full_ja": "駅前の開発が進むにしたがって、新しい店が次々に増えてきた。", "zh_meaning": "随着车站前的开发不断推进，新店铺也一家接一家多起来了。", "why_line": "开发越往前进，新店就越多，两边的变化趋势同步推进。", "form_line": "客观形势同步渐变用「進むにしたがって」；「ついでに」只能用于人顺手捎带做某事。", "opt_notes": {"にしたがって": "接动词原形「進む」，表伴随城市开发推进，商业店铺同步增加。", "ついでに": "意为「某人做A事时顺手做B事」，城市开发不是有意识的人，绝不能用「ついでに」。"}, "q_audio": "./audio/VAR4-G05_q.mp3?v=24b6207d", "exp_audio": "./audio/VAR4-G05_exp.mp3?v=b11414fc", "listen_parts": null, "is_listening": false}]}, {"id": "N3-H18", "subject": "活用", "point": "言う → おっしゃる（尊敬）", "point_key": "K-002", "family": "keigo", "modality": "both", "exam_weight": 3.0, "roi_score": 5.49, "teach": {"left": {"ja": "先生がおっしゃる", "sub": "尊敬语 · 老师/客户「说」"}, "right": {"ja": "私が申す", "sub": "谦让语 · 自己对外人「说/叫…」"}, "example_ja": "先ほど社長が電話で、明日の会議は十時からだとおっしゃっていました。", "zh_meaning": "刚才社长在电话里说，明天的会议从十点开始。", "audio": "./audio/VAR-H18_exp.mp3?v=bd2ac322"}, "primary": {"id": "VAR-H18", "prompt": "先ほど社長が電話で、明日の会議は十時からだと（　　）。", "choices": ["おっしゃっていました", "申していました"], "answer": "おっしゃっていました", "full_ja": "先ほど社長が電話で、明日の会議は十時からだとおっしゃっていました。", "zh_meaning": "刚才社长在电话里说，明天的会议从十点开始。", "why_line": "向公司同事转述「社長が（社长刚才说）」，动作主语是社长。", "form_line": "尊长「说」用特殊尊敬语「おっしゃっていました」；「申す」是自谦语。", "opt_notes": {"おっしゃっていました": "「言う」的特殊尊敬语，得体转述社长的电话指示。", "申していました": "「言う」的谦让语，不能用于本公司上司对外或对内的敬称转述（此处对内尊称社长用おっしゃる）。"}, "q_audio": "./audio/VAR-H18_q.mp3?v=01e99df5", "exp_audio": "./audio/VAR-H18_exp.mp3?v=bd2ac322", "listen_parts": null, "is_listening": false}, "variants": [{"id": "N3-H18", "prompt": "山田先生も、昨日の会議でまったく同じことを（　　）よ。", "choices": ["おっしゃっていました", "申していました"], "answer": "おっしゃっていました", "full_ja": "山田先生も、昨日の会議でまったく同じことをおっしゃっていましたよ。", "zh_meaning": "山田老师在昨天的会议上也说了完全一样的话哦。", "why_line": "主语是「山田先生も」，转述老师说过的话。", "form_line": "老师或客户「说」必用特殊尊敬语「おっしゃる」；「申す」是谦让语，只能用于自己。", "opt_notes": {"おっしゃっていました": "「言う」的尊敬语，得体转述山田老师在会上的发言。", "申していました": "「言う」的谦让语，把老师压低成了下位者，敬语方向反了。"}, "q_audio": "./audio/N3-H18_q.mp3?v=83d22ec0", "exp_audio": "./audio/N3-H18_exp.mp3?v=4bbcd7fd", "listen_parts": null, "is_listening": false}, {"id": "VAR4-H18", "prompt": "失礼ですが、お名前はなんと（　　）か。", "choices": ["おっしゃいます", "申します"], "answer": "おっしゃいます", "full_ja": "失礼ですが、お名前はなんとおっしゃいますか。", "zh_meaning": "冒昧问一下，请问您尊姓大名怎么称呼？", "why_line": "询问对方（客人或长辈）叫什么名字，动作属于对方，必须用尊敬语。", "form_line": "问对方姓名固定说「お名前はなんとおっしゃいますか」；报自己名字才用谦让语「〜と申します」。", "opt_notes": {"おっしゃいます": "「言う」的特殊尊敬语（注意词尾る变い＋ます），询问来客姓名最地道的敬语。", "申します": "「言う」的谦让语，只能用于自报家门，绝不能拿来问对方的名字。"}, "q_audio": "./audio/VAR4-H18_q.mp3?v=a41f2f5a", "exp_audio": "./audio/VAR4-H18_exp.mp3?v=f314dfc5", "listen_parts": null, "is_listening": false}]}, {"id": "N3-V23", "subject": "词汇", "point": "どんどん（势头猛进）", "point_key": "どんどん", "family": "kana_adverb", "modality": "listen", "exam_weight": 3.2, "roi_score": 5.856, "teach": {"left": {"ja": "仕事がどんどん片づく", "sub": "效率奇高、三下五除二接连推进"}, "right": {"ja": "だんだん慣れる", "sub": "花时间一点点慢慢适应"}, "example_ja": "わからないことがあったら、遠慮しないでどんどん質問してください。", "zh_meaning": "要是有不明白的地方，请别客气尽管踊跃提问。", "audio": "./audio/VAR4-V23_exp.mp3?v=b517479a"}, "primary": {"id": "VAR4-V23", "prompt": "わからないことがあったら、遠慮しないで（　　）質問してください。", "choices": ["どんどん", "だんだん"], "answer": "どんどん", "full_ja": "わからないことがあったら、遠慮しないでどんどん質問してください。", "zh_meaning": "要是有不明白的地方，请别客气尽管踊跃提问。", "why_line": "老师或前辈鼓励大家「别拘束，有问题一个接一个尽管问」。", "form_line": "积极踊跃、毫不犹豫地连续行动用「どんどん」；自然缓慢渐变才用「だんだん」。", "opt_notes": {"どんどん": "表示毫不犹豫、接二连三积极行动（どんどん質問する／どんどん食べる）。", "だんだん": "表示随时间缓慢自然变化，不能用于祈使句鼓励别人踊跃提问。"}, "q_audio": "./audio/VAR4-V23_q.mp3?v=545b033a", "exp_audio": "./audio/VAR4-V23_exp.mp3?v=b517479a", "listen_parts": null, "is_listening": false}, "variants": [{"id": "N3-V23", "prompt": "新しいシステムを入れたら、たまっていた仕事が（　　）片づいた。", "choices": ["どんどん", "だんだん"], "answer": "どんどん", "full_ja": "新しいシステムを入れたら、たまっていた仕事がどんどん片づいた。", "zh_meaning": "装上新系统之后，积压的工作接二连三飞快地清完了。", "why_line": "换上新工具后效率大增，积压的活儿一件接一件迅速搞定。", "form_line": "节奏快、势头猛、接连不断推进用「どんどん」；缓慢自然渐变才用「だんだん」。", "opt_notes": {"どんどん": "形容积压的工作势如破竹、接连不断地迅速解决。", "だんだん": "节奏缓慢渐进，体现不出换新系统后爽快清活的高效率。"}, "q_audio": "./audio/N3-V23_q.mp3?v=855d6f08", "exp_audio": "./audio/N3-V23_exp.mp3?v=0489e47e", "listen_parts": null, "is_listening": false}, {"id": "VAR-V23", "prompt": "新しい工場ができて、若い人がこの町へ（　　）引っ越してきている。", "choices": ["どんどん", "ぼんやり"], "answer": "どんどん", "full_ja": "新しい工場ができて、若い人がこの町へどんどん引っ越してきている。", "zh_meaning": "新工厂建成后，年轻人正源源不断地搬到这座小镇来。", "why_line": "形容新厂带动下人口接二连三、势头旺盛地涌入。", "form_line": "势头迅猛接连不断用「どんどん」；「ぼんやり」是迷糊发呆。", "opt_notes": {"どんどん": "形容数量或进度势头迅猛、源源不断。", "ぼんやり": "迷迷糊糊、发呆走神，语义完全不符。"}, "q_audio": "./audio/VAR-V23_q.mp3?v=89098bb5", "exp_audio": "./audio/VAR-V23_exp.mp3?v=8e328031", "listen_parts": null, "is_listening": false}]}, {"id": "N3-L11", "subject": "听力", "point": "聴解「〜てない」还没做", "point_key": "N3L-003", "family": "listen_contract", "modality": "listen", "exam_weight": 2.8, "roi_score": 3.864, "teach": {"left": {"ja": "まだ決めてないんです", "sub": "決めていない · 还没决定好点什么"}, "right": {"ja": "い脱落缩音", "sub": "口语常把 ていない 缩成 てない"}, "example_ja": "男：お客様、ご注文はお決まりでしょうか。", "zh_meaning": "店员：「客人，请问您点好单了吗？」", "audio": "./audio/N3-L11_exp.mp3?v=f2aece53"}, "primary": {"id": "N3-L11", "prompt": "", "choices": ["あ、まだ決めてないんです。おすすめはありますか。", "はい、もうお腹いっぱいです。", "いいえ、昨日は来ませんでした。"], "answer": "あ、まだ決めてないんです。おすすめはありますか。", "full_ja": "男：お客様、ご注文はお決まりでしょうか。", "zh_meaning": "店员：「客人，请问您点好单了吗？」", "why_line": "餐厅高频敬语「お決まりでしょうか（决定好点什么了吗）」，回答「まだ決めてない（还没定好）」最地道。", "form_line": "「決めてない」是「決めていない」吃掉「い」的口语形；第 2、3 项答非所问。", "opt_notes": {"あ、まだ決めてないんです。おすすめはありますか。": "「啊，还没定好呢，有什么推荐吗？」自然得体。", "はい、もうお腹いっぱいです。": "「好的，已经吃饱了。」刚点单就说吃饱不合逻辑。", "いいえ、昨日は来ませんでした。": "「不，昨天没来。」答非所问。"}, "q_audio": "./audio/N3-L11_q.mp3?v=980d2a0b", "exp_audio": "./audio/N3-L11_exp.mp3?v=f2aece53", "listen_parts": {"stem": "./audio/N3-L11_stem.mp3?v=35f2c7d4", "nums": ["./audio/num_JF_1.mp3", "./audio/num_JF_2.mp3", "./audio/num_JF_3.mp3"], "opts": {"あ、まだ決めてないんです。おすすめはありますか。": "./audio/N3-L11_opt0.mp3?v=25c2200b", "はい、もうお腹いっぱいです。": "./audio/N3-L11_opt1.mp3?v=8cbe9c0c", "いいえ、昨日は来ませんでした。": "./audio/N3-L11_opt2.mp3?v=1f1af665"}}, "is_listening": true}, "variants": [{"id": "VAR-L11", "prompt": "", "choices": ["まだ資料を読んでいない", "もう資料を読み終わった", "資料をなくしてしまった"], "answer": "まだ資料を読んでいない", "full_ja": "女：来週の会議の資料、もう読んだ？\n男：ごめん、さっきもらったばかりで、まだ読んでないんだ。", "zh_meaning": "女：「下周会议的资料你已经看过了吗？」 男：「抱歉，刚才才拿到手，还没看呢。」", "why_line": "「まだ読んでないんだ」＝「まだ読んでいない」，刚拿到还没看。", "form_line": "口语把「〜ていない」里的「い」吃掉变成「〜てない」，选。", "opt_notes": {"まだ資料を読んでいない": "「还没读资料。」听懂 まだ読んでない＝まだ読んでいない。", "もう資料を読み終わった": "「已经读完资料了。」把否定 読んでない 听反了。", "資料をなくしてしまった": "「把资料弄丢了。」男生说刚拿到手，并未弄丢。"}, "q_audio": "./audio/VAR-L11_q.mp3?v=ab8907aa", "exp_audio": "./audio/VAR-L11_exp.mp3?v=02bfec56", "listen_parts": {"stem": "./audio/VAR-L11_stem.mp3?v=12a717a8", "nums": ["./audio/num_JF_1.mp3", "./audio/num_JF_2.mp3", "./audio/num_JF_3.mp3"], "opts": {"まだ資料を読んでいない": "./audio/VAR-L11_opt0.mp3?v=53048693", "もう資料を読み終わった": "./audio/VAR-L11_opt1.mp3?v=37466e6a", "資料をなくしてしまった": "./audio/VAR-L11_opt2.mp3?v=2ba6ef59"}}, "is_listening": true}]}, {"id": "G-20261114-06", "subject": "语法", "point": "〜にしては", "point_key": "〜にしては", "family": "reason_contrast", "modality": "both", "exam_weight": 2.8, "roi_score": 5.124, "teach": {"left": {"ja": "〜にしては", "sub": "打破常规尺子（意外反差） · 只待半年，日语却意外地好"}, "right": {"ja": "〜にとって", "sub": "站在某人立场评价 · 对我来说（私にとって）很重要"}, "example_ja": "このスマホは値段が高いにしては、あまり使いやすくない。", "zh_meaning": "这台手机价格挺贵的，用起来却不怎么顺手。", "audio": "./audio/VAR-G06_exp.mp3?v=a727a8b8"}, "primary": {"id": "VAR-G06", "prompt": "このスマホは値段が高い（　　）、あまり使いやすくない。", "choices": ["にしては", "にとって"], "answer": "にしては", "full_ja": "このスマホは値段が高いにしては、あまり使いやすくない。", "zh_meaning": "这台手机价格挺贵的，用起来却不怎么顺手。", "why_line": "按「高价」这个标准原本以为很好用，结果却不好用，与预期标准相反。", "form_line": "い形容词「高い」直接接「にしては」表示就高价而言却不怎样；「にとって」只能接人或群体表立场。", "opt_notes": {"にしては": "接形容词「高い」，表达与高价预期不符的反差。", "にとって": "只能接名词表「对某人而言」，不能接「高い」。"}, "q_audio": "./audio/VAR-G06_q.mp3?v=9004ccc7", "exp_audio": "./audio/VAR-G06_exp.mp3?v=a727a8b8", "listen_parts": null, "is_listening": false}, "variants": [{"id": "G-20261114-06", "prompt": "日本に半年しかいなかった（　　）、日本語が上手だ。", "choices": ["にしては", "にとって"], "answer": "にしては", "full_ja": "彼は日本に半年しかいなかったにしては、日本語がとても上手だ。", "zh_meaning": "他在日本只待了半年，日语却出乎意料地好。", "why_line": "按「只待半年」这个标准原本以为水平一般，结果却非常好，属于打破预期的反差。", "form_line": "简体小句直接接「にしては」表示「就……而言却很意外」；「にとって」表示「对某人来说」，而且前面只能接名词。", "opt_notes": {"にしては": "既能接小句过去式「いなかった」，又精准表达「按只待半年的标准看却意外地好」。", "にとって": "意为「对于…来说」，前面只能接名词（如「私にとって」），语法上根本不能接动词过去式。"}, "q_audio": "./audio/G-20261114-06_q.mp3?v=edc4c993", "exp_audio": "./audio/G-20261114-06_exp.mp3?v=8cc8e8ad", "listen_parts": null, "is_listening": false}, {"id": "VAR4-G06", "prompt": "今日は十二月（　　）気温が高くて、コートがいらないほど暖かい。", "choices": ["にしては", "によって"], "answer": "にしては", "full_ja": "今日は十二月にしては気温が高くて、コートがいらないほど暖かい。", "zh_meaning": "今天按十二月来说气温挺高的，暖和得连大衣都用不着穿。", "why_line": "拿「十二月本该严寒」这把尺子一量，今天却暖得反常。", "form_line": "名词直接加「にしては」（十二月にしては暖かい，中间不加の）；「によって」不表反差对比。", "opt_notes": {"にしては": "按十二月本该寒冷的常理衡量，今天暖得连大衣都不用穿，反差意外用「にしては」。", "によって": "表示原因、手段或因情况而异，放进句中无法构成「在十二月里却反常暖和」。"}, "q_audio": "./audio/VAR4-G06_q.mp3?v=e98cafd9", "exp_audio": "./audio/VAR4-G06_exp.mp3?v=aff8c44e", "listen_parts": null, "is_listening": false}]}, {"id": "N3-H12", "subject": "活用", "point": "一段可能形「起きられる」", "point_key": "V-031", "family": "potential_pair", "modality": "both", "exam_weight": 2.9, "roi_score": 5.307, "teach": {"left": {"ja": "自分で起きられる", "sub": "起きる（自己起床）→ 能起得来"}, "right": {"ja": "誰かを起こせる", "sub": "起こす（叫醒别人）→ 能叫醒"}, "example_ja": "この着物は一人でも簡単に着られますよ。", "zh_meaning": "这件和服一个人也能很轻松地穿上哦。", "audio": "./audio/VAR-H12_exp.mp3?v=5be6582d"}, "primary": {"id": "VAR-H12", "prompt": "この着物は一人でも簡単に（　　）よ。", "choices": ["着られます", "着れます"], "answer": "着られます", "full_ja": "この着物は一人でも簡単に着られますよ。", "zh_meaning": "这件和服一个人也能很轻松地穿上哦。", "why_line": "「着る（穿）」是一段动词，笔试语法题要求选不省音的标准可能形。", "form_line": "一段动词去「る」加「られます」→「着られます」；省掉「ら」的「着れます」只用于日常口语闲聊。", "opt_notes": {"着られます": "一段动词「着る」的标准正式可能形。", "着れます": "口语省略了「ら」的ら抜き言葉，考试笔试判错。"}, "q_audio": "./audio/VAR-H12_q.mp3?v=11aa32c4", "exp_audio": "./audio/VAR-H12_exp.mp3?v=5be6582d", "listen_parts": null, "is_listening": false}, "variants": [{"id": "N3-H12", "prompt": "明日は始発に乗るので、朝五時にちゃんと（　　）か心配だ。", "choices": ["起きられる", "起こせる"], "answer": "起きられる", "full_ja": "明日は始発に乗るので、朝五時にちゃんと起きられるか心配だ。", "zh_meaning": "明天要赶首班电车，真担心早上五点能不能起得来。", "why_line": "担心的是「自己能不能醒来起床」，不是去叫醒别人。", "form_line": "自动词「起きる（起床）」是一段动词，正式可能形加「られる」变「起きられる」；「起こせる」是把别人叫醒。", "opt_notes": {"起きられる": "一段动词「起きる」的正式可能形（自己能起得来）。", "起こせる": "他动词「起こす」的可能形，变成「能不能把别人叫醒」。"}, "q_audio": "./audio/N3-H12_q.mp3?v=57d08aed", "exp_audio": "./audio/N3-H12_exp.mp3?v=93ea456a", "listen_parts": null, "is_listening": false}]}, {"id": "N3-V26", "subject": "词汇", "point": "わざわざ（专程费心跑一趟）", "point_key": "わざわざ", "family": "kana_adverb", "modality": "listen", "exam_weight": 3.2, "roi_score": 5.856, "teach": {"left": {"ja": "わざわざ来てくださる", "sub": "感谢对方专程抽空跑一趟"}, "right": {"ja": "せっかくの機会", "sub": "难得的好机会（接 の＋名词 或 のに／から）"}, "example_ja": "メールで十分だったのに、課長がわざわざ席まで教えに来てくださった。", "zh_meaning": "明明发封邮件就够了，课长却特意走到我座位旁来指点我。", "audio": "./audio/VAR-V26_exp.mp3?v=bad9ea38"}, "primary": {"id": "VAR-V26", "prompt": "メールで十分だったのに、課長が（　　）席まで教えに来てくださった。", "choices": ["わざわざ", "せっかく"], "answer": "わざわざ", "full_ja": "メールで十分だったのに、課長がわざわざ席まで教えに来てくださった。", "zh_meaning": "明明发封邮件就够了，课长却特意走到我座位旁来指点我。", "why_line": "前面明确说了「メールで十分だったのに（发邮件本来就够了）」，课长却不怕麻烦亲自走一趟。", "form_line": "本不必如此却专程费心跑一趟必用「わざわざ」；「せっかく」表难得可贵别浪费。", "opt_notes": {"わざわざ": "本可省事却特意、专程跑一趟，常用于感谢对方费心。", "せっかく": "强调难得的机会不要浪费，不能接在「メールで十分だったのに」后。"}, "q_audio": "./audio/VAR-V26_q.mp3?v=79bef3d2", "exp_audio": "./audio/VAR-V26_exp.mp3?v=bad9ea38", "listen_parts": null, "is_listening": false}, "variants": [{"id": "N3-V26", "prompt": "お忙しいところ、遠い駅まで（　　）迎えに来てくださってありがとうございます。", "choices": ["わざわざ", "せっかく"], "answer": "わざわざ", "full_ja": "お忙しいところ、遠い駅までわざわざ迎えに来てくださってありがとうございます。", "zh_meaning": "百忙之中还劳驾您专程跑到这么远的车站来接我，非常感谢。", "why_line": "直接向对方道谢，感谢对方特意费心跑远路。", "form_line": "寒暄道谢「劳您专程跑一趟」固定用「わざわざ〜てくださってありがとうございます」。", "opt_notes": {"わざわざ": "修饰「迎えに来てくださって」，感谢对方特意费心专程跑一趟。", "せっかく": "道谢时若用せっかく需说「せっかく来てくださったのに」，直接道谢必用「わざわざ」。"}, "q_audio": "./audio/N3-V26_q.mp3?v=4d20ba48", "exp_audio": "./audio/N3-V26_exp.mp3?v=cfd3bd55", "listen_parts": null, "is_listening": false}]}, {"id": "N3-L13", "subject": "听力", "point": "〜てて（〜ていて）", "point_key": "N3L-004", "family": "spoken_contraction", "modality": "listen", "exam_weight": 3.2, "roi_score": 5.856, "teach": {"left": {"ja": "聴いてて ＝ 聴いていて", "sub": "口语吞掉 い · 当时正戴耳机听歌所以没注意"}, "right": {"ja": "全然気づかなかった", "sub": "完全没察觉来电"}, "example_ja": "女：さっき玄関のチャイム鳴らしたのに、気づかなかった？\n男：ごめん、シャワー浴びてて、全然聞こえなかったよ。", "zh_meaning": "女：「刚才按了玄关门铃，你没发觉吗？」 男：「抱歉，当时正冲着澡呢，完全没听见。」", "audio": "./audio/VAR-L13_exp.mp3?v=2f0ef8f1"}, "primary": {"id": "VAR-L13", "prompt": "", "choices": ["シャワーを浴びていたから", "スーパーへ買い物に行っていたから", "テレビの音が大きかったから"], "answer": "シャワーを浴びていたから", "full_ja": "女：さっき玄関のチャイム鳴らしたのに、気づかなかった？\n男：ごめん、シャワー浴びてて、全然聞こえなかったよ。", "zh_meaning": "女：「刚才按了玄关门铃，你没发觉吗？」 男：「抱歉，当时正冲着澡呢，完全没听见。」", "why_line": "男生解释原因说「シャワー浴びてて」（＝浴びていて），当时正冲澡没听见门铃。", "form_line": "口语吞掉「い」变成「浴びてて」，选「シャワーを浴びていたから」。", "opt_notes": {"シャワーを浴びていたから": "「因为当时正在冲澡。」听懂 浴びてて＝浴びていて，抓准没听见门铃的原因。", "スーパーへ買い物に行っていたから": "「因为去超市买东西了。」男生人在家里冲澡，并未出门。", "テレビの音が大きかったから": "「因为电视声音太大了。」对话中未提及电视。"}, "q_audio": "./audio/VAR-L13_q.mp3?v=2a0201ba", "exp_audio": "./audio/VAR-L13_exp.mp3?v=2f0ef8f1", "listen_parts": {"stem": "./audio/VAR-L13_stem.mp3?v=349da338", "nums": ["./audio/num_JF_1.mp3", "./audio/num_JF_2.mp3", "./audio/num_JF_3.mp3"], "opts": {"シャワーを浴びていたから": "./audio/VAR-L13_opt0.mp3?v=607e2354", "スーパーへ買い物に行っていたから": "./audio/VAR-L13_opt1.mp3?v=30263aca", "テレビの音が大きかったから": "./audio/VAR-L13_opt2.mp3?v=8a85e4df"}}, "is_listening": true}, "variants": [{"id": "N3-L13", "prompt": "", "choices": ["音楽を聴いていたから", "携帯を家に忘れたから", "会議に出ていたから"], "answer": "音楽を聴いていたから", "full_ja": "女：さっき電話したのに、出なかったね。\n男：ごめん、イヤホンして音楽聴いてて、全然気づかなかった。", "zh_meaning": "女：「刚才给你打电话你没接呢。」 男：「抱歉，当时戴着耳机正听歌呢，完全没察觉。」", "why_line": "男生解释原因用了口语缩音「音楽聴いてて」（＝音楽を聴いていて），正听着歌没听见铃声。", "form_line": "口语把「〜ていて」里的「い」吞掉变成「〜てて」，选「音楽を聴いていたから」。", "opt_notes": {"音楽を聴いていたから": "「因为当时正听着音乐。」听懂 聴いてて＝聴いていて，抓准没接电话的原因。", "携帯を家に忘れたから": "「因为把手机忘在家里了。」对话中未提及。", "会議に出ていたから": "「因为在开会。」对话中未提及。"}, "q_audio": "./audio/N3-L13_q.mp3?v=162cb6c2", "exp_audio": "./audio/N3-L13_exp.mp3?v=5bdb7c00", "listen_parts": {"stem": "./audio/N3-L13_stem.mp3?v=0d584497", "nums": ["./audio/num_JF_1.mp3", "./audio/num_JF_2.mp3", "./audio/num_JF_3.mp3"], "opts": {"音楽を聴いていたから": "./audio/N3-L13_opt0.mp3?v=d2379ba5", "携帯を家に忘れたから": "./audio/N3-L13_opt1.mp3?v=c89f4a22", "会議に出ていたから": "./audio/N3-L13_opt2.mp3?v=cec7f1d2"}}, "is_listening": true}]}, {"id": "GQ-20261114-02", "subject": "语法", "point": "〜ように言う", "point_key": "〜ように言う", "family": "hearsay_infer", "modality": "both", "exam_weight": 2.6, "roi_score": 4.758, "teach": {"left": {"ja": "飲むように言われた", "sub": "V原形/ない形 ＋ ように言う · 医生叮嘱/要求我「要按时吃药」"}, "right": {"ja": "飲んだそうだ", "sub": "简体句 ＋ そうだ / んだって · 传闻「听说他吃药了」"}, "example_ja": "健康診断の後、医者に塩分を控えるように言われた。", "zh_meaning": "体检之后，被医生叮嘱要少吃盐。", "audio": "./audio/VAR-GQ02_exp.mp3?v=0b1285e5"}, "primary": {"id": "VAR-GQ02", "prompt": "健康診断の後、医者に塩分を控える（　　）言われた。", "choices": ["ように", "ことに"], "answer": "ように", "full_ja": "健康診断の後、医者に塩分を控えるように言われた。", "zh_meaning": "体检之后，被医生叮嘱要少吃盐。", "why_line": "间接转述医生的嘱咐内容（「要控制盐分」）。", "form_line": "转述叮嘱、警告或要求固定用「原形／ない形＋ように言う／言われる」。", "opt_notes": {"ように": "间接引述祈使与叮嘱内容，「医生叮嘱我要控制盐分」。", "ことに": "「〜ことにする/なる」表决定，不能接「言われた」转述叮嘱。"}, "q_audio": "./audio/VAR-GQ02_q.mp3?v=b370b231", "exp_audio": "./audio/VAR-GQ02_exp.mp3?v=0b1285e5", "listen_parts": null, "is_listening": false}, "variants": [{"id": "GQ-20261114-02", "prompt": "医者に薬を飲むように言われた。", "choices": ["被医生叮嘱要吃药", "听说医生吃了药"], "answer": "被医生叮嘱要吃药", "full_ja": "医者に薬を飲むように言われた。", "zh_meaning": "被医生叮嘱要按时吃药。", "why_line": "这里的「ように言う」表示叮嘱、劝告、要求某人去做某事，并不是比喻也不是听说。", "form_line": "动词原形「飲む」加「ように」，再配被动形「言われた（我被医生告知）」，合起来就是医生嘱咐我要吃药。", "opt_notes": {"被医生叮嘱要吃药": "「医者に〜ように言われた」＝被医生嘱咐去做某事（间接命令/叮嘱的标准表达）。", "听说医生吃了药": "传闻「听说」要用「医者が薬を飲んだそうだ／んだって」，结构完全不同。"}, "q_audio": "./audio/GQ-20261114-02_q.mp3?v=af5bcc31", "exp_audio": "./audio/GQ-20261114-02_exp.mp3?v=5b7cae37", "listen_parts": null, "is_listening": false}]}, {"id": "H-20261114-05", "subject": "活用", "point": "五段动词 使役形（词尾あ段＋せる）", "point_key": "V-037", "family": "voice_form", "modality": "both", "exam_weight": 3.0, "roi_score": 4.35, "teach": {"left": {"ja": "休ませていただけませんか", "sub": "使役（允许我休）＋いただく · 部长，能批准我请假吗？"}, "right": {"ja": "休んでいただけませんか", "sub": "漏掉使役させて · 变成：部长，请您去休息好吗？"}, "example_ja": "少し熱があるので、今日は早めに帰らせていただけませんか。", "zh_meaning": "我稍微有点发烧，今天能不能请您准我早点回去？", "audio": "./audio/VAR-H05_exp.mp3?v=b6380278"}, "primary": {"id": "VAR-H05", "prompt": "少し熱があるので、今日は早めに（　　）いただけませんか。", "choices": ["帰らせて", "帰って"], "answer": "帰らせて", "full_ja": "少し熱があるので、今日は早めに帰らせていただけませんか。", "zh_meaning": "我稍微有点发烧，今天能不能请您准我早点回去？", "why_line": "发烧想早退的人是「我自己」，向上级求批准「允许我先回去」。", "form_line": "五段动词「帰る」词尾「る」变あ段「ら」加「せて」，连成「帰らせていただけませんか」；漏掉「せて」就变成劝上级回家了。", "opt_notes": {"帰らせて": "使役＋ていただけませんか＝恳请准许我早退。", "帰って": "「帰っていただけませんか」意为请对方回去，对象完全搞反。"}, "q_audio": "./audio/VAR-H05_q.mp3?v=ff925f25", "exp_audio": "./audio/VAR-H05_exp.mp3?v=b6380278", "listen_parts": null, "is_listening": false}, "variants": [{"id": "H-20261114-05", "prompt": "部長、来週の金曜日、私用で会社を（　　）でしょうか。", "choices": ["休ませていただけない", "休んでいただけない", "休まれていただけない"], "answer": "休ませていただけない", "full_ja": "部長、来週の金曜日、私用で会社を休ませていただけないでしょうか。", "zh_meaning": "部长，下周五我有点私事，能不能请您准我休一天假？", "why_line": "休假的人是「我自己」，是在请求上级放行「允许我去休假」，千万不能说成「请部长您去休假」。", "form_line": "先把「休む」变成使役形「休ませて（让我休）」，再接自谦请求「いただけないでしょうか」；漏掉「させて」就会变成请部长休假。", "opt_notes": {"休ませていただけない": "使役形「休ませて（让我休）」加自谦请求「いただけない」，得体请求准假。", "休んでいただけない": "漏掉了使役「させて」，意思变成「请部长您去休假」。", "休まれていただけない": "把受身形硬拼上去，日语中没有这种说法。"}, "q_audio": "./audio/H-20261114-05_q.mp3?v=c78eb665", "exp_audio": "./audio/H-20261114-05_exp.mp3?v=4c91402d", "listen_parts": null, "is_listening": false}, {"id": "VAR3-H05", "prompt": "先生、少し体調が悪いので、今日は先に（　　）いただけませんか。", "choices": ["帰らせて", "帰られて"], "answer": "帰らせて", "full_ja": "先生、少し体調が悪いので、今日は先に帰らせていただけませんか。", "zh_meaning": "老师，我身体稍微有点不舒服，今天能准许我先回去吗？", "why_line": "身体不适向老师请假，恳请老师「允许我先回家」。", "form_line": "五段动词「帰る」变使役て形「帰らせて」＋「いただけませんか」（恳请准许我…）。", "opt_notes": {"帰らせて": "五段动词「帰る（う→あ段＋せて）」使役形配「いただけませんか」，得体请假。", "帰られて": "受身/尊敬形，不能接「いただけませんか」表达「请准许我回去」。"}, "q_audio": "./audio/VAR3-H05_q.mp3?v=701bb0dd", "exp_audio": "./audio/VAR3-H05_exp.mp3?v=72900b88", "listen_parts": null, "is_listening": false}]}, {"id": "N3-V27", "subject": "词汇", "point": "ぼんやり（迷迷糊糊／发呆）", "point_key": "ぼんやり", "family": "kana_adverb", "modality": "listen", "exam_weight": 3.1, "roi_score": 5.673, "teach": {"left": {"ja": "頭がぼんやりする", "sub": "犯困发懵、视线模糊或走神发呆"}, "right": {"ja": "はっきり見える", "sub": "清清楚楚、斩钉截铁"}, "example_ja": "カフェの窓際に座って、雨の降る通りをぼんやり眺めていた。", "zh_meaning": "坐在咖啡馆窗边，出神地望着下雨的街道。", "audio": "./audio/VAR-V27_exp.mp3?v=fb8aeaf8"}, "primary": {"id": "VAR-V27", "prompt": "カフェの窓際に座って、雨の降る通りを（　　）眺めていた。", "choices": ["ぼんやり", "はっきり"], "answer": "ぼんやり", "full_ja": "カフェの窓際に座って、雨の降る通りをぼんやり眺めていた。", "zh_meaning": "坐在咖啡馆窗边，出神地望着下雨的街道。", "why_line": "独自坐在咖啡馆隔着雨窗放空发呆、眼神不聚焦地闲看。", "form_line": "出神发呆或模糊不清用「ぼんやり」；清晰分明才是「はっきり」。", "opt_notes": {"ぼんやり": "放空走神、迷迷糊糊地望着窗外。", "はっきり": "轮廓分明或态度斩钉截铁，不搭「出神闲望雨景」。"}, "q_audio": "./audio/VAR-V27_q.mp3?v=cf455526", "exp_audio": "./audio/VAR-V27_exp.mp3?v=fb8aeaf8", "listen_parts": null, "is_listening": false}, "variants": [{"id": "N3-V27", "prompt": "寝不足で頭が（　　）して、午後の会議の話がほとんど頭に入らなかった。", "choices": ["ぼんやり", "はっきり"], "answer": "ぼんやり", "full_ja": "寝不足で頭がぼんやりして、午後の会議の話がほとんど頭に入らなかった。", "zh_meaning": "因为睡眠不足脑子迷迷糊糊的，下午开会讲的内容几乎没听进去。", "why_line": "缺觉导致大脑昏沉发懵、注意力涣散，所以听不进会议内容。", "form_line": "脑子发懵、视线模糊或坐着发呆用「ぼんやり」；清晰分明才用「はっきり」。", "opt_notes": {"ぼんやり": "表示睡不够脑子昏沉发呆，所以听不进会议内容。", "はっきり": "意为「清晰明确」，与「听不进脑子里」矛盾。"}, "q_audio": "./audio/N3-V27_q.mp3?v=0e87051c", "exp_audio": "./audio/N3-V27_exp.mp3?v=d74b909c", "listen_parts": null, "is_listening": false}, {"id": "VAR4-V27", "prompt": "幼い頃の出来事なので、もう（　　）としか覚えていない。", "choices": ["ぼんやり", "しっかり"], "answer": "ぼんやり", "full_ja": "幼い頃の出来事なので、もうぼんやりとしか覚えていない。", "zh_meaning": "因为是很小的时候发生的事了，现在只剩模模糊糊的印象。", "why_line": "后半句「〜としか覚えていない（只记得个大概影儿）」说明记忆早已模糊淡化。", "form_line": "记忆依稀模糊用「ぼんやり」；记得清清楚楚、扎扎实实才是「しっかり覚えている」。", "opt_notes": {"ぼんやり": "形容记忆、视线或意识模模糊糊、影影绰绰（ぼんやり覚えている）。", "しっかり": "表示牢牢记住，不能与后半句限定否定「〜としか覚えていない」搭配。"}, "q_audio": "./audio/VAR4-V27_q.mp3?v=38ea3b70", "exp_audio": "./audio/VAR4-V27_exp.mp3?v=883652a0", "listen_parts": null, "is_listening": false}]}, {"id": "N3-L14", "subject": "听力", "point": "〜ちゃう／〜ちゃおう（〜てしまう）", "point_key": "N3L-009", "family": "spoken_contraction", "modality": "listen", "exam_weight": 3.2, "roi_score": 5.856, "teach": {"left": {"ja": "食べちゃおう ＝ 食べてしまおう", "sub": "趁保质期到今天，干脆现在吃掉吧"}, "right": {"ja": "入れといた ＝ 入れておいた", "sub": "刚才先放进冰箱了（但马上改主意开吃）"}, "example_ja": "女：まだ少し時間あるね。カフェでも入る？\n男：ううん、雨が降りそうだから、今日は先に片付けちゃおうよ。", "zh_meaning": "女：「还有点时间呢，去咖啡馆坐坐？」 男：「不了，看天快下雨了，今天干脆先把东西收拾完吧。」", "audio": "./audio/VAR-L14_exp.mp3?v=09712be3"}, "primary": {"id": "VAR-L14", "prompt": "", "choices": ["今のうちに片付けを終わらせる", "近くのカフェでお茶を飲む", "明日もう一度集まる"], "answer": "今のうちに片付けを終わらせる", "full_ja": "女：まだ少し時間あるね。カフェでも入る？\n男：ううん、雨が降りそうだから、今日は先に片付けちゃおうよ。", "zh_meaning": "女：「还有点时间呢，去咖啡馆坐坐？」 男：「不了，看天快下雨了，今天干脆先把东西收拾完吧。」", "why_line": "男生否决喝咖啡，提议趁下雨前「先に片付けちゃおうよ（干脆先收拾完吧）」。", "form_line": "「片付けちゃおう」＝「片付けてしまおう」，选「今のうちに片付けを終わらせる」。", "opt_notes": {"今のうちに片付けを終わらせる": "「趁现在先把收拾工作干完。」男生看快下雨了，提议 先に片付けちゃおうよ。", "近くのカフェでお茶を飲む": "「去附近咖啡馆喝茶。」被男生用 ううん 否决了。", "明日もう一度集まる": "「明天再聚一次。」对话中未提及。"}, "q_audio": "./audio/VAR-L14_q.mp3?v=6fcfeb4c", "exp_audio": "./audio/VAR-L14_exp.mp3?v=09712be3", "listen_parts": {"stem": "./audio/VAR-L14_stem.mp3?v=9eff9682", "nums": ["./audio/num_JF_1.mp3", "./audio/num_JF_2.mp3", "./audio/num_JF_3.mp3"], "opts": {"今のうちに片付けを終わらせる": "./audio/VAR-L14_opt0.mp3?v=c18a6bda", "近くのカフェでお茶を飲む": "./audio/VAR-L14_opt1.mp3?v=4c330916", "明日もう一度集まる": "./audio/VAR-L14_opt2.mp3?v=47186890"}}, "is_listening": true}, "variants": [{"id": "N3-L14", "prompt": "", "choices": ["今から一緒に食べる", "明日まで冷蔵庫に置く", "友達に持って行く"], "answer": "今から一緒に食べる", "full_ja": "男：このケーキ、冷蔵庫に入れといたよ。\n女：あ、それ賞味期限が今日までだから、今食べちゃおうよ。", "zh_meaning": "男：「这块蛋糕我先放进冰箱里了哦。」 女：「啊，那个保质期只到今天，咱们现在干脆吃掉吧。」", "why_line": "虽然男生刚放进冰箱，但女生指出保质期只到今天，拍板「今食べちゃおうよ（现在吃掉吧）」。", "form_line": "「食べちゃおう」是「食べてしまおう」的口语缩音，选「今から一緒に食べる」。", "opt_notes": {"今から一緒に食べる": "「现在起一起吃掉。」女生看保质期到今天，提议 今食べちゃおうよ。", "明日まで冷蔵庫に置く": "「在冰箱放到明天。」保质期只到今天，不能留到明天。", "友達に持って行く": "「带去给朋友。」对话中未提及。"}, "q_audio": "./audio/N3-L14_q.mp3?v=a4b61dd0", "exp_audio": "./audio/N3-L14_exp.mp3?v=ddc64971", "listen_parts": {"stem": "./audio/N3-L14_stem.mp3?v=a165f148", "nums": ["./audio/num_JM_1.mp3", "./audio/num_JM_2.mp3", "./audio/num_JM_3.mp3"], "opts": {"今から一緒に食べる": "./audio/N3-L14_opt0.mp3?v=020e6af5", "明日まで冷蔵庫に置く": "./audio/N3-L14_opt1.mp3?v=8a0b2cc9", "友達に持って行く": "./audio/N3-L14_opt2.mp3?v=0e703442"}}, "is_listening": true}]}, {"id": "N3-G22", "subject": "语法", "point": "〜てたまらない／しかたがない", "point_key": "〜てたまらない", "family": "emotion_compel", "modality": "both", "exam_weight": 2.9, "roi_score": 4.205, "teach": {"left": {"ja": "会いたくてたまらない／しかたがない", "sub": "想见得不得了、情绪强烈难耐"}, "right": {"ja": "〜てもかまわない", "sub": "表示没关系、无所谓"}, "example_ja": "さっき受けた面接の結果が気になってたまらない。", "zh_meaning": "刚才参加的面试结果到底怎么样，心里惦记得受不了。", "audio": "./audio/VAR4-G22_exp.mp3?v=1ccc0430"}, "primary": {"id": "VAR4-G22", "prompt": "さっき受けた面接の結果が気になって（　　）。", "choices": ["たまらない", "ことはない"], "answer": "たまらない", "full_ja": "さっき受けた面接の結果が気になってたまらない。", "zh_meaning": "刚才参加的面试结果到底怎么样，心里惦记得受不了。", "why_line": "刚面完试悬着一颗心，在意和焦虑的程度强烈到坐立不安。", "form_line": "「気になってたまらない」＝在意得不得了；「ことはない」必须接动词原形表用不着。", "opt_notes": {"たまらない": "接在「気になって」后，表示在意得受不了、满脑子都在想结果。", "ことはない": "必须接动词原形（気にすることはない），表「没必要在意」，接续与句意均不符。"}, "q_audio": "./audio/VAR4-G22_q.mp3?v=889b68ea", "exp_audio": "./audio/VAR4-G22_exp.mp3?v=1ccc0430", "listen_parts": null, "is_listening": false}, "variants": [{"id": "N3-G22", "prompt": "一人暮らしを始めてから、実家の犬に会いたくて（　　）。", "choices": ["たまらない", "かまわない"], "answer": "たまらない", "full_ja": "一人暮らしを始めてから、実家の犬に会いたくてたまらない。", "zh_meaning": "开始独居之后，想念老家的狗狗想得不得了。", "why_line": "表达心里涌上来的想念、痒痛或渴望强烈到实在忍受不住。", "form_line": "て形「会いたくて」加「たまらない」（和「てしかたがない」完全同义）；「かまわない」是没关系。", "opt_notes": {"たまらない": "接「会いたくて」后，表达想见得受不了（与「てしかたがない」同义）。", "かまわない": "意为「没关系」，语法与句意均不通。"}, "q_audio": "./audio/N3-G22_q.mp3?v=71f8156d", "exp_audio": "./audio/N3-G22_exp.mp3?v=688e3c4c", "listen_parts": null, "is_listening": false}, {"id": "VAR-G22", "prompt": "昨日の夜から奥歯が痛くて（　　）。", "choices": ["しかたがない", "かまわない"], "answer": "しかたがない", "full_ja": "昨日の夜から奥歯が痛くてしかたがない。", "zh_meaning": "从昨晚开始后槽牙就疼得受不了。", "why_line": "生理上的疼痛剧烈难忍、拿它一点办法都没有。", "form_line": "形容词て形「痛くて」加「しかたがない」（疼得受不了，同「たまらない」）；「かまわない」是没关系。", "opt_notes": {"しかたがない": "接在形容词て形「痛くて」后，表示疼得受不了。", "かまわない": "意为「无所谓、没关系」，与牙疼难忍矛盾。"}, "q_audio": "./audio/VAR-G22_q.mp3?v=3607f54f", "exp_audio": "./audio/VAR-G22_exp.mp3?v=a8281070", "listen_parts": null, "is_listening": false}, {"id": "VAR3-G22", "prompt": "エアコンが壊れて、部屋の中が暑くて（　　）。", "choices": ["たまらない", "かまわない"], "answer": "たまらない", "full_ja": "エアコンが壊れて、部屋の中が暑くてたまらない。", "zh_meaning": "空调坏了，屋子里热得受不了。", "why_line": "昨晚刚混过的双胞胎：「たまらない（受不了）」vs「かまわない（没关系）」。", "form_line": "「暑くてたまらない」＝热得难以忍受；「暑くてもかまわない」＝就算热也没关系。", "opt_notes": {"たまらない": "接在「暑くて」后表示热得难以忍受。", "かまわない": "表示「不要紧、没关系」（常配〜てもかまわない），与空调坏了酷热难耐矛盾。"}, "q_audio": "./audio/VAR3-G22_q.mp3?v=ccf3fa79", "exp_audio": "./audio/VAR3-G22_exp.mp3?v=7d73c625", "listen_parts": null, "is_listening": false}]}, {"id": "N3-H09", "subject": "活用", "point": "五段可能形（え段＋る）", "point_key": "V-027", "family": "potential_form", "modality": "memorize", "exam_weight": 3.0, "roi_score": 4.35, "teach": {"left": {"ja": "読む → 読める", "sub": "五段可能形：词尾 u段 → e段＋る"}, "right": {"ja": "読む → 読まれる", "sub": "あ段＋れる 是受身/尊敬，不是能读"}, "example_ja": "駅から歩いて五分なので、車がなくても毎日楽に通えます。", "zh_meaning": "离车站步行只要五分钟，所以就算没车每天也能轻松通勤。", "audio": "./audio/VAR-H09_exp.mp3?v=67da3f9e"}, "primary": {"id": "VAR-H09", "prompt": "駅から歩いて五分なので、車がなくても毎日楽に（　　）。", "choices": ["通えます", "通われます"], "answer": "通えます", "full_ja": "駅から歩いて五分なので、車がなくても毎日楽に通えます。", "zh_meaning": "离车站步行只要五分钟，所以就算没车每天也能轻松通勤。", "why_line": "考五段动词「通う（かよう）」的可能形。", "form_line": "五段动词词尾う段「う」变え段「え」＋ます → 通えます（能去、能通勤）。", "opt_notes": {"通えます": "五段动词「通う」的正确可能形，表示能轻松通勤。", "通われます": "把五段动词错套成了あ段＋れる（变成被动/尊敬形了）。"}, "q_audio": "./audio/VAR-H09_q.mp3?v=f0233be9", "exp_audio": "./audio/VAR-H09_exp.mp3?v=67da3f9e", "listen_parts": null, "is_listening": false}, "variants": [{"id": "N3-H09", "prompt": "辞書がなくても、日本の新聞が少し（　　）ようになった。", "choices": ["読める", "読まれる"], "answer": "読める", "full_ja": "辞書がなくても、日本の新聞が少し読めるようになった。", "zh_meaning": "就算不用词典，也渐渐能读懂一点日本报纸了。", "why_line": "句尾接「ようになった」，描述个人能力从不会变成「能读了」，要用可能形。", "form_line": "五段动词「読む」把词尾う段「む」推到え段「め」加「る」＝「読める（能读）」；「読まれる」是被动或尊敬。", "opt_notes": {"読める": "「読む」的可能形，搭配「〜ようになった」表变得能读报纸了。", "読まれる": "「読む」的被动/尊敬形，不能表达个人阅读能力提升。"}, "q_audio": "./audio/N3-H09_q.mp3?v=dfc765fe", "exp_audio": "./audio/N3-H09_exp.mp3?v=d44544bd", "listen_parts": null, "is_listening": false}, {"id": "VAR3-H09", "prompt": "毎日練習したので、五十メートル（　　）ようになった。", "choices": ["泳げる", "泳ぎられる"], "answer": "泳げる", "full_ja": "毎日練習したので、五十メートル泳げるようになった。", "zh_meaning": "因为每天坚持练习，现在能游五十米了。", "why_line": "考五段动词「泳ぐ（およぐ）」的可能形。", "form_line": "五段动词词尾「ぐ」直接变え段「げ＋る」→「泳げる」；绝不加「られる」。", "opt_notes": {"泳げる": "五段动词「泳ぐ」的标准可能形（ぐ→げる）。", "泳ぎられる": "误把五段动词按一段规则加「られる」，属于典型活用错形。"}, "q_audio": "./audio/VAR3-H09_q.mp3?v=745875fc", "exp_audio": "./audio/VAR3-H09_exp.mp3?v=59565129", "listen_parts": null, "is_listening": false}]}, {"id": "N3-V22", "subject": "词汇", "point": "だんだん（渐渐变化）", "point_key": "だんだん", "family": "kana_adverb", "modality": "listen", "exam_weight": 3.2, "roi_score": 3.424, "teach": {"left": {"ja": "だんだん暖かくなる", "sub": "随季节时间一点点平缓渐变"}, "right": {"ja": "どんどん進む", "sub": "势头迅猛、接二连三往前冲"}, "example_ja": "新しい職場の仕事にも、毎日続けるうちにだんだん慣れてきた。", "zh_meaning": "新职场的工作，在每天坚持做的过程中也渐渐熟悉适应了。", "audio": "./audio/VAR4-V22_exp.mp3?v=bc06be69"}, "primary": {"id": "VAR4-V22", "prompt": "新しい職場の仕事にも、毎日続けるうちに（　　）慣れてきた。", "choices": ["だんだん", "どんどん"], "answer": "だんだん", "full_ja": "新しい職場の仕事にも、毎日続けるうちにだんだん慣れてきた。", "zh_meaning": "新职场的工作，在每天坚持做的过程中也渐渐熟悉适应了。", "why_line": "适应新环境是日积月累、一天一天平缓过渡的过程。", "form_line": "随时间一步步平缓适应固定用「だんだん慣れてきた」；迅猛推进才用「どんどん」。", "opt_notes": {"だんだん": "随时间一天天平缓自然地适应，常与「慣れてきた」搭配。", "どんどん": "形容势头猛烈、接二连三往前冲，不合日积月累慢慢适应的节奏。"}, "q_audio": "./audio/VAR4-V22_q.mp3?v=4e1b3655", "exp_audio": "./audio/VAR4-V22_exp.mp3?v=bc06be69", "listen_parts": null, "is_listening": false}, "variants": [{"id": "N3-V22", "prompt": "三月の終わりごろから、昼間の気温が（　　）暖かくなってきた。", "choices": ["だんだん", "どんどん"], "answer": "だんだん", "full_ja": "三月の終わりごろから、昼間の気温がだんだん暖かくなってきた。", "zh_meaning": "从三月底左右开始，白天的气温渐渐暖和起来了。", "why_line": "季节入春回暖是一天一天自然平缓过渡的过程。", "form_line": "随时间平缓渐变用「だんだん」；势头猛烈飞快推进才用「どんどん」。", "opt_notes": {"だんだん": "表示随着时间推移一步步缓慢自然地变化，常配「〜てくる」。", "どんどん": "强调速度极快、接二连三势头猛，不合初春缓慢回暖的语感。"}, "q_audio": "./audio/N3-V22_q.mp3?v=eee20d5b", "exp_audio": "./audio/N3-V22_exp.mp3?v=07104063", "listen_parts": null, "is_listening": false}, {"id": "VAR-V22", "prompt": "夕方になって、外の空が（　　）暗くなってきた。", "choices": ["だんだん", "どんどん"], "answer": "だんだん", "full_ja": "夕方になって、外の空がだんだん暗くなってきた。", "zh_meaning": "到了傍晚，外面的天色渐渐暗下来了。", "why_line": "傍晚天黑是随时间一点一滴平缓过渡的自然变化。", "form_line": "自然平缓渐变用「だんだん」；迅猛推进才用「どんどん」。", "opt_notes": {"だんだん": "随时间推移一点点平缓变化（天色渐暗、天气渐暖）。", "どんどん": "势头迅猛接连不断往前冲，不合傍晚天色自然变暗的节奏。"}, "q_audio": "./audio/VAR-V22_q.mp3?v=bae87856", "exp_audio": "./audio/VAR-V22_exp.mp3?v=a68da653", "listen_parts": null, "is_listening": false}]}, {"id": "N3-L06", "subject": "听力", "point": "聴解「まず／後にして」顺序", "point_key": "N3L-087", "family": "listen_seq", "modality": "listen", "exam_weight": 3.0, "roi_score": 5.49, "teach": {"left": {"ja": "先に ／ まず ／ その前に", "sub": "第一顺位马上做（正确答案。）"}, "right": {"ja": "A は後にして", "sub": "陷阱。意思是「A先缓一缓晚点做」"}, "example_ja": "男：お客さんが来る前に、テーブルを拭いておこうか。\n女：ありがとう。あ、テーブルは後にして、まず駅前のケーキ屋で予約したケーキを受け取ってきてくれる？", "zh_meaning": "男：「趁客人来之前，我先把桌子擦一擦吧？」 女：「谢谢。啊，桌子先放后面再擦，你能先去车站前的蛋糕店把订好的蛋糕取回来吗？」", "audio": "./audio/VAR4-L06_exp.mp3?v=73a0fa19"}, "primary": {"id": "VAR4-L06", "prompt": "", "choices": ["テーブルの上を拭く", "ケーキを受け取りに行く", "ケーキ屋に電話して予約する"], "answer": "ケーキを受け取りに行く", "full_ja": "男：お客さんが来る前に、テーブルを拭いておこうか。\n女：ありがとう。あ、テーブルは後にして、まず駅前のケーキ屋で予約したケーキを受け取ってきてくれる？", "zh_meaning": "男：「趁客人来之前，我先把桌子擦一擦吧？」 女：「谢谢。啊，桌子先放后面再擦，你能先去车站前的蛋糕店把订好的蛋糕取回来吗？」", "why_line": "「テーブルは後にして（桌子放后面）」排除了第 1 项，「まず…受け取ってきて」锁定第 2 项去取蛋糕。", "form_line": "注意蛋糕是「予約したケーキ（已经订好的）」，不是现在打电话订，选。", "opt_notes": {"テーブルの上を拭く": "「擦桌子。」女生说 テーブルは後にして（擦桌子先往后放），属于顺序陷阱。", "ケーキを受け取りに行く": "「去取蛋糕。」女生明确指示 まず予約したケーキを受け取ってきて（先去取订好的蛋糕）。", "ケーキ屋に電話して予約する": "「打电话订蛋糕。」蛋糕是已经订好的（予約したケーキ），现在是去取货。"}, "q_audio": "./audio/VAR4-L06_q.mp3?v=8e3789b7", "exp_audio": "./audio/VAR4-L06_exp.mp3?v=73a0fa19", "listen_parts": {"stem": "./audio/VAR4-L06_stem.mp3?v=27944930", "nums": ["./audio/num_JM_1.mp3", "./audio/num_JM_2.mp3", "./audio/num_JM_3.mp3"], "opts": {"テーブルの上を拭く": "./audio/VAR4-L06_opt0.mp3?v=f1f50bcb", "ケーキを受け取りに行く": "./audio/VAR4-L06_opt1.mp3?v=f94ee8d0", "ケーキ屋に電話して予約する": "./audio/VAR4-L06_opt2.mp3?v=914d8f39"}}, "is_listening": true}, "variants": [{"id": "N3-L06", "prompt": "", "choices": ["会議室を準備する", "資料を印刷する", "課長にメールする"], "answer": "資料を印刷する", "full_ja": "女：課長、会議室の準備と資料の印刷、どちらを先にしましょうか。\n男：会議室は後にして、先に資料を印刷してくれる？", "zh_meaning": "女：「课长，布置会议室和打印资料，先做哪个？」 男：「会议室先放后面，你先打印资料好吗？」", "why_line": "听力顺序题盯紧「〜は後にして（这个先放后面）」，跟在「先に（先）」后面的动作才是第一顺位。", "form_line": "打印资料最先做；布置会议室排在后面；发邮件未提及。", "opt_notes": {"会議室を準備する": "「布置会议室。」课长说 会議室は後にして（先放后面再弄）。", "資料を印刷する": "「打印资料。」课长明确指示 先に資料を印刷してくれる？（先印资料）。", "課長にメールする": "「给课长发邮件。」对话中未提及。"}, "q_audio": "./audio/N3-L06_q.mp3?v=5e504363", "exp_audio": "./audio/N3-L06_exp.mp3?v=7d73361f", "listen_parts": {"stem": "./audio/N3-L06_stem.mp3?v=f41ee52b", "nums": ["./audio/num_JF_1.mp3", "./audio/num_JF_2.mp3", "./audio/num_JF_3.mp3"], "opts": {"会議室を準備する": "./audio/N3-L06_opt0.mp3?v=b5af483f", "資料を印刷する": "./audio/N3-L06_opt1.mp3?v=669e99f9", "課長にメールする": "./audio/N3-L06_opt2.mp3?v=674296d9"}}, "is_listening": true}, {"id": "VAR-L06", "prompt": "", "choices": ["銀行へ行く", "昼ご飯を食べる", "メールを返信する"], "answer": "メールを返信する", "full_ja": "男：先輩、先に銀行へ行ってきてもいいですか。\n女：あ、その前にこのメールだけ返信しといて。銀行はその後でね。", "zh_meaning": "男：「前辈，我可以先去趟银行吗？」 女：「啊，那之前先把这封邮件回一下，银行等那之后再去。」", "why_line": "抓顺序词：「その前に（在那之前）」后面跟的是第一顺位，「その後で（那之后）」排在第二顺位。", "form_line": "先回复邮件；去银行被推迟到后面；吃午饭未提及。", "opt_notes": {"銀行へ行く": "「去银行。」前辈说 銀行はその後でね（排在回邮件之后）。", "昼ご飯を食べる": "「吃午饭。」对话中未提及。", "メールを返信する": "「回复邮件。」前辈要求 その前に（去银行前先把邮件回了）。"}, "q_audio": "./audio/VAR-L06_q.mp3?v=7d8f1279", "exp_audio": "./audio/VAR-L06_exp.mp3?v=837e3d0f", "listen_parts": {"stem": "./audio/VAR-L06_stem.mp3?v=6b836d2d", "nums": ["./audio/num_JM_1.mp3", "./audio/num_JM_2.mp3", "./audio/num_JM_3.mp3"], "opts": {"銀行へ行く": "./audio/VAR-L06_opt0.mp3?v=6e93d1d3", "昼ご飯を食べる": "./audio/VAR-L06_opt1.mp3?v=660d0267", "メールを返信する": "./audio/VAR-L06_opt2.mp3?v=fde23648"}}, "is_listening": true}, {"id": "VAR3-L06", "prompt": "", "choices": ["課長に書類を渡す", "郵便局へ荷物を出しに行く", "書類を新しく作り直す"], "answer": "課長に書類を渡す", "full_ja": "女：お疲れ様。先にこの荷物を郵便局に出してこようか？\n男：あ、郵便局は後にして、その前に課長にこの書類を渡してくれる？", "zh_meaning": "女：「辛苦啦，我先把这个包裹送去邮局寄了吧？」 男：「啊，邮局先往后放，在那之前能先把这份文件交给课长吗？」", "why_line": "「郵便局は後にして（邮局往后放）」＋「その前に（在那之前先…）」把交文件插到了第一位。", "form_line": "抓准「その前に」后面的动作，选「課長に書類を渡す」。", "opt_notes": {"課長に書類を渡す": "「把文件交给课长。」抓准 その前に（去邮局之前先把文件给课长）。", "郵便局へ荷物を出しに行く": "「去邮局寄包裹。」被推迟到了 郵便局は後にして。", "書類を新しく作り直す": "「重新做一份文件。」只是转交文件，未提重做。"}, "q_audio": "./audio/VAR3-L06_q.mp3?v=17c062c6", "exp_audio": "./audio/VAR3-L06_exp.mp3?v=32b57672", "listen_parts": {"stem": "./audio/VAR3-L06_stem.mp3?v=4a735a8c", "nums": ["./audio/num_JF_1.mp3", "./audio/num_JF_2.mp3", "./audio/num_JF_3.mp3"], "opts": {"課長に書類を渡す": "./audio/VAR3-L06_opt0.mp3?v=54e8f2c0", "郵便局へ荷物を出しに行く": "./audio/VAR3-L06_opt1.mp3?v=0bd09583", "書類を新しく作り直す": "./audio/VAR3-L06_opt2.mp3?v=e0789e44"}}, "is_listening": true}]}, {"id": "G-20261114-10", "subject": "语法", "point": "〜はずだ", "point_key": "〜はずだ", "family": "hearsay_infer", "modality": "both", "exam_weight": 2.8, "roi_score": 2.996, "teach": {"left": {"ja": "あるはずなんですが", "sub": "按理说应该有（但却找不到） · 肯定预期＋转折"}, "right": {"ja": "あるはずない", "sub": "按理绝对不可能有 · 100%否定推测，与前半句矛盾"}, "example_ja": "先週ネットで予約したはずなんですが、お店に名前がないと言われました。", "zh_meaning": "我上周明明在网上预约过了呀，店里却说没有我的名字。", "audio": "./audio/VAR4-G10_exp.mp3?v=00be40a0"}, "primary": {"id": "VAR4-G10", "prompt": "先週ネットで予約した（　　）、お店に名前がないと言われました。", "choices": ["はずなんですが", "はずがないんですが"], "answer": "はずなんですが", "full_ja": "先週ネットで予約したはずなんですが、お店に名前がないと言われました。", "zh_meaning": "我上周明明在网上预约过了呀，店里却说没有我的名字。", "why_line": "自己清清楚楚上周上网订过位子，按理说名单里肯定有，结果现实却找不到。", "form_line": "有客观依据的肯定预期遇上现实出入，固定用「〜はずなんですが」委婉核实。", "opt_notes": {"はずなんですが": "表示「明明按理说已经预约好了，但结果却不一致」，职场与生活申诉高频句型。", "はずがないんですが": "意为「按理绝不可能预约过」，与前半句上周已在网上订好的事实自相矛盾。"}, "q_audio": "./audio/VAR4-G10_q.mp3?v=74c361af", "exp_audio": "./audio/VAR4-G10_exp.mp3?v=00be40a0", "listen_parts": null, "is_listening": false}, "variants": [{"id": "G-20261114-10", "prompt": "さっき財布に入れたから、レシートはここに（　　）が見つからない。", "choices": ["あるはずなのだが", "あるはずないのだが", "あるわけないのだが"], "answer": "あるはずなのだが", "full_ja": "さっき財布に入れたから、レシートはここにあるはずなのだが、見つからない。", "zh_meaning": "刚才明明放进钱包了，小票按理应该在这里，却找不到。", "why_line": "前半句有明确依据「刚才亲手放进去了」，后半句转折「却找不到」，中间必须是肯定推测「按理应该在」。", "form_line": "肯定推测「あるはずだ」接转折「が」时变为「あるはずなのだが」；若用「はずない」就变成「按理不在却找不到」，前后矛盾。", "opt_notes": {"あるはずなのだが": "「あるはずだ（按理应该在）」接转折「なのだが」，准确表达事与愿违。", "あるはずないのだが": "意为「按理绝不可能在」，与前半句「刚放进钱包」前后矛盾。", "あるわけないのだが": "「わけない」同样表示「绝不可能在」，与语境完全相反。"}, "q_audio": "./audio/G-20261114-10_q.mp3?v=a844d6ab", "exp_audio": "./audio/G-20261114-10_exp.mp3?v=3e8fe3d8", "listen_parts": null, "is_listening": false}, {"id": "VAR-G10", "prompt": "田中さんは今日海外出張中だから、会社にいる（　　）よ。", "choices": ["はずがない", "はずだ"], "answer": "はずがない", "full_ja": "田中さんは今日海外出張中だから、会社にいるはずがないよ。", "zh_meaning": "田中今天正在国外出差，绝不可能在公司里哦。", "why_line": "前面有铁证「人正在国外出差」，逻辑上完全排除他在公司的可能。", "form_line": "动词原形「いる」接「はずがない」表示按道理绝不可能在；「はずだ」是应该在，与在国外出差矛盾。", "opt_notes": {"はずがない": "根据正在海外出差的事实，断定绝不可能在公司。", "はずだ": "变成「应该在公司」，与海外出差矛盾。"}, "q_audio": "./audio/VAR-G10_q.mp3?v=a6ac337d", "exp_audio": "./audio/VAR-G10_exp.mp3?v=bf3bbb65", "listen_parts": null, "is_listening": false}, {"id": "VAR3-G10", "prompt": "さっき駅を出たと連絡があったから、もうすぐ着く（　　）なんですが、まだ来ませんね。", "choices": ["はず", "わけ"], "answer": "はず", "full_ja": "さっき駅を出たと連絡があったから、もうすぐ着くはずなんですが、まだ来ませんね。", "zh_meaning": "刚才来消息说已经出车站了，按理说马上就该到了，怎么还没来呢。", "why_line": "凭「刚才已出站」这一客观依据推断按理该到了，但现实还没到。", "form_line": "客观依据推断＋现实落差固定用「〜はずなんですが」；「わけだ」解释既成事实。", "opt_notes": {"はず": "凭刚出站的联络推断「按理应该快到了」，配「なんですが」表与预期不符。", "わけ": "「わけだ」用于解释既成事实的道理（难怪…），不能对还没到的未来预期说「着くわけなんですが」。"}, "q_audio": "./audio/VAR3-G10_q.mp3?v=586d62b3", "exp_audio": "./audio/VAR3-G10_exp.mp3?v=e89fbde2", "listen_parts": null, "is_listening": false}]}, {"id": "N3-H17", "subject": "活用", "point": "見る → ご覧になる（尊敬）", "point_key": "K-004", "family": "keigo", "modality": "both", "exam_weight": 3.2, "roi_score": 3.424, "teach": {"left": {"ja": "部長がご覧になる", "sub": "尊敬语 · 询问上司/客户是否已过目"}, "right": {"ja": "私が拝見する", "sub": "谦让语 · 只能用于「我」拜读"}, "example_ja": "お客様、こちらの新しいカタログはもうご覧になりましたか。", "zh_meaning": "客人，请问这本新图册您已经看过了吗？", "audio": "./audio/VAR-H17_exp.mp3?v=a0cd7800"}, "primary": {"id": "VAR-H17", "prompt": "お客様、こちらの新しいカタログはもう（　　）か。", "choices": ["ご覧になりました", "拝見しました"], "answer": "ご覧になりました", "full_ja": "お客様、こちらの新しいカタログはもうご覧になりましたか。", "zh_meaning": "客人，请问这本新图册您已经看过了吗？", "why_line": "直接询问「お客様（客人您看过了吗）」，动作主语是客人。", "form_line": "客户或上司「看」必用尊敬语「ご覧になりましたか」；「拝見しました」只能说我自己看。", "opt_notes": {"ご覧になりました": "「見る」的特殊尊敬语，礼貌询问客户是否已过目。", "拝見しました": "「見る」的谦让语，只能用于自己拜读，不能问客户。"}, "q_audio": "./audio/VAR-H17_q.mp3?v=c5d03bda", "exp_audio": "./audio/VAR-H17_exp.mp3?v=a0cd7800", "listen_parts": null, "is_listening": false}, "variants": [{"id": "N3-H17", "prompt": "部長、先ほどメールでお送りした新しい企画書をもう（　　）か。", "choices": ["ご覧になりました", "拝見しました"], "answer": "ご覧になりました", "full_ja": "部長、先ほどメールでお送りした新しい企画書をもうご覧になりましたか。", "zh_meaning": "部长，刚才发邮件呈送的新策划书，请问您已经过目了吗？", "why_line": "这句话是在问「部长您看过了吗」，看策划书的人是部长。", "form_line": "上司或客户「看」必用尊敬语「ご覧になる」；「拝見する」是谦让语，只能说「我拜读了」。", "opt_notes": {"ご覧になりました": "「見る」的特殊尊敬语，抬高部长「过目」的动作。", "拝見しました": "「見る」的谦让语，只能用于自己看上司的资料，不能问部长。"}, "q_audio": "./audio/N3-H17_q.mp3?v=ed3b273f", "exp_audio": "./audio/N3-H17_exp.mp3?v=bc0ba6e6", "listen_parts": null, "is_listening": false}]}, {"id": "N3-V24", "subject": "词汇", "point": "いよいよ（终于到了紧要关头）", "point_key": "いよいよ", "family": "kana_adverb", "modality": "listen", "exam_weight": 3.2, "roi_score": 3.424, "teach": {"left": {"ja": "明日いよいよ始まる", "sub": "正式大幕即将拉开（面向未来高潮）"}, "right": {"ja": "ようやく終わった", "sub": "历尽波折好不容易才完成（多配已实现结果）"}, "example_ja": "明日はいよいよ楽しみにしていた海外旅行に出発する。", "zh_meaning": "明天终于要踏上期待已久的海外旅行了。", "audio": "./audio/VAR4-V24_exp.mp3?v=9fe018d0"}, "primary": {"id": "VAR4-V24", "prompt": "明日は（　　）楽しみにしていた海外旅行に出発する。", "choices": ["いよいよ", "ようやく"], "answer": "いよいよ", "full_ja": "明日はいよいよ楽しみにしていた海外旅行に出発する。", "zh_meaning": "明天终于要踏上期待已久的海外旅行了。", "why_line": "站在出发前一天展望「明日…出発する」，满怀兴奋迎接重头戏开场。", "form_line": "期盼的大日子明天即将到来必用「いよいよ」；「ようやく」用于好不容易熬出头的既成结果。", "opt_notes": {"いよいよ": "铺垫期盼已久，表示关键时刻终于近在眼前（常接明日、来週等未然动作）。", "ようやく": "侧重历尽波折后「总算实现了」，一般用于已经达成的过去或眼前结果，不预告明天出发。"}, "q_audio": "./audio/VAR4-V24_q.mp3?v=6fd71f8d", "exp_audio": "./audio/VAR4-V24_exp.mp3?v=9fe018d0", "listen_parts": null, "is_listening": false}, "variants": [{"id": "N3-V24", "prompt": "半年準備してきた展覧会が、明日（　　）始まる。", "choices": ["いよいよ", "ようやく"], "answer": "いよいよ", "full_ja": "半年準備してきた展覧会が、明日いよいよ始まる。", "zh_meaning": "筹备了半年的展览会，明天终于要正式开幕了。", "why_line": "句尾是「明日始まる」，站在大幕拉开的前夜，心情既期待又紧张。", "form_line": "重大时刻「终于马上就要到了（面向未来）」必选「いよいよ」；「ようやく」多配已经熬出头的结果。", "opt_notes": {"いよいよ": "带着兴奋或紧张感，表示关键时刻「终于马上就要到了」，常接未然动作。", "ようやく": "侧重费尽周折「总算达成了」，一般不接「明天开始」这种日程预告。"}, "q_audio": "./audio/N3-V24_q.mp3?v=26b50bbb", "exp_audio": "./audio/N3-V24_exp.mp3?v=2784381d", "listen_parts": null, "is_listening": false}, {"id": "VAR-V24", "prompt": "長い冬が終わり、来週から（　　）新学期の授業が始まる。", "choices": ["いよいよ", "だんだん"], "answer": "いよいよ", "full_ja": "長い冬が終わり、来週からいよいよ新学期の授業が始まる。", "zh_meaning": "漫长的冬天结束了，从下周起新学期的课终于要开始了。", "why_line": "熬过整个冬天，终于迎来下周正式开学的关键节点。", "form_line": "期盼已久的时刻终于到来用「いよいよ」；「だんだん」表平缓渐变。", "opt_notes": {"いよいよ": "铺垫期待已久，终于迎来正式开场的关键节点。", "だんだん": "表示一点点平缓渐变，不能修饰「下周起正式开课」。"}, "q_audio": "./audio/VAR-V24_q.mp3?v=a72d7424", "exp_audio": "./audio/VAR-V24_exp.mp3?v=67c87ee0", "listen_parts": null, "is_listening": false}]}, {"id": "Q-20261114-001", "subject": "听力", "point": "〜なきゃ", "point_key": "N3L-015", "family": "listen_contract", "modality": "listen", "exam_weight": 3.0, "roi_score": 5.49, "teach": {"left": {"ja": "夕飯の支度しないと！", "sub": "＝ しないと【いけない】 · 必须赶紧去做晚饭。（100%要做）"}, "right": {"ja": "作らなくていい", "sub": "〜なくていい · 这才是「不用做也可以」"}, "example_ja": "男：あ、電気代の支払い、今日までだった！早く払わなくちゃ。\n女：うん、今すぐ払わないとね。", "zh_meaning": "男：「啊，电费今天截止！得赶紧交才行。」 女：「嗯，得马上交了呢。」", "audio": "./audio/VAR-L01_exp.mp3?v=a6f9c9bc"}, "primary": {"id": "VAR-L01", "prompt": "", "choices": ["うん、今すぐ払わないとね。", "じゃあ、払わなくてもいいんだね。", "昨日もう払ったよ。"], "answer": "うん、今すぐ払わないとね。", "full_ja": "男：あ、電気代の支払い、今日までだった！早く払わなくちゃ。\n女：うん、今すぐ払わないとね。", "zh_meaning": "男：「啊，电费今天截止！得赶紧交才行。」 女：「嗯，得马上交了呢。」", "why_line": "「払わなくちゃ」和「払わないと」都是口语里的「必须赶紧交」（省略了いけない）。", "form_line": "顺着附和马上交；把「なくちゃ」听反成不用交；与刚发现没交矛盾。", "opt_notes": {"うん、今すぐ払わないとね。": "「嗯，得马上交了呢。」用同义口语 払わないと 顺着附和。", "じゃあ、払わなくてもいいんだね。": "「那不用交了呢。」把口语 払わなくちゃ（必须交）听反了。", "昨日もう払ったよ。": "「昨天已经交了哦。」与男生刚发现还没交矛盾。"}, "q_audio": "./audio/VAR-L01_q.mp3?v=0f743c91", "exp_audio": "./audio/VAR-L01_exp.mp3?v=a6f9c9bc", "listen_parts": {"stem": "./audio/VAR-L01_stem.mp3?v=374b6482", "nums": ["./audio/num_JF_1.mp3", "./audio/num_JF_2.mp3", "./audio/num_JF_3.mp3"], "opts": {"うん、今すぐ払わないとね。": "./audio/VAR-L01_opt0.mp3?v=5b887a11", "じゃあ、払わなくてもいいんだね。": "./audio/VAR-L01_opt1.mp3?v=2eb2cd13", "昨日もう払ったよ。": "./audio/VAR-L01_opt2.mp3?v=f51cb6ad"}}, "is_listening": true}, "variants": [{"id": "Q-20261114-001", "prompt": "", "choices": ["じゃあ、今日は作らなくていいね。", "ほんとだ、急いで帰ろう。", "夕飯、おいしかったね。"], "answer": "ほんとだ、急いで帰ろう。", "full_ja": "女：あ、もう五時だ。早く帰って、夕飯の支度しないと。\n男：ほんとだ、急いで帰ろう。", "zh_meaning": "女：「啊，都五点了！得赶紧回去准备晚饭了。」 男：「真的耶，赶紧回去吧。」", "why_line": "女生看表催着赶紧回家做晚饭，口语句尾「〜しないと」省略了「いけない」，意思是必须赶紧做。", "form_line": "附和赶紧回家；把「しないと」听反成不用做；过去式时态不对。", "opt_notes": {"じゃあ、今日は作らなくていいね。": "「那今天不用做了呢。」把口语 しないと（必须做）听反了。", "ほんとだ、急いで帰ろう。": "「真的耶，赶紧回去吧。」顺着女生催回家做晚饭自然回应。", "夕飯、おいしかったね。": "「晚饭真好吃呢。」时态不对，晚饭还没开始准备。"}, "q_audio": "./audio/Q-20261114-001_q.mp3?v=44c6dd4b", "exp_audio": "./audio/Q-20261114-001_exp.mp3?v=aeeac5e3", "listen_parts": {"stem": "./audio/Q-20261114-001_stem.mp3?v=3722de3f", "nums": ["./audio/num_JM_1.mp3", "./audio/num_JM_2.mp3", "./audio/num_JM_3.mp3"], "opts": {"じゃあ、今日は作らなくていいね。": "./audio/Q-20261114-001_opt0.mp3?v=04bba38e", "ほんとだ、急いで帰ろう。": "./audio/Q-20261114-001_opt1.mp3?v=ce14ce65", "夕飯、おいしかったね。": "./audio/Q-20261114-001_opt2.mp3?v=b2b188c1"}}, "is_listening": true}, {"id": "VAR3-L01", "prompt": "", "choices": ["今日のうちに図書館へ本を返しに行く", "来週まで本を借りたままにする", "友達に本を貸してあげる"], "answer": "今日のうちに図書館へ本を返しに行く", "full_ja": "女：あれ、図書館で借りた本、返すの今日までじゃない？\n男：ほんとだ！閉まる前に急いで返さなくちゃ。", "zh_meaning": "女：「咦，图书馆借的书，还书期限不是到今天为止吗？」 男：「真的耶！趁关门前必须赶紧去还了。」", "why_line": "男生喊「急いで返さなくちゃ」（＝返さなくてはいけない），必须马上赶在闭馆前去还书。", "form_line": "口语句尾「〜なくちゃ」表必须做某事，选今天去图书馆还书。", "opt_notes": {"今日のうちに図書館へ本を返しに行く": "「趁今天闭馆前去图书馆还书。」听懂 急いで返さなくちゃ（必须赶紧去还）。", "来週まで本を借りたままにする": "「借到下周再说。」还书期限就是今天。", "友達に本を貸してあげる": "「把书借给朋友。」对话中未提及。"}, "q_audio": "./audio/VAR3-L01_q.mp3?v=cc51b453", "exp_audio": "./audio/VAR3-L01_exp.mp3?v=de029728", "listen_parts": {"stem": "./audio/VAR3-L01_stem.mp3?v=43620596", "nums": ["./audio/num_JF_1.mp3", "./audio/num_JF_2.mp3", "./audio/num_JF_3.mp3"], "opts": {"今日のうちに図書館へ本を返しに行く": "./audio/VAR3-L01_opt0.mp3?v=d209edfc", "来週まで本を借りたままにする": "./audio/VAR3-L01_opt1.mp3?v=77ddf886", "友達に本を貸してあげる": "./audio/VAR3-L01_opt2.mp3?v=e318f76c"}}, "is_listening": true}]}, {"id": "G-20261114-11", "subject": "语法", "point": "〜らしい", "point_key": "〜らしい", "family": "hearsay_infer", "modality": "both", "exam_weight": 2.9, "roi_score": 1.798, "teach": {"left": {"ja": "あるらしい / 便利らしい", "sub": "动词原形・な形词干直接＋らしい · 听说有活动 / 听说很方便"}, "right": {"ja": "あるとらしい / 便利だらしい", "sub": "常见接续错误 · 误把「〜と聞いた」的と或だ混入句中"}, "example_ja": "うわさによると、あの二人は来月結婚するらしい。", "zh_meaning": "据传言说，那两个人好像下个月要结婚了。", "audio": "./audio/VAR-G11_exp.mp3?v=b070fe95"}, "primary": {"id": "VAR-G11", "prompt": "うわさによると、あの二人は来月結婚する（　　）。", "choices": ["らしい", "とらしい"], "answer": "らしい", "full_ja": "うわさによると、あの二人は来月結婚するらしい。", "zh_meaning": "据传言说，那两个人好像下个月要结婚了。", "why_line": "开头有「うわさによると（据传闻）」，属于转述别人传来的消息。", "form_line": "动词简体「結婚する」直接接「らしい」，中间不能多加引用的「と」。", "opt_notes": {"らしい": "动词简体形直接＋らしい表传闻。", "とらしい": "语法错误，「らしい」前不可加「と」。"}, "q_audio": "./audio/VAR-G11_q.mp3?v=21f94caa", "exp_audio": "./audio/VAR-G11_exp.mp3?v=b070fe95", "listen_parts": null, "is_listening": false}, "variants": [{"id": "G-20261114-11", "prompt": "ニュースによると、来週また大きなイベントが（　　）よ。", "choices": ["あるらしい", "あるとらしい", "あるだらしい"], "answer": "あるらしい", "full_ja": "ニュースによると、来週また大きなイベントがあるらしいよ。", "zh_meaning": "据新闻说，听说下周又有大型活动哦。", "why_line": "开头有消息来源「ニュースによると（据新闻说）」，是在转述客观传闻。", "form_line": "传闻「らしい」直接接动词简体原形「ある」，连成「あるらしい」；中间绝不能加引用的「と」或「だ」。", "opt_notes": {"あるらしい": "动词简体原形直接接「らしい」表客观传闻（听说有活动）。", "あるとらしい": "混入了引用助词「と」，传闻「らしい」前面不能加「と」。", "あるだらしい": "动词后不能加「だ」，且名词或な形容词接「らしい」也须去掉「だ」。"}, "q_audio": "./audio/G-20261114-11_q.mp3?v=4cd53ff3", "exp_audio": "./audio/G-20261114-11_exp.mp3?v=204f3b1d", "listen_parts": null, "is_listening": false}]}, {"id": "HQ-20261114-01", "subject": "活用", "point": "来る 可能形", "point_key": "V-030", "family": "potential_form", "modality": "memorize", "exam_weight": 2.8, "roi_score": 1.736, "teach": {"left": {"ja": "来られる（こられる）", "sub": "JLPT 卷面唯一标准形 · 来る・見る・食べる 必须带「ら」"}, "right": {"ja": "来れる（これる）", "sub": "口语偷懒「ら抜き言葉」 · 语法选择题里选它必扣分"}, "example_ja": "明日の会議に、来られますか。", "zh_meaning": "明天的会议，您能来吗？", "audio": "./audio/HQ-20261114-01_exp.mp3?v=c6830a33"}, "primary": {"id": "HQ-20261114-01", "prompt": "明日の会議に、九時までに（　　）か。", "choices": ["来られる（こられる）", "来れる（これる）"], "answer": "来られる（こられる）", "full_ja": "明日の会議に、来られますか。", "zh_meaning": "明天的会议，您能来吗？", "why_line": "询问对方「能不能来」，需要把不规则动词「来る（くる）」变成书面的标准可能形。", "form_line": "「来る」的标准可能形必须保留「ら」，写作「来られる（こられる）」；「来れる（これる）」是日常口语吞音，考试卷面判错。", "opt_notes": {"来られる（こられる）": "カ变动词「来る」唯一合乎标准语法的可能形（读音变 こ＋られる）。", "来れる（これる）": "属于口语吞音「ら抜き言葉」，日常聊天听得懂，但在JLPT语法题中严禁选。"}, "q_audio": "./audio/HQ-20261114-01_q.mp3?v=51969c29", "exp_audio": "./audio/HQ-20261114-01_exp.mp3?v=c6830a33", "listen_parts": null, "is_listening": false}, "variants": []}, {"id": "N3-V25", "subject": "词汇", "point": "せっかく（好不容易却白费）", "point_key": "せっかく", "family": "kana_adverb", "modality": "listen", "exam_weight": 3.2, "roi_score": 3.424, "teach": {"left": {"ja": "せっかく作ったのに", "sub": "珍惜难得的一番心血（配 のに 表白费惋惜）"}, "right": {"ja": "わざわざ行く", "sub": "本来不必去却专程跑一趟"}, "example_ja": "せっかく京都まで来たのだから、有名な神社を見て帰ろう。", "zh_meaning": "难得大老远来一趟京都，去看看有名的神社再回去吧。", "audio": "./audio/VAR-V25_exp.mp3?v=8456d4c1"}, "primary": {"id": "VAR-V25", "prompt": "（　　）京都まで来たのだから、有名な神社を見て帰ろう。", "choices": ["せっかく", "わざわざ"], "answer": "せっかく", "full_ja": "せっかく京都まで来たのだから、有名な神社を見て帰ろう。", "zh_meaning": "难得大老远来一趟京都，去看看有名的神社再回去吧。", "why_line": "后接「〜のだから、見て帰ろう」，强调别白白浪费来京都的难得机会。", "form_line": "「せっかく〜のだから（难得…就别白来）」是固定黄金搭配；「わざわざ」强调专程费事。", "opt_notes": {"せっかく": "难得有这个好机会，配「〜のだから」劝大家别浪费机会。", "わざわざ": "强调本可不去却专程跑一趟，不搭「〜のだから…見て帰ろう」。"}, "q_audio": "./audio/VAR-V25_q.mp3?v=f9038e92", "exp_audio": "./audio/VAR-V25_exp.mp3?v=8456d4c1", "listen_parts": null, "is_listening": false}, "variants": [{"id": "N3-V25", "prompt": "（　　）早起きして弁当を作ったのに、家に忘れてきてしまった。", "choices": ["せっかく", "わざわざ"], "answer": "せっかく", "full_ja": "せっかく早起きして弁当を作ったのに、家に忘れてきてしまった。", "zh_meaning": "好不容易早起做了便当，结果却忘在家里没带出来。", "why_line": "后半句「〜のに、忘れてきてしまった」感叹一番辛苦全白费了。", "form_line": "「せっかく〜のに」是黄金搭档（好不容易费心做了某事却白费）；「わざわざ」强调专程多跑一趟。", "opt_notes": {"せっかく": "强调难得费心做了便当，配「のに」表达心血白费的遗憾。", "わざわざ": "侧重「特意多此一举或专程费事」，不用于早起给自己做便当的惋惜感叹。"}, "q_audio": "./audio/N3-V25_q.mp3?v=c240f0de", "exp_audio": "./audio/N3-V25_exp.mp3?v=3534838b", "listen_parts": null, "is_listening": false}]}, {"id": "Q-20261114-004", "subject": "听力", "point": "〜といて", "point_key": "N3L-007", "family": "listen_contract", "modality": "listen", "exam_weight": 3.0, "roi_score": 5.49, "teach": {"left": {"ja": "コピーしといてくれる？", "sub": "〜ておいて → 口语缩成 〜といて · 开会前能帮我「提前复印好」吗？"}, "right": {"ja": "はい、コピーしておきます", "sub": "下属还原成礼貌体回应 · 好的，我马上提前复印好"}, "example_ja": "女：来月の旅行、混む前にホテル予約しとかないとね。\n男：わかった、今すぐ予約しておくね。", "zh_meaning": "女：「下个月的旅行，趁还没订满得提前把酒店订好呢。」 男：「好，我马上提前订好。」", "audio": "./audio/VAR-L04_exp.mp3?v=4d572b67"}, "primary": {"id": "VAR-L04", "prompt": "", "choices": ["ホテルには泊まらないよ。", "旅行は楽しかったね。", "わかった、今すぐ予約しておくね。"], "answer": "わかった、今すぐ予約しておくね。", "full_ja": "女：来月の旅行、混む前にホテル予約しとかないとね。\n男：わかった、今すぐ予約しておくね。", "zh_meaning": "女：「下个月的旅行，趁还没订满得提前把酒店订好呢。」 男：「好，我马上提前订好。」", "why_line": "「予約しとかないと」融合了「ておく（提前做）」的口语缩音「とく」和「ないと（必须）」。", "form_line": "答应马上提前订好；答非所问；用了过去式，旅行还没去。", "opt_notes": {"ホテルには泊まらないよ。": "「不住酒店哦。」答非所问。", "旅行は楽しかったね。": "「旅行真开心呢。」过去式错误，旅行在下个月还没去。", "わかった、今すぐ予約しておくね。": "「好，我现在就提前订好。」听懂口语缩音 しとかないと，回应马上订。"}, "q_audio": "./audio/VAR-L04_q.mp3?v=eadd7ec2", "exp_audio": "./audio/VAR-L04_exp.mp3?v=4d572b67", "listen_parts": {"stem": "./audio/VAR-L04_stem.mp3?v=d0d78088", "nums": ["./audio/num_JM_1.mp3", "./audio/num_JM_2.mp3", "./audio/num_JM_3.mp3"], "opts": {"ホテルには泊まらないよ。": "./audio/VAR-L04_opt0.mp3?v=b1f1ccdb", "旅行は楽しかったね。": "./audio/VAR-L04_opt1.mp3?v=e4a74db5", "わかった、今すぐ予約しておくね。": "./audio/VAR-L04_opt2.mp3?v=570f2783"}}, "is_listening": true}, "variants": [{"id": "Q-20261114-004", "prompt": "", "choices": ["昨日もう会議は終わりましたよ。", "コピー機は使いません。", "はい、すぐコピーしておきます。"], "answer": "はい、すぐコピーしておきます。", "full_ja": "男：会議の前に、この資料、人数分コピーしといてくれる？\n女：はい、すぐコピーしておきます。", "zh_meaning": "男：「开会前，能帮我把这份资料按人数提前复印好吗？」 女：「好的，我马上复印好。」", "why_line": "上司口语里的「しといて」就是「しておいて（提前准备好）」，拜托下属开会前印好资料。", "form_line": "礼貌答应马上印好；说昨天开完会时态矛盾；说不用复印机答非所问。", "opt_notes": {"昨日もう会議は終わりましたよ。": "「昨天会已经开完了哦。」与上司说的「开会前」矛盾。", "コピー機は使いません。": "「不用复印机。」答非所问。", "はい、すぐコピーしておきます。": "「好的，我马上提前印好。」听懂口语缩音 しといて，得体承接任务。"}, "q_audio": "./audio/Q-20261114-004_q.mp3?v=4b5bd582", "exp_audio": "./audio/Q-20261114-004_exp.mp3?v=d936adbc", "listen_parts": {"stem": "./audio/Q-20261114-004_stem.mp3?v=bb14fb55", "nums": ["./audio/num_JF_1.mp3", "./audio/num_JF_2.mp3", "./audio/num_JF_3.mp3"], "opts": {"昨日もう会議は終わりましたよ。": "./audio/Q-20261114-004_opt0.mp3?v=bc5874a3", "コピー機は使いません。": "./audio/Q-20261114-004_opt1.mp3?v=460f0841", "はい、すぐコピーしておきます。": "./audio/Q-20261114-004_opt2.mp3?v=1eb6cc5b"}}, "is_listening": true}, {"id": "VAR3-L04", "prompt": "", "choices": ["会議室の窓を先に開けておく", "お客さんを駅まで迎えに行く", "会議室の窓を全部閉める"], "answer": "会議室の窓を先に開けておく", "full_ja": "女：お客さんが来る前に、会議室の窓を開けといてくれる？\n男：はい、今すぐ開けておきます。", "zh_meaning": "女：「客人来之前，你能先把会议室窗户打开通通风吗？」 男：「好的，我现在马上去开好。」", "why_line": "「窓を開けといて」＝「窓を開けておいて」，提前打开窗户备着。", "form_line": "口语「〜といて」＝「〜ておいて」，选先把会议室窗户打开。", "opt_notes": {"会議室の窓を先に開けておく": "「先把会议室窗户打开备着。」听懂 開けといて＝開けておいて。", "お客さんを駅まで迎えに行く": "「去车站接客户。」对话中未提及。", "会議室の窓を全部閉める": "「把会议室窗户全关上。」把 開けといて（打开）听反了。"}, "q_audio": "./audio/VAR3-L04_q.mp3?v=25572be2", "exp_audio": "./audio/VAR3-L04_exp.mp3?v=70a5c9bf", "listen_parts": {"stem": "./audio/VAR3-L04_stem.mp3?v=e9120b7d", "nums": ["./audio/num_JF_1.mp3", "./audio/num_JF_2.mp3", "./audio/num_JF_3.mp3"], "opts": {"会議室の窓を先に開けておく": "./audio/VAR3-L04_opt0.mp3?v=47bf4c8e", "お客さんを駅まで迎えに行く": "./audio/VAR3-L04_opt1.mp3?v=7a1010a6", "会議室の窓を全部閉める": "./audio/VAR3-L04_opt2.mp3?v=c786997d"}}, "is_listening": true}]}, {"id": "N3-G23", "subject": "语法", "point": "〜わりに", "point_key": "〜わりに", "family": "contrast_expect", "modality": "both", "exam_weight": 2.9, "roi_score": 1.798, "teach": {"left": {"ja": "遠いわりに家賃が高い", "sub": "与前项程度不成比例（明明远却很贵）"}, "right": {"ja": "〜たびに", "sub": "每当做某事的时候"}, "example_ja": "うちの祖母は年齢のわりに、足が速くてとても若く見える。", "zh_meaning": "我奶奶相对于她的年纪来说，走路又快又特别显年轻。", "audio": "./audio/VAR4-G23_exp.mp3?v=40fe2188"}, "primary": {"id": "VAR4-G23", "prompt": "うちの祖母は年齢（　　）、足が速くてとても若く見える。", "choices": ["のわりに", "のせいで"], "answer": "のわりに", "full_ja": "うちの祖母は年齢のわりに、足が速くてとても若く見える。", "zh_meaning": "我奶奶相对于她的年纪来说，走路又快又特别显年轻。", "why_line": "按高龄常理本该腿脚慢，实际却健步如飞很显年轻，前后程度不成比例。", "form_line": "名词接「わりに」中间必须加「の」→「年齢のわりに（相对于年龄而言却…）」；「のせいで」只接负面坏结果。", "opt_notes": {"のわりに": "名词＋のわりに，表示按年纪衡量本该老态，实际却脚步轻快很显年轻。", "のせいで": "表示负面因果「怪年纪大导致某坏结果」，不能接正面夸奖「とても若く見える」。"}, "q_audio": "./audio/VAR4-G23_q.mp3?v=31be89fd", "exp_audio": "./audio/VAR4-G23_exp.mp3?v=40fe2188", "listen_parts": null, "is_listening": false}, "variants": [{"id": "N3-G23", "prompt": "このアパートは駅から遠い（　　）、家賃がかなり高い。", "choices": ["わりに", "たびに"], "answer": "わりに", "full_ja": "このアパートは駅から遠いわりに、家賃がかなり高い。", "zh_meaning": "这间公寓明明离车站很远，房租却相当贵。", "why_line": "离车站远按常理房租应该便宜，结果却反常地贵，前后程度不成比例。", "form_line": "形容词「遠い」直接接「わりに」表示「相对于……而言却……」；「たびに」表示每当做某事。", "opt_notes": {"わりに": "按离车站远来说房租本该便宜，实际却很贵，比例反差用「わりに」。", "たびに": "表示「每当…就…」，不能接形容词「遠い」。"}, "q_audio": "./audio/N3-G23_q.mp3?v=6f8d9c28", "exp_audio": "./audio/N3-G23_exp.mp3?v=bc44629b", "listen_parts": null, "is_listening": false}, {"id": "VAR-G23", "prompt": "彼はたくさん食べる（　　）、ぜんぜん太らない。", "choices": ["わりに", "につれて"], "answer": "わりに", "full_ja": "彼はたくさん食べるわりに、ぜんぜん太らない。", "zh_meaning": "他明明吃得很多，却一点也不胖。", "why_line": "饭量大跟身材瘦不成正比，打破常理预期。", "form_line": "动词原形「食べる」接「わりに」表比例反差；「につれて」是越吃越胖的正向渐变。", "opt_notes": {"わりに": "食量大与身材瘦不成比例，用「わりに」。", "につれて": "表示正比渐变（越吃越胖），与「ぜんぜん太らない」矛盾。"}, "q_audio": "./audio/VAR-G23_q.mp3?v=f0437ba0", "exp_audio": "./audio/VAR-G23_exp.mp3?v=e8e5d8c2", "listen_parts": null, "is_listening": false}]}, {"id": "N3-V28", "subject": "词汇", "point": "ぐったり（累瘫无力）", "point_key": "ぐったり", "family": "kana_adverb", "modality": "listen", "exam_weight": 2.9, "roi_score": 3.103, "teach": {"left": {"ja": "ぐったり疲れる", "sub": "精疲力竭、像抽掉骨头一样瘫软"}, "right": {"ja": "サイズがぴったり合う", "sub": "尺寸时间严丝合缝刚刚好"}, "example_ja": "引っ越しの荷物を一日中運んで、夜はソファの上でぐったりしてしまった。", "zh_meaning": "搬了一整天的搬家行李，晚上累得瘫倒在沙发上动弹不得。", "audio": "./audio/VAR-V28_exp.mp3?v=bdf88dae"}, "primary": {"id": "VAR-V28", "prompt": "引っ越しの荷物を一日中運んで、夜はソファの上で（　　）してしまった。", "choices": ["ぐったり", "ぴったり"], "answer": "ぐったり", "full_ja": "引っ越しの荷物を一日中運んで、夜はソファの上でぐったりしてしまった。", "zh_meaning": "搬了一整天的搬家行李，晚上累得瘫倒在沙发上动弹不得。", "why_line": "搬重物累了一整天，全身力气抽空瘫在沙发上。", "form_line": "精疲力竭瘫软无力用「ぐったり」；尺寸时间严丝合缝用「ぴったり」。", "opt_notes": {"ぐったり": "累得浑身散架、瘫软无力。", "ぴったり": "尺寸合身或准点契合，不能表精疲力竭。"}, "q_audio": "./audio/VAR-V28_q.mp3?v=44f5cf15", "exp_audio": "./audio/VAR-V28_exp.mp3?v=bdf88dae", "listen_parts": null, "is_listening": false}, "variants": [{"id": "N3-V28", "prompt": "猛暑の中を一日中歩き回って、ホテルに着いたら（　　）疲れて動けなかった。", "choices": ["ぐったり", "ぴったり"], "answer": "ぐったり", "full_ja": "猛暑の中を一日中歩き回って、ホテルに着いたらぐったり疲れて動けなかった。", "zh_meaning": "大热天在外面奔波了一整天，回到酒店累得瘫倒在床一动也动不了。", "why_line": "酷暑走了一整天，体力彻底耗尽瘫软下来。", "form_line": "精疲力竭浑身瘫软用「ぐったり」；尺码时间严丝合缝刚刚好才用「ぴったり」。", "opt_notes": {"ぐったり": "描写体力耗尽、瘫倒在床上动弹不得的状态。", "ぴったり": "表示严丝合缝或正点准时，不能修饰疲劳。"}, "q_audio": "./audio/N3-V28_q.mp3?v=d5df699a", "exp_aud
