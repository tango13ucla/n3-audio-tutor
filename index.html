 ＋ 飲まない", "sub": "100% 配否定（极少、难得）"}, "right": {"ja": "たいてい ＋ 飲む", "sub": "通常配肯定（大抵、一般）"}, "example_ja": "父はお酒をめったに飲まない。", "zh_meaning": "父亲极少喝酒。", "audio": "./audio/N3-G18_exp.mp3?v=e88a92c3"}, "primary": {"id": "N3-G18", "prompt": "父はお酒を（　　）飲まない。", "choices": ["めったに", "たいてい"], "answer": "めったに", "full_ja": "父はお酒をめったに飲まない。", "zh_meaning": "父亲极少喝酒。", "why_line": "句尾是否定「飲まない」，表达频率极低、「难得、极少做某事」。", "form_line": "「めったに」必须和句尾的否定「ない」配对使用；「たいてい（通常、大抵）」一般搭配肯定句。", "opt_notes": {"めったに": "陈陈述副词，与否定「飲まない」固定呼应，意为「极少喝酒」。", "たいてい": "意为「通常、大抵」，一般搭配肯定谓语。"}, "q_audio": "./audio/N3-G18_q.mp3?v=f592bcad", "exp_audio": "./audio/N3-G18_exp.mp3?v=e88a92c3", "is_listening": false}, "variants": []}, {"id": "H-20261114-07", "subject": "活用", "point": "終わる ↔ 終える／終わらせる", "point_key": "T-006", "family": "transitivity", "modality": "both", "exam_weight": 2.8, "roi_score": 0.56, "teach": {"left": {"ja": "仕事を終わらせる", "sub": "宾语を＋使役他动化（把工作干完） · 也可说书面他动词：仕事を終える"}, "right": {"ja": "仕事が終わる", "sub": "主语が＋自动词（工作自然结束） · 自动词不能带宾语「仕事を」"}, "example_ja": "旅行に行く前に、今週中にこの仕事を全部終わらせてしまいたい。", "zh_meaning": "去旅行之前，我想在本周内把这项工作全部做完。", "audio": "./audio/H-20261114-07_exp.mp3?v=d965e182"}, "primary": {"id": "H-20261114-07", "prompt": "旅行に行く前に、今週中にこの仕事を全部（　　）しまいたい。", "choices": ["終わらせて", "終わって", "終わられて"], "answer": "終わらせて", "full_ja": "旅行に行く前に、今週中にこの仕事を全部終わらせてしまいたい。", "zh_meaning": "去旅行之前，我想在本周内把这项工作全部做完。", "why_line": "前面有宾语「この仕事を」，表达「人主动把活儿干完」，不能直接用自动词「終わって」。", "form_line": "自动词「終わる」变成使役形「終わらせる → 終わらせて」，才能带宾语「仕事を」表示把工作做完。", "opt_notes": {"終わらせて": "使役形作他动词用，搭配宾语「この仕事を」表示人主动把工作做完。", "終わって": "「終わる」是自动词（工作自己结束），不能带宾语「仕事を」。", "終わられて": "受身形（被结束），放进句中意思不通。"}, "q_audio": "./audio/H-20261114-07_q.mp3?v=2d5e4256", "exp_audio": "./audio/H-20261114-07_exp.mp3?v=d965e182", "is_listening": false}, "variants": []}, {"id": "N3-V10", "subject": "词汇", "point": "ぎりぎり", "point_key": "ぎりぎり", "family": "kana_adverb", "modality": "listen", "exam_weight": 2.1, "roi_score": 0.42, "teach": {"left": {"ja": "ぎりぎり間に合う", "sub": "卡着死线最后一秒勉强赶上"}, "right": {"ja": "ぴったり合う", "sub": "尺寸/时间严丝合缝刚刚好"}, "example_ja": "駅まで走って、終電にぎりぎり間に合った。", "zh_meaning": "一路跑到车站，卡着最后一刻勉强赶上了末班车。", "audio": "./audio/N3-V10_exp.mp3?v=ddb63d42"}, "primary": {"id": "N3-V10", "prompt": "駅まで走って、終電に（　　）間に合った。", "choices": ["ぎりぎり", "ぐっすり"], "answer": "ぎりぎり", "full_ja": "駅まで走って、終電にぎりぎり間に合った。", "zh_meaning": "一路跑到车站，卡着最后一刻勉强赶上了末班车。", "why_line": "一路跑过去才赶上末班车，说明时间「卡在极限边缘、差一点就没赶上」。", "form_line": "「ぎりぎり」表示卡着极限勉强赶上（常配間に合う）；「ぐっすり」形容睡得香甜熟睡。", "opt_notes": {"ぎりぎり": "表示逼近极限边缘、差一点就迟到但勉强赶上。", "ぐっすり": "意为「香甜熟睡（ぐっすり眠る）」，与赶电车无关。"}, "q_audio": "./audio/N3-V10_q.mp3?v=36752e73", "exp_audio": "./audio/N3-V10_exp.mp3?v=ddb63d42", "is_listening": false}, "variants": [{"id": "VAR-V10", "prompt": "このシャツは私の体にサイズが（　　）だ。", "choices": ["ぴったり", "ぎりぎり"], "answer": "ぴったり", "full_ja": "このシャツは私の体にサイズがぴったりだ。", "zh_meaning": "这件衬衫穿在我身上尺码严丝合缝刚刚好。", "why_line": "形容衣服合身、尺寸或时间「分毫不差、刚刚好贴合」。", "form_line": "「ぴったり」表示严丝合缝刚刚好；「ぎりぎり」是卡在极限边缘差一点就不够。", "opt_notes": {"ぴったり": "尺寸、答案、时间严丝合缝刚好契合。", "ぎりぎり": "指逼近极限差点出局，不用于夸衣服合身。"}, "q_audio": "./audio/VAR-V10_q.mp3?v=fbc0eac6", "exp_audio": "./audio/VAR-V10_exp.mp3?v=d0983244", "is_listening": false}]}, {"id": "N3-G19", "subject": "语法", "point": "〜がちだ", "point_key": "〜がちだ", "family": "aspect_time", "modality": "both", "exam_weight": 2.4, "roi_score": 1.392, "teach": {"left": {"ja": "風邪をひきがち", "sub": "ます干/名词 ＋ がち ＝ 动不动就（负面）"}, "right": {"ja": "〜最中だ", "sub": "正在最酣处（接 ている）"}, "example_ja": "冬は空気が乾燥して、風邪をひきがちだ。", "zh_meaning": "冬天空气干燥，动不动就容易感冒。", "audio": "./audio/N3-G19_exp.mp3?v=cb049cd0"}, "primary": {"id": "N3-G19", "prompt": "冬は空気が乾燥して、風邪を（　　）だ。", "choices": ["ひきがち", "ひく最中"], "answer": "ひきがち", "full_ja": "冬は空気が乾燥して、風邪をひきがちだ。", "zh_meaning": "冬天空气干燥，动不动就容易感冒。", "why_line": "生病、迟到、忘带东西这类不太好的消极毛病「动不动就容易发生」，用「がち」。", "form_line": "动词ます形去掉「ます」加「がち」（ひきます → ひきがち）；「最中」表示正在做某事最起劲的当口，意思不通。", "opt_notes": {"ひきがち": "表示容易感冒、动不动就感冒的负面倾向。", "ひく最中": "「〜ている最中」表示正在做某事的正当中，接续与意思均错。"}, "q_audio": "./audio/N3-G19_q.mp3?v=1bf8f0d9", "exp_audio": "./audio/N3-G19_exp.mp3?v=cb049cd0", "is_listening": false}, "variants": []}, {"id": "HQ-20261114-01", "subject": "活用", "point": "来る 可能形", "point_key": "V-030", "family": "potential_form", "modality": "memorize", "exam_weight": 2.8, "roi_score": 0.56, "teach": {"left": {"ja": "来られる（こられる）", "sub": "JLPT 卷面唯一标准形 · 来る・見る・食べる 必须带「ら」"}, "right": {"ja": "来れる（これる）", "sub": "口语偷懒「ら抜き言葉」 · 语法选择题里选它必扣分"}, "example_ja": "明日の会議に、来られますか。", "zh_meaning": "明天的会议，您能来吗？", "audio": "./audio/HQ-20261114-01_exp.mp3?v=c6830a33"}, "primary": {"id": "HQ-20261114-01", "prompt": "明日の会議に、九時までに（　　）か。", "choices": ["来られる（こられる）", "来れる（これる）"], "answer": "来られる（こられる）", "full_ja": "明日の会議に、来られますか。", "zh_meaning": "明天的会议，您能来吗？", "why_line": "询问对方「能不能来」，需要把不规则动词「来る（くる）」变成书面的标准可能形。", "form_line": "「来る」的标准可能形必须保留「ら」，写作「来られる（こられる）」；「来れる（これる）」是日常口语吞音，考试卷面判错。", "opt_notes": {"来られる（こられる）": "カ变动词「来る」唯一合乎标准语法的可能形（读音变 こ＋られる）。", "来れる（これる）": "属于口语吞音「ら抜き言葉」，日常聊天听得懂，但在JLPT语法题中严禁选。"}, "q_audio": "./audio/HQ-20261114-01_q.mp3?v=51969c29", "exp_audio": "./audio/HQ-20261114-01_exp.mp3?v=c6830a33", "is_listening": false}, "variants": []}, {"id": "V-20261114-06", "subject": "词汇", "point": "うっかり", "point_key": "うっかり", "family": "kana_adverb", "modality": "listen", "exam_weight": 2.0, "roi_score": 0.4, "teach": {"left": {"ja": "うっかり", "sub": "💭 分神失误（配 忘れる/乗り過ごす） · 聊嗨了一不留神坐过站"}, "right": {"ja": "しっかり", "sub": "🪨 牢靠踏实（配 持つ/勉強する） · 抓牢扶手 / 踏实准备考试"}, "example_ja": "おしゃべりに夢中になって、うっかり降りる駅を乗り過ごしてしまった。", "zh_meaning": "光顾着聊天太投入，一不小心坐过了站。", "audio": "./audio/V-20261114-06_exp.mp3?v=678d08dd"}, "primary": {"id": "V-20261114-06", "prompt": "おしゃべりに夢中になって、（　　）駅を乗り過ごした。", "choices": ["うっかり", "しっかり"], "answer": "うっかり", "full_ja": "おしゃべりに夢中になって、うっかり降りる駅を乗り過ごしてしまった。", "zh_meaning": "光顾着聊天太投入，一不小心坐过了站。", "why_line": "聊天聊忘了神，「一不留神、疏忽大意」犯了小错，常和句尾「てしまった」呼应。", "form_line": "「うっかり」是不小心走神；「しっかり」意思正好相反，表示牢牢抓稳、踏实可靠。", "opt_notes": {"うっかり": "专配「忘れる／乗り過ごす／口を滑らせる」等因走神引起的小失误。", "しっかり": "意为「结实地、认真稳妥地」，与「聊天入迷坐过站」完全相反。"}, "q_audio": "./audio/V-20261114-06_q.mp3?v=60eb5c55", "exp_audio": "./audio/V-20261114-06_exp.mp3?v=678d08dd", "is_listening": false}, "variants": [{"id": "VAR-V06", "prompt": "電車が揺れるので、手すりに（　　）つかまってください。", "choices": ["しっかり", "うっかり"], "answer": "しっかり", "full_ja": "電車が揺れるので、手すりにしっかりつかまってください。", "zh_meaning": "电车摇晃，请牢牢抓紧扶手。", "why_line": "电车晃动时广播提醒乘客「稳稳地、牢牢地」扶好扶手。", "form_line": "「しっかり」表示牢牢地、稳当地；「うっかり」是一不留神走神大意。", "opt_notes": {"しっかり": "表示牢牢地、稳固地抓住扶手。", "うっかり": "表示不小心犯迷糊，语义相反。"}, "q_audio": "./audio/VAR-V06_q.mp3?v=8382a4f2", "exp_audio": "./audio/VAR-V06_exp.mp3?v=601db18b", "is_listening": false}]}, {"id": "N3-G13", "subject": "语法", "point": "〜そうだ（伝聞 vs 様態）", "point_key": "そうだ（伝聞）", "family": "hearsay_infer", "modality": "both", "exam_weight": 3.0, "roi_score": 0.6, "teach": {"left": {"ja": "降るそうだ", "sub": "原形 ＋ そうだ ＝ 听说（配 によると）"}, "right": {"ja": "降りそうだ", "sub": "ます干 ＋ そうだ ＝ 眼看要（看乌云）"}, "example_ja": "天気予報によると、明日は一日中雨が降るそうだ。", "zh_meaning": "据天气预报说，明天一整天都会下雨。", "audio": "./audio/N3-G13_exp.mp3?v=f71641d2"}, "primary": {"id": "N3-G13", "prompt": "天気予報によると、明日は一日中雨が（　　）。", "choices": ["降るそうだ", "降りそうだ"], "answer": "降るそうだ", "full_ja": "天気予報によると、明日は一日中雨が降るそうだ。", "zh_meaning": "据天气预报说，明天一整天都会下雨。", "why_line": "开头写明了「天気予報によると（根据天气预报）」，是转述听来的消息，不是抬头看乌云。", "form_line": "表「听说」保持动词原形直接接「そうだ」（降るそうだ）；把「る」变成「降りそうだ」则是亲眼看见快要下了。", "opt_notes": {"降るそうだ": "动词原形＋そうだ表传闻（听说），与开头「天気予報によると」严格呼应。", "降りそうだ": "ます形词干＋そうだ表样态（眼看要下雨），不能搭配「〜によると」。"}, "q_audio": "./audio/N3-G13_q.mp3?v=72fa6c98", "exp_audio": "./audio/N3-G13_exp.mp3?v=f71641d2", "is_listening": false}, "variants": [{"id": "VAR-G13", "prompt": "空が真っ暗になってきた。今にも雨が（　　）。", "choices": ["降りそうだ", "降るそうだ"], "answer": "降りそうだ", "full_ja": "空が真っ暗になってきた。今にも雨が降りそうだ。", "zh_meaning": "天空变得一片漆黑，眼看马上就要下雨了。", "why_line": "亲眼看到天黑压压的，「今にも（眼看马上）」说明下雨的苗头就在眼前，不是听广播说的。", "form_line": "看眼前迹象表「快要、看上去很像」用ます形词干接「そうだ」（降ります → 降りそうだ）；原形「降るそうだ」是听说。", "opt_notes": {"降りそうだ": "ます形词干＋そうだ表样态（眼看要下雨），呼应「今にも」。", "降るそうだ": "原形＋そうだ是听说，不能搭配「今にも」。"}, "q_audio": "./audio/VAR-G13_q.mp3?v=a9f9ddde", "exp_audio": "./audio/VAR-G13_exp.mp3?v=f608b70c", "is_listening": false}]}, {"id": "V-20261114-02", "subject": "词汇", "point": "がらがら", "point_key": "がらがら", "family": "kana_adverb", "modality": "listen", "exam_weight": 1.9, "roi_score": 0.38, "teach": {"left": {"ja": "がらがら", "sub": "□□□□ 空荡荡没人 · 电车/电影院座位空空如也（反义：ぎっしり）"}, "right": {"ja": "ばらばら", "sub": "∴∵ 散落零乱・不一致 · 东西散落一地 / 大家意见不一"}, "example_ja": "あの映画館は人気がなくて、日曜日なのに客席はがらがらだった。", "zh_meaning": "那家电影院没人气，明明是周日，观众席却空荡荡的。", "audio": "./audio/V-20261114-02_exp.mp3?v=abf3161f"}, "primary": {"id": "V-20261114-02", "prompt": "日曜日なのに客席は（　　）だった。", "choices": ["がらがら", "ばらばら"], "answer": "がらがら", "full_ja": "あの映画館は人気がなくて、日曜日なのに客席はがらがらだった。", "zh_meaning": "那家电影院没人气，明明是周日，观众席却空荡荡的。", "why_line": "形容电影院、餐厅或电车车厢里「冷冷清清、空无一人」。", "form_line": "空间空荡没人用「がらがら」；「ばらばら」形容东西散落一地，或者大家意见零散不统一。", "opt_notes": {"がらがら": "专指车厢、餐厅、影院座位等空间「空荡荡、冷清没人」（另可指嗓子沙哑）。", "ばらばら": "指物品「散落一地」或团队意见/行动「七零八落、不统一」，不能形容座位空。"}, "q_audio": "./audio/V-20261114-02_q.mp3?v=07b54f43", "exp_audio": "./audio/V-20261114-02_exp.mp3?v=abf3161f", "is_listening": false}, "variants": []}, {"id": "N3-G14", "subject": "语法", "point": "〜ていく／〜てくる", "point_key": "〜ていく／〜てくる", "family": "change_flow", "modality": "both", "exam_weight": 3.0, "roi_score": 0.6, "teach": {"left": {"ja": "暖かくなってきた", "sub": "过去 → 现在（一直变暖到现在）"}, "right": {"ja": "寒くなっていく", "sub": "现在 → 未来（今后会越来越冷）"}, "example_ja": "４月に入ってから、だんだん暖かくなってきた。", "zh_meaning": "进入四月以来，天气渐渐暖和起来了。", "audio": "./audio/N3-G14_exp.mp3?v=64df868e"}, "primary": {"id": "N3-G14", "prompt": "４月に入ってから、だんだん暖かく（　　）。", "choices": ["なってきた", "なっていった"], "answer": "なってきた", "full_ja": "４月に入ってから、だんだん暖かくなってきた。", "zh_meaning": "进入四月以来，天气渐渐暖和起来了。", "why_line": "时间从四月初一路延续到说话的「现在」，这股变暖的趋势是朝着现在的我走过来的。", "form_line": "从过去持续到现在的变化用「てきた」（なってきた）；从现在往未来继续远去的变化才用「ていく」。", "opt_notes": {"なってきた": "表示从进入4月起一路变化至今，完美契合「４月に入ってから」。", "なっていった": "表示过去某段时期向远方推移或往未来发展，不用于「到现在变暖了」。"}, "q_audio": "./audio/N3-G14_q.mp3?v=a115d783", "exp_audio": "./audio/N3-G14_exp.mp3?v=64df868e", "is_listening": false}, "variants": [{"id": "VAR-G14", "prompt": "少子化が進んで、これから子どもの数はますます減って（　　）だろう。", "choices": ["いく", "きた"], "answer": "いく", "full_ja": "少子化が進んで、これから子どもの数はますます減っていくだろう。", "zh_meaning": "随着生小孩的人越来越少（少子化加剧），今后孩子的数量大概会继续减少下去吧。", "why_line": "句中有「これから（从今往后）」和「だろう」，变化是从现在向未来继续延伸出去。", "form_line": "从现在往未来持续发展用「ていく」（減っていく）；从过去变到现在才用「てきた」。", "opt_notes": {"いく": "表示从现在起向未来持续减少下去。", "きた": "过去式不能与「これから…だろう」未来推测连用。"}, "q_audio": "./audio/VAR-G14_q.mp3?v=71c1c5b9", "exp_audio": "./audio/VAR-G14_exp.mp3?v=70b506b1", "is_listening": false}]}, {"id": "N3-G15", "subject": "语法", "point": "〜ば〜ほど", "point_key": "〜ば〜ほど", "family": "star_syntax", "modality": "memorize", "exam_weight": 3.0, "roi_score": 0.6, "teach": {"left": {"ja": "読めば ＋ 読むほど", "sub": "假定形ば ＋ 原形ほど ＝ 越…越…"}, "right": {"ja": "読むと読むほど", "sub": "「ほど」前面绝不配「と」"}, "example_ja": "この本は読めば読むほど面白くなる。", "zh_meaning": "这本书越读越有意思。", "audio": "./audio/N3-G15_exp.mp3?v=d31e2c74"}, "primary": {"id": "N3-G15", "prompt": "この本は（　　）読むほど面白くなる。", "choices": ["読めば", "読むと"], "answer": "読めば", "full_ja": "この本は読めば読むほど面白くなる。", "zh_meaning": "这本书越读越有意思。", "why_line": "表达「越……就越……」的递进关系时，同一个动词要在前后重复出现两次。", "form_line": "前一个词变假定形「ば」（読む → 読めば），后一个词保持原形接「ほど」（読むほど），「ほど」前面不能配「と」。", "opt_notes": {"読めば": "构成「Vば＋V原形＋ほど」标准句型，意为越读越有趣。", "読むと": "不能与后半句「読むほど」构成「越…越…」呼应。"}, "q_audio": "./audio/N3-G15_q.mp3?v=6a0a2f2f", "exp_audio": "./audio/N3-G15_exp.mp3?v=d31e2c74", "is_listening": false}, "variants": []}, {"id": "G-20261114-07", "subject": "语法", "point": "★排序・〜ずにはいられない", "point_key": "〜ずにはいられない", "family": "star_syntax", "modality": "memorize", "exam_weight": 2.9, "roi_score": 0.58, "teach": {"left": {"ja": "泣かず・には・いられない", "sub": "固定铁板四连块 · 情不自禁、忍不住哭了"}, "right": {"ja": "★排序必背语序", "sub": "Vない去ない ＋ ず ＋ には ＋ いられない · 注意：する → せずにはいられな…"}, "example_ja": "その映画のラストシーンは感動的で、見ていて泣かずにはいられなかった。", "zh_meaning": "那部电影的结局太感人，看着看着忍不住哭了出来。", "audio": "./audio/G-20261114-07_exp.mp3?v=5132d586"}, "primary": {"id": "G-20261114-07", "prompt": "感動的で、見ていて（　　）。", "choices": ["泣かずにはいられなかった", "泣かないではいなかった"], "answer": "泣かずにはいられなかった", "full_ja": "その映画のラストシーンは感動的で、見ていて泣かずにはいられなかった。", "zh_meaning": "那部电影的结局太感人，看着看着忍不住哭了出来。", "why_line": "情绪自然涌上来控制不住，日语表达「情不自禁、忍不住做某事」有固定句式。", "form_line": "把否定形「泣かない」的「ない」换成古语否定「ず」，再接「にはいられない」，连成「泣かずにはいられなかった」。", "opt_notes": {"泣かずにはいられなかった": "N3核心固定句型「〜ずにはいられない」（忍不住…），排序题常拆开考「には」的位置。", "泣かないではいなかった": "生造错误搭配（正确同义形只能是「泣かないではいられなかった」，尾部必须是可能形いられない）。"}, "q_audio": "./audio/G-20261114-07_q.mp3?v=ac6fc385", "exp_audio": "./audio/G-20261114-07_exp.mp3?v=5132d586", "is_listening": false}, "variants": []}, {"id": "G-20261114-08", "subject": "语法", "point": "★排序・〜さえ〜ば", "point_key": "〜さえ〜ば", "family": "star_syntax", "modality": "memorize", "exam_weight": 2.9, "roi_score": 0.58, "teach": {"left": {"ja": "〜さえ 〜ば", "sub": "最低唯一条件呼应 · 只要有手机，就万事OK"}, "right": {"ja": "〜こそ", "sub": "单独强调主语/原因 · 今年こそ（今年一定要）/ からこそ"}, "example_ja": "スマホさえあれば、いつでもわからない言葉を調べられる。", "zh_meaning": "只要有手机，随时都能查不懂的词。", "audio": "./audio/G-20261114-08_exp.mp3?v=5c0a0bcd"}, "primary": {"id": "G-20261114-08", "prompt": "スマホ（　　）あれば、いつでも調べられる。", "choices": ["さえ", "こそ"], "answer": "さえ", "full_ja": "スマホさえあれば、いつでもわからない言葉を調べられる。", "zh_meaning": "只要有手机，随时都能查不懂的词。", "why_line": "后半句有假定形「あれば」，表达「只要满足这一个最低条件，其他都不是问题」。", "form_line": "「名词＋さえ＋あれば」是固定呼应（只要有……就）；「こそ」只表强调，不能和「ば」搭成只要条件。", "opt_notes": {"さえ": "「名词＋さえ＋ば」固定呼应骨架，表示「只要具备这一个最低条件就够了」。", "こそ": "表强调「正是…」（如「こちらこそ」「からこそ」），不能与「あれば」构成「只要…就」呼应。"}, "q_audio": "./audio/G-20261114-08_q.mp3?v=ecf89c8a", "exp_audio": "./audio/G-20261114-08_exp.mp3?v=5c0a0bcd", "is_listening": false}, "variants": [{"id": "VAR-G08", "prompt": "薬を飲み（　　）すれば、すぐ熱が下がりますよ。", "choices": ["さえ", "しか"], "answer": "さえ", "full_ja": "薬を飲みさえすれば、すぐ熱が下がりますよ。", "zh_meaning": "只要把药吃了，很快就会退烧的。", "why_line": "表达「只要完成吃药这一个动作，退烧就自然解决」。", "form_line": "动词用「ます形去掉ます（飲み）＋さえすれば」表示只要做……就；「しか」必须配否定，不能接「すれば」。", "opt_notes": {"さえ": "「Vます干＋さえすれば」固定句型，意为只要吃药就能退烧。", "しか": "必须搭配否定「〜ない」，不能配假定形「すれば」。"}, "q_audio": "./audio/VAR-G08_q.mp3?v=3849f068", "exp_audio": "./audio/VAR-G08_exp.mp3?v=4e37b032", "is_listening": false}]}, {"id": "G-20261114-11", "subject": "语法", "point": "〜らしい", "point_key": "〜らしい", "family": "hearsay_infer", "modality": "both", "exam_weight": 2.9, "roi_score": 0.58, "teach": {"left": {"ja": "あるらしい / 便利らしい", "sub": "动词原形・な形词干直接＋らしい · 听说有活动 / 听说很方便"}, "right": {"ja": "あるとらしい / 便利だらしい", "sub": "常见接续错误 · 误把「〜と聞いた」的と或だ混入句中"}, "example_ja": "ニュースによると、来週また大きなイベントがあるらしいよ。", "zh_meaning": "据新闻说，听说下周又有大型活动哦。", "audio": "./audio/G-20261114-11_exp.mp3?v=204f3b1d"}, "primary": {"id": "G-20261114-11", "prompt": "ニュースによると、来週また大きなイベントが（　　）よ。", "choices": ["あるらしい", "あるとらしい", "あるだらしい"], "answer": "あるらしい", "full_ja": "ニュースによると、来週また大きなイベントがあるらしいよ。", "zh_meaning": "据新闻说，听说下周又有大型活动哦。", "why_line": "开头有消息来源「ニュースによると（据新闻说）」，是在转述客观传闻。", "form_line": "传闻「らしい」直接接动词简体原形「ある」，连成「あるらしい」；中间绝不能加引用的「と」或「だ」。", "opt_notes": {"あるらしい": "动词简体原形直接接「らしい」表客观传闻（听说有活动）。", "あるとらしい": "混入了引用助词「と」，传闻「らしい」前面不能加「と」。", "あるだらしい": "动词后不能加「だ」，且名词或な形容词接「らしい」也须去掉「だ」。"}, "q_audio": "./audio/G-20261114-11_q.mp3?v=4cd53ff3", "exp_audio": "./audio/G-20261114-11_exp.mp3?v=204f3b1d", "is_listening": false}, "variants": [{"id": "VAR-G11", "prompt": "うわさによると、あの二人は来月結婚する（　　）。", "choices": ["らしい", "とらしい"], "answer": "らしい", "full_ja": "うわさによると、あの二人は来月結婚するらしい。", "zh_meaning": "据传言说，那两个人好像下个月要结婚了。", "why_line": "开头有「うわさによると（据传闻）」，属于转述别人传来的消息。", "form_line": "动词简体「結婚する」直接接「らしい」，中间不能多加引用的「と」。", "opt_notes": {"らしい": "动词简体形直接＋らしい表传闻。", "とらしい": "语法错误，「らしい」前不可加「と」。"}, "q_audio": "./audio/VAR-G11_q.mp3?v=21f94caa", "exp_audio": "./audio/VAR-G11_exp.mp3?v=b070fe95", "is_listening": false}]}, {"id": "G-20261114-12", "subject": "语法", "point": "〜ことになる", "point_key": "〜ことになる", "family": "rule_decide", "modality": "both", "exam_weight": 2.9, "roi_score": 0.58, "teach": {"left": {"ja": "行く＋こと＋になった", "sub": "动词原形＋形式名词こと＋になる · 定下来要去东京出差了"}, "right": {"ja": "行きますになった", "sub": "常见接续口误 · 动词ます形不能直接接〜になった"}, "example_ja": "急な仕事が入って、来月から東京へ出張に行くことになった。", "zh_meaning": "突然来了紧急工作，定下来下个月去东京出差。", "audio": "./audio/G-20261114-12_exp.mp3?v=54d6c922"}, "primary": {"id": "G-20261114-12", "prompt": "急な仕事が入って、来月から東京へ出張に（　　）。", "choices": ["行くことになった", "行きますになった", "行くものになった"], "answer": "行くことになった", "full_ja": "急な仕事が入って、来月から東京へ出張に行くことになった。", "zh_meaning": "突然来了紧急工作，定下来下个月去东京出差。", "why_line": "不是自己随心起意，而是公司或工作安排定下来的结果，日语用「ことになった」。", "form_line": "动词原形「行く」不能直接接「になった」，中间必须先加「こと」把动作名词化，说成「行くことになった」。", "opt_notes": {"行くことになった": "动词原形加「ことになった」，表示外部或公司安排定下来要去出差。", "行きますになった": "错用了礼貌形「ます」且漏掉了中间名词化的「こと」。", "行くものになった": "日语不存在「〜ものになった」这种表安排决定的句型。"}, "q_audio": "./audio/G-20261114-12_q.mp3?v=702d5066", "exp_audio": "./audio/G-20261114-12_exp.mp3?v=54d6c922", "is_listening": false}, "variants": [{"id": "VAR-G12", "prompt": "会議で話し合った結果、来週のイベントは中止する（　　）。", "choices": ["ことになった", "になった"], "answer": "ことになった", "full_ja": "会議で話し合った結果、来週のイベントは中止することになった。", "zh_meaning": "经过开会商讨，决定取消下周的活动。", "why_line": "经过会议集体商量后拍板定下来的组织决定，用「ことになった」。", "form_line": "动词「中止する」后面必须先加形式名词「こと」再接「になった」，不能直接说「中止するになった」。", "opt_notes": {"ことになった": "动词原形＋ことになった，标准表达会议决定结果。", "になった": "动词原形后不能直接接「になった」。"}, "q_audio": "./audio/VAR-G12_q.mp3?v=f328fcd1", "exp_audio": "./audio/VAR-G12_exp.mp3?v=517646b3", "is_listening": false}]}, {"id": "G-20261114-09", "subject": "语法", "point": "〜わけだ", "point_key": "〜わけだ", "family": "hearsay_infer", "modality": "both", "exam_weight": 2.8, "roi_score": 0.56, "teach": {"left": {"ja": "ダメ【な】＋わけだ", "sub": "な形容词＋な＋形式名词わけ · 难怪减肥不行 / 自然是不行的"}, "right": {"ja": "ダメわけだ", "sub": "常见口误（漏掉な） · 名词前不能把な形容词词干直接裸贴上去"}, "example_ja": "毎日夜遅くまで甘い物を食べていたら、ダイエットにはダメなわけだよ。", "zh_meaning": "要是每天吃甜食吃到大半夜，对减肥当然是不行的啦。", "audio": "./audio/G-20261114-09_exp.mp3?v=08565de6"}, "primary": {"id": "G-20261114-09", "prompt": "毎日夜遅くまで甘い物を食べていたら、ダイエットには（　　）よ。", "choices": ["ダメなわけだ", "ダメわけだ", "ダメだわけだ"], "answer": "ダメなわけだ", "full_ja": "毎日夜遅くまで甘い物を食べていたら、ダイエットにはダメなわけだよ。", "zh_meaning": "要是每天吃甜食吃到大半夜，对减肥当然是不行的啦。", "why_line": "顺着前面的原因推出顺理成章的结论（「难怪不行、当然没戏」），用「わけだ」。", "form_line": "「わけ」本质是名词，な形容词「ダメ」修饰名词时中间必须保留「な」，变成「ダメなわけだ」，不能漏掉「な」。", "opt_notes": {"ダメなわけだ": "「わけ」本质是名词，な形容词「ダメ」修饰它时必须保留「な」。", "ダメわけだ": "漏掉了连体修饰的「な」，な形容词词干不能直接贴名词。", "ダメだわけだ": "终止形「だ」不能直接修饰名词「わけ」，必须变为「な」。"}, "q_audio": "./audio/G-20261114-09_q.mp3?v=1c1812e7", "exp_audio": "./audio/G-20261114-09_exp.mp3?v=08565de6", "is_listening": false}, "variants": [{"id": "VAR-G09", "prompt": "彼は日本に１０年も住んでいたから、日本の事情に詳しい（　　）。", "choices": ["わけだ", "わけがない"], "answer": "わけだ", "full_ja": "彼は日本に１０年も住んでいたから、日本の事情に詳しいわけだ。", "zh_meaning": "他在日本住了足足十年，难怪这么熟悉日本的情况。", "why_line": "前面给出原因「住了整整十年」，自然推出合情合理的结果「难怪这么懂」。", "form_line": "い形容词「詳しい」直接接「わけだ」表示怪不得、理所当然；「わけがない」是绝不可能懂，意思反了。", "opt_notes": {"わけだ": "表示合乎情理的结论，「难怪这么熟悉」。", "わけがない": "意为「绝不可能熟悉」，与住了10年完全矛盾。"}, "q_audio": "./audio/VAR-G09_q.mp3?v=066e1020", "exp_audio": "./audio/VAR-G09_exp.mp3?v=1aa86384", "is_listening": false}]}, {"id": "G-20261114-02", "subject": "语法", "point": "〜ところだ", "point_key": "〜ところだ", "family": "aspect_time", "modality": "both", "exam_weight": 2.6, "roi_score": 0.52, "teach": {"left": {"ja": "食べたところ", "sub": "た形 ＋ ところ · 刚刚才做完（配 たった今）"}, "right": {"ja": "食べるところ", "sub": "原形 ＋ ところ · 正要开始做（配 これから）"}, "example_ja": "「昼ごはん、もう食べた？」「うん、たった今、食べたところだよ。」", "zh_meaning": "「午饭吃了吗？」「嗯，刚刚才吃完。」", "audio": "./audio/G-20261114-02_exp.mp3?v=f40416eb"}, "primary": {"id": "G-20261114-02", "prompt": "うん、たった今、食べた（　　）だよ。", "choices": ["ところ", "ばかりか"], "answer": "ところ", "full_ja": "「昼ごはん、もう食べた？」「うん、たった今、食べたところだよ。」", "zh_meaning": "「午饭吃了吗？」「嗯，刚刚才吃完。」", "why_line": "前面有「たった今（就在刚才）」，说明筷子刚放下没几秒钟。", "form_line": "动词过去式「食べた」加「ところだ」表示刚刚做完；「ばかりか」是「不仅如此反而」的意思，用在这里完全不通。", "opt_notes": {"ところ": "「たった今＋Vたところだ」黄金呼应，精准表达动作刚刚结束那一刻。", "ばかりか": "意为「不仅…甚至连…也」（递进句型），不能表示刚刚做完某事。"}, "q_audio": "./audio/G-20261114-02_q.mp3?v=478ed93d", "exp_audio": "./audio/G-20261114-02_exp.mp3?v=f40416eb", "is_listening": false}, "variants": [{"id": "VAR-G02", "prompt": "「もう出発した？」「ううん、今から家を出る（　　）だよ。」", "choices": ["ところ", "ばかり"], "answer": "ところ", "full_ja": "「もう出発した？」「ううん、今から家を出るところだよ。」", "zh_meaning": "「已经出发了吗？」「还没呢，现在正要出门。」", "why_line": "前面说了「ううん、今から（还没，现在开始）」，说明脚刚迈出去、马上要出门。", "form_line": "动词原形「出る」接「ところだ」表示正要做某事；过去式「出たところ」才是刚刚出了门。", "opt_notes": {"ところ": "「今から＋V原形＋ところだ」表示正准备出门。", "ばかり": "「Vたばかり」才表刚做完；「出るばかり」不表示正要出门。"}, "q_audio": "./audio/VAR-G02_q.mp3?v=e356ac21", "exp_audio": "./audio/VAR-G02_exp.mp3?v=a69000dd", "is_listening": false}]}, {"id": "GQ-20261114-01", "subject": "语法", "point": "〜っぱなし", "point_key": "〜っぱなし", "family": "aspect_time", "modality": "listen", "exam_weight": 2.5, "roi_score": 0.5, "teach": {"left": {"ja": "つけっぱなし", "sub": "Vます去ます ＋ っぱなし · 开着不管（电视没关就睡了）"}, "right": {"ja": "つけたばかり", "sub": "Vた ＋ ばかり / ところ · 刚刚才打开"}, "example_ja": "テレビをつけっぱなしで寝た。", "zh_meaning": "电视一直开着没关就睡着了。", "audio": "./audio/GQ-20261114-01_exp.mp3?v=1145759e"}, "primary": {"id": "GQ-20261114-01", "prompt": "テレビをつけっぱなしで寝た。", "choices": ["一直开着没关", "刚刚才打开"], "answer": "一直开着没关", "full_ja": "テレビをつけっぱなしで寝た。", "zh_meaning": "电视一直开着没关就睡着了。", "why_line": "「っぱなし」专门描绘做完打开、摊开等动作后，就一直晾在那里没去收拾。", "form_line": "动词ます形「つけます」去掉「ます」接「っぱなし」就是一直开着；「刚刚才打开」日语要说「つけたばかり」。", "opt_notes": {"一直开着没关": "「つける（打开）＋っぱなし」表示打开后一直维持原样没去关掉，带一点不该放任的语气。", "刚刚才打开": "「刚刚打开」日语应说「つけたばかり」或「つけたところ」，不是「っぱなし」。"}, "q_audio": "./audio/GQ-20261114-01_q.mp3?v=e1e02317", "exp_audio": "./audio/GQ-20261114-01_exp.mp3?v=1145759e", "is_listening": false}, "variants": []}, {"id": "G-20261114-03", "subject": "语法", "point": "〜からこそ", "point_key": "〜からこそ", "family": "reason_contrast", "modality": "both", "exam_weight": 2.4, "roi_score": 0.48, "teach": {"left": {"ja": "〜からこそ", "sub": "正向唯一核心原因 · 正因为苦练 → 才夺冠（〜のだ）"}, "right": {"ja": "〜くせに", "sub": "逆接＋责备不满 · 明明知道 → 却故意不说"}, "example_ja": "毎日こつこつ練習したからこそ、今日の試合で優勝できたのだ。", "zh_meaning": "正因为每天踏踏实实练习，今天比赛才拿到了冠军。", "audio": "./audio/G-20261114-03_exp.mp3?v=e6ea8a5e"}, "primary": {"id": "G-20261114-03", "prompt": "毎日こつこつ練習した（　　）、優勝できたのだ。", "choices": ["からこそ", "くせに"], "answer": "からこそ", "full_ja": "毎日こつこつ練習したからこそ、今日の試合で優勝できたのだ。", "zh_meaning": "正因为每天踏踏实实练习，今天比赛才拿到了冠军。", "why_line": "前后是积极的因果关系，想突出「正是靠着前面的努力，才换来后面的好结果」。", "form_line": "「から」表原因，「こそ」表强调，合起来「からこそ」就是正因为；「くせに」带责备语气（明明却），不能用来夸奖。", "opt_notes": {"からこそ": "「正因为每天踏实练习才夺冠」，与句尾强调原因的「〜のだ」严丝合缝。", "くせに": "意为「明明…却…」，带强烈批评与不满口气，绝不用于正面因果。"}, "q_audio": "./audio/G-20261114-03_q.mp3?v=f6fc490b", "exp_audio": "./audio/G-20261114-03_exp.mp3?v=e6ea8a5e", "is_listening": false}, "variants": []}, {"id": "N3-G21", "subject": "语法", "point": "〜ことはない", "point_key": "〜ことはない", "family": "modal_end", "modality": "listen", "exam_weight": 2.4, "roi_score": 0.48, "teach": {"left": {"ja": "心配することはない", "sub": "原形 ＋ ことはない ＝ 没必要、用不着"}, "right": {"ja": "〜はずがない", "sub": "按理绝对不可能（100%否定推断）"}, "example_ja": "軽い風邪だから、そんなに心配することはないよ。", "zh_meaning": "只是轻微感冒，用不着那么担心哦。", "audio": "./audio/N3-G21_exp.mp3?v=6b0de7f6"}, "primary": {"id": "N3-G21", "prompt": "軽い風邪だから、そんなに心配する（　　）よ。", "choices": ["ことはない", "はずがない"], "answer": "ことはない", "full_ja": "軽い風邪だから、そんなに心配することはないよ。", "zh_meaning": "只是轻微感冒，用不着那么担心哦。", "why_line": "说话人是在温言宽慰对方「没必要那么紧张」，而不是推断「对方绝不可能担心」。", "form_line": "动词原形接「ことはない」意思是没必要、用不着；「はずがない」则是按理绝对不可能发生。", "opt_notes": {"ことはない": "意为「没必要、用不着担心」，口语宽慰高频句型。", "はずがない": "意为「按道理绝不可能担心」，不符合宽慰语境。"}, "q_audio": "./audio/N3-G21_q.mp3?v=160cd4f6", "exp_audio": "./audio/N3-G21_exp.mp3?v=6b0de7f6", "is_listening": false}, "variants": []}, {"id": "G-20261114-04", "subject": "语法", "point": "〜ものだ", "point_key": "〜ものだ", "family": "modal_end", "modality": "listen", "exam_weight": 2.3, "roi_score": 0.46, "teach": {"left": {"ja": "泣くものだ", "sub": "自然天性・世间常理 · 小宝宝本来就是会哭的"}, "right": {"ja": "早く寝ることだ", "sub": "对别人的忠告建议 · 你最好早点睡觉"}, "example_ja": "赤ん坊は泣くものだから、そんなに心配しなくてもいいよ。", "zh_meaning": "小宝宝本来就是爱哭的，不用那么担心。", "audio": "./audio/G-20261114-04_exp.mp3?v=b3b62b2c"}, "primary": {"id": "G-20261114-04", "prompt": "赤ん坊は泣く（　　）だから、心配しなくてもいいよ。", "choices": ["もの", "こと"], "answer": "もの", "full_ja": "赤ん坊は泣くものだから、そんなに心配しなくてもいいよ。", "zh_meaning": "小宝宝本来就是爱哭的，不用那么担心。", "why_line": "说话人在宽慰对方：婴儿爱哭是自然天性和世间常理，不是什么异常情况。", "form_line": "动词原形接「ものだ」表示天性与常理（泣くものだ）；接「ことだ」则是忠告别人「你最好去做某事」。", "opt_notes": {"もの": "「赤ん坊は泣くものだ」指婴儿爱哭乃自然天性，用来宽慰对方不必担心。", "こと": "「V原形＋ことだ」意为「最好/应该去做…」（忠告句尾），不能接「だから」表天性。"}, "q_audio": "./audio/G-20261114-04_q.mp3?v=54707f33", "exp_audio": "./audio/G-20261114-04_exp.mp3?v=b3b62b2c", "is_listening": false}, "variants": []}], "words": {"私用": {"head": "私用", "kana": "しよう", "pos": "名词", "zh": "私事，私人事情", "audio": "./audio/words/w_56d2983920.mp3"}, "風邪": {"head": "風邪", "kana": "かぜ", "pos": "名词", "zh": "感冒", "audio": "./audio/words/w_334bdc29ca.mp3"}, "会議室": {"head": "会議室", "kana": "かいぎしつ", "pos": "名词", "zh": "会议室", "audio": "./audio/words/w_9ee159da4c.mp3"}, "子ども": {"head": "子ども", "kana": "こども", "pos": "名词", "zh": "孩子，小朋友", "audio": "./audio/words/w_1e0fb7bad2.mp3"}, "海外出張中": {"head": "海外出張中", "kana": "かいがいしゅっちょうちゅう", "pos": "名词", "zh": "正在国外出差期间", "audio": "./audio/words/w_711ff98204.mp3"}, "海外出張": {"head": "海外出張", "kana": "かいがいしゅっちょう", "pos": "名词", "zh": "海外出差，去国外出差", "audio": "./audio/words/w_e914c61552.mp3"}, "ダイエット中": {"head": "ダイエット中", "kana": "だいえっとちゅう", "pos": "名词", "zh": "正在减肥期间", "audio": "./audio/words/w_08a1125fff.mp3"}, "旅行先": {"head": "旅行先", "kana": "りょこうさき", "pos": "名词", "zh": "旅行目的地，旅途中去的地方", "audio": "./audio/words/w_6620551374.mp3"}, "三日間": {"head": "三日間", "kana": "みっかかん", "pos": "数量词", "zh": "三天时间", "audio": "./audio/words/w_645b27d4d6.mp3"}, "一日中": {"head": "一日中", "kana": "いちにちじゅう", "pos": "副詞・名詞", "zh": "一整天", "pitch": "④", "tip": "注意浊音 じゅう", "audio": "./audio/words/w_8559b0949a.mp3"}, "今週中": {"head": "今週中", "kana": "こんしゅうちゅう", "pos": "名词", "zh": "本周之内", "audio": "./audio/words/w_46f911fd83.mp3"}, "夜中": {"head": "夜中", "kana": "よなか", "pos": "名词", "zh": "半夜，深夜", "audio": "./audio/words/w_02f220055d.mp3"}, "野菜嫌い": {"head": "野菜嫌い", "kana": "やさいぎらい", "pos": "な形容词・名词", "zh": "讨厌吃蔬菜", "audio": "./audio/words/w_e5194a3f27.mp3"}, "しておけば": {"head": "〜ておく", "kana": "しておけば", "pos": "补助动词假定形", "zh": "只要提前做好（准备）", "audio": "./audio/words/w_f7609977ac.mp3"}, "しといてくれる": {"head": "〜ておく＋くれる", "kana": "しといてくれる", "pos": "口语缩约请求", "zh": "能帮我提前做好吗（＝しておいてくれる）", "audio": "./audio/words/w_dc960726b6 function mergeFlashProgTuple(st, fp) {
  if (!Array.isArray(fp) || fp.length < 3) return false;
  const cur = Array.isArray(st.flashProg) ? st.flashProg : [0, 0, 0, 0];
  const sSeen = Math.max(0, Math.floor(fp[0] || 0));
  const sTgt = Math.max(0, Math.floor(fp[1] || 0));
  const sDone = Math.max(0, Math.floor(fp[2] || 0));
  const sUpd = Math.max(0, Math.floor(fp[3] || 0));
  const nSeen = Math.max(Math.floor(cur[0] || 0), sSeen);
  const nDone = Math.max(Math.floor(cur[2] || 0), sDone);
  const nUpd = Math.max(Math.floor(cur[3] || 0), sUpd);
  let nTgt = (sUpd >= Math.floor(cur[3] || 0) && sTgt > 0) ? sTgt : (Math.floor(cur[1] || 0) || sTgt);
  nTgt = Math.max(nSeen, nTgt);
  const next = [nSeen, nTgt, nDone, nUpd];
  if (String(next) === String(cur)) return false;
  st.flashProg = next;
  return true;
}

function recomputeStatusesFromCRDT(st) {
  const rAt = Math.floor(st.resetAt || 0);
  DATA.points.forEach(p => {
    const ps = st.pts[p.id];
    if (!ps) return;
    ps.greenAt = Math.floor(ps.greenAt || 0);
    ps.retestAt = Math.floor(ps.retestAt || 0);
    ps.wrongCount = Math.floor(ps.wrongCount || 0);
    ps.variantIdx = Math.floor(ps.variantIdx || 0);
    if (ps.greenAt > rAt && ps.greenAt >= ps.retestAt) {
      ps.status = "green";
    } else if (ps.retestAt > rAt || ps.wrongCount > 0 || ps.audioPrimed) {
      ps.status = "learning";
      if (ps.wrongCount > 0 && p.variants && p.variants.length > 0) {
        ps.useVariant = true;
      }
    } else {
      ps.status = "unseen";
    }
  });
}

    if (typeof sd.radioMaxSec === "number" && sd.radioMaxSec > base.radioMaxSec) base.radioMaxSec = Math.floor(sd.radioMaxSec);
    if (Array.isArray(sd.radioPos) && sd.radioPos.length === 2 && (sd.radioPos[1] || 0) > (base.radioPos[1] || 0)) {

    }
    const gMap = sd.greenAt || {};
    Object.keys(gMap).forEach(rawId => {
      const pid = CARD_TO_POINT_ID[rawId] || rawId;
      if (base.pts[pid]) base.pts[pid].greenAt = Math.max(base.pts[pid].greenAt, Math.floor(gMap[rawId] || 0));
    });
    const tMap = sd.retestAt || {};
    Object.keys(tMap).forEach(rawId => {

      if (base.pts[pid]) base.pts[pid].retestAt = Math.max(base.pts[pid].retestAt, Math.floor(tMap[rawId] || 0));
    });

    Object.keys(wMap).forEach(rawId => {

    if (Array.isArray(sd.flashProg)) mergeFlashProgTuple(base, sd.flashProg);
    if (Array.isArray(sd.tappedWords)) {
      sd.tappedWords.forEach(w => {

        if (ws && !base.tappedWords.includes(ws)) base.tappedWords.push(ws);
      });
    }
    const sov = cs.seeded_overrides || {};
    Object.keys(sov).forEach(mk => {
      const v = sov[mk];
      if (Array.isArray(v) && v.length === 2) {
        base.masteryOverrides[mk] = String(v[0]);
        base.masteryOverrideTs[mk] = Math.floor(v[1] || 1);

    candidateKeys.forEach(k => {

        if (typeof saved.resetAt === "number" && saved.resetAt > base.resetAt) base.resetAt = Math.floor(saved.resetAt);
        if (typeof saved.ct === "number") {

          Object.keys(saved.pts).forEach(rawId => {

  if (ct === (st.ct || 0) && String(c.slice(0, 4)) <= String(mine)) return false;

      setMasteryTier(p.point, "done", gts);
    } else if (ps && (ps.retestAt || 0) > (A.resetAt || 0) && (ps.retestAt || 0) > (ps.greenAt || 0)) {

// Legacy URL #sync fallback kept compatible alongside automatic real-time cloud sync
function encodeSyncCode() {
  const bytes = new Uint8Array(8);

    if (idx < 56 && A.pts[p.id] && A.pts[p.id].status === "green") {

function applySyncCodeFromUrl() {

    g: pkt.z ? {} : sortedMap(pkt.g || {}),
    t: pkt.z ? {} : sortedMap(pkt.t || {}),
    w: pkt.z ? {} : sortedMap(pkt.w || {})
  });
}

function mergeIncomingRecords(compactList) {
  if (!Array.isArray(compactList) || !compactList.length) return;
  const seen = new Set((A.recentRecords || []).map(r => `${String(r.ts || "").slice(0, 19)}|${r.id}|${r.choice}`));
  compactList.forEach(item => {
    if (!Array.isArray(item) || item.length < 4) return;
    const rec = {
      id: String(item[0] || ""),
      point: String(item[1] || ""),
      choice: String(item[2] || ""),
      correct: item[3] ? "true" : "false",
      ask_again: "false",
      ts: String(item[4] || "")
    };
    const key = `${rec.ts.slice(0, 19)}|${rec.id}|${rec.choice}`;
    if (rec.id && !seen.has(key)) {
      seen.add(key);
      A.recentRecords.push(rec);
    }
  });
  A.recentRecords.sort((a, b) => String(a.ts || "").localeCompare(String(b.ts || "")));
  if (A.recentRecords.length > 25) A.recentRecords = A.recentRecords.slice(-25);
}

function applyIncomingPacket(pkt) {
  if (!pkt || pkt.a !== "n3z") return false;
  let changed = false;
  syncApplyingRemote = true;
  try {
    if (pkt.o && typeof pkt.o === "object") {
      Object.keys(pkt.o).forEach(mk => {
        const v = pkt.o[mk];
        if (Array.isArray(v) && v.length === 2) {
          const tier = String(v[0]);
          const ts = Math.floor(v[1] || 1);
          const curTs = A.masteryOverrideTs[mk] || 0;
          if (ts > curTs || (ts === curTs && String(A.masteryOverrides[mk] || "") < tier)) {
            A.masteryOverrides[mk] = tier;
            A.masteryOverrideTs[mk] = ts;
            changed = true;
          }
        }
      });
    }

    if (pkt.d !== DATA.plan_date) {
      if (changed) {
        applyMasteryOverrides();
        saveAdaptiveState();
      }
      return changed;
    }

    const rIn = Math.floor(pkt.r || 0);
    if (rIn > (A.resetAt || 0)) {
      A.resetAt = rIn;
      changed = true;
    }

    const mIn = Math.floor(pkt.m || 0);
    if (mIn > (A.radioMaxSec || 0)) {
      A.radioMaxSec = mIn;
      changed = true;
    }

    if (Array.isArray(pkt.fp) && mergeFlashProgTuple(A, pkt.fp)) {
      changed = true;
    }

    if (Array.isArray(pkt.rp) && pkt.rp.length === 2) {
      const rpSec = Math.floor(pkt.rp[0] || 0);
      const rpTs = Math.floor(pkt.rp[1] || 0);
      const myTs = (A.radioPos && A.radioPos[1]) || 0;
      if (rpTs > myTs || (rpTs === myTs && rpSec > ((A.radioPos && A.radioPos[0]) || 0))) {
        A.radioPos = [rpSec, rpTs];
        try { localStorage.setItem(RADIO_POS_KEY, String(rpSec)); } catch (e) {}
        if (radioInitialized && radioPlayer.paused && Math.abs((radioPlayer.currentTime || 0) - rpSec) > 1) {
          lastSavedSec = rpSec;
          radioPlayer.currentTime = rpSec;
          updateRadioLiveDisplay(rpSec);
        }
        changed = true;
      }
    }

    let ptsChanged = false;
    if (typeof pkt.z === "string") {
      decodePointStates(pkt.z).forEach(e => {
        const pid = CARD_TO_POINT_ID[e.id] || e.id;
        const ps = A.pts[pid];
        if (!ps) return;
        if (e.g > (ps.greenAt || 0)) { ps.greenAt = e.g; ptsChanged = true; }
        if (e.r > (ps.retestAt || 0)) { ps.retestAt = e.r; ptsChanged = true; }
        if (applySchedTuple(ps, e.s, A.resetAt)) ptsChanged = true;
      });
    } else {
      // older page versions (before v13)
      const gIn = pkt.g || {};
      Object.keys(gIn).forEach(rawId => {
        const pid = CARD_TO_POINT_ID[rawId] || rawId;
        const ts = Math.floor(gIn[rawId] || 0);
        if (A.pts[pid] && ts > (A.pts[pid].greenAt || 0)) { A.pts[pid].greenAt = ts; ptsChanged = true; }
      });
      const tIn = pkt.t || {};
      Object.keys(tIn).forEach(rawId => {
        const pid = CARD_TO_POINT_ID[rawId] || rawId;
        const ts = Math.floor(tIn[rawId] || 0);
        if (A.pts[pid] && ts > (A.pts[pid].retestAt || 0)) { A.pts[pid].retestAt = ts; ptsChanged = true; }
      });
    }
    if (ptsChanged) changed = true;

    let curChanged = false;
    if (Array.isArray(pkt.c) && applyCursorTuple(A, pkt.c)) {
      curChanged = true;
      changed = true;
    }

    if (Array.isArray(pkt.sp) && applySpeedTuple(A, pkt.sp)) {
      if (SPEEDS.includes(A.es)) expSpeed = A.es;
      if (RADIO_SPEEDS.includes(A.rs)) radioSpeed = A.rs;
      try {
        localStorage.setItem("n3_exp_speed", String(expSpeed));
        localStorage.setItem("n3_radio_speed", String(radioSpeed));
      } catch (e) {}
      radioPlayer.defaultPlaybackRate = radioSpeed;
      radioPlayer.playbackRate = radioSpeed;
      if (activeKind === "exp" || activeKind === "teach") applyPlaybackRate(activeKind);
      const sb = document.getElementById("ans-spd-btn");
      if (sb) sb.textContent = `${expSpeed}x`;
      const rb = document.getElementById("radio-spd-btn");
      if (rb) rb.textContent = `${radioSpeed}x`;
      changed = true;
    }

    if (Array.isArray(pkt.tw)) {
      if (!Array.isArray(A.tappedWords)) A.tappedWords = [];
      pkt.tw.forEach(w => {
        const ws = String(w || "").trim();
        if (ws && !A.tappedWords.includes(ws)) {
          A.tappedWords.push(ws);
          changed = true;
        }
      });
      if (A.tappedWords.length > 80) A.tappedWords = A.tappedWords.slice(-80);
    }

    mergeIncomingRecords(pkt.l);

    if (changed) {
      recomputeStatusesFromCRDT(A);
      applyMasteryOverrides();
      let shownChanged = false;
      if (viewStage === "quiz" || viewStage === "done") {
        const prevId = curPointId;
        const prevQ = activeQuizObj ? activeQuizObj.id : "";
        const prevC = currentChoices.join("|");
        const prevStage = viewStage;
        const want = (A.cur && A.pts[A.cur] && A.pts[A.cur].status !== "green") ? A.cur : "";
        const curOk = curPointId && A.pts[curPointId] && A.pts[curPointId].status !== "green";
        if (curChanged && want) setupCurrentTurn(want);
        else if (!curOk) setupCurrentTurn();
        else setupCurrentTurn(curPointId);
        shownChanged = curPointId !== prevId || viewStage !== prevStage ||
          (activeQuizObj ? activeQuizObj.id : "") !== prevQ || currentChoices.join("|") !== prevC;
        if (shownChanged) {
          stageEnteredAt = performance.now();
          if (activeKind === "q" || activeKind === "done") stopQuizAudio();
        }
      }
      saveAdaptiveState();
      renderGreenBoard();
      if (activeMode === "tutor") {
        if (shownChanged || viewStage !== "result") renderTutor();
      } else if (activeMode === "dash") renderDashboard();
    }
    return changed;
  } finally {
    syncApplyingRemote = false;
  }
}

function pushCloudSync(useKeepalive) {
  if (!NTFY_TOPIC) return Promise.resolve(false);
  const pkt = buildCompactPacket();
  const fp = packetFingerprint(pkt);
  const hasOutbox = pkt._sentKeys.length > 0;
  if (!useKeepalive && !hasOutbox && fp === lastSyncedFp) return Promise.resolve(false);

  if (cloudInFlight && !useKeepalive) {
    cloudPendingPush = true;
    return Promise.resolve(false);
  }

  cloudInFlight = true;
  return fetch(`https://ntfy.sh/${NTFY_TOPIC}`, {
    method: "POST",
    body: JSON.stringify(pkt),
    keepalive: !!useKeepalive
  }).then(resp => {
    cloudInFlight = false;
    if (resp && resp.ok) {
      lastSyncedFp = fp;
      cloudLastSyncTs = Date.now();
      if (cloudSyncState !== "live") cloudSyncState = "synced";
      updateSyncModalBadge();
      if (hasOutbox) {
        const done = new Set(pkt._sentKeys);
        const rest = loadOutbox().filter(it => !done.has(recKey(it)));
        saveOutbox(rest);
        if (rest.length) cloudPendingPush = true;
      }
    } else if (hasOutbox) {
      setTimeout(() => scheduleCloudPush(0), 20000);
    }
    if (cloudPendingPush) {
      cloudPendingPush = false;
      scheduleCloudPush(250);
    }
    return !!(resp && resp.ok);
  }).catch(() => {
    cloudInFlight = false;
    if (cloudSyncState !== "live") cloudSyncState = "offline";
    updateSyncModalBadge();
    // not delivered: keep everything queued and try again shortly
    setTimeout(() => scheduleCloudPush(0), 15000);
    return false;
  });
}

function scheduleCloudPush(delayMs) {
  if (!NTFY_TOPIC) return;
  if (cloudPushTimer) clearTimeout(cloudPushTimer);
  cloudPushTimer = setTimeout(() => {
    cloudPushTimer = null;
    pushCloudSync(false);
  }, typeof delayMs === "number" ? delayMs : 120);
}

function pullCloudSync(pushIfLocalAhead) {
  if (!NTFY_TOPIC) return Promise.resolve(false);
  return fetch(`https://ntfy.sh/${NTFY_TOPIC}/json?poll=1&since=all`, {
    cache: "no-store"
  }).then(resp => resp.ok ? resp.text() : "").then(raw => {
    let latestRemoteFp = "";
    if (raw) {
      raw.split("\n").forEach(line => {
        const s = line.trim();
        if (!s) return;
        try {
          const env = JSON.parse(s);
          if (env && env.event === "message" && typeof env.message === "string") {
            const pkt = JSON.parse(env.message);
            if (pkt && pkt.a === "n3z") {
              if (pkt.d === DATA.plan_date) latestRemoteFp = packetFingerprint(pkt);
              applyIncomingPacket(pkt);
            }
          }
        } catch (e) {}
      });
    }
    cloudLastSyncTs = Date.now();
    if (cloudSyncState !== "live") cloudSyncState = "synced";
    updateSyncModalBadge();

    const myFp = packetFingerprint(buildCompactPacket());
    if (latestRemoteFp && myFp === latestRemoteFp && !loadOutbox().length) {
      lastSyncedFp = myFp;
      return true;
    }
    if (pushIfLocalAhead && myFp !== latestRemoteFp) {
      // Automatically upload any local-only historical progress (e.g. from Phone or Desktop) so every device converges!
      return pushCloudSync(false);
    }
    return true;
  }).catch(() => {
    if (cloudSyncState !== "live") cloudSyncState = "offline";
    updateSyncModalBadge();
    return false;
  });
}

function connectCloudSSE() {
  if (!NTFY_TOPIC || typeof EventSource === "undefined") return;
  if (cloudSSE && cloudSSE.readyState !== 2) return;
  try {
    if (cloudSSE) cloudSSE.close();
  } catch (e) {}

  try {
    cloudSSE = new EventSource(`https://ntfy.sh/${NTFY_TOPIC}/sse`);
    cloudSSE.onopen = () => {
      cloudSyncState = "live";
      updateSyncModalBadge();
    };
    cloudSSE.onmessage = ev => {
      if (!ev || !ev.data) return;
      try {
        const env = JSON.parse(ev.data);
        const msgStr = (env && env.event === "message" && typeof env.message === "string") ? env.message : ev.data;
        const pkt = JSON.parse(msgStr);
        if (pkt && pkt.a === "n3z") {
          const inFp = packetFingerprint(pkt);
          applyIncomingPacket(pkt);
          const myFp = packetFingerprint(buildCompactPacket());
          if (myFp === inFp) lastSyncedFp = myFp;
          cloudLastSyncTs = Date.now();
          cloudSyncState = "live";
          updateSyncModalBadge();
        }
      } catch (e) {}
    };
    cloudSSE.onerror = () => {
      try { cloudSSE.close(); } catch (e) {}
      cloudSSE = null;
      if (cloudSyncState === "live") cloudSyncState = "synced";
      updateSyncModalBadge();
      if (cloudSSERetryTimer) clearTimeout(cloudSSERetryTimer);
      cloudSSERetryTimer = setTimeout(() => {
        if (document.visibilityState === "visible") connectCloudSSE();
      }, 6000);
    };
  } catch (e) {}
}

function computeDaily120Metrics() {
  const totalCards = Math.max(1, DATA.points.length);
  const greenCnt = DATA.points.filter(p => A.pts[p.id] && A.pts[p.id].status === "green").length;
  const quizRatio = Math.min(1.0, greenCnt / totalCards);
  const quizDone = greenCnt >= totalCards;

  const radioDur = Math.max(600, DATA.radio.duration_sec || 2100);
  const targetMins = Math.max(1, Math.round(radioDur / 60));
  const listenedSec = Math.min(radioDur, Math.max(0, A.radioMaxSec || 0));
  const listenedMins = Math.min(targetMins, Math.floor(listenedSec / 60));
  const radioRatio = Math.min(1.0, listenedSec / (radioDur * 0.92));
  const radioDone = radioRatio >= 0.98;

  const vItems = (DATA.mastery && DATA.mastery.vocab && DATA.mastery.vocab.items) ? DATA.mastery.vocab.items : [];
  const liveFlashLeft = vItems.filter(it => it.tier !== "done").length;
  const fp = Array.isArray(A.flashProg) ? A.flashProg : [0, 0, 0, 0];
  const flashSeen = Math.max(0, Math.floor(fp[0] || 0));
  const flashDone = (Math.floor(fp[2] || 0) > 0) || (liveFlashLeft === 0 && vItems.length > 0);
  const flashTarget = flashDone
    ? Math.max(flashSeen, Math.floor(fp[1] || 0) || liveFlashLeft)
    : Math.max(flashSeen, Math.floor(fp[1] || 0) || liveFlashLeft || 1);
  const flashRatio = flashDone ? 1.0 : (flashSeen > 0 ? Math.min(0.96, flashSeen / Math.max(1, flashTarget)) : 0);

  const vDone = vItems.filter(it => it.tier === "done").length;
  const vWip = vItems.filter(it => it.tier === "wip").length;
  const vocabBonus = Math.min(8, Math.max(0, (vDone - 11) * 0.25 + Math.max(0, vWip - 33) * 0.06));

  // Combined 3-ritual daily completion: 50% quiz + 32% podcast + 18% bedtime vocab
  const dailyLockPct = Math.min(100, Math.round((quizRatio * 0.50 + radioRatio * 0.32 + flashRatio * 0.18) * 100));

  // Projected JLPT N3 score (/180): 108 base + 12 quiz + 8 podcast + 4 bedtime flashcards + permanent vocab mastery lift
  const projScore = Math.min(165, Math.round(108 + quizRatio * 12 + (radioDone ? 8 : radioRatio * 8) + flashRatio * 4 + vocabBonus));

  return {
    totalCards,
    greenCnt,
    quizRatio,
    quizDone,
    targetMins,
    listenedMins: radioDone ? targetMins : listenedMins,
    radioRatio: radioDone ? 1.0 : radioRatio,
    radioDone,
    flashSeen: flashDone ? Math.max(flashSeen, flashTarget) : flashSeen,
    flashTarget,
    flashRatio,
    flashDone,
    allThreeDone: quizDone && radioDone && flashDone,
    dailyLockPct,
    projScore
  };
}

function selectNextPointId(forcedId) {
  if (forcedId && A.pts[forcedId]) return forcedId;
  const remaining = DATA.points.filter(p => A.pts[p.id].status !== "green");
  if (!remaining.length) return null;
  if (remaining.length === 1) return remaining[0].id;

  const nonRepeat = remaining.filter(p => p.id !== A.lastPointId);
  const pool = nonRepeat.length ? nonRepeat : remaining;

  const dueQuizzes = pool.filter(p => {
    const s = A.pts[p.id];
    return s.status === "learning" && s.dueStep <= A.step;
  });
  if (dueQuizzes.length) {
    dueQuizzes.sort((a, b) => {
      const pa = A.pts[a.id].audioPrimed ? 1 : 0;
      const pb = A.pts[b.id].audioPrimed ? 1 : 0;
      return A.pts[a.id].dueStep - A.pts[b.id].dueStep || pb - pa || b.roi_score - a.roi_score;
    });
    return dueQuizzes[0].id;
  }

  if (A.hotFamily) {
    const famSiblings = pool.filter(p => p.family === A.hotFamily && A.pts[p.id].dueStep <= A.step);
    if (famSiblings.length) return famSiblings[0].id;
  }

  const ready = pool.filter(p => A.pts[p.id].dueStep <= A.step);
  if (ready.length) {
    ready.sort((a, b) => {
      const ma = a.modality === "memorize" ? 0.25 : (a.modality === "both" ? 0.12 : 0);
      const mb = b.modality === "memorize" ? 0.25 : (b.modality === "both" ? 0.12 : 0);
      return (b.roi_score + mb) - (a.roi_score + ma);
    });
    return ready[0].id;
  }

  pool.sort((a, b) => A.pts[a.id].dueStep - A.pts[b.id].dueStep);
  return pool[0].id;
}

// Tokenize full sentence first so multi-character words & conjugated chunks never get split in half!
function renderJapaneseWithHighlight(text, highlightTarget) {
  const src = String(text || "");
  const target = String(highlightTarget || "").split("（")[0].trim();
  const hlIdx = (target && target.length >= 1) ? src.indexOf(target) : -1;
  const hlEnd = hlIdx >= 0 ? hlIdx + target.length : -1;

  let out = "";
  let i = 0;

    let matched = null;
    for (let k = 0; k < DICT_KEYS.length; k++) {
      const w = DICT_KEYS[k];
      if (!src.startsWith(w, i)) continue;
      if (INTERJECTION_SET.has(w) && i > 0 && !"「『（(、。！？!? \n\t：:".includes(src[i - 1])) {
        continue;
      }
      if (w.length === 2 && PARTICLE_FALLBACK[w] && hasLongerContentWordAt(src, i + 1)) {
        continue;
      }
      matched = w;
      break;
    }
    if (matched) {
      const tStart = i;
      const tEnd = i + matched.length;
      const escW = escapeHtml(matched);
      let innerHtml = "";
      if (hlIdx >= 0 && tStart < hlEnd && tEnd > hlIdx) {
        const s1 = Math.max(tStart, hlIdx) - tStart;
        const s2 = Math.min(tEnd, hlEnd) - tStart;
        innerHtml =
          escapeHtml(matched.slice(0, s1)) +
          `<span class="ans-hl">${escapeHtml(matched.slice(s1, s2))}</span>` +
          escapeHtml(matched.slice(s2));
      } else {
        innerHtml = escW;
      }
      out += `<span class="w-tok" data-w="${escW}">${innerHtml}</span>`;
      i = tEnd;
    } else {
      const ch = escapeHtml(src[i]);
      if (hlIdx >= 0 && i >= hlIdx && i < hlEnd) {
        out += `<span class="ans-hl">${ch}</span>`;
      } else {
        out += ch;
      }
      i += 1;
    }
  }
  return out;
}

const SPEAKER_RE = /^\s*([男女ＡＢAB]|[^\s：:「」]{1,3})\s*[：:]\s*/;
function splitSpeakerLines(text) {
  const src = String(text || "").trim();
  if (!src) return [];
  // Break before every "男：" / "女：" style label, even if the source put them on one line
  const parts = src.split(/\n+|\s*(?=[男女][：:])|\s+(?=[^\s：:「」。、]{1,3}[：:])/).map(x => x.trim()).filter(Boolean);
  return parts.map(t => {
    const m = t.match(SPEAKER_RE);
    return m ? { who: m[1], text: t.slice(m[0].length) } : { who: "", text: t };
  });
}

function renderDialogueHTML(fullJa, ans, zh) {
  const ja = splitSpeakerLines(fullJa);
  if (ja.length < 2 || ja.some(l => !l.who)) return "";
  const zl = splitSpeakerLines(zh);
  const zhOk = zl.length === ja.length && zl.every(l => l.who);
  return `<div class="dlg">${ja.map((l, i) => {
    const isAns = ans && l.text.indexOf(ans) >= 0;
    const zhTxt = zhOk ? zl[i].text.replace(/^「|」$/g, "") : "";
    return `<div class="dlg-row${isAns ? " is-ans" : ""}"><span class="dlg-who">${escapeHtml(l.who)}</span><div><div class="dlg-ja">${renderJapaneseWithHighlight(l.text, isAns ? ans : "")}</div>${zhTxt ? `<div class="dlg-zh">${escapeHtml(zhTxt)}</div>` : ""}</div></div>`;
  }).join("")}</div>${!zhOk && zh ? `<p class="result-zh">${escapeHtml(zh)}</p>` : ""}`;
}

const audioBlobMap = new Map();
const audioFetchMap = new Map();
let playReqSeq = 0;

function warmAudio(url) {
  if (!url) return Promise.resolve("");
  if (audioBlobMap.has(url)) return Promise.resolve(audioBlobMap.get(url));
  if (audioFetchMap.has(url)) return audioFetchMap.get(url);
  const p = fetch(url)
    .then(res => (res && res.ok ? res.blob() : null))
    .then(blob => {
      audioFetchMap.delete(url);
      if (!blob || !blob.size) return url;
      if (audioBlobMap.size >= 80) {
        const oldestKey = audioBlobMap.keys().next().value;
        const oldestUrl = audioBlobMap.get(oldestKey);
        audioBlobMap.delete(oldestKey);
        try { URL.revokeObjectURL(oldestUrl); } catch (e) {}
      }
      const blobUrl = URL.createObjectURL(blob);
      audioBlobMap.set(url, blobUrl);
      return blobUrl;
    })
    .catch(() => {
      audioFetchMap.delete(url);
      return url;
    });
  audioFetchMap.set(url, p);
  return p;
}

function applyPlaybackRate(kind) {
  const rate = (kind === "exp" || kind === "teach" || kind === "done") ? expSpeed : 1.0;
  player.defaultPlaybackRate = rate;

function startResolvedClip(srcUrl, kind, seq) {
  if (seq !== playReqSeq) return;
  activeKind = kind;
  player.src = srcUrl;
  player.currentTime = 0;
  applyPlaybackRate(kind);
  const pr = player.play();
  if (pr && typeof pr.catch === "function") {
    pr.catch(() => {
      if (seq === playReqSeq) {
        activeKind = null;
        syncAudioButtons();
      }
    });
  }
  syncAudioButtons();
}

function playMainClip(url, kind, toggleIfSame) {
  if (!url) return;
  if (!radioPlayer.paused) radioPlayer.pause();
  if (toggleIfSame && activeKind === kind && !player.paused) {
    stopQuizAudio();
    return;
  }
  const seq = ++playReqSeq;
  if (audioBlobMap.has(url)) {
    startResolvedClip(audioBlobMap.get(url), kind, seq);
    return;
  }
  activeKind = kind;
  syncAudioButtons();
  warmAudio(url).then(resolvedUrl => {
    startResolvedClip(resolvedUrl || url, kind, seq);
  });
}

}

function paintRadioSeekProgress(t) {
  const seekEl = document.getElementById("radio-seek");
  const pillEl = document.getElementById("radio-date-pill");
  const dur = Math.max(1, (radioPlayer.duration && isFinite(radioPlayer.duration)) ? radioPlayer.duration : (DATA.radio.duration_sec || 2100));
  const rm = computeDaily120Metrics();
  if (pillEl) {
    const hostsLabel = DATA.radio.hosts || "文涛 · 文道 · 子东";
    pillEl.textContent = rm.radioDone ? `锵锵三人 · ${hostsLabel} · 今日已听完 ✓` : `锵锵三人 · ${hostsLabel}`;
  }
  if (seekEl) {
    const curPct = Math.max(0, Math.min(100, ((t || 0) / dur) * 100));
    const maxPct = rm.radioDone ? 100 : Math.max(curPct, Math.min(100, ((A.radioMaxSec || 0) / dur) * 100));
    seekEl.style.background = `linear-gradient(to right, #2D7A56 0%, #2D7A56 ${curPct.toFixed(1)}%, rgba(45, 122, 86, 0.36) ${curPct.toFixed(1)}%, rgba(45, 122, 86, 0.36) ${maxPct.toFixed(1)}%, rgba(28, 27, 24, 0.10) ${maxPct.toFixed(1)}%, rgba(28, 27, 24, 0.10) 100%)`;

function updateRadioLiveDisplay(t) {
  const seekEl = document.getElementById("radio-seek");
  if (seekEl) seekEl.value = Math.floor(t);
  document.getElementById("radio-cur-time").textContent = formatMMSS(t);
  if (radioPlayer.duration && isFinite(radioPlayer.duration)) {
    seekEl.max = Math.ceil(radioPlayer.duration);
    document.getElementById("radio-tot-time").textContent = formatMMSS(radioPlayer.duration);
  }

  if (t > (A.radioMaxSec || 0)) {
    const prevMin = Math.floor((A.radioMaxSec || 0) / 60);
    A.radioMaxSec = Math.floor(t);
    if (Math.floor(A.radioMaxSec / 60) !== prevMin) {
      if (!radioPlayer.paused) A.radioPos = [Math.floor(t), nowUnixSec()];
      saveAdaptiveState();
      renderGreenBoard();
      if (Date.now() - lastRadioCloudPushMs > 55000) {
        lastRadioCloudPushMs = Date.now();
        scheduleCloudPush(400);
      }
    }
  }
  paintRadioSeekProgress(t);

  const segs = DATA.radio.segments || [];
  let curSeg = null;
  let segIdx = -1;
  for (let i = 0; i < segs.length; i++) {
    if (t >= segs[i].start && t < segs[i].end) {
      curSeg = segs[i];
      segIdx = i;
      break;
    }
  }

  if (curSeg) {
    if (segIdx !== lastRenderedSegIdx) {
      lastRenderedSegIdx = segIdx;
      const chaps = DATA.radio.chapters || [];
      const chapObj = chaps[curSeg.chapter] || chaps[0];
      if (chapObj) {
        document.getElementById("radio-chap-lbl").textContent = chapObj.title.replace(/^[①②③④]\s*/, "");
        renderRadioChapters(chapObj.idx);
      }
      document.getElementById("radio-live-title").textContent = curSeg.title;
      document.getElementById("radio-live-ja").innerHTML = annotateJapanese(curSeg.ja_focus || "");
      clearInlineLexicon("radio-inline-lex");
      setupMediaSession(curSeg.title);
    }

    const segPids = Array.isArray(curSeg.point_ids) && curSeg.point_ids.length
      ? curSeg.point_ids
      : (curSeg.point_id ? [curSeg.point_id] : []);
    if (segPids.length && t >= curSeg.end - 12) {
      let changed = false;
      for (const pid of segPids) {
        const ps = A.pts[pid];
        if (ps && !ps.audioPrimed) {
          ps.audioPrimed = true;
          if (ps.status === "unseen") ps.status = "learning";
          changed = true;
        }
      }
      if (changed) {
        saveAdaptiveState();
        renderGreenBoard();
      }
    }
  }
}

// Calm zero-guess escape hatch: never force a blind 50/50 guess (which risks lucky false-greens).
// Reveals THIS sentence's full 3-step explanation + voice immediately, and schedules a variant re-test 4 steps later.
function revealWithoutGuess() {
  if (viewStage !== "quiz" || !activeQuizObj) return;
  clearActiveWordToken();
  stopQuizAudio();
  pickedVal = "__UNSURE__";
  viewStage = "result";
  stageEnteredAt = performance.now();

  const stamp = nowUnixSec();
  const p = getPointById(curPointId);
  const ps = A.pts[p.id];
  ps.retestAt = Math.max(stamp, (ps.greenAt || 0) + 1);
  ps.status = "learning";
  ps.wrongCount += 1;
  if (p.variants && p.variants.length > 0) {
    if (ps.useVariant) ps.variantIdx += 1;
    ps.useVariant = true;
  }
  ps.dueStep = A.step + 4;
  A.hotFamily = p.family;
  A.step += 1;
  A.lastPointId = p.id;
  recomputeStatusesFromCRDT(A);
  syncBackendRecord(p, activeQuizObj.id, "不确定", false, false, "todo", stamp);

  renderTutor();
  playMainClip(activeQuizObj.exp_audio, "exp", false);
}

    ps.retestAt = Math.max(stamp, (ps.greenAt || 0) + 1);
    ps.status = "learning";
    ps.wrongCount += 1;
    if (p.variants && p.variants.length > 0) {

  stageEnteredAt = performance.now();
  renderTutor();
}

let prevEnsoDoneKey = "";

function renderEnsoRingSVG(idx, ratio, isDone) {
  if (isDone) {
    return `<svg class="enso-svg" viewBox="0 0 28 28" aria-hidden="true">
      <circle cx="14" cy="14" r="10.2" fill="#2D7A56"/>
      <path d="M 9.6 14.3 L 12.6 17.2 L 18.7 10.9" fill="none" stroke="#FCFBF8" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;
  }
  if (ratio > 0.005) {
    const pct = Math.max(8, Math.min(97, Math.round(ratio * 100)));
    return `<svg class="enso-svg" viewBox="0 0 28 28" aria-hidden="true">
      <circle cx="14" cy="14" r="9.8" fill="none" stroke="rgba(28, 27, 24, 0.13)" stroke-width="1.85"/>
      <circle cx="14" cy="14" r="9.8" pathLength="100" fill="none" stroke="#2D7A56" stroke-width="2.35" stroke-linecap="round" stroke-dasharray="${pct} 105" transform="rotate(-90 14 14)"/>
    </svg>`;
  }
  return `<svg class="enso-svg" viewBox="0 0 28 28" aria-hidden="true">
    <circle cx="14" cy="14" r="9.8" fill="none" stroke="rgba(28, 27, 24, 0.20)" stroke-width="1.6" stroke-dasharray="3.6 3.2"/>
  </svg>`;
}

function onEnsoTap(idx, ev) {
  if (ev) ev.stopPropagation();
  if (idx === 0) {
    if (activeMode !== "tutor") switchMode("tutor");
    else openSessionModal();
  } else if (idx === 1) {
    if (activeMode !== "radio") switchMode("radio", false);
    else openSessionModal();
  } else {
    openNightFlash();
  }
}

function renderGreenBoard() {
  const m = computeDaily120Metrics();

  const trioEl = document.getElementById("enso-trio");
  if (trioEl) {
    const doneKey = `${m.quizDone ? 1 : 0}${m.radioDone ? 1 : 0}${m.flashDone ? 1 : 0}`;
    const rings = [
      { ratio: m.quizRatio, done: m.quizDone, label: `做题 ${m.greenCnt}/${m.totalCards}` },
      { ratio: m.radioRatio, done: m.radioDone, label: `随身听 ${m.listenedMins}/${m.targetMins}分` },
      { ratio: m.flashRatio, done: m.flashDone, label: `睡前生词 ${m.flashDone ? "已完成" : m.flashSeen + "/" + m.flashTarget}` }
    ];
    trioEl.innerHTML = rings.map((r, idx) => {
      const newlyDone = r.done && prevEnsoDoneKey && prevEnsoDoneKey[idx] === "0";
      return `<button class="enso-btn${r.done ? " done" : ""}${newlyDone ? " is-done" : ""}" id="enso-${idx + 1}" onclick="onEnsoTap(${idx}, event)" aria-label="${escapeHtml(r.label)}" title="${escapeHtml(r.label)}">${renderEnsoRingSVG(idx, r.ratio, r.done)}</button>`;
    }).join("");
    prevEnsoDoneKey = doneKey;
  }

  const quizPart = m.quizDone ? `做题 ✓` : `做题 ${m.greenCnt}/${m.totalCards}`;
  const radioPart = m.radioDone ? `随身听 ✓` : `听 ${m.listenedMins}/${m.targetMins}分`;
  const flashPart = m.flashDone ? `生词 ✓` : `词 ${m.flashSeen}/${m.flashTarget}`;
  document.getElementById("gm-left-txt").textContent = `${quizPart} · ${radioPart} · ${flashPart}`;

  if (m.projScore >= 120) {
    document.getElementById("gm-right-txt").innerHTML = `预计 <b class="moss">${m.projScore}分 · 稳过120</b>`;
  } else {
    document.getElementById("gm-right-txt").innerHTML = `预计 <b>${m.projScore}分</b> · 冲120+`;
  }
  document.getElementById("gm-fill").style.width = `${m.dailyLockPct}%`;
}

function lexBoxHTML(id) {
  return `
    <div class="inline-lex empty" id="${id}" data-surface="">
      <div class="ilex-top">
        <div class="ilex-head"><span class="ilex-surf"></span><span class="ilex-kana"></span></div>
        <button class="ilex-speak" type="button">发音</button>

      <div class="ilex-meta"></div>
    </div>`;
}

function renderTutor() {
  renderGreenBoard();
  clearActiveWordToken();
  const box = document.getElementById("voice-card");
  const effStage = (viewStage === "done" || !curPointId)
    ? "done"
    : ((viewStage === "quiz" && activeQuizObj) ? "quiz" : viewStage);
  box.className = "stage-wrap stage-" + effStage;

  if (viewStage === "done" || !curPointId) {
    const m = computeDaily120Metrics();
    const nextBtn = !m.radioDone
      ? `<button class="sumi-btn" onclick="switchMode('radio', true)">去听随身听</button>`
      : (!m.flashDone
          ? `<button class="sumi-btn" onclick="openNightFlash()">睡前过生词</button>`
          : `<button class="sumi-btn" onclick="switchMode('dash')">查看总表</button>`);
    box.innerHTML = `
      <div class="meta-bar"><span class="overline ok">${m.allThreeDone ? "今日三修圆满 · 稳过 120 分" : "五十道题已全部刷绿"}</span></div>
      <div class="focal-space">
        <h2 class="point-heading">${m.allThreeDone ? "今日三样皆已圆满" : "五十道题已全部过关"}</h2>
        <p class="logic-line">${m.allThreeDone
          ? `做题、三人随身听与生词皆已收笔，预计总分稳锁在 ${m.projScore} 分。安心休息，考场稳站 120 分以上。`
          : `做题部分已拿满，当前预计 ${m.projScore} 分。${!m.radioDone ? "顺手听完今日随身听，" : ""}睡前再过一遍生词，就能把三枚圆印全部收满。`}</p>
      </div>
      <div class="action-dock">
        <div class="dock-row">
          <button class="ghost-btn" onclick="resetTodayMission()">再来一轮</button>
          ${nextBtn}
        </div>
      </div>
    `;
    return;
  }

  const p = getPointById(curPointId);
  const ps = A.pts[curPointId];

  // -------- TEACH --------
  if (viewStage === "teach") {
    warmAudio(p.teach.audio);
    warmAudio(p.primary.q_audio);
    box.innerHTML = `
      <div class="meta-bar">
        <span class="overline warm">${escapeHtml(p.subject)} · 考点梳理</span>
        <div class="quiet-actions">
          <button class="text-btn" id="exp-replay-btn" onclick="playMainClip('${p.teach.audio}', 'teach', true)">讲解</button>
          <button class="text-btn" id="ans-spd-btn" onclick="cycleExpSpeed()">${expSpeed}x</button>
        </div>
      </div>

      <div class="focal-space">
        <h2 class="point-heading">${escapeHtml(p.point)}</h2>
        <div class="zen-pair">
          <div class="zen-pair-row">
            <div class="zp-ja"><span class="zp-dot"></span><span>${escapeHtml(p.teach.left.ja)}</span></div>
            <div class="zp-sub">${escapeHtml(p.teach.left.sub)}</div>
          </div>
          ${p.teach.right && p.teach.right.ja ? `
          <div class="zen-pair-row">
            <div class="zp-ja"><span class="zp-dot muted"></span><span>${escapeHtml(p.teach.right.ja)}</span></div>
            <div class="zp-sub">${escapeHtml(p.teach.right.sub)}</div>
          </div>` : ""}
        </div>
        <div class="example-line">${annotateJapanese(p.teach.example_ja)}</div>
        ${p.teach.zh_meaning ? `<p class="example-zh">${escapeHtml(p.teach.zh_meaning)}</p>` : ""}
      </div>

      <div class="action-dock">
        <button class="sumi-btn" style="width:100%;" onclick="completeTeachCard()"><span>继续</span><span class="desk-hint">滚轮下滑 · Enter</span></button>
      </div>
      ${lexBoxHTML("tutor-inline-lex")}
    `;
    syncAudioButtons();
    return;
  }

  // -------- QUIZ --------
  if (viewStage === "quiz" && activeQuizObj) {
    warmAudio(activeQuizObj.q_audio);
    warmAudio(activeQuizObj.exp_audio);
    const isVariant = activeQuizObj.id !== p.primary.id;
    let label = p.subject;
    if (isVariant) label += " · 换题复考";
    else if (ps.audioPrimed) label += " · 随身听已聊";

    const controlsHTML = activeQuizObj.is_listening
      ? `<div class="listen-num-grid">
          ${currentChoices.map((c, cIdx) => `
            <button class="listen-num-btn" onclick="submitAnswer(currentChoices[${cIdx}])">${cIdx + 1}</button>
          `).join("")}
        </div>`
      : `<div class="choice-list">
          ${currentChoices.map((c, cIdx) => `
            <button class="zen-choice" onclick="submitAnswer(currentChoices[${cIdx}])">
              <span>${escapeHtml(c)}</span>
              <span class="kbd-tag">${cIdx + 1}</span>
            </button>
          `).join("")}
        </div>`;

    box.innerHTML = `
      <div class="meta-bar">
        <span class="overline">${escapeHtml(label)}</span>
        <div class="quiet-actions">
          ${!activeQuizObj.is_listening ? `<button class="text-btn" id="q-play-btn" onclick="playMainClip(activeQuizObj.q_audio, 'q', true)">读题</button>` : ""}
        </div>
      </div>

      <div class="focal-space">
        <div class="quiz-focal">
          ${activeQuizObj.is_listening ? `
          <div class="listen-medallion-wrap">
            <button class="listen-medallion" id="voice-orb" onclick="playMainClip(activeQuizObj.q_audio, 'q', true)" aria-label="播放">
              <svg class="med-ic" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86A1 1 0 0 0 8 5.14z"/></svg>
              <div class="med-waves"><span></span><span></span><span></span></div>
            </button>
          </div>` : `<p class="quiz-ja">${escapeHtml(activeQuizObj.prompt)}</p>`}
        </div>
      </div>

      <div class="action-dock">
        ${controlsHTML}
        <button class="unsure-btn" onclick="revealWithoutGuess()">
          <span>不确定 · 直接看讲解</span>
          <span class="kbd-tag">0</span>
        </button>
      </div>
    `;
    syncAudioButtons();
    return;
  }

  // -------- RESULT (Structured Scannable Zen Layout: ① 原句与翻译 -> ② 要点 -> ③ 逐项拆解) --------
  const q = activeQuizObj || p.primary;
  const isUnsure = pickedVal === "__UNSURE__";
  const isCorrect = !isUnsure && pickedVal === q.answer;
  const ansIdx = currentChoices.indexOf(q.answer) + 1;
  const pickedIdx = currentChoices.indexOf(pickedVal) + 1;

  let overCls = "overline ng";
  let overTxt = "";
  if (isCorrect) {
    overCls = "overline ok";
    overTxt = q.is_listening && ansIdx > 0 ? `已变绿 · 正确答案 ${ansIdx}` : "已变绿";
  } else if (isUnsure) {
    overCls = "overline warm";
    overTxt = q.is_listening && ansIdx > 0 ? `直接看讲解 · 正确答案 ${ansIdx} · 稍后复考` : "直接看讲解 · 稍后复考";
  } else {
    overCls = "overline ng";
    overTxt = q.is_listening && ansIdx > 0
      ? `误选 ${pickedIdx || ""} · 正确答案 ${ansIdx} · 稍后复考`
      : `误选「${pickedVal}」 · 稍后复考`;
  }

  const notesMap = q.opt_notes || {};
  const orderedOpts = q.is_listening
    ? currentChoices.map((opt, idx) => ({ opt, num: idx + 1 }))
    : [
        { opt: q.answer, num: 0 },
        ...currentChoices
          .filter(o => o !== q.answer)
          .sort((a, b) => (a === pickedVal ? -1 : b === pickedVal ? 1 : 0))
          .map(opt => ({ opt, num: 0 }))
      ];

  const optRowsHTML = orderedOpts.map(({ opt, num }) => {
    const isAns = opt === q.answer;
    const isMis = !isAns && !isUnsure && opt === pickedVal;
    const rowCls = isAns ? "opt-row ok" : (isMis ? "opt-row ng" : "opt-row dim");
    const markTxt = q.is_listening
      ? (isAns ? `${num} ✓` : (isMis ? `${num} ✕` : `${num} ·`))
      : (isAns ? "✓" : (isMis ? "✕" : "×"));
    const badgeHTML = isAns
      ? `<span class="opt-badge ok">正解</span>`
      : (isMis ? `<span class="opt-badge ng">误选</span>` : "");
    const descTxt = notesMap[opt] || (isAns ? (q.form_line || "") : "");
    return `<div class="${rowCls}">
      <span class="opt-mark">${markTxt}</span>
      <div class="opt-body">
        <div class="opt-head"><span class="opt-ja">${annotateJapanese(opt)}</span>${badgeHTML}</div>
        ${descTxt ? `<div class="opt-desc">${escapeHtml(descTxt)}</div>` : ""}
      </div>
    </div>`;
  }).join("");

  box.innerHTML = `
    <div class="meta-bar">
      <span class="${overCls}">${escapeHtml(overTxt)}</span>
      <div class="quiet-actions">
        <button class="text-btn" onclick="playMainClip(activeQuizObj.q_audio, 'q', true)">原题</button>
        <button class="text-btn" id="exp-replay-btn" onclick="playMainClip(activeQuizObj.exp_audio, 'exp', true)">讲解</button>
        <button class="text-btn" id="ans-spd-btn" onclick="cycleExpSpeed()">${expSpeed}x</button>
      </div>
    </div>

    <div class="focal-space">
      ${(q.is_listening && renderDialogueHTML(q.full_ja, q.answer, q.zh_meaning)) || `<div class="result-ja">${annotateSentenceWithAnswer(q.full_ja, q.answer)}</div>
      ${q.zh_meaning ? `<p class="result-zh">${escapeHtml(q.zh_meaning)}</p>` : ""}`}
      <div class="result-divider"></div>
      ${q.why_line ? `<div class="res-cue"><span class="cue-tag">要点</span><span class="cue-txt">${escapeHtml(q.why_line)}</span></div>` : ""}
      <div class="opt-breakdown${q.is_listening ? " is-listen" : ""}">${optRowsHTML}</div>
    </div>

    <div class="action-dock">
      <div class="dock-row">
        ${isCorrect ? `<button class="ghost-btn" onclick="advanceNext(true)">再考</button>` : ""}
        <button class="sumi-btn" onclick="advanceNext(false)"><span>下一题</span><span class="desk-hint">滚轮下滑 · Enter</span></button>
      </div>
    </div>
    ${lexBoxHTML("tutor-inline-lex")}
  `;
  syncAudioButtons();
}

// ================= INSTANT INLINE WORD MEANING (ZERO MODAL, ZERO GOOGLE BAR) =================
let activeTokEl = null;

function clearActiveWordToken() {
  if (activeTokEl) {
    activeTokEl.classList.remove("active-tok");
    activeTokEl = null;
  }
}

function clearInlineLexicon(boxId) {
  const el = document.getElementById(boxId);
  if (!el) return;
  el.classList.add("empty");
  el.dataset.surface = "";
}

function speakJapaneseFallback(text) {
  if (!("speechSynthesis" in window)) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ja-JP";
    u.rate = 1.0;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

function playWordAudio(surface, pauseMainIfNeeded) {
  const info = DATA.words[surface];
  if (!info) return;
  if (pauseMainIfNeeded && !player.paused) {
    player.pause();
    syncAudioButtons();
  }
  if (info.audio) {
    wordPlayer.src = info.audio;
    wordPlayer.currentTime = 0;
    wordPlayer.playbackRate = 1.0;
    wordPlayer.play().catch(() => speakJapaneseFallback(info.kana || surface));
  } else {
    speakJapaneseFallback(info.kana || surface);
  }
}

function playDirectUrl(url) {
  if (!url) return;
  if (!player.paused) player.pause();
  wordPlayer.src = url;
  wordPlayer.currentTime = 0;
  wordPlayer.playbackRate = 1.0;
  wordPlayer.play().catch(() => {});
}

const TRIVIAL_TAP_WORDS = new Set([
  "この", "その", "あの", "ここ", "そこ", "あそこ", "これ", "それ", "あれ", "どれ", "どちら",
  "私", "僕", "彼", "彼女", "人", "今日", "明日", "昨日", "今", "もう", "また", "もっと", "だけ", "だから"
]);

function recordTappedWord(surface) {
  if (!surface || PARTICLE_FALLBACK[surface] || TRIVIAL_TAP_WORDS.has(surface)) return;
  const info = DATA.words[surface];
  if (!info || !info.zh) return;
  if (!Array.isArray(A.tappedWords)) A.tappedWords = [];
  if (!A.tappedWords.includes(surface)) {
    A.tappedWords.push(surface);
    if (A.tappedWords.length > 80) A.tappedWords = A.tappedWords.slice(-80);
    applyMasteryOverrides();
    renderGreenBoard();
    saveAdaptiveState();
    scheduleCloudPush(450);
  }
}

function showInlineWordMeaning(surface, tokEl) {
  const info = DATA.words[surface];
  if (!info) return;

  const targetBoxId = activeMode === "radio" ? "radio-inline-lex" : "tutor-inline-lex";
  const box = document.getElementById(targetBoxId);
  if (!box) return;

  if (tokEl && tokEl === activeTokEl && !box.classList.contains("empty")) {
    clearActiveWordToken();
    clearInlineLexicon(targetBoxId);
    return;
  }

  recordTappedWord(surface);
  clearActiveWordToken();
  if (tokEl && tokEl.classList) {
    activeTokEl = tokEl;
    activeTokEl.classList.add("active-tok");
  }

  const headDiff = info.head && info.head !== surface ? `原形 ${info.head}` : "";
  const metaLine = [headDiff, info.pos, info.tip].filter(Boolean).join(" · ");
  const kanaTxt = info.kana && info.kana !== surface
    ? (info.kana + (info.pitch ? " " + info.pitch : ""))
    : (info.pitch || "");

  box.dataset.surface = surface;
  const surfEl = box.querySelector(".ilex-surf");
  const kanaEl = box.querySelector(".ilex-kana");
  const zhEl = box.querySelector(".ilex-zh");
  const metaEl = box.querySelector(".ilex-meta");
  if (surfEl) surfEl.textContent = surface;
  if (kanaEl) kanaEl.textContent = kanaTxt;
  if (zhEl) zhEl.textContent = info.zh || "";
  if (metaEl) metaEl.textContent = metaLine;
  box.classList.remove("empty");

  if (player.paused && radioPlayer.paused) {
    playWordAudio(surface, false);
  }
}

document.addEventListener("click", e => {
  if (flashOpen) return;
  const speakBtn = e.target.closest && e.target.closest(".ilex-speak");
  if (speakBtn) {
    e.preventDefault();
    e.stopPropagation();
    const box = speakBtn.closest(".inline-lex");
    if (box && box.dataset.surface) playWordAudio(box.dataset.surface, true);
    return;
  }
  const tok = e.target.closest && e.target.closest(".w-tok");
  if (tok && !(activeMode === "tutor" && viewStage === "quiz")) {
    e.preventDefault();
    e.stopPropagation();
    showInlineWordMeaning(tok.dataset.w, tok);
    return;
  }
  if (!e.target.closest || !e.target.closest(".inline-lex")) {
    const targetBoxId = activeMode === "radio" ? "radio-inline-lex" : "tutor-inline-lex";
    const box = document.getElementById(targetBoxId);
    if (box && !box.classList.contains("empty") && (e.target.closest(".focal-space") || e.target.closest(".radio-center"))) {
      clearActiveWordToken();
      clearInlineLexicon(targetBoxId);
    }
  }
});

// ================= DESKTOP MOUSE WHEEL & MOBILE SWIPE ERGONOMICS =================
let lastWheelAdvanceAt = 0;

window.addEventListener("wheel", e => {
  if (flashOpen) return;
  if (activeMode !== "tutor") return;
  if (viewStage !== "result" && viewStage !== "teach") return;
  if (document.getElementById("app-modal").classList.contains("open")) return;
  if (e.deltaY < 24 || Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;

  const now = performance.now();
  if (now - stageEnteredAt < 480 || now - lastWheelAdvanceAt < 750) return;

  const fs = document.querySelector("#tutor-view .focal-space");
  if (fs && fs.scrollHeight > fs.clientHeight + 8) {
    if (fs.scrollTop + fs.clientHeight < fs.scrollHeight - 8) return;
  }

  lastWheelAdvanceAt = now;
  if (viewStage === "teach") completeTeachCard();
  else advanceNext(false);
}, { passive: true });

let touchStartX = 0;
let touchStartY = 0;
let touchStartTime = 0;

document.getElementById("tutor-view").addEventListener("touchstart", e => {
  if (!e.touches || e.touches.length !== 1) return;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  touchStartTime = performance.now();
}, { passive: true });

document.getElementById("tutor-view").addEventListener("touchend", e => {
  if (flashOpen) return;
  if (activeMode !== "tutor") return;
  if (viewStage !== "result" && viewStage !== "teach") return;
  if (document.getElementById("app-modal").classList.contains("open")) return;
  if (!e.changedTouches || e.changedTouches.length !== 1) return;

  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const dt = performance.now() - touchStartTime;
  if (dx <= -56 && Math.abs(dx) > Math.abs(dy) * 1.7 && dt < 650) {
    if (viewStage === "teach") completeTeachCard();
    else advanceNext(false);
  }
}, { passive: true });

// ================= KEYBOARD =================
document.addEventListener("keydown", e => {
  const tag = (e.target && e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea") {
    if (e.key === "Escape") e.target.blur();
    return;
  }
  if (flashOpen) {
    if (e.key === "Escape") { e.preventDefault(); closeNightFlash(); }
    else if (e.key === " ") { e.preventDefault(); toggleFlashPlay(); }
    else if (e.key === "ArrowRight" || e.key === "Enter") { e.preventDefault(); flashStepNext(true); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); flashStepPrev(); }
    else if (e.key.toLowerCase() === "r" || e.key === "1") { e.preventDefault(); markFlashUnfamiliar(); }
    else if (e.key.toLowerCase() === "m" || e.key === "2") { e.preventDefault(); markFlashMastered(); }
    return;
  }
  if (document.getElementById("app-modal").classList.contains("open")) {
    if (e.key === "Escape") closeModal();
    return;
  }

  if (activeMode === "radio") {
    if (e.key === " ") { e.preventDefault(); toggleRadioPlay(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); seekRadioBy(-15); }
    else if (e.key === "ArrowRight") { e.preventDefault(); seekRadioBy(15); }
    return;
  }
  if (activeMode !== "tutor") return;
  if (e.key.toLowerCase() === "s") { e.preventDefault(); cycleExpSpeed(); return; }

  if (viewStage === "teach") {
    const p = getPointById(curPointId);
    if (e.key === " ") { e.preventDefault(); if (p) playMainClip(p.teach.audio, "teach", true); }
    else if (e.key === "Enter" || e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); completeTeachCard(); }
    return;
  }
  if (viewStage === "quiz" && activeQuizObj) {
    if (e.key === " ") { e.preventDefault(); playMainClip(activeQuizObj.q_audio, "q", true); }
    else if (e.key === "1" && currentChoices[0]) { e.preventDefault(); submitAnswer(currentChoices[0]); }
    else if (e.key === "2" && currentChoices[1]) { e.preventDefault(); submitAnswer(currentChoices[1]); }
    else if (e.key === "3" && currentChoices[2]) { e.preventDefault(); submitAnswer(currentChoices[2]); }
    else if (e.key === "0") { e.preventDefault(); revealWithoutGuess(); }
    return;
  }
  if (viewStage === "result" && activeQuizObj) {
    if (e.key === " ") { e.preventDefault(); playMainClip(activeQuizObj.exp_audio, "exp", true); }
    else if (e.key === "Enter" || e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); advanceNext(false); }
    else if (e.key.toLowerCase() === "r") { e.preventDefault(); advanceNext(true); }
  }
});

function recalcCounts(modKey) {

  const c = { todo: 0, wip: 0, done: 0, total: items.length };
  items.forEach(it => { c[it.tier] += 1; });
  DATA.mastery[modKey].counts = c;
  return c;
}
