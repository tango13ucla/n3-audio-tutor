<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="screen-orientation" content="portrait" />
<meta name="x5-orientation" content="portrait" />
<meta name="description" content="JLPT N3 · 做题 · 随身听 · 单手记词" />
<meta name="theme-color" content="#F5F2EB" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+JP:wght@500;600&display=swap" rel="stylesheet" />
<title>N3</title>
<style>
  :root {
    /* Traditional Japanese Pigments (日本の伝統色): 生成り · 白練 · 墨 · 苔色 · 黄土 · 弁柄 */
    --washi: #F5F2EB;
    --sheet: #FCFBF8;
    --sumi: #1C1B18;
    --ink-2: #48443C;
    --ink-3: #847E72;
    --hairline: rgba(28, 27, 24, 0.09);
    --hairline-strong: rgba(28, 27, 24, 0.18);
    --track: #E5E0D5;
    --moss: #2B5F49;
    --moss-soft: rgba(43, 95, 73, 0.10);
    --ochre: #B07D3A;
    --bengara: #9E3E36;
    /* Editorial Bilingual Pairing: Japanese Literary Mincho + Clean Chinese Humanist Sans */
    --sans: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", -apple-system, BlinkMacSystemFont, sans-serif;
    --serif-jp: "Hiragino Mincho ProN", "YuMincho", "Noto Serif JP", serif;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--washi);
    color: var(--sumi);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    /* Eliminate Android Chrome Touch-to-Search Google bar on word tap */
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: calc(14px + env(safe-area-inset-top)) 26px calc(16px + env(safe-area-inset-bottom));
  }

  .zen-shell {
    width: 100%;
    max-width: 496px;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  @media (min-width: 860px) {
    body { padding: 34px 48px 34px; }
    .zen-shell { max-width: 590px; }
    .zen-shell.wide-mode { max-width: 800px; }
  }

  button {
    font-family: inherit;
    white-space: nowrap;
    background: none;
    border: none;
    padding: 0;
    color: inherit;
    cursor: pointer;
  }

  /* ================= 1. STRICT GRID HEADER ================= */
  .zen-header {
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--hairline);
  }

  .zen-brand {
    font-size: 15px;
    font-weight: 500;
    color: var(--ink-3);
    letter-spacing: 0.06em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .zen-brand strong {
    font-weight: 600;
    color: var(--sumi);
    margin: 0 2px;
  }

  .zen-nav {
    display: flex;
    align-items: baseline;
    gap: 20px;
  }
  .nav-link {
    font-size: 16.5px;
    font-weight: 500;
    color: var(--ink-3);
    letter-spacing: 0.04em;
    padding: 6px 4px 5px;
    margin: -6px -4px 0;
    position: relative;
    transition: color 0.2s ease;
  }
  .nav-link.active {
    color: var(--sumi);
    font-weight: 600;
  }
  .nav-link.active::after {
    content: "";
    position: absolute;
    left: 4px;
    right: 4px;
    bottom: -15px;
    height: 1.5px;
    background: var(--sumi);
  }
  .nav-link.is-playing {
    color: var(--moss);
  }

  /* ================= 2. THREE ZEN ENSO DAILY RITUALS (円相 · 无字打卡) ================= */
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  .zen-horizon {
    flex-shrink: 0;
    padding: 10px 0 9px;
    border-bottom: 1px solid var(--hairline);
    cursor: pointer;
  }
  .horizon-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--ink-3);
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
    gap: 12px;
  }
  .horizon-meta b {
    font-weight: 600;
    color: var(--sumi);
  }
  .horizon-meta b.moss {
    color: var(--moss);
  }
  .enso-trio {
    display: flex;
    align-items: center;
    gap: 11px;
  }
  .enso-btn {
    width: 32px;
    height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    padding: 0;
    transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease;
  }
  .enso-btn:active {
    transform: scale(0.91);
  }
  .enso-svg {
    width: 26px;
    height: 26px;
    display: block;
    overflow: visible;
  }
  .enso-btn.is-done .enso-svg {
    animation: ensoSettle 0.38s cubic-bezier(0.22, 1, 0.36, 1);
  }
  @keyframes ensoSettle {
    0% { transform: scale(0.88); opacity: 0.72; }
    65% { transform: scale(1.04); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  .horizon-score {
    white-space: nowrap;
    line-height: 1;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--ink-3);
    padding: 8px 0 8px 10px;
    margin: -4px 0;
  }
  .horizon-score .ledger-tag {
    color: var(--ink-2);
    transition: color 0.18s ease;
  }
  .horizon-score.active-ledger .ledger-tag {
    color: var(--sumi);
    font-weight: 600;
  }
  .horizon-track {
    display: none;
  }

  /* ================= 3. OPEN WASHI STAGE (余白 MA + TINDER SWIPE ERGONOMICS) ================= */
  .zen-panel {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .zen-panel.hidden {
    display: none;
  }
  #tutor-view {
    touch-action: pan-y;
  }

  .stage-wrap {
    position: relative;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding-top: 14px;
    animation: fadeTurn 0.18s ease-out;
    will-change: transform, opacity;
  }
  @keyframes fadeTurn {
    from { opacity: 0.48; }
    to { opacity: 1; }
  }

  /* Tactile Tinder-style card physics on Result & Teach pages (frameless open Washi) */
  .stage-wrap.tutor-dragging {
    transition: none !important;
    animation: none !important;
  }
  .stage-wrap.tutor-settling {
    transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease;
  }
  .stage-wrap.tutor-fly-right {
    transform: translate3d(118%, 8px, 0) rotate(6.5deg) !important;
    opacity: 0 !important;
    transition: transform 0.21s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.19s ease !important;
  }
  .stage-wrap.tutor-fly-left {
    transform: translate3d(-118%, 8px, 0) rotate(-6.5deg) !important;
    opacity: 0 !important;
    transition: transform 0.21s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.19s ease !important;
  }
  .tutor-stamp {
    position: absolute;
    top: 46px;
    z-index: 30;
    padding: 4px 11px;
    border-radius: 5px;
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: 0.07em;
    opacity: 0;
    pointer-events: none;
  }
  .tutor-stamp.right {
    left: 2px;
    color: var(--moss);
    border: 1.5px solid var(--moss);
    background: rgba(252, 251, 248, 0.94);
  }
  .tutor-stamp.left {
    right: 2px;
    color: var(--bengara);
    border: 1.5px solid var(--bengara);
    background: rgba(252, 251, 248, 0.94);
  }
  .tutor-stamp.left.moss-tone {
    color: var(--moss);
    border-color: var(--moss);
  }

  .meta-bar {
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    min-height: 28px;
    gap: 12px;
  }
  .overline {
    font-size: 14.5px;
    font-weight: 500;
    letter-spacing: 0.05em;
    color: var(--ink-3);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .overline.ok { color: var(--moss); font-weight: 600; }
  .overline.ng { color: var(--bengara); font-weight: 600; }
  .overline.warm { color: var(--ochre); }

  .quiet-actions {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }
  .text-btn {
    font-size: 14.5px;
    font-weight: 500;
    color: var(--ink-2);
    letter-spacing: 0.03em;
    font-variant-numeric: tabular-nums;
    padding: 8px 5px;
    margin: -6px -5px;
  }
  .text-btn.playing {
    color: var(--moss);
    font-weight: 600;
  }

  /* Center focal space on quiz/done; pin reading views (teach/result) cleanly from the top */
  .focal-space {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding: 16px 0 22px;
    scrollbar-width: none;
    -webkit-mask-image: linear-gradient(to bottom, #000 0, #000 calc(100% - 22px), transparent 100%);
    mask-image: linear-gradient(to bottom, #000 0, #000 calc(100% - 22px), transparent 100%);
  }
  .focal-space > * { flex-shrink: 0; }
  .focal-space::-webkit-scrollbar { display: none; }
  .stage-quiz .focal-space > :first-child,
  .stage-done .focal-space > :first-child { margin-top: auto; }
  .stage-quiz .focal-space > :last-child,
  .stage-done .focal-space > :last-child { margin-bottom: auto; }

  .action-dock {
    flex-shrink: 0;
    padding-top: 10px;
  }

  /* Right-Handed Single-Hand Mobile Ergonomics (<860px):
     Elevate interactive docks out of the bottom bezel cramp into the natural right-thumb sweet arc (~54-82% height),
     cluster quiz prompt + options comfortably, and never require sliding the hand down the phone. */
  @media (max-width: 859px) {
    .action-dock,
    .radio-dock,
    .vc-dock {
      padding-bottom: 38px;
    }
    #tutor-view .stage-quiz .focal-space {
      justify-content: flex-end;
      padding-bottom: 24px;
      -webkit-mask-image: none;
      mask-image: none;
    }
    #tutor-view .stage-quiz .focal-space > :first-child,
    #tutor-view .stage-quiz .focal-space > :last-child {
      margin-top: 0;
      margin-bottom: 0;
    }
    #tutor-view .stage-quiz .quiz-focal {
      min-height: 92px;
      justify-content: flex-end;
    }
    #tutor-view .stage-quiz .listen-medallion-wrap {
      padding: 12px 0 8px;
    }
  }

  /* Desktop vs Mobile Ergonomics (>=860px):
     Quiz centers optically; reading views stay anchored from top so tapping words shifts 0px. */
  @media (min-width: 860px) {
    #tutor-view .stage-wrap {
      justify-content: flex-start;
    }
    #tutor-view .focal-space {
      flex: 0 1 auto;
      justify-content: flex-start;
      padding: 22px 0 2px;
      -webkit-mask-image: none;
      mask-image: none;
    }
    #tutor-view .stage-quiz .focal-space,
    #tutor-view .stage-done .focal-space {
      margin-top: auto;
    }
    #tutor-view .action-dock {
      padding-top: 26px;
    }
    #tutor-view .stage-quiz .action-dock,
    #tutor-view .stage-done .action-dock {
      margin-bottom: auto;
    }
  }

  /* -------- TEACH VIEW -------- */
  .point-heading {
    margin: 0 0 20px;
    font-family: var(--serif-jp);
    font-size: 27.5px;
    font-weight: 600;
    line-height: 1.38;
    letter-spacing: 0.03em;
    color: var(--sumi);
  }
  .zen-pair {
    border-top: 1px solid var(--hairline);
    border-bottom: 1px solid var(--hairline);
    margin-bottom: 20px;
  }
  .zen-pair-row {
    padding: 15px 0;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .zen-pair-row + .zen-pair-row {
    border-top: 1px solid var(--hairline);
  }
  .zp-ja {
    font-family: var(--serif-jp);
    font-size: 22px;
    font-weight: 600;
    color: var(--sumi);
    letter-spacing: 0.025em;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .zp-dot {
    width: 6.5px;
    height: 6.5px;
    border-radius: 50%;
    background: var(--moss);
    flex-shrink: 0;
  }
  .zp-dot.muted {
    background: transparent;
    border: 1.5px solid var(--ink-3);
  }
  .zp-sub {
    padding-left: 16.5px;
    font-size: 16.5px;
    font-weight: 400;
    color: var(--ink-2);
    line-height: 1.6;
  }

  .example-line {
    font-family: var(--serif-jp);
    font-size: 22.5px;
    font-weight: 500;
    line-height: 1.76;
    letter-spacing: 0.03em;
    color: var(--sumi);
    white-space: pre-line;
  }
  .example-zh {
    margin: 8px 0 0;
    font-size: 17px;
    color: var(--ink-2);
    line-height: 1.62;
  }

  /* -------- QUIZ VIEW (Optimal Literary Reading Scale + Blind-Ear Listening) -------- */
  .quiz-focal {
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 116px;
  }
  .quiz-ja {
    margin: 0;
    font-family: var(--serif-jp);
    font-size: 27px;
    font-weight: 600;
    line-height: 1.74;
    letter-spacing: 0.035em;
    color: var(--sumi);
  }
  @media (min-width: 860px) {
    .quiz-ja { font-size: 30px; }
  }

  .listen-medallion-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 0;
  }
  .listen-medallion {
    width: 82px;
    height: 82px;
    border-radius: 50%;
    border: 1px solid var(--hairline-strong);
    background: var(--sheet);
    color: var(--sumi);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.2s ease, transform 0.15s ease;
  }
  .listen-medallion:active { transform: scale(0.96); }
  .listen-medallion.speaking {
    border-color: var(--moss);
    color: var(--moss);
  }
  .med-ic { width: 27px; height: 27px; margin-left: 2px; }
  .med-waves { display: none; align-items: center; gap: 3.5px; height: 24px; }
  .listen-medallion.speaking .med-ic { display: none; }
  .listen-medallion.speaking .med-waves { display: flex; }
  .med-waves span {
    width: 2.5px;
    height: 8px;
    background: var(--moss);
    animation: zenWave 0.9s ease-in-out infinite;
  }
  .med-waves span:nth-child(2) { animation-delay: 0.16s; }
  .med-waves span:nth-child(3) { animation-delay: 0.32s; }
  @keyframes zenWave {
    0%, 100% { height: 6px; opacity: 0.45; }
    50% { height: 20px; opacity: 1; }
  }

  .choice-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .zen-choice {
    width: 100%;
    min-height: 62px;
    padding: 14px 22px;
    background: var(--sheet);
    border: 1px solid var(--hairline-strong);
    border-radius: 8px;
    font-family: var(--serif-jp);
    font-size: 22.5px;
    font-weight: 500;
    color: var(--sumi);
    letter-spacing: 0.03em;
    line-height: 1.44;
    text-align: left;
    white-space: normal;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: border-color 0.16s ease, background 0.16s ease;
  }
  .zen-choice:active { background: #EDEAE1; }

  .listen-num-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }
  .listen-num-btn {
    min-height: 68px;
    background: var(--sheet);
    border: 1px solid var(--hairline-strong);
    border-radius: 8px;
    font-family: var(--serif-jp);
    font-size: 25px;
    font-weight: 600;
    color: var(--sumi);
    font-variant-numeric: tabular-nums;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.16s ease, background 0.16s ease;
  }
  .listen-num-btn:active { background: #EDEAE1; }

  .unsure-btn {
    margin-top: 12px;
    width: 100%;
    min-height: 46px;
    padding: 0 18px;
    border: 1px dashed var(--hairline-strong);
    border-radius: 8px;
    font-size: 15px;
    font-weight: 500;
    color: var(--ink-2);
    letter-spacing: 0.04em;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: border-color 0.16s ease, color 0.16s ease, background 0.16s ease;
  }
  .unsure-btn:active { background: #EDEAE1; }

  .desk-hint { display: none; }
  .kbd-tag {
    display: inline-block;
    font-family: var(--sans);
    font-size: 13px;
    color: var(--ink-3);
    opacity: 0.45;
    font-variant-numeric: tabular-nums;
    margin-left: 10px;
    flex-shrink: 0;
  }
  .unsure-btn .kbd-tag { display: none; }
  @media (min-width: 860px) {
    .zen-choice:hover, .listen-num-btn:hover { border-color: var(--sumi); background: #FFFFFF; }
    .unsure-btn:hover { border-color: var(--sumi); color: var(--sumi); background: rgba(252, 251, 248, 0.72); }
    .kbd-tag { opacity: 1; }
    .unsure-btn .kbd-tag { display: inline-block; }
    .desk-hint {
      display: inline-block;
      font-size: 12.5px;
      font-weight: 400;
      opacity: 0.68;
      letter-spacing: 0.03em;
      margin-left: 10px;
    }
  }
  .quiz-ja {
    cursor: pointer;
  }

  /* -------- RESULT VIEW (3-Step Human Clarity: 句意 -> 为什么用 -> 变形与辨析) -------- */
  .result-ja {
    margin: 0;
    font-family: var(--serif-jp);
    font-size: 22.5px;
    font-weight: 500;
    line-height: 1.68;
    letter-spacing: 0.03em;
    color: var(--sumi);
    white-space: pre-line;
  }
  .ans-hl {
    color: var(--moss);
    font-weight: 600;
  }
  .result-zh {
    margin: 6px 0 0;
    font-size: 15px;
    font-weight: 400;
    color: var(--ink-3);
    line-height: 1.58;
    letter-spacing: 0.012em;
  }
  .dlg {
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .dlg-row {
    display: grid;
    grid-template-columns: auto 1fr;
    column-gap: 10px;
    align-items: baseline;
  }
  .dlg-who {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-3);
    text-align: center;
    min-width: 24px;
    padding: 0 5px;
    box-sizing: border-box;
    white-space: nowrap;
    border: 1px solid var(--hairline);
    border-radius: 5px;
    line-height: 22px;
    height: 22px;
    transform: translateY(-2px);
  }
  .dlg-ja {
    font-family: var(--serif-jp);
    font-size: 19px;
    font-weight: 500;
    line-height: 1.58;
    letter-spacing: 0.02em;
    color: var(--sumi);
  }
  .dlg-row.is-ans .dlg-who {
    color: var(--moss);
    border-color: rgba(43, 95, 73, 0.35);
  }
  .dlg-zh {
    margin-top: 2px;
    font-size: 14px;
    font-weight: 400;
    color: var(--ink-3);
    line-height: 1.52;
    letter-spacing: 0.01em;
  }
  .res-cue {
    display: grid;
    grid-template-columns: auto 1fr;
    column-gap: 9px;
    align-items: baseline;
    margin-bottom: 10px;
  }
  .cue-tag {
    font-family: var(--sans);
    font-size: 11.5px;
    font-weight: 600;
    color: var(--ink-3);
    letter-spacing: 0.04em;
    border: 1px solid var(--hairline-strong);
    border-radius: 4px;
    padding: 1px 6px;
    line-height: 1.45;
    white-space: nowrap;
  }
  .cue-txt {
    font-size: 14.5px;
    font-weight: 400;
    color: var(--ink-2);

座深夜酒馆、村上春树的拟声密码与路边蹲着的成年人", "ja_focus": "平日の昼間は、電車ががらがらだ。子どもの目線に合わせて、しゃがんで話しかけた。", "start": 1515.8, "end": 1848.2}]}, "points": [{"id": "N3-G13", "subject": "语法", "point": "〜そうだ（伝聞 vs 様態）", "point_key": "そうだ（伝聞）", "family": "hearsay_infer", "modality": "both", "exam_weight": 3.0, "roi_score": 4.35, "teach": {"left": {"ja": "降るそうだ", "sub": "原形 ＋ そうだ ＝ 听说（配 によると）"}, "right": {"ja": "降りそうだ", "sub": "ます干 ＋ そうだ ＝ 眼看要（看乌云）"}, "example_ja": "天気予報によると、明日は一日中雨が降るそうだ。", "zh_meaning": "据天气预报说，明天一整天都会下雨。", "audio": "./audio/N3-G13_exp.mp3?v=f71641d2"}, "primary": {"id": "N3-G13", "prompt": "天気予報によると、明日は一日中雨が（　　）。", "choices": ["降るそうだ", "降りそうだ"], "answer": "降るそうだ", "full_ja": "天気予報によると、明日は一日中雨が降るそうだ。", "zh_meaning": "据天气预报说，明天一整天都会下雨。", "why_line": "开头写明了「天気予報によると（根据天气预报）」，是转述听来的消息，不是抬头看乌云。", "form_line": "表「听说」保持动词原形直接接「そうだ」（降るそうだ）；把「る」变成「降りそうだ」则是亲眼看见快要下了。", "opt_notes": {"降るそうだ": "动词原形＋そうだ表传闻（听说），与开头「天気予報によると」严格呼应。", "降りそうだ": "ます形词干＋そうだ表样态（眼看要下雨），不能搭配「〜によると」。"}, "q_audio": "./audio/N3-G13_q.mp3?v=72fa6c98", "exp_audio": "./audio/N3-G13_exp.mp3?v=f71641d2", "is_listening": false}, "variants": [{"id": "VAR-G13", "prompt": "空が真っ暗になってきた。今にも雨が（　　）。", "choices": ["降りそうだ", "降るそうだ"], "answer": "降りそうだ", "full_ja": "空が真っ暗になってきた。今にも雨が降りそうだ。", "zh_meaning": "天空变得一片漆黑，眼看马上就要下雨了。", "why_line": "亲眼看到天黑压压的，「今にも（眼看马上）」说明下雨的苗头就在眼前，不是听广播说的。", "form_line": "看眼前迹象表「快要、看上去很像」用ます形词干接「そうだ」（降ります → 降りそうだ）；原形「降るそうだ」是听说。", "opt_notes": {"降りそうだ": "ます形词干＋そうだ表样态（眼看要下雨），呼应「今にも」。", "降るそうだ": "原形＋そうだ是听说，不能搭配「今にも」。"}, "q_audio": "./audio/VAR-G13_q.mp3?v=a9f9ddde", "exp_audio": "./audio/VAR-G13_exp.mp3?v=f608b70c", "is_listening": false}]}, {"id": "H-20261114-06", "subject": "活用", "point": "五段使役受身短形（〜される）与正式形", "point_key": "V-045", "family": "voice_form", "modality": "memorize", "exam_weight": 2.9, "roi_score": 5.307, "teach": {"left": {"ja": "話す → 話させられた", "sub": "す结尾五段动词唯一正确形 · 不缩约，完整保留させられた"}, "right": {"ja": "話さされた", "sub": "す结尾严禁缩约 · ささ连撞拗口，日语严禁这样缩"}, "example_ja": "昨日のパーティーで、急にみんなの前で日本語でスピーチを話させられた。", "zh_meaning": "昨天派对上，突然在大家面前被迫用日语讲了话。", "audio": "./audio/H-20261114-06_exp.mp3?v=3d3698a9"}, "primary": {"id": "H-20261114-06", "prompt": "昨日のパーティーで、急にみんなの前で日本語でスピーチを（　　）。", "choices": ["話させられた", "話さされた", "話しさせられた"], "answer": "話させられた", "full_ja": "昨日のパーティーで、急にみんなの前で日本語でスピーチを話させられた。", "zh_meaning": "昨天派对上，突然在大家面前被迫用日语讲了话。", "why_line": "原本没打算上台，是被大家起哄推上去「被迫发言」，要用使役受身形。", "form_line": "五段动词「話す」以「す」结尾，变使役受身不能缩约，只能先变「話させ」再加「られた」＝「話させられた」。", "opt_notes": {"話させられた": "「す」结尾五段动词的使役受身不能缩约，只能用完整形「話させられた」。", "話さされた": "错误缩约：「す」结尾五段动词严禁缩成「〜さされた」。", "話しさせられた": "接续错误：误拿ます形词干「話し」去硬接「させられた」。"}, "q_audio": "./audio/H-20261114-06_q.mp3?v=dd2a5112", "exp_audio": "./audio/H-20261114-06_exp.mp3?v=3d3698a9", "is_listening": false}, "variants": [{"id": "VAR-H06", "prompt": "子どもの頃、母に嫌いな牛乳を毎日（　　）。", "choices": ["飲まされた", "飲みさせられた"], "answer": "飲まされた", "full_ja": "子どもの頃、母に嫌いな牛乳を毎日飲まされた。", "zh_meaning": "小时候，每天都被妈妈逼着喝讨厌的牛奶。", "why_line": "自己不想喝却被妈妈要求喝，「被迫做某事」要用使役受身形。", "form_line": "非「す」结尾的五段动词「飲む」，词尾「む」变あ段「ま」加缩约形「された」＝「飲まされた」，绝没有「飲みさせられた」。", "opt_notes": {"飲まされた": "「飲む」的标准使役受身缩约形（被迫喝）。", "飲みさせられた": "接续错误，五段动词不以ます干接させられる。"}, "q_audio": "./audio/VAR-H06_q.mp3?v=8b76be72", "exp_audio": "./audio/VAR-H06_exp.mp3?v=e64f9961", "is_listening": false}]}, {"id": "V-20261114-08", "subject": "词汇", "point": "出張", "point_key": "出張", "family": "kanji_reading", "modality": "memorize", "exam_weight": 2.2, "roi_score": 2.2, "teach": {"left": {"ja": "出張 → しゅっちょう", "sub": "有促音「っ」＋有长音「う」 · 出（しゅつ）遇ち音变促音＝出差"}, "right": {"ja": "主張 → しゅちょう", "sub": "无促音「っ」＋有长音「う」 · 漏掉促音就变成「主张观点」"}, "example_ja": "来週から三日間、大阪へ出張します。", "zh_meaning": "下周起要去大阪出差三天。", "audio": "./audio/V-20261114-08_exp.mp3?v=ffb30e10"}, "primary": {"id": "V-20261114-08", "prompt": "来週から三日間、大阪へ「出張」します。「出張」の読み方は？", "choices": ["しゅっちょう", "しゅちょう", "しゅっちょ"], "answer": "しゅっちょう", "full_ja": "来週から三日間、大阪へ出張します。", "zh_meaning": "下周起要去大阪出差三天。", "why_line": "考高频职场词「出張（出差）」的促音与长音组合。", "form_line": "「出（しゅっ）」带促音停顿，「張（ちょう）」带长音，合起来是「しゅっちょう」；漏掉促音念「しゅちょう」就变成「主張（主张观点）」。", "opt_notes": {"しゅっちょう": "中间促音「っ」与末尾长音「う」俱全，「出張（出差）」标准读音。", "しゅちょう": "漏掉中间促音，会变成另一个词「主張（主张观点）」。", "しゅっちょ": "漏掉了「張（ちょう）」末尾的长音「う」。"}, "q_audio": "./audio/V-20261114-08_q.mp3?v=163abd46", "exp_audio": "./audio/V-20261114-08_exp.mp3?v=ffb30e10", "is_listening": false}, "variants": []}, {"id": "Q-20261114-001", "subject": "听力", "point": "〜なきゃ", "point_key": "N3L-015", "family": "listen_contract", "modality": "listen", "exam_weight": 3.0, "roi_score": 3.0, "teach": {"left": {"ja": "夕飯の支度しないと！", "sub": "＝ しないと【いけない】 · 必须赶紧去做晚饭。（100%要做）"}, "right": {"ja": "作らなくていい", "sub": "〜なくていい · 这才是「不用做也可以」"}, "example_ja": "女：あ、もう五時だ。早く帰って、夕飯の支度しないと。\n男：ほんとだ、急いで帰ろう。", "zh_meaning": "女：「啊，都五点了！得赶紧回去准备晚饭了。」 男：「真的耶，赶紧回去吧。」", "audio": "./audio/Q-20261114-001_exp.mp3?v=231a602a"}, "primary": {"id": "Q-20261114-001", "prompt": "", "choices": ["じゃあ、今日は作らなくていいね。", "ほんとだ、急いで帰ろう。", "夕飯、おいしかったね。"], "answer": "ほんとだ、急いで帰ろう。", "full_ja": "女：あ、もう五時だ。早く帰って、夕飯の支度しないと。\n男：ほんとだ、急いで帰ろう。", "zh_meaning": "女：「啊，都五点了！得赶紧回去准备晚饭了。」 男：「真的耶，赶紧回去吧。」", "why_line": "女生看表催着赶紧回家做晚饭，口语句尾「〜しないと」省略了「いけない」，意思是必须赶紧做。", "form_line": "第 2 句附和赶紧回家；第 1 句把「しないと」听反成不用做；第 3 句过去式时态不对。", "opt_notes": {"じゃあ、今日は作らなくていいね。": "「那今天不用做了呢。」把口语 しないと（必须做）听反了。", "ほんとだ、急いで帰ろう。": "「真的耶，赶紧回去吧。」顺着女生催回家做晚饭自然回应。", "夕飯、おいしかったね。": "「晚饭真好吃呢。」时态不对，晚饭还没开始准备。"}, "q_audio": "./audio/Q-20261114-001_q.mp3?v=44c6dd4b", "exp_audio": "./audio/Q-20261114-001_exp.mp3?v=231a602a", "is_listening": true}, "variants": [{"id": "VAR-L01", "prompt": "", "choices": ["うん、今すぐ払わないとね。", "じゃあ、払わなくてもいいんだね。", "昨日もう払ったよ。"], "answer": "うん、今すぐ払わないとね。", "full_ja": "男：あ、電気代の支払い、今日までだった！早く払わなくちゃ。\n女：うん、今すぐ払わないとね。", "zh_meaning": "男：「啊，电费今天截止！得赶紧交才行。」 女：「嗯，得马上交了呢。」", "why_line": "「払わなくちゃ」和「払わないと」都是口语里的「必须赶紧交」（省略了いけない）。", "form_line": "第 1 句顺着附和马上交；第 2 句把「なくちゃ」听反成不用交；第 3 句与刚发现没交矛盾。", "opt_notes": {"うん、今すぐ払わないとね。": "「嗯，得马上交了呢。」用同义口语 払わないと 顺着附和。", "じゃあ、払わなくてもいいんだね。": "「那不用交了呢。」把口语 払わなくちゃ（必须交）听反了。", "昨日もう払ったよ。": "「昨天已经交了哦。」与男生刚发现还没交矛盾。"}, "q_audio": "./audio/VAR-L01_q.mp3?v=0f743c91", "exp_audio": "./audio/VAR-L01_exp.mp3?v=4a6a7c5f", "is_listening": true}]}, {"id": "N3-G21", "subject": "语法", "point": "〜ことはない", "point_key": "〜ことはない", "family": "modal_end", "modality": "listen", "exam_weight": 2.4, "roi_score": 3.312, "teach": {"left": {"ja": "心配することはない", "sub": "原形 ＋ ことはない ＝ 没必要、用不着"}, "right": {"ja": "〜はずがない", "sub": "按理绝对不可能（100%否定推断）"}, "example_ja": "軽い風邪だから、そんなに心配することはないよ。", "zh_meaning": "只是轻微感冒，用不着那么担心哦。", "audio": "./audio/N3-G21_exp.mp3?v=6b0de7f6"}, "primary": {"id": "N3-G21", "prompt": "軽い風邪だから、そんなに心配する（　　）よ。", "choices": ["ことはない", "はずがない"], "answer": "ことはない", "full_ja": "軽い風邪だから、そんなに心配することはないよ。", "zh_meaning": "只是轻微感冒，用不着那么担心哦。", "why_line": "说话人是在温言宽慰对方「没必要那么紧张」，而不是推断「对方绝不可能担心」。", "form_line": "动词原形接「ことはない」意思是没必要、用不着；「はずがない」则是按理绝对不可能发生。", "opt_notes": {"ことはない": "意为「没必要、用不着担心」，口语宽慰高频句型。", "はずがない": "意为「按道理绝不可能担心」，不符合宽慰语境。"}, "q_audio": "./audio/N3-G21_q.mp3?v=160cd4f6", "exp_audio": "./audio/N3-G21_exp.mp3?v=6b0de7f6", "is_listening": false}, "variants": []}, {"id": "H-20261114-05", "subject": "活用", "point": "五段动词 使役形（词尾あ段＋せる）", "point_key": "V-037", "family": "voice_form", "modality": "both", "exam_weight": 3.0, "roi_score": 4.35, "teach": {"left": {"ja": "休ませていただけませんか", "sub": "使役（允许我休）＋いただく · 部长，能批准我请假吗？"}, "right": {"ja": "休んでいただけませんか", "sub": "漏掉使役させて · 变成：部长，请您去休息好吗？"}, "example_ja": "部長、来週の金曜日、私用で会社を休ませていただけないでしょうか。", "zh_meaning": "部长，下周五我有点私事，能不能请您准我休一天假？", "audio": "./audio/H-20261114-05_exp.mp3?v=4c91402d"}, "primary": {"id": "H-20261114-05", "prompt": "部長、来週の金曜日、私用で会社を（　　）でしょうか。", "choices": ["休ませていただけない", "休んでいただけない", "休まれていただけない"], "answer": "休ませていただけない", "full_ja": "部長、来週の金曜日、私用で会社を休ませていただけないでしょうか。", "zh_meaning": "部长，下周五我有点私事，能不能请您准我休一天假？", "why_line": "休假的人是「我自己」，是在请求上级放行「允许我去休假」，千万不能说成「请部长您去休假」。", "form_line": "先把「休む」变成使役形「休ませて（让我休）」，再接自谦请求「いただけないでしょうか」；漏掉「させて」就会变成请部长休假。", "opt_notes": {"休ませていただけない": "使役形「休ませて（让我休）」加自谦请求「いただけない」，得体请求准假。", "休んでいただけない": "漏掉了使役「させて」，意思变成「请部长您去休假」。", "休まれていただけない": "把受身形硬拼上去，日语中没有这种说法。"}, "q_audio": "./audio/H-20261114-05_q.mp3?v=c78eb665", "exp_audio": "./audio/H-20261114-05_exp.mp3?v=4c91402d", "is_listening": false}, "variants": [{"id": "VAR-H05", "prompt": "少し熱があるので、今日は早めに（　　）いただけませんか。", "choices": ["帰らせて", "帰って"], "answer": "帰らせて", "full_ja": "少し熱があるので、今日は早めに帰らせていただけませんか。", "zh_meaning": "我稍微有点发烧，今天能不能请您准我早点回去？", "why_line": "发烧想早退的人是「我自己」，向上级求批准「允许我先回去」。", "form_line": "五段动词「帰る」词尾「る」变あ段「ら」加「せて」，连成「帰らせていただけませんか」；漏掉「せて」就变成劝上级回家了。", "opt_notes": {"帰らせて": "使役＋ていただけませんか＝恳请准许我早退。", "帰って": "「帰っていただけませんか」意为请对方回去，对象完全搞反。"}, "q_audio": "./audio/VAR-H05_q.mp3?v=ff925f25", "exp_audio": "./audio/VAR-H05_exp.mp3?v=b6380278", "is_listening": false}]}, {"id": "V-20261114-03", "subject": "词汇", "point": "内緒", "point_key": "内緒", "family": "kanji_reading", "modality": "memorize", "exam_weight": 2.2, "roi_score": 1.364, "teach": {"left": {"ja": "な・い・しょ", "sub": "3拍干脆收尾（无长音。） · 嘘🤫 保密要短促收声，绝不拖尾巴"}, "right": {"ja": "ないしょう / ないしゅ", "sub": "中文母语高频误读陷阱 · 「緒」在此处念短音 しょ，不带 う"}, "example_ja": "この話はみんなには内緒にしておいてね。", "zh_meaning": "这件事请替我向大家保密哦。", "audio": "./audio/V-20261114-03_exp.mp3?v=33a7a142"}, "primary": {"id": "V-20261114-03", "prompt": "この話はみんなには「内緒」にしておいてね。", "choices": ["ないしょ", "ないしょう"], "answer": "ないしょ", "full_ja": "この話はみんなには内緒にしておいてね。", "zh_meaning": "这件事请替我向大家保密哦。", "why_line": "「内緒にしておく」是日常高频表达「替我保密、别往外说」，考汉字「緒」的长短音。", "form_line": "「内緒」只有三拍，末尾是干脆的短音「しょ」（ないしょ），后面绝对没有长音「う」。", "opt_notes": {"ないしょ": "「内緒」标准读音（⓪型平调 3拍），尾音 しょ 短促利落，常搭「内緒にする（保密）」。", "ないしょう": "受中文后鼻音或「紹介（しょうかい）」干扰产生的典型长音误读，日语中无此读法。"}, "q_audio": "./audio/V-20261114-03_q.mp3?v=c33ed83a", "exp_audio": "./audio/V-20261114-03_exp.mp3?v=33a7a142", "is_listening": false}, "variants": []}, {"id": "N3-L07", "subject": "听力", "point": "聴解「〜とかないと」提前办妥", "point_key": "N3L-048", "family": "listen_contract", "modality": "listen", "exam_weight": 3.0, "roi_score": 5.49, "teach": {"left": {"ja": "買っとかないと", "sub": "買っておかないと · 不提前买好不行"}, "right": {"ja": "買わなくていい", "sub": "听反成了不用买"}, "example_ja": "女：明日の朝は早いから、今日のうちにお弁当と飲み物、買っとかないとね。", "zh_meaning": "女：「明天一早要出发，今天之内得先把便当和饮料买好才行呢。」", "audio": "./audio/N3-L07_exp.mp3?v=88684bda"}, "primary": {"id": "N3-L07", "prompt": "", "choices": ["そうだね、今のうちに買っておこう。", "じゃあ、ガソリンは入れなくていいね。", "昨日はドライブ楽しかったね。"], "answer": "そうだね、今のうちに買っておこう。", "full_ja": "女：明日の朝は早いから、今日のうちにお弁当と飲み物、買っとかないとね。", "zh_meaning": "女：「明天一早要出发，今天之内得先把便当和饮料买好才行呢。」", "why_line": "「買っとかないと」是「買っておかないといけない」的口语连缩，意思是必须提前买好。", "form_line": "第 1 项「趁现在买好吧」精准呼应；第 2 项把必须做听反成了不用做且跑题；第 3 项时态错误。", "opt_notes": {"そうだね、今のうちに買っておこう。": "「是啊，趁现在提前买好吧。」精准接住口语缩音 買っとかないと。", "じゃあ、ガソリンは入れなくていいね。": "「那不用加油了呢。」既跑题又把必须提前做听反成了不用做。", "昨日はドライブ楽しかったね。": "「昨天兜风真开心呢。」时态与内容均无关。"}, "q_audio": "./audio/N3-L07_q.mp3?v=22647194", "exp_audio": "./audio/N3-L07_exp.mp3?v=88684bda", "is_listening": true}, "variants": []}, {"id": "G-20261114-01", "subject": "语法", "point": "〜てくれる／もらう", "point_key": "〜てくれる／もらう", "family": "keigo_give", "modality": "both", "exam_weight": 3.0, "roi_score": 3.21, "teach": {"left": {"ja": "先輩に ＋ もらった", "sub": "我是主语（私は） · 我从前辈那儿「得到教导」"}, "right": {"ja": "先輩が ＋ くれた", "sub": "别人是主语（先輩が） · 前辈主动「教给了我」"}, "example_ja": "わからない問題があったので、私は先輩に解き方を教えてもらった。", "zh_meaning": "因为有不会的题，我请前辈教了我解法。", "audio": "./audio/G-20261114-01_exp.mp3?v=45fc72ef"}, "primary": {"id": "G-20261114-01", "prompt": "私は先輩に解き方を教えて（　　）。", "choices": ["もらった", "くれた"], "answer": "もらった", "full_ja": "わからない問題があったので、私は先輩に解き方を教えてもらった。", "zh_meaning": "因为有不会的题，我请前辈教了我解法。", "why_line": "整句话的主语是「我」，前辈后面标了「に」，是站在「我从前辈那里得到帮助」的角度在说。", "form_line": "我得到帮助接「もらった」（教えてもらった）；只有主语是前辈主动帮我（先輩が）才用「くれた」。", "opt_notes": {"もらった": "句中是「私は＋先輩に」，我作主语向对方请教受益，必用 てもらう。", "くれた": "要求别人作主语（「先輩が私に教えてくれた」），不能接在「私は先輩に」后面。"}, "q_audio": "./audio/G-20261114-01_q.mp3?v=aec3cb11", "exp_audio": "./audio/G-20261114-01_exp.mp3?v=45fc72ef", "is_listening": false}, "variants": [{"id": "VAR-G01", "prompt": "道に迷っていたら、親切な人が駅まで案内して（　　）。", "choices": ["くれた", "もらった"], "answer": "くれた", "full_ja": "道に迷っていたら、親切な人が駅まで案内してくれた。", "zh_meaning": "正迷路的时候，一位热心人主动带我去了车站。", "why_line": "句子主语是「親切な人が（热心人）」，别人主动向我伸出援手，站在对方给我的方向说。", "form_line": "「别人が＋てくれた」（别人主动帮我）对应「私が＋てもらった」（我请别人帮我）。", "opt_notes": {"くれた": "主语是「親切な人が」，对方主动为我带路，必用「てくれた」。", "もらった": "需要我作主语且搭配「親切な人に案内してもらった」。"}, "q_audio": "./audio/VAR-G01_q.mp3?v=0681bc35", "exp_audio": "./audio/VAR-G01_exp.mp3?v=68627df9", "is_listening": false}]}, {"id": "H-20261114-02", "subject": "活用", "point": "五段动词 受身形（词尾あ段＋れる）", "point_key": "V-032", "family": "voice_form", "modality": "both", "exam_weight": 3.0, "roi_score": 1.86, "teach": {"left": {"ja": "踏まれる（れ＝受身）", "sub": "受害被动：我倒霉被踩 · 隣の人に足を踏まれた"}, "right": {"ja": "踏ませる（せ＝使役）", "sub": "s音＝使唤/强迫别人做 · 逼别人去踩（意思全反了。）"}, "example_ja": "満員電車の中で、隣の人に足を踏まれて痛かった。", "zh_meaning": "在挤满人的电车里，被旁边的人踩了脚，很疼。", "audio": "./audio/H-20261114-02_exp.mp3?v=0dd1c820"}, "primary": {"id": "H-20261114-02", "prompt": "満員電車の中で、隣の人に足を（　　）痛かった。", "choices": ["踏まれて", "踏ませて"], "answer": "踏まれて", "full_ja": "満員電車の中で、隣の人に足を踏まれて痛かった。", "zh_meaning": "在挤满人的电车里，被旁边的人踩了脚，很疼。", "why_line": "我是倒霉挨踩的受害者，「被别人踩了脚」要用受身（被动），不可能是我指使别人来踩我。", "form_line": "五段动词「踏む」词尾「む」变あ段「ま」加「れる」，て形就是「踏まれて」；带「せ」的「踏ませて」是使役（让别人踩）。", "opt_notes": {"踏まれて": "踏む的受害受身形（踏まれる），「人に足を踏まれる」是日语最典型的受害被动句。", "踏ませて": "踏む的使役形（踏ませる），变成「我让/逼旁边的人踩我的脚」，逻辑荒谬。"}, "q_audio": "./audio/H-20261114-02_q.mp3?v=f28a70df", "exp_audio": "./audio/H-20261114-02_exp.mp3?v=0dd1c820", "is_listening": false}, "variants": [{"id": "VAR-H02", "prompt": "母は野菜嫌いの子どもにピーマンを（　　）。", "choices": ["食べさせた", "食べられた"], "answer": "食べさせた", "full_ja": "母は野菜嫌いの子どもにピーマンを食べさせた。", "zh_meaning": "妈妈让讨厌吃蔬菜的孩子把青椒吃下去了。", "why_line": "主语是「妈妈」，妈妈督促要求孩子去吃，属于「让别人做某事」的使役句。", "form_line": "一段动词「食べる」去掉「る」加「させる」，过去式就是「食べさせた」；「食べられた」是被动被吃掉。", "opt_notes": {"食べさせた": "使役形，表示妈妈让孩子吃青椒。", "食べられた": "受身形（被偷吃），语义不符。"}, "q_audio": "./audio/VAR-H02_q.mp3?v=095a1d22", "exp_audio": "./audio/VAR-H02_exp.mp3?v=8f30739a", "is_listening": false}]}, {"id": "N3-V12", "subject": "词汇", "point": "ついてない（倒霉）", "point_key": "ついてない", "family": "idiom_luck", "modality": "listen", "exam_weight": 2.8, "roi_score": 5.124, "teach": {"left": {"ja": "今日はついてない", "sub": "运背、点背、真倒霉"}, "right": {"ja": "運がついている", "sub": "走运、手气好"}, "example_ja": "財布を落とすし、急な雨にも降られるし、今日は本当についてない。", "zh_meaning": "既丢了钱包，又被突如其来的雨淋了，今天真是点背透了。", "audio": "./audio/N3-V12_exp.mp3?v=199d9581"}, "primary": {"id": "N3-V12", "prompt": "財布を落とすし、急な雨にも降られるし、今日は本当に（　　）。", "choices": ["ついてない", "かまわない"], "answer": "ついてない", "full_ja": "財布を落とすし、急な雨にも降られるし、今日は本当についてない。", "zh_meaning": "既丢了钱包，又被突如其来的雨淋了，今天真是点背透了。", "why_line": "前面用「〜し、〜し」连举两件倒霉事，句尾感叹今天运气太差。", "form_line": "口语说手气背、倒霉固定用「ついてない」（運がついていない）；「かまわない」是不在乎。", "opt_notes": {"ついてない": "惯用语，意为「运气不好、真倒霉」。", "かまわない": "意为「没关系、不在乎」，不符合连连倒霉的叹息。"}, "q_audio": "./audio/N3-V12_q.mp3?v=96bda144", "exp_audio": "./audio/N3-V12_exp.mp3?v=199d9581", "is_listening": false}, "variants": []}, {"id": "N3-L10", "subject": "听力", "point": "聴解「〜ことにした」拍板决定", "point_key": "N3L-085", "family": "listen_decision", "modality": "listen", "exam_weight": 2.8, "roi_score": 4.06, "teach": {"left": {"ja": "やめておくことにした", "sub": "最后拍板决定今天先作罢不买"}, "right": {"ja": "どっちもいいけど", "sub": "前半句铺垫，转折后才是真结论"}, "example_ja": "女：黒いのと白いの、どっちもいいけど、やっぱり今日はやめておくことにした。\n男：そっか、高い買い物だし、ゆっくり考えたほうがいいね。", "zh_meaning": "女：「黑的和白的都不错，不过思来想去今天还是决定先不买了。」 男：「这样啊，毕竟挺贵的，慢慢考虑比较好。」", "audio": "./audio/N3-L10_exp.mp3?v=9952b95c"}, "primary": {"id": "N3-L10", "prompt": "", "choices": ["黒い靴を買う", "白い靴を買う", "今日は何も買わない"], "answer": "今日は何も買わない", "full_ja": "女：黒いのと白いの、どっちもいいけど、やっぱり今日はやめておくことにした。\n男：そっか、高い買い物だし、ゆっくり考えたほうがいいね。", "zh_meaning": "女：「黑的和白的都不错，不过思来想去今天还是决定先不买了。」 男：「这样啊，毕竟挺贵的，慢慢考虑比较好。」", "why_line": "转折词「けど」之后才是真决定：「今日はやめておくことにした（决定今天先作罢不买）」。", "form_line": "第 3 项今天什么都不买正确；第 1、2 项都是转折前的烟雾弹。", "opt_notes": {"黒い靴を買う": "前半句只说黑色白色都不错，但「けど」后已放弃。", "白い靴を買う": "同上，属于转折前的干扰项。", "今日は何も買わない": "女生明确说「今日はやめておくことにした」（决定今天先不买）。"}, "q_audio": "./audio/N3-L10_q.mp3?v=9387a193", "exp_audio": "./audio/N3-L10_exp.mp3?v=9952b95c", "is_listening": true}, "variants": []}, {"id": "G-20261114-05", "subject": "语法", "point": "〜にしたがって", "point_key": "〜にしたがって", "family": "change_flow", "modality": "both", "exam_weight": 2.8, "roi_score": 2.8, "teach": {"left": {"ja": "〜にしたがって", "sub": "↗ 伴随同步渐变 · 台风越近，风雨越强（配 だんだん）"}, "right": {"ja": "〜ついでに", "sub": "🚶 人顺手做第二件事 · 散步顺便寄封信（自然现象禁用。）"}, "example_ja": "台風が近づくにしたがって、風も雨もだんだん強くなってきた。", "zh_meaning": "随着台风靠近，风和雨都渐渐变大了。", "audio": "./audio/G-20261114-05_exp.mp3?v=240e1df8"}, "primary": {"id": "G-20261114-05", "prompt": "台風が近づく（　　）、風も雨も強くなってきた。", "choices": ["にしたがって", "ついでに"], "answer": "にしたがって", "full_ja": "台風が近づくにしたがって、風も雨もだんだん強くなってきた。", "zh_meaning": "随着台风靠近，风和雨都渐渐变大了。", "why_line": "台风越走越近，风雨也跟着越来越大，两边是同步渐变的关系。", "form_line": "动词原形接「にしたがって」表示随着一方变化另一方也跟着变；「ついでに」是人做一件事时顺手做另一件事，自然现象不能用。", "opt_notes": {"にしたがって": "表示随着前项推进，后项同步发生渐变，完美呼应后半句「だんだん強くなってきた」。", "ついでに": "意为「顺便…」，主语必须是有意识的人（如买菜顺便取快递），自然现象绝对禁用。"}, "q_audio": "./audio/G-20261114-05_q.mp3?v=b2c427d8", "exp_audio": "./audio/G-20261114-05_exp.mp3?v=240e1df8", "is_listening": false}, "variants": [{"id": "VAR-G05", "prompt": "スーパーへ買い物に行く（　　）、郵便局で手紙を出した。", "choices": ["ついでに", "にしたがって"], "answer": "ついでに", "full_ja": "スーパーへ買い物に行くついでに、郵便局で手紙を出した。", "zh_meaning": "去超市买东西的时候，顺便在邮局寄了封信。", "why_line": "去超市是主要行程，寄信只是半路顺手办的小事，属于「顺便做某事」。", "form_line": "动词原形接「ついでに」表示顺便；「にしたがって」则是随着一方变化另一方同步渐变。", "opt_notes": {"ついでに": "有意识的人在去超市途中顺便寄信。", "にしたがって": "表伴随同步渐变，不能用于顺便寄信。"}, "q_audio": "./audio/VAR-G05_q.mp3?v=d18d6e69", "exp_audio": "./audio/VAR-G05_exp.mp3?v=a18cfc1c", "is_listening": false}]}, {"id": "N3-H09", "subject": "活用", "point": "五段可能形（え段＋る）", "point_key": "V-027", "family": "potential_form", "modality": "memorize", "exam_weight": 3.0, "roi_score": 1.86, "teach": {"left": {"ja": "読む → 読める", "sub": "五段可能形：词尾 u段 → e段＋る"}, "right": {"ja": "読む → 読まれる", "sub": "あ段＋れる 是受身/尊敬，不是能读"}, "example_ja": "辞書がなくても、日本の新聞が少し読めるようになった。", "zh_meaning": "就算不用词典，也渐渐能读懂一点日本报纸了。", "audio": "./audio/N3-H09_exp.mp3?v=d44544bd"}, "primary": {"id": "N3-H09", "prompt": "辞書がなくても、日本の新聞が少し（　　）ようになった。", "choices": ["読める", "読まれる"], "answer": "読める", "full_ja": "辞書がなくても、日本の新聞が少し読めるようになった。", "zh_meaning": "就算不用词典，也渐渐能读懂一点日本报纸了。", "why_line": "句尾接「ようになった」，描述个人能力从不会变成「能读了」，要用可能形。", "form_line": "五段动词「読む」把词尾う段「む」推到え段「め」加「る」＝「読める（能读）」；「読まれる」是被动或尊敬。", "opt_notes": {"読める": "「読む」的可能形，搭配「〜ようになった」表变得能读报纸了。", "読まれる": "「読む」的被动/尊敬形，不能表达个人阅读能力提升。"}, "q_audio": "./audio/N3-H09_q.mp3?v=dfc765fe", "exp_audio": "./audio/N3-H09_exp.mp3?v=d44544bd", "is_listening": false}, "variants": []}, {"id": "N3-V13", "subject": "词汇", "point": "うっとり（陶醉入迷）", "point_key": "うっとり", "family": "kana_adverb", "modality": "listen", "exam_weight": 2.8, "roi_score": 5.124, "teach": {"left": {"ja": "音色にうっとりする", "sub": "被美景音乐迷住、如痴如醉"}, "right": {"ja": "疲れてぐったりする", "sub": "累得瘫软无力、筋疲力尽"}, "example_ja": "あまりに美しいピアノの音色に、会場のみんながうっとり聞き入った。", "zh_meaning": "钢琴的音色太美了，全场听众都听得如痴如醉。", "audio": "./audio/N3-V13_exp.mp3?v=83bb689e"}, "primary": {"id": "N3-V13", "prompt": "あまりに美しいピアノの音色に、会場のみんなが（　　）聞き入った。", "choices": ["うっとり", "ぐったり"], "answer": "うっとり", "full_ja": "あまりに美しいピアノの音色に、会場のみんながうっとり聞き入った。", "zh_meaning": "钢琴的音色太美了，全场听众都听得如痴如醉。", "why_line": "形容被优美的音乐、夜景或美人吸引得神魂颠倒、陶醉出神。", "form_line": "陶醉入迷用「うっとり」；「ぐったり」是累得瘫在沙发上浑身没劲。", "opt_notes": {"うっとり": "形容被美好事物吸引得陶醉出神。", "ぐったり": "形容精疲力竭瘫软无力。"}, "q_audio": "./audio/N3-V13_q.mp3?v=124d43d2", "exp_audio": "./audio/N3-V13_exp.mp3?v=83bb689e", "is_listening": false}, "variants": []}, {"id": "N3-L08", "subject": "听力", "point": "聴解「〜ちゃった」遗憾做完", "point_key": "N3L-010", "family": "listen_contract", "modality": "listen", "exam_weight": 2.9, "roi_score": 4.002, "teach": {"left": {"ja": "降りちゃった", "sub": "降りてしまった · 糟糕下车了"}, "right": {"ja": "置いたまま", "sub": "包还落在行李架上原封未动"}, "example_ja": "男：あ、大変！網棚の上にかばん置いたまま、電車降りちゃった！", "zh_meaning": "男：「啊，糟了！包还放在行李架上，我就这么下电车了！」", "audio": "./audio/N3-L08_exp.mp3?v=9a9a0ccf"}, "primary": {"id": "N3-L08", "prompt": "", "choices": ["えっ、急いで駅に電話して聞いてみよう。", "じゃあ、これから電車に乗るんだね。", "新しいかばん、買えてよかったね。"], "answer": "えっ、急いで駅に電話して聞いてみよう。", "full_ja": "男：あ、大変！網棚の上にかばん置いたまま、電車降りちゃった！", "zh_meaning": "男：「啊，糟了！包还放在行李架上，我就这么下电车了！」", "why_line": "「置いたまま（原封不动落着）」配「降りちゃった（降りてしまった，糟了已经下车了）」。", "form_line": "第 1 项赶紧给车站打电话询问最合情理；第 2 项以为还没上车；第 3 项误听成买新包。", "opt_notes": {"えっ、急いで駅に電話して聞いてみよう。": "「啊？赶紧给车站打电话问问吧。」听懂他把包忘车上已经下车了。", "じゃあ、これから電車に乗るんだね。": "「那你接下来要坐电车呀。」时态听反，已经下车了。", "新しいかばん、買えてよかったね。": "「买到新包真好呀。」把丢包听成了买包。"}, "q_audio": "./audio/N3-L08_q.mp3?v=f4bf92f3", "exp_audio": "./audio/N3-L08_exp.mp3?v=9a9a0ccf", "is_listening": true}, "variants": []}, {"id": "G-20261114-03", "subject": "语法", "point": "〜からこそ", "point_key": "〜からこそ", "family": "reason_contrast", "modality": "both", "exam_weight": 2.4, "roi_score": 2.4, "teach": {"left": {"ja": "〜からこそ", "sub": "正向唯一核心原因 · 正因为苦练 → 才夺冠（〜のだ）"}, "right": {"ja": "〜くせに", "sub": "逆接＋责备不满 · 明明知道 → 却故意不说"}, "example_ja": "毎日こつこつ練習したからこそ、今日の試合で優勝できたのだ。", "zh_meaning": "正因为每天踏踏实实练习，今天比赛才拿到了冠军。", "audio": "./audio/G-20261114-03_exp.mp3?v=e6ea8a5e"}, "primary": {"id": "G-20261114-03", "prompt": "毎日こつこつ練習した（　　）、優勝できたのだ。", "choices": ["からこそ", "くせに"], "answer": "からこそ", "full_ja": "毎日こつこつ練習したからこそ、今日の試合で優勝できたのだ。", "zh_meaning": "正因为每天踏踏实实练习，今天比赛才拿到了冠军。", "why_line": "前后是积极的因果关系，想突出「正是靠着前面的努力，才换来后面的好结果」。", "form_line": "「から」表原因，「こそ」表强调，合起来「からこそ」就是正因为；「くせに」带责备语气（明明却），不能用来夸奖。", "opt_notes": {"からこそ": "「正因为每天踏实练习才夺冠」，与句尾强调原因的「〜のだ」严丝合缝。", "くせに": "意为「明明…却…」，带强烈批评与不满口气，绝不用于正面因果。"}, "q_audio": "./audio/G-20261114-03_q.mp3?v=f6fc490b", "exp_audio": "./audio/G-20261114-03_exp.mp3?v=e6ea8a5e", "is_listening": false}, "variants": []}, {"id": "H-20261114-07", "subject": "活用", "point": "終わる ↔ 終える／終わらせる", "point_key": "T-006", "family": "transitivity", "modality": "both", "exam_weight": 2.8, "roi_score": 1.736, "teach": {"left": {"ja": "仕事を終わらせる", "sub": "宾语を＋使役他动化（把工作干完） · 也可说书面他动词：仕事を終える"}, "right": {"ja": "仕事が終わる", "sub": "主语が＋自动词（工作自然结束） · 自动词不能带宾语「仕事を」"}, "example_ja": "旅行に行く前に、今週中にこの仕事を全部終わらせてしまいたい。", "zh_meaning": "去旅行之前，我想在本周内把这项工作全部做完。", "audio": "./audio/H-20261114-07_exp.mp3?v=d965e182"}, "primary": {"id": "H-20261114-07", "prompt": "旅行に行く前に、今週中にこの仕事を全部（　　）しまいたい。", "choices": ["終わらせて", "終わって", "終わられて"], "answer": "終わらせて", "full_ja": "旅行に行く前に、今週中にこの仕事を全部終わらせてしまいたい。", "zh_meaning": "去旅行之前，我想在本周内把这项工作全部做完。", "why_line": "前面有宾语「この仕事を」，表达「人主动把活儿干完」，不能直接用自动词「終わって」。", "form_line": "自动词「終わる」变成使役形「終わらせる → 終わらせて」，才能带宾语「仕事を」表示把工作做完。", "opt_notes": {"終わらせて": "使役形作他动词用，搭配宾语「この仕事を」表示人主动把工作做完。", "終わって": "「終わる」是自动词（工作自己结束），不能带宾语「仕事を」。", "終わられて": "受身形（被结束），放进句中意思不通。"}, "q_audio": "./audio/H-20261114-07_q.mp3?v=2d5e4256", "exp_audio": "./audio/H-20261114-07_exp.mp3?v=d965e182", "is_listening": false}, "variants": []}, {"id": "N3-V14", "subject": "词汇", "point": "からから（干渴）", "point_key": "からから", "family": "kana_adverb", "modality": "listen", "exam_weight": 2.8, "roi_score": 5.124, "teach": {"left": {"ja": "のどがからからだ", "sub": "清音 · 嗓子干得冒烟、水分干透"}, "right": {"ja": "電車ががらがらだ", "sub": "浊音 · 车厢店里空荡荡没人"}, "example_ja": "暑い中を二時間も歩いたので、のどがからからに乾いた。", "zh_meaning": "大热天走了两个小时，嗓子渴得直冒烟。", "audio": "./audio/N3-V14_exp.mp3?v=d4874161"}, "primary": {"id": "N3-V14", "prompt": "暑い中を二時間も歩いたので、のどが（　　）に乾いた。", "choices": ["からから", "がらがら"], "answer": "からから", "full_ja": "暑い中を二時間も歩いたので、のどがからからに乾いた。", "zh_meaning": "大热天走了两个小时，嗓子渴得直冒烟。", "why_line": "后接「乾いた（干了）」，描写体内水分耗尽、喉咙干涸。", "form_line": "清音「からから」表示水分干透、口干舌燥；浊音「がらがら」表示车厢空荡荡或嗓子沙哑。", "opt_notes": {"からから": "形容水分彻底干涸、口干舌燥（のどがからから）。", "がらがら": "形容空间空荡无人，接「のど」会变成感冒嗓子哑了，不配「乾いた」。"}, "q_audio": "./audio/N3-V14_q.mp3?v=1b1d6f93", "exp_audio": "./audio/N3-V14_exp.mp3?v=d4874161", "is_listening": false}, "variants": [{"id": "VAR-V14", "prompt": "サウナから出た後で、のどが（　　）だったのですぐ水を飲んだ。", "choices": ["からから", "ぎっしり"], "answer": "からから", "full_ja": "サウナから出た後で、のどがからからだったのですぐ水を飲んだ。", "zh_meaning": "从桑拿房出来后嗓子干透了，马上喝了水。", "why_line": "蒸完桑拿流汗口渴，喉咙干涸急需喝水。", "form_line": "「のどがからから」是口干舌燥固定搭配；「ぎっしり」是日程或箱子塞得满满当当。", "opt_notes": {"からから": "口干舌燥、水分干透。", "ぎっしり": "日程或箱子塞得满满当当。"}, "q_audio": "./audio/VAR-V14_q.mp3?v=e0794d21", "exp_audio": "./audio/VAR-V14_exp.mp3?v=6737fff7", "is_listening": false}]}, {"id": "N3-L11", "subject": "听力", "point": "聴解「〜てない」还没做", "point_key": "N3L-003", "family": "listen_contract", "modality": "listen", "exam_weight": 2.8, "roi_score": 3.864, "teach": {"left": {"ja": "まだ決めてないんです", "sub": "決めていない · 还没决定好点什么"}, "right": {"ja": "い脱落缩音", "sub": "口语常把 ていない 缩成 てない"}, "example_ja": "男：お客様、ご注文はお決まりでしょうか。", "zh_meaning": "店员：「客人，请问您点好单了吗？」", "audio": "./audio/N3-L11_exp.mp3?v=bb390736"}, "primary": {"id": "N3-L11", "prompt": "", "choices": ["あ、まだ決めてないんです。おすすめはありますか。", "はい、もうお腹いっぱいです。", "いいえ、昨日は来ませんでした。"], "answer": "あ、まだ決めてないんです。おすすめはありますか。", "full_ja": "男：お客様、ご注文はお決まりでしょうか。", "zh_meaning": "店员：「客人，请问您点好单了吗？」", "why_line": "餐厅高频敬语「お決まりでしょうか（决定好点什么了吗）」，回答「まだ決めてない（还没定好）」最地道。", "form_line": "「決めてない」是「決めていない」吃掉「い」的口语形；第 2、3 项答非所问。", "opt_notes": {"あ、まだ決めてないんです。おすすめはありますか。": "「啊，还没定好呢，有什么推荐吗？」自然得体。", "はい、もうお腹いっぱいです。": "「好的，已经吃饱了。」刚点单就说吃饱不合逻辑。", "いいえ、昨日は来ませんでした。": "「不，昨天没来。」答非所问。"}, "q_audio": "./audio/N3-L11_q.mp3?v=980d2a0b", "exp_audio": "./audio/N3-L11_exp.mp3?v=bb390736", "is_listening": true}, "variants": []}, {"id": "G-20261114-04", "subject": "语法", "point": "〜ものだ", "point_key": "〜ものだ", "family": "modal_end", "modality": "listen", "exam_weight": 2.3, "roi_score": 2.3, "teach": {"left": {"ja": "泣くものだ", "sub": "自然天性・世间常理 · 小宝宝本来就是会哭的"}, "right": {"ja": "早く寝ることだ", "sub": "对别人的忠告建议 · 你最好早点睡觉"}, "example_ja": "赤ん坊は泣くものだから、そんなに心配しなくてもいいよ。", "zh_meaning": "小宝宝本来就是爱哭的，不用那么担心。", "audio": "./audio/G-20261114-04_exp.mp3?v=b3b62b2c"}, "primary": {"id": "G-20261114-04", "prompt": "赤ん坊は泣く（　　）だから、心配しなくてもいいよ。", "choices": ["もの", "こと"], "answer": "もの", "full_ja": "赤ん坊は泣くものだから、そんなに心配しなくてもいいよ。", "zh_meaning": "小宝宝本来就是爱哭的，不用那么担心。", "why_line": "说话人在宽慰对方：婴儿爱哭是自然天性和世间常理，不是什么异常情况。", "form_line": "动词原形接「ものだ」表示天性与常理（泣くものだ）；接「ことだ」则是忠告别人「你最好去做某事」。", "opt_notes": {"もの": "「赤ん坊は泣くものだ」指婴儿爱哭乃自然天性，用来宽慰对方不必担心。", "こと": "「V原形＋ことだ」意为「最好/应该去做…」（忠告句尾），不能接「だから」表天性。"}, "q_audio": "./audio/G-20261114-04_q.mp3?v=54707f33", "exp_audio": "./audio/G-20261114-04_exp.mp3?v=b3b62b2c", "is_listening": false}, "variants": []}, {"id": "N3-H10", "subject": "活用", "point": "閉まる ↔ 閉める", "point_key": "T-002", "family": "transitivity", "modality": "both", "exam_weight": 3.0, "roi_score": 0.6, "teach": {"left": {"ja": "ドアが 閉まる", "sub": "が ＋ まる ＝ 门自己关上（自动）"}, "right": {"ja": "ドアを 閉める", "sub": "を ＋ める ＝ 人把门关上（他动）"}, "example_ja": "風が強くて、ドアが勝手に閉まった。", "zh_meaning": "风很大，门自己关上了。", "audio": "./audio/N3-H10_exp.mp3?v=58998dd3"}, "primary": {"id": "N3-H10", "prompt": "風が強くて、ドアが勝手に（　　）。", "choices": ["閉まった", "閉めた"], "answer": "閉まった", "full_ja": "風が強くて、ドアが勝手に閉まった。", "zh_meaning": "风很大，门自己关上了。", "why_line": "不是人去关门，而是风吹得「门自己关上了」，前面配「ドアが勝手に」，要用自动词。", "form_line": "「閉まる → 閉まった」是自动词（门自己关，配が）；「閉める → 閉めた」是他动词（人伸手关门，配を）。", "opt_notes": {"閉まった": "自动词「閉まる」过去式，搭配「ドアが勝手に（门自己）」。", "閉めた": "他动词「閉める」，必须搭配动作承受者「ドアを」。"}, "q_audio": "./audio/N3-H10_q.mp3?v=c7b4f97f", "exp_audio": "./audio/N3-H10_exp.mp3?v=58998dd3", "is_listening": false}, "variants": [{"id": "VAR-H10", "prompt": "エアコンをつけるから、窓を（　　）ください。", "choices": ["閉めて", "閉まって"], "answer": "閉めて", "full_ja": "エアコンをつけるから、窓を閉めてください。", "zh_meaning": "要开空调了，请把窗户关上。", "why_line": "请对方动手「把窗户关上」，前面有宾格助词「窓を」，必须配他动词。", "form_line": "他动词「閉める → 閉めて」配「窓を」；自动词「閉まって」是门窗自己关着。", "opt_notes": {"閉めて": "他动词「閉める」，配宾语「窓を」。", "閉まって": "自动词不能配「窓を」。"}, "q_audio": "./audio/VAR-H10_q.mp3?v=66b05431", "exp_audio": "./audio/VAR-H10_exp.mp3?v=651f97c0", "is_listening": false}]}, {"id": "N3-V15", "subject": "词汇", "point": "ぶらぶら（闲逛溜达）", "point_key": "ぶらぶら", "family": "kana_adverb", "modality": "listen", "exam_weight": 2.8, "roi_score": 5.124, "teach": {"left": {"ja": "町をぶらぶら歩く", "sub": "悠闲自在地溜达、闲逛"}, "right": {"ja": "出口を探してうろうろする", "sub": "迷路焦急乱转、形迹可疑徘徊"}, "example_ja": "日曜日は特に予定もなかったので、古い商店街をぶらぶら散歩した。", "zh_meaning": "周日没什么特别安排，就在老商业街悠闲地溜达散步。", "audio": "./audio/N3-V15_exp.mp3?v=fae7b861"}, "primary": {"id": "N3-V15", "prompt": "日曜日は特に予定もなかったので、古い商店街を（　　）散歩した。", "choices": ["ぶらぶら", "うろうろ"], "answer": "ぶらぶら", "full_ja": "日曜日は特に予定もなかったので、古い商店街をぶらぶら散歩した。", "zh_meaning": "周日没什么特别安排，就在老商业街悠闲地溜达散步。", "why_line": "周日没事干去散步，心情是轻松惬意、不赶时间的。", "form_line": "悠闲逛街溜达用「ぶらぶら」；「うろうろ」是迷路找不着出口或形迹可疑地转悠。", "opt_notes": {"ぶらぶら": "不赶时间、轻松悠闲地漫步闲逛。", "うろうろ": "不知所措地原地打转或可疑徘徊，不配悠闲散步。"}, "q_audio": "./audio/N3-V15_q.mp3?v=6c92102b", "exp_audio": "./audio/N3-V15_exp.mp3?v=fae7b861", "is_listening": false}, "variants": []}, {"id": "N3-L12", "subject": "听力", "point": "聴解「〜てく」带走/喝完再去", "point_key": "N3L-018", "family": "listen_contract", "modality": "listen", "exam_weight": 2.7, "roi_score": 3.726, "teach": {"left": {"ja": "飲んでかない？", "sub": "飲んでいかない？ · 要不要喝杯咖啡再走"}, "right": {"ja": "〜ていく → 〜てく", "sub": "口语吃掉 い 音的热情挽留"}, "example_ja": "男：まだ少し時間あるから、コーヒーでも飲んでかない？", "zh_meaning": "男：「还有点时间，要不要喝杯咖啡再走？」", "audio": "./audio/N3-L12_exp.mp3?v=a0aa7282"}, "primary": {"id": "N3-L12", "prompt": "", "choices": ["じゃあ、すぐお湯を沸かすね。", "気をつけて帰ってね。", "コーヒーは買わなくていいよ。"], "answer": "じゃあ、すぐお湯を沸かすね。", "full_ja": "男：まだ少し時間あるから、コーヒーでも飲んでかない？", "zh_meaning": "男：「还有点时间，要不要喝杯咖啡再走？」", "why_line": "「飲んでかない？」是「飲んでいかない？」的口语缩音，邀请对方顺道喝杯咖啡再去。", "form_line": "第 1 项「好呀那我马上烧水」顺势答应一起喝；第 2 项变成送客道别；第 3 项跑题。", "opt_notes": {"じゃあ、すぐお湯を沸かすね。": "「好呀，那我马上烧水泡咖啡。」（或顺势接下喝一杯的提议）。", "気をつけて帰ってね。": "「路上小心回去哦。」对方是在邀你喝完再走，不是在道别。", "コーヒーは買わなくていいよ。": "「不用买咖啡哦。」答非所问。"}, "q_audio": "./audio/N3-L12_q.mp3?v=31f904c7", "exp_audio": "./audio/N3-L12_exp.mp3?v=a0aa7282", "is_listening": true}, "variants": []}, {"id": "N3-G14", "subject": "语法", "point": "〜ていく／〜てくる", "point_key": "〜ていく／〜てくる", "family": "change_flow", "modality": "both", "exam_weight": 3.0, "roi_score": 1.86, "teach": {"left": {"ja": "暖かくなってきた", "sub": "过去 → 现在（一直变暖到现在）"}, "right": {"ja": "寒くなっていく", "sub": "现在 → 未来（今后会越来越冷）"}, "example_ja": "４月に入ってから、だんだん暖かくなってきた。", "zh_meaning": "进入四月以来，天气渐渐暖和起来了。", "audio": "./audio/N3-G14_exp.mp3?v=64df868e"}, "primary": {"id": "N3-G14", "prompt": "４月に入ってから、だんだん暖かく（　　）。", "choices": ["なってきた", "なっていった"], "answer": "なってきた", "full_ja": "４月に入ってから、だんだん暖かくなってきた。", "zh_meaning": "进入四月以来，天气渐渐暖和起来了。", "why_line": "时间从四月初一路延续到说话的「现在」，这股变暖的趋势是朝着现在的我走过来的。", "form_line": "从过去持续到现在的变化用「てきた」（なってきた）；从现在往未来继续远去的变化才用「ていく」。", "opt_notes": {"なってきた": "表示从进入4月起一路变化至今，完美契合「４月に入ってから」。", "なっていった": "表示过去某段时期向远方推移或往未来发展，不用于「到现在变暖了」。"}, "q_audio": "./audio/N3-G14_q.mp3?v=a115d783", "exp_audio": "./audio/N3-G14_exp.mp3?v=64df868e", "is_listening": false}, "variants": [{"id": "VAR-G14", "prompt": "少子化が進んで、これから子どもの数はますます減って（　　）だろう。", "choices": ["いく", "きた"], "answer": "いく", "full_ja": "少子化が進んで、これから子どもの数はますます減っていくだろう。", "zh_meaning": "随着生小孩的人越来越少（少子化加剧），今后孩子的数量大概会继续减少下去吧。", "why_line": "句中有「これから（从今往后）」和「だろう」，变化是从现在向未来继续延伸出去。", "form_line": "从现在往未来持续发展用「ていく」（減っていく）；从过去变到现在才用「てきた」。", "opt_notes": {"いく": "表示从现在起向未来持续减少下去。", "きた": "过去式不能与「これから…だろう」未来推测连用。"}, "q_audio": "./audio/VAR-G14_q.mp3?v=71c1c5b9", "exp_audio": "./audio/VAR-G14_exp.mp3?v=70b506b1", "is_listening": false}]}, {"id": "H-20261114-03", "subject": "活用", "point": "落ちる ↔ 落とす", "point_key": "T-044", "family": "transitivity", "modality": "both", "exam_weight": 3.0, "roi_score": 5.49, "teach": {"left": {"ja": "鍵を 落とす", "sub": "を ＋ す结尾（他动词） · 人不小心「把钥匙弄掉了」"}, "right": {"ja": "鍵が 落ちる", "sub": "が ＋ る结尾（自动词） · 钥匙自己「掉下来了」"}, "example_ja": "走っている途中で、ポケットから鍵を落としてしまった。", "zh_meaning": "跑步途中，不小心把钥匙从口袋里弄掉了。", "audio": "./audio/H-20261114-03_exp.mp3?v=eb65d925"}, "primary": {"id": "H-20261114-03", "prompt": "ポケットから鍵を（　　）しまった。", "choices": ["落として", "落ちて"], "answer": "落として", "full_ja": "走っている途中で、ポケットから鍵を落としてしまった。", "zh_meaning": "跑步途中，不小心把钥匙从口袋里弄掉了。", "why_line": "前面紧跟着宾语「鍵を」，表达人不小心「把钥匙弄掉了」，必须配他动词。", "form_line": "带「す」尾的「落とす → 落として」是他动词（配を，把某物弄掉）；「落ちる → 落ちて」是自动词（配が，某物自己掉）。", "opt_notes": {"落として": "前面明确有「鍵を」，必须配他动词「落とす」，加「てしまう」表不小心弄丢的懊悔。", "落ちて": "自动词「落ちる」不能带宾语「鍵を」，只能说「ポケットから鍵が落ちた」。"}, "q_audio": "./audio/H-20261114-03_q.mp3?v=558cf7ff", "exp_audio": "./audio/H-20261114-03_exp.mp3?v=eb65d925", "is_listening": false}, "variants": [{"id": "VAR-H03", "prompt": "階段で手が滑って、スマホが下に（　　）しまった。", "choices": ["落ちて", "落として"], "answer": "落ちて", "full_ja": "階段で手が滑って、スマホが下に落ちてしまった。", "zh_meaning": "在楼梯上手一滑，手机掉下去了。", "why_line": "后半句主语是「スマホが（手机）」，客观描述手机滑落下去，要配自动词。", "form_line": "前面是「スマホが」必配自动词「落ちる → 落ちて」；前面若是「スマホを」才配他动词「落として」。", "opt_notes": {"落ちて": "自动词「落ちる」，与主语助词「スマホが」严格配对。", "落として": "他动词「落とす」，要求前面是「スマホを」。"}, "q_audio": "./audio/VAR-H03_q.mp3?v=a279ec92", "exp_audio": "./audio/VAR-H03_exp.mp3?v=d4cde5f4", "is_listening": false}]}, {"id": "N3-V16", "subject": "词汇", "point": "がっかり（失望泄气）", "point_key": "がっかり", "family": "kana_adverb", "modality": "listen", "exam_weight": 2.8, "roi_score": 5.124, "teach": {"left": {"ja": "中止でがっかりする", "sub": "大失所望、像泄了气的皮球"}, "right": {"ja": "気分がすっきりする", "sub": "神清气爽、痛快舒畅"}, "example_ja": "楽しみにしていた試合が雨で中止になり、子どもたちはがっかりしていた。", "zh_meaning": "盼了好久的比赛因雨取消，孩子们都大失所望。", "audio": "./audio/N3-V16_exp.mp3?v=3c7a4b75"}, "primary": {"id": "N3-V16", "prompt": "楽しみにしていた試合が雨で中止になり、子どもたちは（　　）していた。", "choices": ["がっかり", "すっきり"], "answer": "がっかり", "full_ja": "楽しみにしていた試合が雨で中止になり、子どもたちはがっかりしていた。", "zh_meaning": "盼了好久的比赛因雨取消，孩子们都大失所望。", "why_line": "原本满怀期待的事突然泡汤，肩膀一下子垮下来泄了气。", "form_line": "失望泄气用「がっかり」；神清气爽痛快舒畅才用「すっきり」。", "opt_notes": {"がっかり": "表示期待落空后的沮丧与失望。", "すっきり": "表示心情或头脑清爽畅快，语义相反。"}, "q_audio": "./audio/N3-V16_q.mp3?v=264828fa", "exp_audio": "./audio/N3-V16_exp.mp3?v=3c7a4b75", "is_listening": false}, "variants": [{"id": "VAR-V16", "prompt": "熱いシャワーを浴びたら、頭も体も（　　）した。", "choices": ["すっきり", "がっかり"], "answer": "すっきり", "full_ja": "熱いシャワーを浴びたら、頭も体もすっきりした。", "zh_meaning": "冲了个热水澡，头脑和身体都神清气爽。", "why_line": "洗掉一身疲惫汗水之后，整个人清爽舒畅。", "form_line": "神清气爽用「すっきり」；失望泄气才是「がっかり」。", "opt_notes": {"すっきり": "浑身清爽畅快。", "がっかり": "沮丧泄气，语义相反。"}, "q_audio": "./audio/VAR-V16_q.mp3?v=5136e7e2", "exp_audio": "./audio/VAR-V16_exp.mp3?v=e7655c5c", "is_listening": false}]}, {"id": "N3-L09", "subject": "听力", "point": "聴解「〜なくちゃ」必须得做", "point_key": "N3L-016", "family": "listen_contract", "modality": "listen", "exam_weight": 2.9, "roi_score": 2.9, "teach": {"left": {"ja": "まとめなくちゃ", "sub": "まとめなくてはならない · 得赶快整理完"}, "right": {"ja": "まとめなくていい", "sub": "不用整理"}, "example_ja": "女：どうしよう、五時までにこの報告書、まとめなくちゃ。", "zh_meaning": "女：「怎么办呀，五点之前必须把这份报告整理出来。」", "audio": "./audio/N3-L09_exp.mp3?v=be010798"}, "primary": {"id": "N3-L09", "prompt": "", "choices": ["じゃあ、今日はもう帰らなくていいよ。", "まだ少し時間あるよ、手伝おうか？", "レポート、昨日もう出したんでしょ？"], "answer": "まだ少し時間あるよ、手伝おうか？", "full_ja": "女：どうしよう、五時までにこの報告書、まとめなくちゃ。", "zh_meaning": "女：「怎么办呀，五点之前必须把这份报告整理出来。」", "why_line": "句尾「まとめなくちゃ」省略了「ならない」，意思是五点前非整理完不可，急需帮忙。", "form_line": "第 2 项「还有点时间，要我帮忙吗」最贴心自然；第 1、3 项都不合语境。", "opt_notes": {"じゃあ、今日はもう帰らなくていいよ。": "「那今天不用回去了哦。」不合逻辑。", "まだ少し時間あるよ、手伝おうか？": "「还有点时间，要我帮忙吗？」听懂她赶五点死线着急。", "レポート、昨日もう出したんでしょ？": "「报告昨天不是交了吗？」与正在赶报告矛盾。"}, "q_audio": "./audio/N3-L09_q.mp3?v=e2b90a2e", "exp_audio": "./audio/N3-L09_exp.mp3?v=be010798", "is_listening": true}, "variants": []}, {"id": "GQ-20261114-02", "subject": "语法", "point": "〜ように言う", "point_key": "〜ように言う", "family": "hearsay_infer", "modality": "both", "exam_weight": 2.6, "roi_score": 1.612, "teach": {"left": {"ja": "飲むように言われた", "sub": "V原形/ない形 ＋ ように言う · 医生叮嘱/要求我「要按时吃药」"}, "right": {"ja": "飲んだそうだ", "sub": "简体句 ＋ そうだ / んだって · 传闻「听说他吃药了」"}, "example_ja": "医者に薬を飲むように言われた。", "zh_meaning": "被医生叮嘱要按时吃药。", "audio": "./audio/GQ-20261114-02_exp.mp3?v=5b7cae37"}, "primary": {"id": "GQ-20261114-02", "prompt": "医者に薬を飲むように言われた。", "choices": ["被医生叮嘱要吃药", "听说医生吃了药"], "answer": "被医生叮嘱要吃药", "full_ja": "医者に薬を飲むように言われた。", "zh_meaning": "被医生叮嘱要按时吃药。", "why_line": "这里的「ように言う」表示叮嘱、劝告、要求某人去做某事，并不是比喻也不是听说。", "form_line": "动词原形「飲む」加「ように」，再配被动形「言われた（我被医生告知）」，合起来就是医生嘱咐我要吃药。", "opt_notes": {"被医生叮嘱要吃药": "「医者に〜ように言われた」＝被医生嘱咐去做某事（间接命令/叮嘱的标准表达）。", "听说医生吃了药": "传闻「听说」要用「医者が薬を飲んだそうだ／んだって」，结构完全不同。"}, "q_audio": "./audio/GQ-20261114-02_q.mp3?v=af5bcc31", "exp_audio": "./audio/GQ-20261114-02_exp.mp3?v=5b7cae37", "is_listening": false}, "variants": []}, {"id": "H-20261114-04", "subject": "活用", "point": "消える ↔ 消す", "point_key": "T-004", "family": "transitivity", "modality": "both", "exam_weight": 3.0, "roi_score": 5.49, "teach": {"left": {"ja": "火が 消えた", "sub": "が ＋ 自然に（自动词） · 风吹过来，火苗自己灭了"}, "right": {"ja": "火を 消した", "sub": "を ＋ す结尾（他动词） · 人伸手去，把火吹灭/关掉"}, "example_ja": "強い風が吹いて、ろうそくの火が自然に消えた。", "zh_meaning": "刮起一阵大风，蜡烛的火自然灭了。", "audio": "./audio/H-20261114-04_exp.mp3?v=f9a2ece6"}, "primary": {"id": "H-20261114-04", "prompt": "強い風が吹いて、ろうそくの火が自然に（　　）。", "choices": ["消えた", "消した"], "answer": "消えた", "full_ja": "強い風が吹いて、ろうそくの火が自然に消えた。", "zh_meaning": "刮起一阵大风，蜡烛的火自然灭了。", "why_line": "风吹过来之后「火苗自己熄灭了」，前面是主语「火が」加「自然に」，要用自动词。", "form_line": "「消える → 消えた」是自动词（火自己灭，配が）；带「す」的「消す → 消した」是他动词（人去把火弄灭，配を）。", "opt_notes": {"消えた": "自动词「消える」过去式，完美契合主语助词「火が」与副词「自然に（自然地熄灭）」。", "消した": "他动词「消す」过去式，需要人作主语且配「火を消した」（人为把火弄灭）。"}, "q_audio": "./audio/H-20261114-04_q.mp3?v=9d94e1a8", "exp_audio": "./audio/H-20261114-04_exp.mp3?v=f9a2ece6", "is_listening": false}, "variants": [{"id": "VAR-H04", "prompt": "寝る前に、部屋の電気をちゃんと（　　）ください。", "choices": ["消して", "消えて"], "answer": "消して", "full_ja": "寝る前に、部屋の電気をちゃんと消してください。", "zh_meaning": "睡觉前，请把房间的灯关好。", "why_line": "嘱咐对方伸手「把灯关掉」，前面有宾格助词「電気を」，必须用他动词。", "form_line": "他动词「消す → 消して」配「電気を」；自动词「消えて」表示灯自己灭了，不能用来让人关灯。", "opt_notes": {"消して": "他动词「消す」て形，搭配宾语「電気を」。", "消えて": "自动词不能带宾语「電気を」。"}, "q_audio": "./audio/VAR-H04_q.mp3?v=0a85d886", "exp_audio": "./audio/VAR-H04_exp.mp3?v=7ec63f5b", "is_listening": false}]}, {"id": "N3-V17", "subject": "词汇", "point": "慰める（なぐさめる）", "point_key": "慰める", "family": "kanji_reading", "modality": "memorize", "exam_weight": 2.8, "roi_score": 5.124, "teach": {"left": {"ja": "慰める（なぐさめる）", "sub": "训读 · 温言安慰沮丧的人"}, "right": {"ja": "諦める（あきらめる）", "sub": "死心、放弃"}, "example_ja": "試合に負けて泣いている後輩を優しく慰めた。", "zh_meaning": "温柔地安慰了输掉比赛哭泣的后辈。", "audio": "./audio/N3-V17_exp.mp3?v=9c429b11"}, "primary": {"id": "N3-V17", "prompt": "試合に負けて泣いている後輩を優しく「慰めた」。「慰めた」の読み方は？", "choices": ["なぐさめた", "あきらめた"], "answer": "なぐさめた", "full_ja": "試合に負けて泣いている後輩を優しく慰めた。", "zh_meaning": "温柔地安慰了输掉比赛哭泣的后辈。", "why_line": "考高频一段他动词「慰める（安慰）」的四拍训读。", "form_line": "「慰める」读「なぐさめる → なぐさめた」；「あきらめた」是「諦めた（放弃死心）」。", "opt_notes": {"なぐさめた": "「慰める」的正确训读。", "あきらめた": "「諦める（放弃）」的读音，易混四拍一段动词。"}, "q_audio": "./audio/N3-V17_q.mp3?v=c222d673", "exp_audio": "./audio/N3-V17_exp.mp3?v=9c429b11", "is_listening": false}, "variants": []}, {"id": "GQ-20261114-01", "subject": "语法", "point": "〜っぱなし", "point_key": "〜っぱなし", "family": "aspect_time", "modality": "listen", "exam_weight": 2.5, "roi_score": 1.55, "teach": {"left": {"ja": "つけっぱなし", "sub": "Vます去ます ＋ っぱなし · 开着不管（电视没关就睡了）"}, "right": {"ja": "つけたばかり", "sub": "Vた ＋ ばかり / ところ · 刚刚才打开"}, "example_ja": "テレビをつけっぱなしで寝た。", "zh_meaning": "电视一直开着没关就睡着了。", "audio": "./audio/GQ-20261114-01_exp.mp3?v=1145759e"}, "primary": {"id": "GQ-20261114-01", "prompt": "テレビをつけっぱなしで寝た。", "choices": ["一直开着没关", "刚刚才打开"], "answer": "一直开着没关", "full_ja": "テレビをつけっぱなしで寝た。", "zh_meaning": "电视一直开着没关就睡着了。", "why_line": "「っぱなし」专门描绘做完打开、摊开等动作后，就一直晾在那里没去收拾。", "form_line": "动词ます形「つけます」去掉「ます」接「っぱなし」就是一直开着；「刚刚才打开」日语要说「つけたばかり」。", "opt_notes": {"一直开着没关": "「つける（打开）＋っぱなし」表示打开后一直维持原样没去关掉，带一点不该放任的语气。", "刚刚才打开": "「刚刚打开」日语应说「つけたばかり」或「つけたところ」，不是「っぱなし」。"}, "q_audio": "./audio/GQ-20261114-01_q.mp3?v=e1e02317", "exp_audio": "./audio/GQ-20261114-01_exp.mp3?v=1145759e", "is_listening": false}, "variants": []}, {"id": "N3-H11", "subject": "活用", "point": "自谦「参ります」vs 尊敬误用", "point_key": "K-041", "family": "keigo_direction", "modality": "both", "exam_weight": 3.0, "roi_score": 5.25, "teach": {"left": {"ja": "私が参ります／伺います", "sub": "自己的去来用谦让语压低自己"}, "right": {"ja": "社長がいらっしゃいます", "sub": "尊敬语只能用于对方或长辈"}, "example_ja": "明日の午後二時に、御社へ参ります。", "zh_meaning": "明天下午两点，我会前往贵公司拜访。", "audio": "./audio/N3-H11_exp.mp3?v=2bd78dbe"}, "primary": {"id": "N3-H11", "prompt": "（取引先に電話で）明日の午後二時に、御社へ（　　）。", "choices": ["参ります", "いらっしゃいます"], "answer": "参ります", "full_ja": "明日の午後二時に、御社へ参ります。", "zh_meaning": "明天下午两点，我会前往贵公司拜访。", "why_line": "给客户打电话说「我去贵公司」，动作发出者是我自己，必须压低自己。", "form_line": "自己的「行く／来る」用谦让语「参ります」（或伺います）；「いらっしゃいます」是尊敬语，绝不能说自己。", "opt_notes": {"参ります": "「行く」的谦让语，用于自己前往对方公司。", "いらっしゃいます": "尊敬语，绝不能用于自己的动作。"}, "q_audio": "./audio/N3-H11_q.mp3?v=81d7d4f6", "exp_audio": "./audio/N3-H11_exp.mp3?v=2bd78dbe", "is_listening": false}, "variants": [{"id": "VAR-H11", "prompt": "（自己紹介で）はじめまして、今月入社した林と（　　）。", "choices": ["申します", "おっしゃいます"], "answer": "申します", "full_ja": "はじめまして、今月入社した林と申します。", "zh_meaning": "初次见面，我叫林，是本月刚入职的。", "why_line": "初次见面自我介绍报名字，动作属于自己，要用谦让语。", "form_line": "「言う」的谦让语是「申します」（林と申します）；「おっしゃいます」是尊敬语，不能说自己。", "opt_notes": {"申します": "「言う」的谦让语，用于报上自己的名字。", "おっしゃいます": "尊敬语，绝对不能用于自己。"}, "q_audio": "./audio/VAR-H11_q.mp3?v=8cdc58c3", "exp_audio": "./audio/VAR-H11_exp.mp3?v=73b07ad1", "is_listening": false}]}, {"id": "N3-V18", "subject": "词汇", "point": "組む（くむ）", "point_key": "組む", "family": "kanji_reading", "modality": "memorize", "exam_weight": 2.7, "roi_score": 4.941, "teach": {"left": {"ja": "予定を組む（くむ）", "sub": "词首清音 く · 编排日程/交叉"}, "right": {"ja": "ぐむ", "sub": "只有接在复合词后才可能连浊（番組 ばんぐみ）"}, "example_ja": "無理のないように、来月のスケジュールを組んだ。", "zh_meaning": "为了不至于太赶，合理编排了下个月的日程表。", "audio": "./audio/N3-V18_exp.mp3?v=6684b56b"}, "primary": {"id": "N3-V18", "prompt": "無理のないように、来月のスケジュールを「組んだ」。「組んだ」の読み方は？", "choices": ["くんだ", "ぐんだ"], "answer": "くんだ", "full_ja": "無理のないように、来月のスケジュールを組んだ。", "zh_meaning": "为了不至于太赶，合理编排了下个月的日程表。", "why_line": "「スケジュールを組む」表示编排日程，考词首清浊音。", "form_line": "单独动词「組む」词首永远是清音「くむ → くんだ」；只有排在复合词后半截如「番組（ばんぐみ）」才连浊。", "opt_notes": {"くんだ": "「組む（くむ）」的た形，词首清音不浊化。", "ぐんだ": "受「番組（ばんぐみ）」连浊影响产生的词首误读。"}, "q_audio": "./audio/N3-V18_q.mp3?v=4765f214", "exp_audio": "./audio/N3-V18_exp.mp3?v=6684b56b", "is_listening": false}, "variants": []}, {"id": "G-20261114-07", "subject": "语法", "point": "★排序・〜ずにはいられない", "point_key": "〜ずにはいられない", "family": "star_syntax", "modality": "memorize", "exam_weight": 2.9, "roi_score": 0.58, "teach": {"left": {"ja": "泣かず・には・いられない", "sub": "固定铁板四连块 · 情不自禁、忍不住哭了"}, "right": {"ja": "★排序必背语序", "sub": "Vない去ない ＋ ず ＋ には ＋ いられない · 注意：する → せずにはいられな…"}, "example_ja": "その映画のラストシーンは感動的で、見ていて泣かずにはいられなかった。", "zh_meaning": "那部电影的结局太感人，看着看着忍不住哭了出来。", "audio": "./audio/G-20261114-07_exp.mp3?v=5132d586"}, "primary": {"id": "G-20261114-07", "prompt": "感動的で、見ていて（　　）。", "choices": ["泣かずにはいられなかった", "泣かないではいなかった"], "answer": "泣かずにはいられなかった", "full_ja": "その映画のラストシーンは感動的で、見ていて泣かずにはいられなかった。", "zh_meaning": "那部电影的结局太感人，看着看着忍不住哭了出来。", "why_line": "情绪自然涌上来控制不住，日语表达「情不自禁、忍不住做某事」有固定句式。", "form_line": "把否定形「泣かない」的「ない」换成古语否定「ず」，再接「にはいられない」，连成「泣かずにはいられなかった」。", "opt_notes": {"泣かずにはいられなかった": "N3核心固定句型「〜ずにはいられない」（忍不住…），排序题常拆开考「には」的位置。", "泣かないではいなかった": "生造错误搭配（正确同义形只能是「泣かないではいられなかった」，尾部必须是可能形いられない）。"}, "q_audio": "./audio/G-20261114-07_q.mp3?v=ac6fc385", "exp_audio": "./audio/G-20261114-07_exp.mp3?v=5132d586", "is_listening": false}, "variants": []}, {"id": "N3-H12", "subject": "活用", "point": "一段可能形「起きられる」", "point_key": "V-031", "family": "potential_pair", "modality": "both", "exam_weight": 2.9, "roi_score": 4.205, "teach": {"left": {"ja": "自分で起きられる", "sub": "起きる（自己起床）→ 能起得来"}, "right": {"ja": "誰かを起こせる", "sub": "起こす（叫醒别人）→ 能叫醒"}, "example_ja": "明日は始発に乗るので、朝五時にちゃんと起きられるか心配だ。", "zh_meaning": "明天要赶首班电车，真担心早上五点能不能起得来。", "audio": "./audio/N3-H12_exp.mp3?v=93ea456a"}, "primary": {"id": "N3-H12", "prompt": "明日は始発に乗るので、朝五時にちゃんと（　　）か心配だ。", "choices": ["起きられる", "起こせる"], "answer": "起きられる", "full_ja": "明日は始発に乗るので、朝五時にちゃんと起きられるか心配だ。", "zh_meaning": "明天要赶首班电车，真担心早上五点能不能起得来。", "why_line": "担心的是「自己能不能醒来起床」，不是去叫醒别人。", "form_line": "自动词「起きる（起床）」是一段动词，正式可能形加「られる」变「起きられる」；「起こせる」是把别人叫醒。", "opt_notes": {"起きられる": "一段动词「起きる」的正式可能形（自己能起得来）。", "起こせる": "他动词「起こす」的可能形，变成「能不能把别人叫醒」。"}, "q_audio": "./audio/N3-H12_q.mp3?v=57d08aed", "exp_audio": "./audio/N3-H12_exp.mp3?v=93ea456a", "is_listening": false}, "variants": [{"id": "VAR-H12", "prompt": "この着物は一人でも簡単に（　　）よ。", "choices": ["着られます", "着れます"], "answer": "着られます", "full_ja": "この着物は一人でも簡単に着られますよ。", "zh_meaning": "这件和服一个人也能很轻松地穿上哦。", "why_line": "「着る（穿）」是一段动词，笔试语法题要求选不省音的标准可能形。", "form_line": "一段动词去「る」加「られます」→「着られます」；省掉「ら」的「着れます」只用于日常口语闲聊。", "opt_notes": {"着られます": "一段动词「着る」的标准正式可能形。", "着れます": "口语省略了「ら」的ら抜き言葉，考试笔试判错。"}, "q_audio": "./audio/VAR-H12_q.mp3?v=11aa32c4", "exp_audio": "./audio/VAR-H12_exp.mp3?v=5be6582d", "is_listening": false}]}, {"id": "N3-V19", "subject": "词汇", "point": "疑問（ぎもん）", "point_key": "疑問", "family": "kanji_reading", "modality": "memorize", "exam_weight": 2.7, "roi_score": 4.941, "teach": {"left": {"ja": "疑問（ぎ・もん）", "sub": "疑 读浊音 ぎ · 疑问"}, "right": {"ja": "基本（き・ほん）", "sub": "基/気 才读清音 き"}, "example_ja": "その説明を聞いて、一つ疑問が浮かんだ。", "zh_meaning": "听了那个说明，脑海里浮现出一个疑问。", "audio": "./audio/N3-V19_exp.mp3?v=e8f6d71f"}, "primary": {"id": "N3-V19", "prompt": "その説明を聞いて、一つ「疑問」が浮かんだ。「疑問」の読み方は？", "choices": ["ぎもん", "きもん"], "answer": "ぎもん", "full_ja": "その説明を聞いて、一つ疑問が浮かんだ。", "zh_meaning": "听了那个说明，脑海里浮现出一个疑问。", "why_line": "考双汉字词「疑問」首字「疑」的清浊音。", "form_line": "汉字「疑」在音读词里一律带浊点读「ぎ」：疑問（ぎもん）；不带浊点念「きもん」就变成「鬼門」。", "opt_notes": {"ぎもん": "「疑問」标准音读，首字带浊音 ぎ。", "きもん": "漏掉首字浊点的常见误读（鬼門 才念 きもん）。"}, "q_audio": "./audio/N3-V19_q.mp3?v=ae32201b", "exp_audio": "./audio/N3-V19_exp.mp3?v=e8f6d71f", "is_listening": false}, "variants": []}, {"id": "G-20261114-11", "subject": "语法", "point": "〜らしい", "point_key": "〜らしい", "family": "hearsay_infer", "modality": "both", "exam_weight": 2.9, "roi_score": 0.58, "teach": {"left": {"ja": "あるらしい / 便利らしい", "sub": "动词原形・な形词干直接＋らしい · 听说有活动 / 听说很方便"}, "right": {"ja": "あるとらしい / 便利だらしい", "sub": "常见接续错误 · 误把「〜と聞いた」的と或だ混入句中"}, "example_ja": "ニュースによると、来週また大きなイベントがあるらしいよ。", "zh_meaning": "据新闻说，听说下周又有大型活动哦。", "audio": "./audio/G-20261114-11_exp.mp3?v=204f3b1d"}, "primary": {"id": "G-20261114-11", "prompt": "ニュースによると、来週また大きなイベントが（　　）よ。", "choices": ["あるらしい", "あるとらしい", "あるだらしい"], "answer": "あるらしい", "full_ja": "ニュースによると、来週また大きなイベントがあるらしいよ。", "zh_meaning": "据新闻说，听说下周又有大型活动哦。", "why_line": "开头有消息来源「ニュースによると（据新闻说）」，是在转述客观传闻。", "form_line": "传闻「らしい」直接接动词简体原形「ある」，连成「あるらしい」；中间绝不能加引用的「と」或「だ」。", "opt_notes": {"あるらしい": "动词简体原形直接接「らしい」表客观传闻（听说有活动）。", "あるとらしい": "混入了引用助词「と」，传闻「らしい」前面不能加「と」。", "あるだらしい": "动词后不能加「だ」，且名词或な形容词接「らしい」也须去掉「だ」。"}, "q_audio": "./audio/G-20261114-11_q.mp3?v=4cd53ff3", "exp_audio": "./audio/G-20261114-11_exp.mp3?v=204f3b1d", "is_listening": false}, "variants": [{"id": "VAR-G11", "prompt": "うわさによると、あの二人は来月結婚する（　　）。", "choices": ["らしい", "とらしい"], "answer": "らしい", "full_ja": "うわさによると、あの二人は来月結婚するらしい。", "zh_meaning": "据传言说，那两个人好像下个月要结婚了。", "why_line": "开头有「うわさによると（据传闻）」，属于转述别人传来的消息。", "form_line": "动词简体「結婚する」直接接「らしい」，中间不能多加引用的「と」。", "opt_notes": {"らしい": "动词简体形直接＋らしい表传闻。", "とらしい": "语法错误，「らしい」前不可加「と」。"}, "q_audio": "./audio/VAR-G11_q.mp3?v=21f94caa", "exp_audio": "./audio/VAR-G11_exp.mp3?v=b070fe95", "is_listening": false}]}, {"id": "N3-H13", "subject": "活用", "point": "見る → 拝見する（谦让）", "point_key": "K-013", "family": "keigo_direction", "modality": "memorize", "exam_weight": 2.6, "roi_score": 2.782, "teach": {"left": {"ja": "私が拝見しました", "sub": "我拜读/观看了您发来的资料"}, "right": {"ja": "先生がご覧になりました", "sub": "长辈/客户观看了"}, "example_ja": "先ほど送っていただいた企画書、さっそく拝見しました。", "zh_meaning": "您刚才发来的策划书，我已经第一时间拜读过了。", "audio": "./audio/N3-H13_exp.mp3?v=06331109"}, "primary": {"id": "N3-H13", "prompt": "先ほど送っていただいた企画書、さっそく（　　）ました。", "choices": ["拝見し", "ご覧になり"], "answer": "拝見し", "full_ja": "先ほど送っていただいた企画書、さっそく拝見しました。", "zh_meaning": "您刚才发来的策划书，我已经第一时间拜读过了。", "why_line": "看策划书的人是我自己，向对方汇报「我看了您的文件」要用谦让语。", "form_line": "自己看用谦让语「拝見しました」；对方或长辈看才用尊敬语「ご覧になりました」。", "opt_notes": {"拝見し": "「見る」的谦让语，主语是我自己。", "ご覧になり": "「見る」的尊敬语，不能用于自己看资料。"}, "q_audio": "./audio/N3-H13_q.mp3?v=fd1981f3", "exp_audio": "./audio/N3-H13_exp.mp3?v=06331109", "is_listening": false}, "variants": []}, {"id": "N3-V20", "subject": "词汇", "point": "指示（しじ）", "point_key": "指示", "family": "kanji_reading", "modality": "memorize", "exam_weight": 2.7, "roi_score": 4.941, "teach": {"left": {"ja": "指示（し・じ）", "sub": "先清音 し、后浊音 じ"}, "right": {"ja": "じし", "sub": "把清浊顺序颠倒了"}, "example_ja": "災害のときは、係員の指示に従ってください。", "zh_meaning": "遇到灾害时，请听从工作人员的指示。", "audio": "./audio/N3-V20_exp.mp3?v=e72af0a4"}, "primary": {"id": "N3-V20", "prompt": "災害のときは、係員の「指示」に従ってください。「指示」の読み方は？", "choices": ["しじ", "じし"], "answer": "しじ", "full_ja": "災害のときは、係員の指示に従ってください。", "zh_meaning": "遇到灾害时，请听从工作人员的指示。", "why_line": "考职场与广播高频词「指示」两个假名的清浊顺序。", "form_line": "第一拍「指（し）」是清音，第二拍「示（じ）」是浊音，合起来「しじ」，绝不能颠倒成「じし」。", "opt_notes": {"しじ": "「指示」标准音读（①型）：指（し）＋示（じ）。", "じし": "前后清浊颠倒的典型误读。"}, "q_audio": "./audio/N3-V20_q.mp3?v=4f8354d1", "exp_audio": "./audio/N3-V20_exp.mp3?v=e72af0a4", "is_listening": false}, "variants": []}, {"id": "N3-G22", "subject": "语法", "point": "〜てたまらない／しかたがない", "point_key": "〜てたまらない", "family": "emotion_compel", "modality": "both", "exam_weight": 2.9, "roi_score": 5.307, "teach": {"left": {"ja": "会いたくてたまらない／しかたがない", "sub": "想见得不得了、情绪强烈难耐"}, "right": {"ja": "〜てもかまわない", "sub": "表示没关系、无所谓"}, "example_ja": "一人暮らしを始めてから、実家の犬に会いたくてたまらない。", "zh_meaning": "开始独居之后，想念老家的狗狗想得不得了。", "audio": "./audio/N3-G22_exp.mp3?v=688e3c4c"}, "primary": {"id": "N3-G22", "prompt": "一人暮らしを始めてから、実家の犬に会いたくて（　　）。", "choices": ["たまらない", "かまわない"], "answer": "たまらない", "full_ja": "一人暮らしを始めてから、実家の犬に会いたくてたまらない。", "zh_meaning": "开始独居之后，想念老家的狗狗想得不得了。", "why_line": "表达心里涌上来的想念、痒痛或渴望强烈到实在忍受不住。", "form_line": "て形「会いたくて」加「たまらない」（和「てしかたがない」完全同义）；「かまわない」是没关系。", "opt_notes": {"たまらない": "接「会いたくて」后，表达想见得受不了（与「てしかたがない」同义）。", "かまわない": "意为「没关系」，语法与句意均不通。"}, "q_audio": "./audio/N3-G22_q.mp3?v=71f8156d", "exp_audio": "./audio/N3-G22_exp.mp3?v=688e3c4c", "is_listening": false}, "variants": [{"id": "VAR-G22", "prompt": "昨日の夜から奥歯が痛くて（　　）。", "choices": ["しかたがない", "かまわない"], "answer": "しかたがない", "full_ja": "昨日の夜から奥歯が痛くてしかたがない。", "zh_meaning": "从昨晚开始后槽牙就疼得受不了。", "why_line": "生理上的疼痛剧烈难忍、拿它一点办法都没有。", "form_line": "形容词て形「痛くて」加「しかたがない」（疼得受不了，同「たまらない」）；「かまわない」是没关系。", "opt_notes": {"しかたがない": "接在形容词て形「痛くて」后，表示疼得受不了。", "かまわない": "意为「无所谓、没关系」，与牙疼难忍矛盾。"}, "q_audio": "./audio/VAR-G22_q.mp3?v=3607f54f", "exp_audio": "./audio/VAR-G22_exp.mp3?v=a8281070", "is_listening": false}]}, {"id": "N3-V21", "subject": "词汇", "point": "加える（くわえる）", "point_key": "加える", "family": "kanji_reading", "modality": "memorize", "exam_weight": 2.7, "roi_score": 4.941, "teach": {"left": {"ja": "加える（くわえる）", "sub": "训读三拍 く・わ・える · 添加"}, "right": {"ja": "変える（かえる）", "sub": "改变、更换"}, "example_ja": "スープに塩を少し加えて味を調えた。", "zh_meaning": "往汤里稍微加了一点盐把味道调好。", "audio": "./audio/N3-V21_exp.mp3?v=c06f4bc4"}, "primary": {"id": "N3-V21", "prompt": "スープに塩を少し「加えて」味を調えた。「加えて」の読み方は？", "choices": ["くわえて", "かえて"], "answer": "くわえて", "full_ja": "スープに塩を少し加えて味を調えた。", "zh_meaning": "往汤里稍微加了一点盐把味道调好。", "why_line": "「塩を加える（加盐）」考单汉字动词「加える」的训读。", "form_line": "「加える」训读三拍「くわえる → くわえて」；「かえて」是「変える（改变）」。", "opt_notes": {"くわえて": "「加える（くわえる）」的正确训读。", "かえて": "把音读「か（参加）」误套进训读动词。"}, "q_audio": "./audio/N3-V21_q.mp3?v=525b0d1f", "exp_audio": "./audio/N3-V21_exp.mp3?v=c06f4bc4", "is_listening": false}, "variants": []}, {"id": "N3-G26", "subject": "语法", "point": "〜なんて", "point_key": "〜なんて", "family": "surprise_quote", "modality": "both", "exam_weight": 2.8, "roi_score": 3.864, "teach": {"left": {"ja": "無断で休むなんて", "sub": "居然无故旷工（惊讶意外）"}, "right": {"ja": "決まりしだい", "sub": "一确定就立刻…"}, "example_ja": "あの真面目な田中さんが無断で休むなんて、信じられない。", "zh_meaning": "那么认真的田中居然不请假就旷工，真不敢相信。", "audio": "./audio/N3-G26_exp.mp3?v=b61d4b16"}, "primary": {"id": "N3-G26", "prompt": "あの真面目な田中さんが無断で休む（　　）、信じられない。", "choices": ["なんて", "しだい"], "answer": "なんて", "full_ja": "あの真面目な田中さんが無断で休むなんて、信じられない。", "zh_meaning": "那么认真的田中居然不请假就旷工，真不敢相信。", "why_line": "后半句「信じられない（难以置信）」点明了说话人非常意外和震惊。", "form_line": "简体小句直接加「なんて」表惊讶感叹（休むなんて）；「しだい」是一旦确定就立刻。", "opt_notes": {"なんて": "对出乎意料的事表示强烈惊讶与感叹。", "しだい": "接ます干表「一旦…就立刻…」，语境不通。"}, "q_audio": "./audio/N3-G26_q.mp3?v=e0518c6e", "exp_audio": "./audio/N3-G26_exp.mp3?v=b61d4b16", "is_listening": false}, "variants": []}, {"id": "N3-V09", "subject": "词汇", "point": "書類（しょるい）", "point_key": "書類", "family": "kanji_reading", "modality": "memorize", "exam_weight": 2.2, "roi_score": 4.026, "teach": {"left": {"ja": "しょ・るい（書類）", "sub": "短音「しょ」。（同：辞書 じしょ、図書館 としょかん）"}, "right": {"ja": "しょうるい", "sub": "中文母语最爱误加长音 う"}, "example_ja": "大事な書類を封筒に入れた。", "zh_meaning": "把重要的文件装进了信封。", "audio": "./audio/N3-V09_exp.mp3?v=545a6402"}, "primary": {"id": "N3-V09", "prompt": "大事な「書類」を封筒に入れた。「書類」の読み方は？", "choices": ["しょるい", "しょうるい"], "answer": "しょるい", "full_ja": "大事な書類を封筒に入れた。", "zh_meaning": "把重要的文件装进了信封。", "why_line": "考「書類（文件、资料）」里汉字「書」在日语中的长短音。", "form_line": "中文「书」听感较长，但日语里的「書（しょ）」是一拍短音，合起来是「しょるい」，绝不加「う」。", "opt_notes": {"しょるい": "「書類」标准读音（⓪型），「書」为短音 しょ。", "しょうるい": "典型的多加长音误读。"}, "q_audio": "./audio/N3-V09_q.mp3?v=5bdeff50", "exp_audio": "./audio/N3-V09_exp.mp3?v=545a6402", "is_listening": false}, "variants": []}, {"id": "N3-G24", "subject": "语法", "point": "〜向き", "point_key": "〜向き", "family": "suitability", "modality": "both", "exam_weight": 2.7, "roi_score": 3.726, "teach": {"left": {"ja": "初心者向きだ", "sub": "客观特征正好适合初学者"}, "right": {"ja": "初心者向けに作る", "sub": "专门针对初学者设计制作"}, "example_ja": "このスキー場は坂がゆるやかで、初心者向きだ。", "zh_meaning": "这个滑雪场坡度平缓，很适合初学者。", "audio": "./audio/N3-G24_exp.mp3?v=011216bc"}, "primary": {"id": "N3-G24", "prompt": "このスキー場は坂がゆるやかで、初心者（　　）だ。", "choices": ["向き", "がち"], "answer": "向き", "full_ja": "このスキー場は坂がゆるやかで、初心者向きだ。", "zh_meaning": "这个滑雪场坡度平缓，很适合初学者。", "why_line": "滑雪场本身坡缓好滑，客观条件天然适合新手。", "form_line": "名词加「向きだ」表示客观特征适合某类人（初心者向きだ）；「がち」接动词或病気表动不动发生消极事。", "opt_notes": {"向き": "坡度平缓，客观条件很适合初学者。", "がち": "接动词ます干或「病気」，表容易发生消极状况。"}, "q_audio": "./audio/N3-G24_q.mp3?v=b50b15b7", "exp_audio": "./audio/N3-G24_exp.mp3?v=011216bc", "is_listening": false}, "variants": []}, {"id": "N3-G25", "subject": "语法", "point": "〜とすると", "point_key": "〜とすると", "family": "condition_suppose", "modality": "both", "exam_weight": 2.7, "roi_score": 3.726, "teach": {"left": {"ja": "行くとすると", "sub": "假定前项成立并据此推算结果"}, "right": {"ja": "〜につれて", "sub": "随着一方变化另一方同步渐变"}, "example_ja": "今からタクシーで行くとすると、会場に三時には着くだろう。", "zh_meaning": "假设现在打车去的话，三点应该能到会场吧。", "audio": "./audio/N3-G25_exp.mp3?v=df6722f9"}, "primary": {"id": "N3-G25", "prompt": "今からタクシーで行く（　　）、会場に三時には着くだろう。", "choices": ["とすると", "につれて"], "answer": "とすると", "full_ja": "今からタクシーで行くとすると、会場に三時には着くだろう。", "zh_meaning": "假设现在打车去的话，三点应该能到会场吧。", "why_line": "先把「现在打车出发」当成假定前提，再顺着算出到达时间。", "form_line": "动词简体形「行く」接「とすると」表假定推算；「につれて」是两边一起渐变。", "opt_notes": {"とすると": "假定现在打车去，据此推算三点能到。", "につれて": "表示伴随渐变，不表假定推算。"}, "q_audio": "./audio/N3-G25_q.mp3?v=90324a6a", "exp_audio": "./audio/N3-G25_exp.mp3?v=df6722f9", "is_listening": false}, "variants": []}, {"id": "N3-G27", "subject": "语法", "point": "まるで〜のように", "point_key": "まるで〜のように", "family": "simile_marude", "modality": "both", "exam_weight": 2.7, "roi_score": 3.726, "teach": {"left": {"ja": "まるで真夏のように暑い", "sub": "简直就像盛夏一样热"}, "right": {"ja": "〜のために", "sub": "为了…／因为…"}, "example_ja": "まだ四月なのに、今日はまるで真夏のように暑い。", "zh_meaning": "明明才四月，今天却简直像盛夏一样热。", "audio": "./audio/N3-G27_exp.mp3?v=ee60e371"}, "primary": {"id": "N3-G27", "prompt": "まだ四月なのに、今日はまるで真夏（　　）暑い。", "choices": ["のように", "のために"], "answer": "のように", "full_ja": "まだ四月なのに、今日はまるで真夏のように暑い。", "zh_meaning": "明明才四月，今天却简直像盛夏一样热。", "why_line": "前面出现了标志词「まるで（简直就像）」，后面必须用比喻收尾。", "form_line": "名词「真夏」加「のように」与「まるで」首尾呼应；「のために」是表目的或原因。", "opt_notes": {"のように": "与「まるで」首尾呼应构成比喻「简直像盛夏一样」。", "のために": "表目的或原因，无法与「まるで」呼应。"}, "q_audio": "./audio/N3-G27_q.mp3?v=636c212c", "exp_audio": "./audio/N3-G27_exp.mp3?v=ee60e371", "is_listening": false}, "variants": []}, {"id": "N3-G18", "subject": "语法", "point": "〜めったに〜ない", "point_key": "〜めったに〜ない", "family": "star_syntax", "modality": "memorize", "exam_weight": 2.6, "roi_score": 3.588, "teach": {"left": {"ja": "めったに ＋ 飲まない", "sub": "100% 配否定（极少、难得）"}, "right": {"ja": "たいてい ＋ 飲む", "sub": "通常配肯定（大抵、一般）"}, "example_ja": "父はお酒をめったに飲まない。", "zh_meaning": "父亲极少喝酒。", "audio": "./audio/N3-G18_exp.mp3?v=e88a92c3"}, "primary": {"id": "N3-G18", "prompt": "父はお酒を（　　）飲まない。", "choices": ["めったに", "たいてい"], "answer": "めったに", "full_ja": "父はお酒をめったに飲まない。", "zh_meaning": "父亲极少喝酒。", "why_line": "句尾是否定「飲まない」，表达频率极低、「难得、极少做某事」。", "form_line": "「めったに」必须和句尾的否定「ない」配对使用；「たいてい（通常、大抵）」一般搭配肯定句。", "opt_notes": {"めったに": "陈陈述副词，与否定「飲まない」固定呼应，意为「极少喝酒」。", "たいてい": "意为「通常、大抵」，一般搭配肯定谓语。"}, "q_audio": "./audio/N3-G18_q.mp3?v=f592bcad", "exp_audio": "./audio/N3-G18_exp.mp3?v=e88a92c3", "is_listening": false}, "variants": []}, {"id": "N3-G19", "subject": "语法", "point": "〜がちだ", "point_key": "〜がちだ", "family": "aspect_time", "modality": "both", "exam_weight": 2.4, "roi_score": 3.312, "teach": {"left": {"ja": "風邪をひきがち", "sub": "ます干/名词 ＋ がち ＝ 动不动就（负面）"}, "right": {"ja": "〜最中だ", "sub": "正在最酣处（接 ている）"}, "example_ja": "冬は空気が乾燥して、風邪をひきがちだ。", "zh_meaning": "冬天空气干燥，动不动就容易感冒。", "audio": "./audio/N3-G19_exp.mp3?v=cb049cd0"}, "primary": {"id": "N3-G19", "prompt": "冬は空気が乾燥して、風邪を（　　）だ。", "choices": ["ひきがち", "ひく最中"], "answer": "ひきがち", "full_ja": "冬は空気が乾燥して、風邪をひきがちだ。", "zh_meaning": "冬天空气干燥，动不动就容易感冒。", "why_line": "生病、迟到、忘带东西这类不太好的消极毛病「动不动就容易发生」，用「がち」。", "form_line": "动词ます形去掉「ます」加「がち」（ひきます → ひきがち）；「最中」表示正在做某事最起劲的当口，意思不通。", "opt_notes": {"ひきがち": "表示容易感冒、动不动就感冒的负面倾向。", "ひく最中": "「〜ている最中」表示正在做某事的正当中，接续与意思均错。"}, "q_audio": "./audio/N3-G19_q.mp3?v=1bf8f0d9", "exp_audio": "./audio/N3-G19_exp.mp3?v=cb049cd0", "is_listening": false}, "variants": []}, {"id": "N3-G23", "subject": "语法", "point": "〜わりに", "point_key": "〜わりに", "family": "contrast_expect", "modality": "both", "exam_weight": 2.9, "roi_score": 2.9, "teach": {"left": {"ja": "遠いわりに家賃が高い", "sub": "与前项程度不成比例（明明远却很贵）"}, "right": {"ja": "〜たびに", "sub": "每当做某事的时候"}, "example_ja": "このアパートは駅から遠いわりに、家賃がかなり高い。", "zh_meaning": "这间公寓明明离车站很远，房租却相当贵。", "audio": "./audio/N3-G23_exp.mp3?v=bc44629b"}, "primary": {"id": "N3-G23", "prompt": "このアパートは駅から遠い（　　）、家賃がかなり高い。", "choices": ["わりに", "たびに"], "answer": "わりに", "full_ja": "このアパートは駅から遠いわりに、家賃がかなり高い。", "zh_meaning": "这间公寓明明离车站很远，房租却相当贵。", "why_line": "离车站远按常理房租应该便宜，结果却反常地贵，前后程度不成比例。", "form_line": "形容词「遠い」直接接「わりに」表示「相对于……而言却……」；「たびに」表示每当做某事。", "opt_notes": {"わりに": "按离车站远来说房租本该便宜，实际却很贵，比例反差用「わりに」。", "たびに": "表示「每当…就…」，不能接形容词「遠い」。"}, "q_audio": "./audio/N3-G23_q.mp3?v=6f8d9c28", "exp_audio": "./audio/N3-G23_exp.mp3?v=bc44629b", "is_listening": false}, "variants": [{"id": "VAR-G23", "prompt": "彼はたくさん食べる（　　）、ぜんぜん太らない。", "choices": ["わりに", "につれて"], "answer": "わりに", "full_ja": "彼はたくさん食べるわりに、ぜんぜん太らない。", "zh_meaning": "他明明吃得很多，却一点也不胖。", "why_line": "饭量大跟身材瘦不成正比，打破常理预期。", "form_line": "动词原形「食べる」接「わりに」表比例反差；「につれて」是越吃越胖的正向渐变。", "opt_notes": {"わりに": "食量大与身材瘦不成比例，用「わりに」。", "につれて": "表示正比渐变（越吃越胖），与「ぜんぜん太らない」矛盾。"}, "q_audio": "./audio/VAR-G23_q.mp3?v=f0437ba0", "exp_audio": "./audio/VAR-G23_exp.mp3?v=e8e5d8c2", "is_listening": false}]}], "words": {"私用": {"head": "私用", "kana": "しよう", "pos": "名词", "zh": "私事，私人事情", "audio": "./audio/words/w_56d2983920.mp3", "trap_hl": ["し"], "trap_tag": "短音", "zh_opaque": false}, "風邪": {"head": "風邪", "kana": "かぜ", "pos": "名词", "zh": "感冒", "audio": "./audio/words/w_334bdc29ca.mp3", "trap_hl": ["かぜ"], "trap_tag": "熟字训", "zh_opaque": true}, "会議室": {"head": "会議室", "kana": "かいぎしつ", "pos": "名词", "zh": "会议室", "audio": "./audio/words/w_9ee159da4c.mp3", "trap_hl": ["ぎ"], "trap_tag": "连浊", "zh_opaque": false}, "子ども": {"head": "子ども", "kana": "こども", "pos": "名词", "zh": "孩子，小朋友", "audio": "./audio/words/w_1e0fb7bad2.mp3", "trap_hl": ["こ"], "trap_tag": "训读", "zh_opaque": false}, "海外出張中": {"head": "海外出張中", "kana": "かいがいしゅっちょうちゅう", "pos": "名词", "zh": "正在国外出差期间", "audio": "./audio/words/w_711ff98204.mp3", "trap_hl": ["っ", "ちゅう"], "trap_tag": "促音+不浊", "zh_opaque": false}, "海外出張": {"head": "海外出張", "kana": "かいがいしゅっちょう", "pos": "名词", "zh": "海外出差，去国外出差", "audio": "./audio/words/w_e914c61552.mp3", "trap_hl": ["っ"], "trap_tag": "促音", "zh_opaque": false}, "ダイエット中": {"head": "ダイエット中", "kana": "だいえっとちゅう", "pos": "名词", "zh": "正在减肥期间", "audio": "./audio/words/w_08a1125fff.mp3", "trap_hl": ["ちゅう"], "trap_tag": "不浊", "zh_opaque": false}, "旅行先": {"head": "旅行先", "kana": "りょこうさき", "pos": "名词", "zh": "旅行目的地，旅途中去的地方", "audio": "./audio/words/w_6620551374.mp3", "trap_hl": ["さき"], "trap_tag": "不浊", "zh_opaque": false}, "三日間": {"head": "三日間", "kana": "みっかかん", "pos": "数量词", "zh": "三天时间", "audio": "./audio/words/w_645b27d4d6.mp3", "trap_hl": ["っ"], "trap_tag": "促音", "zh_opaque": false}, "一日中": {"head": "一日中", "kana": "いちにちじゅう", "pos": "副詞・名詞", "zh": "一整天", "pitch": "④", "tip": "注意浊音 じゅう", "audio": "./audio/words/w_8559b0949a.mp3", "trap_hl": ["じゅう"], "trap_tag": "浊音", "zh_opaque": false}, "今週中": {"head": "今週中", "kana": "こんしゅうじゅう", "pos": "名词", "zh": "本周之内", "audio":
