io": "./audio/N3-V28_exp.mp3?v=9971aa4b", "listen_parts": null, "is_listening": false}]}, {"id": "N3-L10", "subject": "听力", "point": "聴解「〜ことにした」拍板决定", "point_key": "N3L-085", "family": "listen_decision", "modality": "listen", "exam_weight": 2.8, "roi_score": 5.124, "teach": {"left": {"ja": "やめておくことにした", "sub": "最后拍板决定今天先作罢不买"}, "right": {"ja": "どっちもいいけど", "sub": "前半句铺垫，转折后才是真结论"}, "example_ja": "男：熱はないんだけど、朝からすごくのどが痛いんだ。\n女：無理しないで、今日は早く帰って休んだらいいんじゃない？", "zh_meaning": "男：「虽然没发烧，但从早上起嗓子就特别疼。」 女：「别硬撑了，今天早点回去休息比较好吧？」", "audio": "./audio/VAR3-L10_exp.mp3?v=758a6ee7"}, "primary": {"id": "VAR3-L10", "prompt": "", "choices": ["今日は早く家に帰って休むこと", "夜遅くまで残業を続けること", "今からスポーツジムへ行くこと"], "answer": "今日は早く家に帰って休むこと", "full_ja": "男：熱はないんだけど、朝からすごくのどが痛いんだ。\n女：無理しないで、今日は早く帰って休んだらいいんじゃない？", "zh_meaning": "男：「虽然没发烧，但从早上起嗓子就特别疼。」 女：「别硬撑了，今天早点回去休息比较好吧？」", "why_line": "女生句尾升调说「早く帰って休んだらいいんじゃない？」，委婉建议他早回家休息。", "form_line": "口语「〜んじゃない？」升调表柔和建议，选早点回家休息。", "opt_notes": {"今日は早く家に帰って休むこと": "「今天早点回家休息。」女生用 早く帰って休んだらいいんじゃない？温柔建议。", "夜遅くまで残業を続けること": "「继续加班到深夜。」女生劝他 無理しないで（别硬撑）。", "今からスポーツジムへ行くこと": "「现在去健身房。」对话中未提及。"}, "q_audio": "./audio/VAR3-L10_q.mp3?v=b55f0266", "exp_audio": "./audio/VAR3-L10_exp.mp3?v=758a6ee7", "listen_parts": {"stem": "./audio/VAR3-L10_stem.mp3?v=f42b08f3", "nums": ["./audio/num_JM_1.mp3", "./audio/num_JM_2.mp3", "./audio/num_JM_3.mp3"], "opts": {"今日は早く家に帰って休むこと": "./audio/VAR3-L10_opt0.mp3?v=35128caa", "夜遅くまで残業を続けること": "./audio/VAR3-L10_opt1.mp3?v=9caec940", "今からスポーツジムへ行くこと": "./audio/VAR3-L10_opt2.mp3?v=7f7ec611"}}, "is_listening": true}, "variants": [{"id": "N3-L10", "prompt": "", "choices": ["黒い靴を買う", "白い靴を買う", "今日は何も買わない"], "answer": "今日は何も買わない", "full_ja": "女：黒いのと白いの、どっちもいいけど、やっぱり今日はやめておくことにした。\n男：そっか、高い買い物だし、ゆっくり考えたほうがいいね。", "zh_meaning": "女：「黑的和白的都不错，不过思来想去今天还是决定先不买了。」 男：「这样啊，毕竟挺贵的，慢慢考虑比较好。」", "why_line": "转折词「けど」之后才是真决定：「今日はやめておくことにした（决定今天先作罢不买）」。", "form_line": "今天什么都不买正确；第 1、2 项都是转折前的烟雾弹。", "opt_notes": {"黒い靴を買う": "前半句只说黑色白色都不错，但「けど」后已放弃。", "白い靴を買う": "同上，属于转折前的干扰项。", "今日は何も買わない": "女生明确说「今日はやめておくことにした」（决定今天先不买）。"}, "q_audio": "./audio/N3-L10_q.mp3?v=9387a193", "exp_audio": "./audio/N3-L10_exp.mp3?v=fb1ab877", "listen_parts": {"stem": "./audio/N3-L10_stem.mp3?v=c1cca961", "nums": ["./audio/num_JF_1.mp3", "./audio/num_JF_2.mp3", "./audio/num_JF_3.mp3"], "opts": {"黒い靴を買う": "./audio/N3-L10_opt0.mp3?v=42d4306d", "白い靴を買う": "./audio/N3-L10_opt1.mp3?v=a3f4326e", "今日は何も買わない": "./audio/N3-L10_opt2.mp3?v=12f307aa"}}, "is_listening": true}, {"id": "VAR-L10", "prompt": "", "choices": ["毎日階段を使うこと", "エレベーターに乗ること", "スポーツジムに通うこと"], "answer": "毎日階段を使うこと", "full_ja": "男：健康診断の結果があまりよくなくて、今日からエレベーターじゃなくて階段を使うことにしたよ。\n女：いいね、私も運動不足だから一緒に歩こうかな。", "zh_meaning": "男：「体检结果不太理想，我决定从今天起不坐电梯改走楼梯了。」 女：「挺好呀，我也缺乏运动，要不一起走吧。」", "why_line": "用「エレベーターじゃなくて」排除了电梯，拍板「階段を使うことにした（决定走楼梯）」。", "form_line": "「〜ことにした」表示个人主观立下新决定，选「毎日階段を使うこと」。", "opt_notes": {"毎日階段を使うこと": "「每天走楼梯。」抓准 じゃなくて 后的决定 階段を使うことにした。", "エレベーターに乗ること": "「坐电梯。」男生明确说 エレベーターじゃなくて（不坐电梯）。", "スポーツジムに通うこと": "「去健身房。」对话中未提及。"}, "q_audio": "./audio/VAR-L10_q.mp3?v=feed82f8", "exp_audio": "./audio/VAR-L10_exp.mp3?v=0c82c9f1", "listen_parts": {"stem": "./audio/VAR-L10_stem.mp3?v=eebd8f1d", "nums": ["./audio/num_JF_1.mp3", "./audio/num_JF_2.mp3", "./audio/num_JF_3.mp3"], "opts": {"毎日階段を使うこと": "./audio/VAR-L10_opt0.mp3?v=4f82a9eb", "エレベーターに乗ること": "./audio/VAR-L10_opt1.mp3?v=27bcb92b", "スポーツジムに通うこと": "./audio/VAR-L10_opt2.mp3?v=5801b1b6"}}, "is_listening": true}]}, {"id": "N3-G26", "subject": "语法", "point": "〜なんて", "point_key": "〜なんて", "family": "surprise_quote", "modality": "both", "exam_weight": 2.8, "roi_score": 1.736, "teach": {"left": {"ja": "無断で休むなんて", "sub": "居然无故旷工（惊讶意外）"}, "right": {"ja": "決まりしだい", "sub": "一确定就立刻…"}, "example_ja": "あの真面目な彼が、連絡もなしに会社を休むなんて信じられない。", "zh_meaning": "一贯认真的他竟然一声不吭没来上班，简直令人难以置信。", "audio": "./audio/VAR-G26_exp.mp3?v=c7c6d4f5"}, "primary": {"id": "VAR-G26", "prompt": "あの真面目な彼が、連絡もなしに会社を休む（　　）信じられない。", "choices": ["なんて", "しだい"], "answer": "なんて", "full_ja": "あの真面目な彼が、連絡もなしに会社を休むなんて信じられない。", "zh_meaning": "一贯认真的他竟然一声不吭没来上班，简直令人难以置信。", "why_line": "平时最老实的人居然无故旷工，后接「信じられない」表达震惊。", "form_line": "对意外之事感叹「竟然…简直不敢信」用「〜なんて信じられない」。", "opt_notes": {"なんて": "举出「他竟然不请假旷工」这件事并表达强烈意外。", "しだい": "接ます形词干表「一…就立即」，接续与意思均不通。"}, "q_audio": "./audio/VAR-G26_q.mp3?v=73535bee", "exp_audio": "./audio/VAR-G26_exp.mp3?v=c7c6d4f5", "listen_parts": null, "is_listening": false}, "variants": [{"id": "N3-G26", "prompt": "あの真面目な田中さんが無断で休む（　　）、信じられない。", "choices": ["なんて", "しだい"], "answer": "なんて", "full_ja": "あの真面目な田中さんが無断で休むなんて、信じられない。", "zh_meaning": "那么认真的田中居然不请假就旷工，真不敢相信。", "why_line": "后半句「信じられない（难以置信）」点明了说话人非常意外和震惊。", "form_line": "简体小句直接加「なんて」表惊讶感叹（休むなんて）；「しだい」是一旦确定就立刻。", "opt_notes": {"なんて": "对出乎意料的事表示强烈惊讶与感叹。", "しだい": "接ます干表「一旦…就立刻…」，语境不通。"}, "q_audio": "./audio/N3-G26_q.mp3?v=e0518c6e", "exp_audio": "./audio/N3-G26_exp.mp3?v=b61d4b16", "listen_parts": null, "is_listening": false}]}, {"id": "N3-V29", "subject": "词汇", "point": "ぴったり（严丝合缝刚刚好）", "point_key": "ぴったり", "family": "kana_adverb", "modality": "listen", "exam_weight": 2.9, "roi_score": 3.103, "teach": {"left": {"ja": "足にぴったり合う", "sub": "尺码不松不紧严丝合缝"}, "right": {"ja": "終電にぎりぎり間に合う", "sub": "卡在最后一秒勉强赶上"}, "example_ja": "新幹線は時刻表どおり、九時ぴったりに東京駅に着いた。", "zh_meaning": "新干线完全按照时刻表，九点整分秒不差抵达了东京站。", "audio": "./audio/VAR-V29_exp.mp3?v=5ebadef1"}, "primary": {"id": "VAR-V29", "prompt": "新幹線は時刻表どおり、九時（　　）に東京駅に着いた。", "choices": ["ぴったり", "ぎりぎり"], "answer": "ぴったり", "full_ja": "新幹線は時刻表どおり、九時ぴったりに東京駅に着いた。", "zh_meaning": "新干线完全按照时刻表，九点整分秒不差抵达了东京站。", "why_line": "前面有「時刻表どおり（完全按时刻表）」，说明九点整准点到站。", "form_line": "时刻后接「ぴったり」表示整点分秒不差；「ぎりぎり」是卡在最后一秒勉强赶上。", "opt_notes": {"ぴったり": "接在时刻后表示整点分秒不差。", "ぎりぎり": "表示勉强赶上死线，与「時刻表どおり（按时刻表准点）」矛盾。"}, "q_audio": "./audio/VAR-V29_q.mp3?v=bcb0dc46", "exp_audio": "./audio/VAR-V29_exp.mp3?v=5ebadef1", "listen_parts": null, "is_listening": false}, "variants": [{"id": "N3-V29", "prompt": "この靴は私の足にサイズが（　　）合って、とても歩きやすい。", "choices": ["ぴったり", "ぎりぎり"], "answer": "ぴったり", "full_ja": "この靴は私の足にサイズがぴったり合って、とても歩きやすい。", "zh_meaning": "这双鞋尺码跟我的脚严丝合缝刚刚好，走起路来特别舒服。", "why_line": "鞋子不松不紧贴合双脚，所以很好走路。", "form_line": "「サイズがぴったり合う」是固定搭配（尺码严丝合缝）；「ぎりぎり」是卡死线勉强赶上。", "opt_notes": {"ぴったり": "与「サイズが合う」是铁板搭配，形容尺码贴合刚刚好。", "ぎりぎり": "表示卡在极限边缘勉强够着，不能形容鞋子好穿合脚。"}, "q_audio": "./audio/N3-V29_q.mp3?v=1d2dfbe3", "exp_audio": "./audio/N3-V29_exp.mp3?v=f8f3fc56", "listen_parts": null, "is_listening": false}]}, {"id": "N3-L07", "subject": "听力", "point": "聴解「〜とかないと」提前办妥", "point_key": "N3L-048", "family": "listen_contract", "modality": "listen", "exam_weight": 3.0, "roi_score": 4.35, "teach": {"left": {"ja": "買っとかないと", "sub": "買っておかないと · 不提前买好不行"}, "right": {"ja": "買わなくていい", "sub": "听反成了不用买"}, "example_ja": "男：来週の土曜日、人気のレストランに行くんだけど、大丈夫かな。\n女：週末は絶対混むから、今日のうちに予約しとこうよ。", "zh_meaning": "男：「下周六想去那家超火的餐厅，不知道要紧吗。」 女：「周末肯定爆满，趁今天先订好位子吧。」", "audio": "./audio/VAR-L07_exp.mp3?v=ec535ecd"}, "primary": {"id": "VAR-L07", "prompt": "", "choices": ["今日レストランを予約する", "土曜日に別の店を探す", "予約せずにお店へ行く"], "answer": "今日レストランを予約する", "full_ja": "男：来週の土曜日、人気のレストランに行くんだけど、大丈夫かな。\n女：週末は絶対混むから、今日のうちに予約しとこうよ。", "zh_meaning": "男：「下周六想去那家超火的餐厅，不知道要紧吗。」 女：「周末肯定爆满，趁今天先订好位子吧。」", "why_line": "女生拍板「今日のうちに予約しとこうよ」（＝予約しておこう），趁今天提前订妥。", "form_line": "口语「〜とこう」＝「〜ておこう（提前办好吧）」，选今天预订餐厅。", "opt_notes": {"今日レストランを予約する": "「今天就预订餐厅。」女生提议 今日のうちに予約しとこうよ（趁今天提前订好）。", "土曜日に別の店を探す": "「周六再找别的店。」对话中未提及。", "予約せずにお店へ行く": "「不预约直接去。」女生明确说周末肯定人多必须提前订。"}, "q_audio": "./audio/VAR-L07_q.mp3?v=5b5f54b3", "exp_audio": "./audio/VAR-L07_exp.mp3?v=ec535ecd", "listen_parts": {"stem": "./audio/VAR-L07_stem.mp3?v=7dd73227", "nums": ["./audio/num_JM_1.mp3", "./audio/num_JM_2.mp3", "./audio/num_JM_3.mp3"], "opts": {"今日レストランを予約する": "./audio/VAR-L07_opt0.mp3?v=8ba698b4", "土曜日に別の店を探す": "./audio/VAR-L07_opt1.mp3?v=f3d018b1", "予約せずにお店へ行く": "./audio/VAR-L07_opt2.mp3?v=046c86a0"}}, "is_listening": true}, "variants": [{"id": "N3-L07", "prompt": "", "choices": ["そうだね、今のうちに買っておこう。", "じゃあ、ガソリンは入れなくていいね。", "昨日はドライブ楽しかったね。"], "answer": "そうだね、今のうちに買っておこう。", "full_ja": "女：明日の朝は早いから、今日のうちにお弁当と飲み物、買っとかないとね。", "zh_meaning": "女：「明天一早要出发，今天之内得先把便当和饮料买好才行呢。」", "why_line": "「買っとかないと」是「買っておかないといけない」的口语连缩，意思是必须提前买好。", "form_line": "「趁现在买好吧」精准呼应；把必须做听反成了不用做且跑题；时态错误。", "opt_notes": {"そうだね、今のうちに買っておこう。": "「是啊，趁现在提前买好吧。」精准接住口语缩音 買っとかないと。", "じゃあ、ガソリンは入れなくていいね。": "「那不用加油了呢。」既跑题又把必须提前做听反成了不用做。", "昨日はドライブ楽しかったね。": "「昨天兜风真开心呢。」时态与内容均无关。"}, "q_audio": "./audio/N3-L07_q.mp3?v=22647194", "exp_audio": "./audio/N3-L07_exp.mp3?v=465110d8", "listen_parts": {"stem": "./audio/N3-L07_stem.mp3?v=fbf0527d", "nums": ["./audio/num_JM_1.mp3", "./audio/num_JM_2.mp3", "./audio/num_JM_3.mp3"], "opts": {"そうだね、今のうちに買っておこう。": "./audio/N3-L07_opt0.mp3?v=1afc54eb", "じゃあ、ガソリンは入れなくていいね。": "./audio/N3-L07_opt1.mp3?v=3f3735af", "昨日はドライブ楽しかったね。": "./audio/N3-L07_opt2.mp3?v=dd1f383d"}}, "is_listening": true}]}, {"id": "N3-G27", "subject": "语法", "point": "まるで〜のように", "point_key": "まるで〜のように", "family": "simile_marude", "modality": "both", "exam_weight": 2.7, "roi_score": 1.674, "teach": {"left": {"ja": "まるで真夏のように暑い", "sub": "简直就像盛夏一样热"}, "right": {"ja": "〜のために", "sub": "为了…／因为…"}, "example_ja": "まだ四月なのに、今日はまるで真夏のように暑い。", "zh_meaning": "明明才四月，今天却简直像盛夏一样热。", "audio": "./audio/N3-G27_exp.mp3?v=ee60e371"}, "primary": {"id": "N3-G27", "prompt": "まだ四月なのに、今日はまるで真夏（　　）暑い。", "choices": ["のように", "のために"], "answer": "のように", "full_ja": "まだ四月なのに、今日はまるで真夏のように暑い。", "zh_meaning": "明明才四月，今天却简直像盛夏一样热。", "why_line": "前面出现了标志词「まるで（简直就像）」，后面必须用比喻收尾。", "form_line": "名词「真夏」加「のように」与「まるで」首尾呼应；「のために」是表目的或原因。", "opt_notes": {"のように": "与「まるで」首尾呼应构成比喻「简直像盛夏一样」。", "のために": "表目的或原因，无法与「まるで」呼应。"}, "q_audio": "./audio/N3-G27_q.mp3?v=636c212c", "exp_audio": "./audio/N3-G27_exp.mp3?v=ee60e371", "listen_parts": null, "is_listening": false}, "variants": []}, {"id": "N3-V30", "subject": "词汇", "point": "許す（ゆるす）", "point_key": "許す", "family": "kanji_reading", "modality": "memorize", "exam_weight": 2.9, "roi_score": 3.103, "teach": {"left": {"ja": "ミスを許す（ゆるす）", "sub": "训读 ゆるす · 原谅、宽恕、允许"}, "right": {"ja": "残す（のこす）", "sub": "留下、剩饭"}, "example_ja": "ルールを破ることは、どんな理由があっても許されない。", "zh_meaning": "违反规则这件事，不管有什么理由都是绝不允许的。", "audio": "./audio/VAR4-V30_exp.mp3?v=5683e314"}, "primary": {"id": "VAR4-V30", "prompt": "ルールを破ることは、どんな理由があっても「許されない」。「許されない」の読み方は？", "choices": ["ゆるされない", "はずされない"], "answer": "ゆるされない", "full_ja": "ルールを破ることは、どんな理由があっても許されない。", "zh_meaning": "违反规则这件事，不管有什么理由都是绝不允许的。", "why_line": "考高频五段动词「許す（原谅、允许）」变成受身否定形后的训读。", "form_line": "「許す（ゆるす）」→ 受身否定「許されない（ゆるされない）」；「はずされない」是「外されない」。", "opt_notes": {"ゆるされない": "「許す（ゆるす）」的受身否定形，表示绝不容许。", "はずされない": "「外す（取下、摘掉）」的受身否定形，字形与词义均不同。"}, "q_audio": "./audio/VAR4-V30_q.mp3?v=a2a9ae4b", "exp_audio": "./audio/VAR4-V30_exp.mp3?v=5683e314", "listen_parts": null, "is_listening": false}, "variants": [{"id": "N3-V30", "prompt": "心から謝ったら、先輩は笑って私のミスを「許して」くれた。「許して」の読み方は？", "choices": ["ゆるして", "のこして"], "answer": "ゆるして", "full_ja": "心から謝ったら、先輩は笑って私のミスを許してくれた。", "zh_meaning": "诚心诚意道歉之后，前辈笑着原谅了我的失误。", "why_line": "考单汉字五段动词「許す（原谅、允许）」的训读。", "form_line": "「許す」训读为「ゆるす → ゆるして」；「のこして」是「残して（留下）」。", "opt_notes": {"ゆるして": "「許す（ゆるす）」的て形，意为原谅过错。", "のこして": "「残す（留下）」的て形，字形与读音完全不同。"}, "q_audio": "./audio/N3-V30_q.mp3?v=010ae323", "exp_audio": "./audio/N3-V30_exp.mp3?v=4f40c853", "listen_parts": null, "is_listening": false}, {"id": "VAR-V30", "prompt": "時間が「許す」かぎり、いろいろな国を旅行してみたい。「許す」の読み方は？", "choices": ["ゆるす", "のこす"], "answer": "ゆるす", "full_ja": "時間が許すかぎり、いろいろな国を旅行してみたい。", "zh_meaning": "只要时间允许，我想去各种各样的国家旅行看看。", "why_line": "考单汉字动词「許す（允许、原谅）」在惯用搭配里的训读。", "form_line": "「時間が許す（时间允许）」训读「ゆるす」；「のこす」是「残す（留下）」。", "opt_notes": {"ゆるす": "「許す（允许、原谅）」的训读，時間が許す＝时间允许。", "のこす": "「残す（留下）」的训读。"}, "q_audio": "./audio/VAR-V30_q.mp3?v=dd84ddd7", "exp_audio": "./audio/VAR-V30_exp.mp3?v=3cd5d3b4", "listen_parts": null, "is_listening": false}]}, {"id": "N3-L15", "subject": "听力", "point": "〜ちゃって（〜てしまって）", "point_key": "N3L-012", "family": "spoken_contraction", "modality": "listen", "exam_weight": 3.2, "roi_score": 3.424, "teach": {"left": {"ja": "入っちゃって ＝ 入ってしまって", "sub": "带遗憾语气交代原因 · 偏巧突然来了急活"}, "right": {"ja": "行けないって", "sub": "口语传话「って＝と」（发消息说来不了）"}, "example_ja": "男：どうしたの？朝から元気ないね。\n女：昨日遅くまでドラマ見ちゃって、すごく眠いんだ。", "zh_meaning": "男：「怎么啦？一大早就没精打采的。」 女：「昨晚追剧看到太晚，困死了。」", "audio": "./audio/VAR-L15_exp.mp3?v=d8beeda0"}, "primary": {"id": "VAR-L15", "prompt": "", "choices": ["夜遅くまでドラマを見たから", "朝早く運動したから", "電車が止まって歩いたから"], "answer": "夜遅くまでドラマを見たから", "full_ja": "男：どうしたの？朝から元気ないね。\n女：昨日遅くまでドラマ見ちゃって、すごく眠いんだ。", "zh_meaning": "男：「怎么啦？一大早就没精打采的。」 女：「昨晚追剧看到太晚，困死了。」", "why_line": "女生用「ドラマ見ちゃって」（＝見てしまって）懊悔交代缺觉原因。", "form_line": "口语「〜ちゃって」表带悔意的原因，选「夜遅くまでドラマを見たから」。", "opt_notes": {"夜遅くまでドラマを見たから": "「因为看电视剧看到很晚。」女生坦白 昨日遅くまでドラマ見ちゃって。", "朝早く運動したから": "「因为一早运动了。」对话中未提及。", "電車が止まって歩いたから": "「因为电车停运走路来的。」对话中未提及。"}, "q_audio": "./audio/VAR-L15_q.mp3?v=9b6437ca", "exp_audio": "./audio/VAR-L15_exp.mp3?v=d8beeda0", "listen_parts": {"stem": "./audio/VAR-L15_stem.mp3?v=196fb082", "nums": ["./audio/num_JM_1.mp3", "./audio/num_JM_2.mp3", "./audio/num_JM_3.mp3"], "opts": {"夜遅くまでドラマを見たから": "./audio/VAR-L15_opt0.mp3?v=4e50d726", "朝早く運動したから": "./audio/VAR-L15_opt1.mp3?v=ad584705", "電車が止まって歩いたから": "./audio/VAR-L15_opt2.mp3?v=3743cdda"}}, "is_listening": true}, "variants": [{"id": "N3-L15", "prompt": "", "choices": ["急に仕事が入ったから", "風邪をひいたから", "店の場所を間違えたから"], "answer": "急に仕事が入ったから", "full_ja": "女：あれ、今日の飲み会、田中さんは来ないの？\n男：うん、急な仕事が入っちゃって、行けないって連絡があったよ。", "zh_meaning": "女：「咦，今天的聚餐田中不来吗？」 男：「嗯，他来消息说突然插进来一件急活，去不了了。」", "why_line": "「急な仕事が入っちゃって」＝「急な仕事が入ってしまって」，带着遗憾交代缺席原因。", "form_line": "口语「〜ちゃって」在句中表令人无奈的突发原因，选「急に仕事が入ったから」。", "opt_notes": {"急に仕事が入ったから": "「因为突然来了急活。」男生转述 急な仕事が入っちゃって（突然插进工作来不了）。", "風邪をひいたから": "「因为感冒了。」对话中未提及。", "店の場所を間違えたから": "「因为搞错了店的位置。」对话中未提及。"}, "q_audio": "./audio/N3-L15_q.mp3?v=eebd0e6a", "exp_audio": "./audio/N3-L15_exp.mp3?v=199f26b8", "listen_parts": {"stem": "./audio/N3-L15_stem.mp3?v=f302960f", "nums": ["./audio/num_JF_1.mp3", "./audio/num_JF_2.mp3", "./audio/num_JF_3.mp3"], "opts": {"急に仕事が入ったから": "./audio/N3-L15_opt0.mp3?v=3468a67c", "風邪をひいたから": "./audio/N3-L15_opt1.mp3?v=1ac0a4fa", "店の場所を間違えたから": "./audio/N3-L15_opt2.mp3?v=bb735f34"}}, "is_listening": true}]}, {"id": "G-20261114-02", "subject": "语法", "point": "〜ところだ", "point_key": "〜ところだ", "family": "aspect_time", "modality": "both", "exam_weight": 2.6, "roi_score": 1.612, "teach": {"left": {"ja": "食べたところ", "sub": "た形 ＋ ところ · 刚刚才做完（配 たった今）"}, "right": {"ja": "食べるところ", "sub": "原形 ＋ ところ · 正要开始做（配 これから）"}, "example_ja": "「もう出発した？」「ううん、今から家を出るところだよ。」", "zh_meaning": "「已经出发了吗？」「还没呢，现在正要出门。」", "audio": "./audio/VAR-G02_exp.mp3?v=a69000dd"}, "primary": {"id": "VAR-G02", "prompt": "「もう出発した？」「ううん、今から家を出る（　　）だよ。」", "choices": ["ところ", "ばかり"], "answer": "ところ", "full_ja": "「もう出発した？」「ううん、今から家を出るところだよ。」", "zh_meaning": "「已经出发了吗？」「还没呢，现在正要出门。」", "why_line": "前面说了「ううん、今から（还没，现在开始）」，说明脚刚迈出去、马上要出门。", "form_line": "动词原形「出る」接「ところだ」表示正要做某事；过去式「出たところ」才是刚刚出了门。", "opt_notes": {"ところ": "「今から＋V原形＋ところだ」表示正准备出门。", "ばかり": "「Vたばかり」才表刚做完；「出るばかり」不表示正要出门。"}, "q_audio": "./audio/VAR-G02_q.mp3?v=e356ac21", "exp_audio": "./audio/VAR-G02_exp.mp3?v=a69000dd", "listen_parts": null, "is_listening": false}, "variants": [{"id": "G-20261114-02", "prompt": "うん、たった今、食べた（　　）だよ。", "choices": ["ところ", "ばかりか"], "answer": "ところ", "full_ja": "「昼ごはん、もう食べた？」「うん、たった今、食べたところだよ。」", "zh_meaning": "「午饭吃了吗？」「嗯，刚刚才吃完。」", "why_line": "前面有「たった今（就在刚才）」，说明筷子刚放下没几秒钟。", "form_line": "动词过去式「食べた」加「ところだ」表示刚刚做完；「ばかりか」是「不仅如此反而」的意思，用在这里完全不通。", "opt_notes": {"ところ": "「たった今＋Vたところだ」黄金呼应，精准表达动作刚刚结束那一刻。", "ばかりか": "意为「不仅…甚至连…也」（递进句型），不能表示刚刚做完某事。"}, "q_audio": "./audio/G-20261114-02_q.mp3?v=478ed93d", "exp_audio": "./audio/G-20261114-02_exp.mp3?v=f40416eb", "listen_parts": null, "is_listening": false}]}, {"id": "N3-V31", "subject": "词汇", "point": "かわいがる（疼爱／宠爱）", "point_key": "かわいがる", "family": "kana_adverb", "modality": "listen", "exam_weight": 2.9, "roi_score": 3.103, "teach": {"left": {"ja": "猫や後輩をかわいがる", "sub": "かわいい去い＋がる ＝ 疼爱、宠爱"}, "right": {"ja": "薬をいやがる", "sub": "いや＋がる ＝ 讨厌、抗拒"}, "example_ja": "課長は新しく入った後輩たちを、いつも弟のようにかわいがってくれる。", "zh_meaning": "课长总是把新进公司的后辈当亲弟弟一样疼惜关照。", "audio": "./audio/VAR-V31_exp.mp3?v=612a1ae2"}, "primary": {"id": "VAR-V31", "prompt": "課長は新しく入った後輩たちを、いつも弟のように（　　）くれる。", "choices": ["かわいがって", "いやがって"], "answer": "かわいがって", "full_ja": "課長は新しく入った後輩たちを、いつも弟のようにかわいがってくれる。", "zh_meaning": "课长总是把新进公司的后辈当亲弟弟一样疼惜关照。", "why_line": "前面说「弟のように（像对待亲弟弟一样）」，自然是爱护关照。", "form_line": "疼爱照顾晚辈用「かわいがる → かわいがって」；「いやがる」是嫌弃抗拒。", "opt_notes": {"かわいがって": "前辈或长辈满怀温情地疼爱、关照后辈。", "いやがって": "「嫌がる（嫌弃讨厌）」，与「弟のように」相反。"}, "q_audio": "./audio/VAR-V31_q.mp3?v=bf23dadd", "exp_audio": "./audio/VAR-V31_exp.mp3?v=612a1ae2", "listen_parts": null, "is_listening": false}, "variants": [{"id": "N3-V31", "prompt": "祖母は近所の小さな猫を、自分の孫のように（　　）いる。", "choices": ["かわいがって", "いやがって"], "answer": "かわいがって", "full_ja": "祖母は近所の小さな猫を、自分の孫のようにかわいがっている。", "zh_meaning": "奶奶把邻居家的小猫当成自己亲孙子一样疼爱。", "why_line": "比作「就像自己的孙子一样」，自然是满心欢喜地宠溺疼爱。", "form_line": "把「かわいい」词尾「い」换成「がる」变成他动词「かわいがる（疼爱、宠爱）」。", "opt_notes": {"かわいがって": "表示像疼孙子一样宠爱小猫。", "いやがって": "意为「嫌弃、讨厌」，与「像亲孙子一样」语义相反。"}, "q_audio": "./audio/N3-V31_q.mp3?v=03beb335", "exp_audio": "./audio/N3-V31_exp.mp3?v=5f3db2d5", "listen_parts": null, "is_listening": false}]}, {"id": "N3-L08", "subject": "听力", "point": "聴解「〜ちゃった」遗憾做完", "point_key": "N3L-010", "family": "listen_contract", "modality": "listen", "exam_weight": 2.9, "roi_score": 1.798, "teach": {"left": {"ja": "降りちゃった", "sub": "降りてしまった · 糟糕下车了"}, "right": {"ja": "置いたまま", "sub": "包还落在行李架上原封未动"}, "example_ja": "女：あ、しまった！間違えて古い資料を課長にメールで送っちゃった！", "zh_meaning": "女：「啊，糟了！我不小心搞错了，把旧资料发邮件给课长了！」", "audio": "./audio/VAR4-L08_exp.mp3?v=22fc84bc"}, "primary": {"id": "VAR4-L08", "prompt": "", "choices": ["じゃあ、これから課長に送るんだね。", "新しい資料、もらえてよかったね。", "すぐ謝って、正しいのを送り直したほうがいいよ。"], "answer": "すぐ謝って、正しいのを送り直したほうがいいよ。", "full_ja": "女：あ、しまった！間違えて古い資料を課長にメールで送っちゃった！", "zh_meaning": "女：「啊，糟了！我不小心搞错了，把旧资料发邮件给课长了！」", "why_line": "「あ、しまった！」配「送っちゃった（送ってしまった）」，懊恼自己已经手滑错发了旧版文件。", "form_line": "「赶紧道歉并把正确资料重发过去」最得体；时态听反，完全听岔。", "opt_notes": {"じゃあ、これから課長に送るんだね。": "「那接下来要发给课长呀。」时态听反，送っちゃった 表示已经发出去酿成失误了。", "新しい資料、もらえてよかったね。": "「能拿到新资料真好呀。」把错发旧资料完全听岔成了收到新资料。", "すぐ謝って、正しいのを送り直したほうがいいよ。": "「赶紧道个歉，把正确的那份重新发过去比较好哦。」精准接住错发邮件后的懊悔补救语境。"}, "q_audio": "./audio/VAR4-L08_q.mp3?v=883ecb0f", "exp_audio": "./audio/VAR4-L08_exp.mp3?v=22fc84bc", "listen_parts": {"stem": "./audio/VAR4-L08_stem.mp3?v=966908af", "nums": ["./audio/num_JM_1.mp3", "./audio/num_JM_2.mp3", "./audio/num_JM_3.mp3"], "opts": {"じゃあ、これから課長に送るんだね。": "./audio/VAR4-L08_opt0.mp3?v=ce07699d", "新しい資料、もらえてよかったね。": "./audio/VAR4-L08_opt1.mp3?v=d771a642", "すぐ謝って、正しいのを送り直したほうがいいよ。": "./audio/VAR4-L08_opt2.mp3?v=cf231c70"}}, "is_listening": true}, "variants": [{"id": "N3-L08", "prompt": "", "choices": ["えっ、急いで駅に電話して聞いてみよう。", "じゃあ、これから電車に乗るんだね。", "新しいかばん、買えてよかったね。"], "answer": "えっ、急いで駅に電話して聞いてみよう。", "full_ja": "男：あ、大変！網棚の上にかばん置いたまま、電車降りちゃった！", "zh_meaning": "男：「啊，糟了！包还放在行李架上，我就这么下电车了！」", "why_line": "「置いたまま（原封不动落着）」配「降りちゃった（降りてしまった，糟了已经下车了）」。", "form_line": "赶紧给车站打电话询问最合情理；以为还没上车；误听成买新包。", "opt_notes": {"えっ、急いで駅に電話して聞いてみよう。": "「啊？赶紧给车站打电话问问吧。」听懂他把包忘车上已经下车了。", "じゃあ、これから電車に乗るんだね。": "「那你接下来要坐电车呀。」时态听反，已经下车了。", "新しいかばん、買えてよかったね。": "「买到新包真好呀。」把丢包听成了买包。"}, "q_audio": "./audio/N3-L08_q.mp3?v=f4bf92f3", "exp_audio": "./audio/N3-L08_exp.mp3?v=f8d9c188", "listen_parts": {"stem": "./audio/N3-L08_stem.mp3?v=f2a55519", "nums": ["./audio/num_JF_1.mp3", "./audio/num_JF_2.mp3", "./audio/num_JF_3.mp3"], "opts": {"えっ、急いで駅に電話して聞いてみよう。": "./audio/N3-L08_opt0.mp3?v=407a4fa5", "じゃあ、これから電車に乗るんだね。": "./audio/N3-L08_opt1.mp3?v=32661406", "新しいかばん、買えてよかったね。": "./audio/N3-L08_opt2.mp3?v=5a10070c"}}, "is_listening": true}]}, {"id": "N3-V32", "subject": "词汇", "point": "余る（あまる）", "point_key": "余る", "family": "kanji_reading", "modality": "memorize", "exam_weight": 2.9, "roi_score": 3.103, "teach": {"left": {"ja": "料理が余る（あまる）", "sub": "训读 あまる · 用不完多出来、剩下"}, "right": {"ja": "疲れがたまる", "sub": "积攒、堆积（溜まる）"}, "example_ja": "映画のチケットが一枚余っているから、よかったら一緒に行かない？", "zh_meaning": "电影票正好富余出一张，你要是方便的话要不要一起去看？", "audio": "./audio/VAR4-V32_exp.mp3?v=b5a8c19b"}, "primary": {"id": "VAR4-V32", "prompt": "映画のチケットが一枚「余って」いるから、よかったら一緒に行かない？「余って」の読み方は？", "choices": ["あまって", "たまって"], "answer": "あまって", "full_ja": "映画のチケットが一枚余っているから、よかったら一緒に行かない？", "zh_meaning": "电影票正好富余出一张，你要是方便的话要不要一起去看？", "why_line": "多出一张没人用的电影票，考单汉字自动词「余る」的训读。", "form_line": "多出来、剩下来写「余る」必读「あまる → あまって」；积攒积分或工作积压才念「たまって」。", "opt_notes": {"あまって": "「余る（富余、多出来）」的正确训读，多出一张电影票邀朋友同去。", "たまって": "「溜まる／貯まる（积攒、堆积）」的读音，易混五段自动词。"}, "q_audio": "./audio/VAR4-V32_q.mp3?v=98a9c293", "exp_audio": "./audio/VAR4-V32_exp.mp3?v=b5a8c19b", "listen_parts": null, "is_listening": false}, "variants": [{"id": "N3-V32", "prompt": "パーティーの料理を作りすぎて、お皿にたくさん「余った」。「余った」の読み方は？", "choices": ["あまった", "たまった"], "answer": "あまった", "full_ja": "パーティーの料理を作りすぎて、お皿にたくさん余った。", "zh_meaning": "聚会的菜做得太多了，盘子里剩下了好多。", "why_line": "考高频自动词「余る（剩下、富余）」的训读。", "form_line": "「余る」训读为「あまる → あまった」；「たまった」是「溜まった（积攒、堆积）」。", "opt_notes": {"あまった": "「余る（あまる）」的た形，表示菜做多了剩下来。", "たまった": "「溜まる（积压、攒下）」的读音，易混五段自动词。"}, "q_audio": "./audio/N3-V32_q.mp3?v=66801aa1", "exp_audio": "./audio/N3-V32_exp.mp3?v=f409af47", "listen_parts": null, "is_listening": false}, {"id": "VAR-V32", "prompt": "会議が早く終わって時間が三十分「余った」ので、お茶を飲みに行った。「余った」の読み方は？", "choices": ["あまった", "たまった"], "answer": "あまった", "full_ja": "会議が早く終わって時間が三十分余ったので、お茶を飲みに行った。", "zh_meaning": "会议提前结束，时间富余了三十分钟，就去喝了杯茶。", "why_line": "昨晚刚错过的双胞胎读音题：「余った（富余剩下）」vs「溜まった（积压）」。", "form_line": "时间或预算富余剩下写「余る」必读「あまる → あまった」；攒钱或积压工作才读「たまった」。", "opt_notes": {"あまった": "「余る（富余剩下）」的正确训读，会提前开完多出三十分钟。", "たまった": "「溜まる（积压）」或「貯まる（攒钱）」的读音，昨晚易混点。"}, "q_audio": "./audio/VAR-V32_q.mp3?v=f4760408", "exp_audio": "./audio/VAR-V32_exp.mp3?v=27285ab5", "listen_parts": null, "is_listening": false}]}, {"id": "N3-L12", "subject": "听力", "point": "聴解「〜てく」带走/喝完再去", "point_key": "N3L-018", "family": "listen_contract", "modality": "listen", "exam_weight": 2.7, "roi_score": 1.674, "teach": {"left": {"ja": "飲んでかない？", "sub": "飲んでいかない？ · 要不要喝杯咖啡再走"}, "right": {"ja": "〜ていく → 〜てく", "sub": "口语吃掉 い 音的热情挽留"}, "example_ja": "男：まだ少し時間あるから、コーヒーでも飲んでかない？", "zh_meaning": "男：「还有点时间，要不要喝杯咖啡再走？」", "audio": "./audio/N3-L12_exp.mp3?v=81adac36"}, "primary": {"id": "N3-L12", "prompt": "", "choices": ["じゃあ、すぐお湯を沸かすね。", "気をつけて帰ってね。", "コーヒーは買わなくていいよ。"], "answer": "じゃあ、すぐお湯を沸かすね。", "full_ja": "男：まだ少し時間あるから、コーヒーでも飲んでかない？", "zh_meaning": "男：「还有点时间，要不要喝杯咖啡再走？」", "why_line": "「飲んでかない？」是「飲んでいかない？」的口语缩音，邀请对方顺道喝杯咖啡再去。", "form_line": "「好呀那我马上烧水」顺势答应一起喝；变成送客道别；跑题。", "opt_notes": {"じゃあ、すぐお湯を沸かすね。": "「好呀，那我马上烧水泡咖啡。」（或顺势接下喝一杯的提议）。", "気をつけて帰ってね。": "「路上小心回去哦。」对方是在邀你喝完再走，不是在道别。", "コーヒーは買わなくていいよ。": "「不用买咖啡哦。」答非所问。"}, "q_audio": "./audio/N3-L12_q.mp3?v=31f904c7", "exp_audio": "./audio/N3-L12_exp.mp3?v=81adac36", "listen_parts": {"stem": "./audio/N3-L12_stem.mp3?v=b1046f8c", "nums": ["./audio/num_JF_1.mp3", "./audio/num_JF_2.mp3", "./audio/num_JF_3.mp3"], "opts": {"じゃあ、すぐお湯を沸かすね。": "./audio/N3-L12_opt0.mp3?v=c376b4f4", "気をつけて帰ってね。": "./audio/N3-L12_opt1.mp3?v=12997db4", "コーヒーは買わなくていいよ。": "./audio/N3-L12_opt2.mp3?v=5d76f345"}}, "is_listening": true}, "variants": []}, {"id": "N3-V17", "subject": "词汇", "point": "慰める（なぐさめる）", "point_key": "慰める", "family": "kanji_reading", "modality": "memorize", "exam_weight": 2.8, "roi_score": 2.996, "teach": {"left": {"ja": "慰める（なぐさめる）", "sub": "训读 · 温言安慰沮丧的人"}, "right": {"ja": "諦める（あきらめる）", "sub": "死心、放弃"}, "example_ja": "仕事で失敗して落ち込んでいる同僚を、みんなで慰めることにした。", "zh_meaning": "同事因为工作失误情绪低落，大家决定一起去安慰他。", "audio": "./audio/VAR4-V17_exp.mp3?v=7e6d27f1"}, "primary": {"id": "VAR4-V17", "prompt": "仕事で失敗して落ち込んでいる同僚を、みんなで「慰める」ことにした。「慰める」の読み方は？", "choices": ["なぐさめる", "あらためる"], "answer": "なぐさめる", "full_ja": "仕事で失敗して落ち込んでいる同僚を、みんなで慰めることにした。", "zh_meaning": "同事因为工作失误情绪低落，大家决定一起去安慰他。", "why_line": "复测单汉字一段动词「慰める（安慰）」的原形四拍训读。", "form_line": "「慰める」训读「なぐさめる」；干扰项「あらためる」是「改める（改正、重新）」。", "opt_notes": {"なぐさめる": "「慰める」的正确训读，安慰因工作失误消沉的同事。", "あらためる": "「改める（改善、更改）」的读音，同为四拍一段动词干扰项。"}, "q_audio": "./audio/VAR4-V17_q.mp3?v=ff17c45d", "exp_audio": "./audio/VAR4-V17_exp.mp3?v=7e6d27f1", "listen_parts": null, "is_listening": false}, "variants": [{"id": "N3-V17", "prompt": "試合に負けて泣いている後輩を優しく「慰めた」。「慰めた」の読み方は？", "choices": ["なぐさめた", "あきらめた"], "answer": "なぐさめた", "full_ja": "試合に負けて泣いている後輩を優しく慰めた。", "zh_meaning": "温柔地安慰了输掉比赛哭泣的后辈。", "why_line": "考高频一段他动词「慰める（安慰）」的四拍训读。", "form_line": "「慰める」读「なぐさめる → なぐさめた」；「あきらめた」是「諦めた（放弃死心）」。", "opt_notes": {"なぐさめた": "「慰める」的正确训读。", "あきらめた": "「諦める（放弃）」的读音，易混四拍一段动词。"}, "q_audio": "./audio/N3-V17_q.mp3?v=c222d673", "exp_audio": "./audio/N3-V17_exp.mp3?v=9c429b11", "listen_parts": null, "is_listening": false}, {"id": "VAR-V17", "prompt": "試験に落ちて元気がない友人を、温かい言葉で「慰めた」。「慰めた」の読み方は？", "choices": ["なぐさめた", "たしかめた"], "answer": "なぐさめた", "full_ja": "試験に落ちて元気がない友人を、温かい言葉で慰めた。", "zh_meaning": "用温暖的话语安慰了落榜没精打采的朋友。", "why_line": "复测单汉字动词「慰める（安慰）」的四拍训读。", "form_line": "「慰める」训读「なぐさめる → なぐさめた」；「たしかめた」是「確かめた（确认）」。", "opt_notes": {"なぐさめた": "「慰める」的正确训读，意为安慰失落的朋友。", "たしかめた": "「確かめる（确认核实）」的读音，同为四拍一段动词易混。"}, "q_audio": "./audio/VAR-V17_q.mp3?v=2f71184e", "exp_audio": "./audio/VAR-V17_exp.mp3?v=081e955e", "listen_parts": null, "is_listening": false}]}, {"id": "N3-V21", "subject": "词汇", "point": "加える（くわえる）", "point_key": "加える", "family": "kanji_reading", "modality": "memorize", "exam_weight": 2.7, "roi_score": 2.889, "teach": {"left": {"ja": "加える（くわえる）", "sub": "训读三拍 く・わ・える · 添加"}, "right": {"ja": "変える（かえる）", "sub": "改变、更换"}, "example_ja": "発表の資料にグラフを一つ加えると、もっとわかりやすくなる。", "zh_meaning": "在汇报资料里添上一张图表的话，就会变得更加清晰易懂。", "audio": "./audio/VAR4-V21_exp.mp3?v=cf655402"}, "primary": {"id": "VAR4-V21", "prompt": "発表の資料にグラフを一つ「加える」と、もっとわかりやすくなる。「加える」の読み方は？", "choices": ["くわえる", "かかえる"], "answer": "くわえる", "full_ja": "発表の資料にグラフを一つ加えると、もっとわかりやすくなる。", "zh_meaning": "在汇报资料里添上一张图表的话，就会变得更加清晰易懂。", "why_line": "考单汉字一段动词「加える（添加、补充）」的原形训读。", "form_line": "「加える」训读为「くわえる」；干扰项「かかえる」是「抱える（抱住、背负问题）」。", "opt_notes": {"くわえる": "「加える（添加、增加）」的正确训读。", "かかえる": "「抱える（双手抱着、承担难题）」的读音，首尾相近易混。"}, "q_audio": "./audio/VAR4-V21_q.mp3?v=dd10e778", "exp_audio": "./audio/VAR4-V21_exp.mp3?v=cf655402", "listen_parts": null, "is_listening": false}, "variants": [{"id": "N3-V21", "prompt": "スープに塩を少し「加えて」味を調えた。「加えて」の読み方は？", "choices": ["くわえて", "かえて"], "answer": "くわえて", "full_ja": "スープに塩を少し加えて味を調えた。", "zh_meaning": "往汤里稍微加了一点盐把味道调好。", "why_line": "「塩を加える（加盐）」考单汉字动词「加える」的训读。", "form_line": "「加える」训读三拍「くわえる → くわえて」；「かえて」是「変える（改变）」。", "opt_notes": {"くわえて": "「加える（くわえる）」的正确训读。", "かえて": "把音读「か（参加）」误套进训读动词。"}, "q_audio": "./audio/N3-V21_q.mp3?v=525b0d1f", "exp_audio": "./audio/N3-V21_exp.mp3?v=c06f4bc4", "listen_parts": null, "is_listening": false}, {"id": "VAR-V21", "prompt": "名簿に新入社員の名前を三人「加えた」。「加えた」の読み方は？", "choices": ["くわえた", "そろえた"], "answer": "くわえた", "full_ja": "名簿に新入社員の名前を三人加えた。", "zh_meaning": "往花名册里新添了三名新员工的名字。", "why_line": "复测单汉字动词「加える（添加、加入）」的三拍训读。", "form_line": "「加える」训读「くわえる → くわえた」；「そろえた」是「揃えた（凑齐、摆齐）」。", "opt_notes": {"くわえた": "「加える」的正确训读，把新员工名字加进花名册。", "そろえた": "「揃える（凑齐、摆整齐）」的读音。"}, "q_audio": "./audio/VAR-V21_q.mp3?v=0291855d", "exp_audio": "./audio/VAR-V21_exp.mp3?v=ae91544e", "listen_parts": null, "is_listening": false}]}, {"id": "N3-V10", "subject": "词汇", "point": "ぎりぎり", "point_key": "ぎりぎり", "family": "kana_adverb", "modality": "listen", "exam_weight": 2.1, "roi_score": 2.247, "teach": {"left": {"ja": "ぎりぎり間に合う", "sub": "卡着死线最后一秒勉强赶上"}, "right": {"ja": "ぴったり合う", "sub": "尺寸/时间严丝合缝刚刚好"}, "example_ja": "このシャツは私の体にサイズがぴったりだ。", "zh_meaning": "这件衬衫穿在我身上尺码严丝合缝刚刚好。", "audio": "./audio/VAR-V10_exp.mp3?v=d0983244"}, "primary": {"id": "VAR-V10", "prompt": "このシャツは私の体にサイズが（　　）だ。", "choices": ["ぴったり", "ぎりぎり"], "answer": "ぴったり", "full_ja": "このシャツは私の体にサイズがぴったりだ。", "zh_meaning": "这件衬衫穿在我身上尺码严丝合缝刚刚好。", "why_line": "形容衣服合身、尺寸或时间「分毫不差、刚刚好贴合」。", "form_line": "「ぴったり」表示严丝合缝刚刚好；「ぎりぎり」是卡在极限边缘差一点就不够。", "opt_notes": {"ぴったり": "尺寸、答案、时间严丝合缝刚好契合。", "ぎりぎり": "指逼近极限差点出局，不用于夸衣服合身。"}, "q_audio": "./audio/VAR-V10_q.mp3?v=fbc0eac6", "exp_audio": "./audio/VAR-V10_exp.mp3?v=d0983244", "listen_parts": null, "is_listening": false}, "variants": [{"id": "N3-V10", "prompt": "駅まで走って、終電に（　　）間に合った。", "choices": ["ぎりぎり", "ぐっすり"], "answer": "ぎりぎり", "full_ja": "駅まで走って、終電にぎりぎり間に合った。", "zh_meaning": "一路跑到车站，卡着最后一刻勉强赶上了末班车。", "why_line": "一路跑过去才赶上末班车，说明时间「卡在极限边缘、差一点就没赶上」。", "form_line": "「ぎりぎり」表示卡着极限勉强赶上（常配間に合う）；「ぐっすり」形容睡得香甜熟睡。", "opt_notes": {"ぎりぎり": "表示逼近极限边缘、差一点就迟到但勉强赶上。", "ぐっすり": "意为「香甜熟睡（ぐっすり眠る）」，与赶电车无关。"}, "q_audio": "./audio/N3-V10_q.mp3?v=36752e73", "exp_audio": "./audio/N3-V10_exp.mp3?v=ddb63d42", "listen_parts": null, "is_listening": false}]}, {"id": "V-20261114-05", "subject": "词汇", "point": "はっきり", "point_key": "はっきり", "family": "kana_adverb", "modality": "listen", "exam_weight": 2.0, "roi_score": 2.14, "teach": {"left": {"ja": "はっきり", "sub": "🔍 清晰明确（声音/视线/态度） · はっきり言う・富士山がはっきり見える"}, "right": {"ja": "うっかり", "sub": "💭 一走神犯迷糊 · うっかり忘れる・うっかり乗り過ごす"}, "example_ja": "今日は空気が澄んでいて、遠くの富士山まではっきり見える。", "zh_meaning": "今天空气清澈，连远处的富士山都看得一清二楚。", "audio": "./audio/VAR-V05_exp.mp3?v=684403db"}, "primary": {"id": "VAR-V05", "prompt": "今日は空気が澄んでいて、遠くの富士山まで（　　）見える。", "choices": ["はっきり", "ぼんやり"], "answer": "はっきり", "full_ja": "今日は空気が澄んでいて、遠くの富士山まではっきり見える。", "zh_meaning": "今天空气清澈，连远处的富士山都看得一清二楚。", "why_line": "前面给出原因「空気が澄んでいて（空气澄澈透亮）」，远山轮廓清晰可见。", "form_line": "清楚分明用「はっきり」；雾蒙蒙看不清或发呆才是「ぼんやり」。", "opt_notes": {"はっきり": "视觉听觉清晰分明，或态度干脆利落。", "ぼんやり": "雾蒙蒙看不清或走神发呆，与「空気が澄んでいて（空气清澈）」相反。"}, "q_audio": "./audio/VAR-V05_q.mp3?v=b0d9c0df", "exp_audio": "./audio/VAR-V05_exp.mp3?v=684403db", "listen_parts": null, "is_listening": false}, "variants": [{"id": "V-20261114-05", "prompt": "後ろの席まで聞こえるように、もっと大きな声で（　　）返事をしてください。", "choices": ["はっきり", "うっかり"], "answer": "はっきり", "full_ja": "後ろの席まで聞こえるように、もっと大きな声ではっきり返事をしてください。", "zh_meaning": "为了让后排座位也听得见，请更大声、更清楚地回答。", "why_line": "要求声音洪亮、吐字「清清楚楚、明明白白」。", "form_line": "「はっきり」表示清楚分明；「うっかり」表示一时走神、疏忽大意。", "opt_notes": {"はっきり": "表示声音响亮清楚、轮廓清晰可见或态度明确果断（はっきり断る）。", "うっかり": "表示「一不留神、粗心大意」，只能搭配犯错/忘事，不能祈使别人「迷糊地回答」。"}, "q_audio": "./audio/V-20261114-05_q.mp3?v=c617d78e", "exp_audio": "./audio/V-20261114-05_exp.mp3?v=10a8c2b8", "listen_parts": null, "is_listening": false}, {"id": "VAR4-V05", "prompt": "引き受けられない頼みは、最初から（　　）断ったほうがいい。", "choices": ["はっきり", "うっかり"], "answer": "はっきり", "full_ja": "引き受けられない頼みは、最初からはっきり断ったほうがいい。", "zh_meaning": "自己办不到的请求，从一开始就明确拒绝比较好。", "why_line": "除了声音响亮、视线清晰，「はっきり」还常用来形容态度干脆不含糊。", "form_line": "态度明确果断地拒绝＝「はっきり断る」；「うっかり」是一走神犯迷糊。", "opt_notes": {"はっきり": "表示态度鲜明、不含糊地明确表态（はっきり断る／はっきり言う）。", "うっかり": "表示一不留神犯迷糊，不能搭配建议别人「从一开始就果断拒绝」。"}, "q_audio": "./audio/VAR4-V05_q.mp3?v=13d9c9f6", "exp_audio": "./audio/VAR4-V05_exp.mp3?v=a9ac1425", "listen_parts": null, "is_listening": false}]}, {"id": "V-20261114-06", "subject": "词汇", "point": "うっかり", "point_key": "うっかり", "family": "kana_adverb", "modality": "listen", "exam_weight": 2.0, "roi_score": 2.14, "teach": {"left": {"ja": "うっかり", "sub": "💭 分神失误（配 忘れる/乗り過ごす） · 聊嗨了一不留神坐过站"}, "right": {"ja": "しっかり", "sub": "🪨 牢靠踏实（配 持つ/勉強する） · 抓牢扶手 / 踏实准备考试"}, "example_ja": "電車が揺れるので、手すりにしっかりつかまってください。", "zh_meaning": "电车摇晃，请牢牢抓紧扶手。", "audio": "./audio/VAR-V06_exp.mp3?v=601db18b"}, "primary": {"id": "VAR-V06", "prompt": "電車が揺れるので、手すりに（　　）つかまってください。", "choices": ["しっかり", "うっかり"], "answer": "しっかり", "full_ja": "電車が揺れるので、手すりにしっかりつかまってください。", "zh_meaning": "电车摇晃，请牢牢抓紧扶手。", "why_line": "电车晃动时广播提醒乘客「稳稳地、牢牢地」扶好扶手。", "form_line": "「しっかり」表示牢牢地、稳当地；「うっかり」是一不留神走神大意。", "opt_notes": {"しっかり": "表示牢牢地、稳固地抓住扶手。", "うっかり": "表示不小心犯迷糊，语义相反。"}, "q_audio": "./audio/VAR-V06_q.mp3?v=8382a4f2", "exp_audio": "./audio/VAR-V06_exp.mp3?v=601db18b", "listen_parts": null, "is_listening": false}, "variants": [{"id": "V-20261114-06", "prompt": "おしゃべりに夢中になって、（　　）駅を乗り過ごした。", "choices": ["うっかり", "しっかり"], "answer": "うっかり", "full_ja": "おしゃべりに夢中になって、うっかり降りる駅を乗り過ごしてしまった。", "zh_meaning": "光顾着聊天太投入，一不小心坐过了站。", "why_line": "聊天聊忘了神，「一不留神、疏忽大意」犯了小错，常和句尾「てしまった」呼应。", "form_line": "「うっかり」是不小心走神；「しっかり」意思正好相反，表示牢牢抓稳、踏实可靠。", "opt_notes": {"うっかり": "专配「忘れる／乗り過ごす／口を滑らせる」等因走神引起的小失误。", "しっかり": "意为「结实地、认真稳妥地」，与「聊天入迷坐过站」完全相反。"}, "q_audio": "./audio/V-20261114-06_q.mp3?v=60eb5c55", "exp_audio": "./audio/V-20261114-06_exp.mp3?v=678d08dd", "listen_parts": null, "is_listening": false}]}, {"id": "N3-V12", "subject": "词汇", "point": "ついてない（倒霉）", "point_key": "ついてない", "family": "idiom_luck", "modality": "listen", "exam_weight": 2.8, "roi_score": 1.736, "teach": {"left": {"ja": "今日はついてない", "sub": "运背、点背、真倒霉"}, "right": {"ja": "運がついている", "sub": "走运、手气好"}, "example_ja": "財布を落とすし、急な雨にも降られるし、今日は本当についてない。", "zh_meaning": "既丢了钱包，又被突如其来的雨淋了，今天真是点背透了。", "audio": "./audio/N3-V12_exp.mp3?v=199d9581"}, "primary": {"id": "N3-V12", "prompt": "財布を落とすし、急な雨にも降られるし、今日は本当に（　　）。", "choices": ["ついてない", "かまわない"], "answer": "ついてない", "full_ja": "財布を落とすし、急な雨にも降られるし、今日は本当についてない。", "zh_meaning": "既丢了钱包，又被突如其来的雨淋了，今天真是点背透了。", "why_line": "前面用「〜し、〜し」连举两件倒霉事，句尾感叹今天运气太差。", "form_line": "口语说手气背、倒霉固定用「ついてない」（運がついていない）；「かまわない」是不在乎。", "opt_notes": {"ついてない": "惯用语，意为「运气不好、真倒霉」。", "かまわない": "意为「没关系、不在乎」，不符合连连倒霉的叹息。"}, "q_audio": "./audio/N3-V12_q.mp3?v=96bda144", "exp_audio": "./audio/N3-V12_exp.mp3?v=199d9581", "listen_parts": null, "is_listening": false}, "variants": []}, {"id": "N3-V13", "subject": "词汇", "point": "うっとり（陶醉入迷）", "point_key": "うっとり", "family": "kana_adverb", "modality": "listen", "exam_weight": 2.8, "roi_score": 1.736, "teach": {"left": {"ja": "音色にうっとりする", "sub": "被美景音乐迷住、如痴如醉"}, "right": {"ja": "疲れてぐったりする", "sub": "累得瘫软无力、筋疲力尽"}, "example_ja": "あまりに美しいピアノの音色に、会場のみんながうっとり聞き入った。", "zh_meaning": "钢琴的音色太美了，全场听众都听得如痴如醉。", "audio": "./audio/N3-V13_exp.mp3?v=83bb689e"}, "primary": {"id": "N3-V13", "prompt": "あまりに美しいピアノの音色に、会場のみんなが（　　）聞き入った。", "choices": ["うっとり", "ぐったり"], "answer": "うっとり", "full_ja": "あまりに美しいピアノの音色に、会場のみんながうっとり聞き入った。", "zh_meaning": "钢琴的音色太美了，全场听众都听得如痴如醉。", "why_line": "形容被优美的音乐、夜景或美人吸引得神魂颠倒、陶醉出神。", "form_line": "陶醉入迷用「うっとり」；「ぐったり」是累得瘫在沙发上浑身没劲。", "opt_notes": {"うっとり": "形容被美好事物吸引得陶醉出神。", "ぐったり": "形容精疲力竭瘫软无力。"}, "q_audio": "./audio/N3-V13_q.mp3?v=124d43d2", "exp_audio": "./audio/N3-V13_exp.mp3?v=83bb689e", "listen_parts": null, "is_listening": false}, "variants": []}, {"id": "N3-V14", "subject": "词汇", "point": "からから（干渴）", "point_key": "からから", "family": "kana_adverb", "modality": "listen", "exam_weight": 2.8, "roi_score": 1.736, "teach": {"left": {"ja": "のどがからからだ", "sub": "清音 · 嗓子干得冒烟、水分干透"}, "right": {"ja": "電車ががらがらだ", "sub": "浊音 · 车厢店里空荡荡没人"}, "example_ja": "暑い中を二時間も歩いたので、のどがからからに乾いた。", "zh_meaning": "大热天走了两个小时，嗓子渴得直冒烟。", "audio": "./audio/N3-V14_exp.mp3?v=d4874161"}, "primary": {"id": "N3-V14", "prompt": "暑い中を二時間も歩いたので、のどが（　　）に乾いた。", "choices": ["からから", "がらがら"], "answer": "からから", "full_ja": "暑い中を二時間も歩いたので、のどがからからに乾いた。", "zh_meaning": "大热天走了两个小时，嗓子渴得直冒烟。", "why_line": "后接「乾いた（干了）」，描写体内水分耗尽、喉咙干涸。", "form_line": "清音「からから」表示水分干透、口干舌燥；浊音「がらがら」表示车厢空荡荡或嗓子沙哑。", "opt_notes": {"からから": "形容水分彻底干涸、口干舌燥（のどがからから）。", "がらがら": "形容空间空荡无人，接「のど」会变成感冒嗓子哑了，不配「乾いた」。"}, "q_audio": "./audio/N3-V14_q.mp3?v=1b1d6f93", "exp_audio": "./audio/N3-V14_exp.mp3?v=d4874161", "listen_parts": null, "is_listening": false}, "variants": [{"id": "VAR-V14", "prompt": "サウナから出た後で、のどが（　　）だったのですぐ水を飲んだ。", "choices": ["からから", "ぎっしり"], "answer": "からから", "full_ja": "サウナから出た後で、のどがからからだったのですぐ水を飲んだ。", "zh_meaning": "从桑拿房出来后嗓子干透了，马上喝了水。", "why_line": "蒸完桑拿流汗口渴，喉咙干涸急需喝水。", "form_line": "「のどがからから」是口干舌燥固定搭配；「ぎっしり」是日程或箱子塞得满满当当。", "opt_notes": {"からから": "口干舌燥、水分干透。", "ぎっしり": "日程或箱子塞得满满当当。"}, "q_audio": "./audio/VAR-V14_q.mp3?v=e0794d21", "exp_audio": "./audio/VAR-V14_exp.mp3?v=6737fff7", "listen_parts": null, "is_listening": false}]}, {"id": "N3-V15", "subject": "词汇", "point": "ぶらぶら（闲逛溜达）", "point_key": "ぶらぶら", "family": "kana_adverb", "modality": "listen", "exam_weight": 2.8, "roi_score": 1.736, "teach": {"left": {"ja": "町をぶらぶら歩く", "sub": "悠闲自在地溜达、闲逛"}, "right": {"ja": "出口を探してうろうろする", "sub": "迷路焦急乱转、形迹可疑徘徊"}, "example_ja": "日曜日は特に予定もなかったので、古い商店街をぶらぶら散歩した。", "zh_meaning": "周日没什么特别安排，就在老商业街悠闲地溜达散步。", "audio": "./audio/N3-V15_exp.mp3?v=fae7b861"}, "primary": {"id": "N3-V15", "prompt": "日曜日は特に予定もなかったので、古い商店街を（　　）散歩した。", "choices": ["ぶらぶら", "うろうろ"], "answer": "ぶらぶら", "full_ja": "日曜日は特に予定もなかったので、古い商店街をぶらぶら散歩した。", "zh_meaning": "周日没什么特别安排，就在老商业街悠闲地溜达散步。", "why_line": "周日没事干去散步，心情是轻松惬意、不赶时间的。", "form_line": "悠闲逛街溜达用「ぶらぶら」；「うろうろ」是迷路找不着出口或形迹可疑地转悠。", "opt_notes": {"ぶらぶら": "不赶时间、轻松悠闲地漫步闲逛。", "うろうろ": "不知所措地原地打转或可疑徘徊，不配悠闲散步。"}, "q_audio": "./audio/N3-V15_q.mp3?v=6c92102b", "exp_audio": "./audio/N3-V15_exp.mp3?v=fae7b861", "listen_parts": null, "is_listening": false}, "variants": []}, {"id": "N3-V16", "subject": "词汇", "point": "がっかり（失望泄气）", "point_key": "がっかり", "family": "kana_adverb", "modality": "listen", "exam_weight": 2.8, "roi_score": 1.736, "teach": {"left": {"ja": "中止でがっかりする", "sub": "大失所望、像泄了气的皮球"}, "right": {"ja": "気分がすっきりする", "sub": "神清气爽、痛快舒畅"}, "example_ja": "楽しみにしていた試合が雨で中止になり、子どもたちはがっかりしていた。", "zh_meaning": "盼了好久的比赛因雨取消，孩子们都大失所望。", "audio": "./audio/N3-V16_exp.mp3?v=3c7a4b75"}, "primary": {"id": "N3-V16", "prompt": "楽しみにしていた試合が雨で中止になり、子どもたちは（　　）していた。", "choices": ["がっかり", "すっきり"], "answer": "がっかり", "full_ja": "楽しみにしていた試合が雨で中止になり、子どもたちはがっかりしていた。", "zh_meaning": "盼了好久的比赛因雨取消，孩子们都大失所望。", "why_line": "原本满怀期待的事突然泡汤，肩膀一下子垮下来泄了气。", "form_line": "失望泄气用「がっかり」；神清气爽痛快舒畅才用「すっきり」。", "opt_notes": {"がっかり": "表示期待落空后的沮丧与失望。", "すっきり": "表示心情或头脑清爽畅快，语义相反。"}, "q_audio": "./audio/N3-V16_q.mp3?v=264828fa", "exp_audio": "./audio/N3-V16_exp.mp3?v=3c7a4b75", "listen_parts": null, "is_listening": false}, "variants": [{"id": "VAR-V16", "prompt": "熱いシャワーを浴びたら、頭も体も（　　）した。", "choices": ["すっきり", "がっかり"], "answer": "すっきり", "full_ja": "熱いシャワーを浴びたら、頭も体もすっきりした。", "zh_meaning": "冲了个热水澡，头脑和身体都神清气爽。", "why_line": "洗掉一身疲惫汗水之后，整个人清爽舒畅。", "form_line": "神清气爽用「すっきり」；失望泄气才是「がっかり」。", "opt_notes": {"すっきり": "浑身清爽畅快。", "がっかり": "沮丧泄气，语义相反。"}, "q_audio": "./audio/VAR-V16_q.mp3?v=5136e7e2", "exp_audio": "./audio/VAR-V16_exp.mp3?v=e7655c5c", "listen_parts": null, "is_listening": false}]}, {"id": "N3-V18", "subject": "词汇", "point": "組む（くむ）", "point_key": "組む", "family": "kanji_reading", "modality": "write", "exam_weight": 2.7, "roi_score": 1.674, "teach": {"left": {"ja": "予定を組む（くむ）", "sub": "词首清音 く · 编排日程/交叉"}, "right": {"ja": "ぐむ", "sub": "只有接在复合词后才可能连浊（番組 ばんぐみ）"}, "example_ja": "無理のないように、来月のスケジュールを組んだ。", "zh_meaning": "为了不至于太赶，合理编排了下个月的日程表。", "audio": "./audio/N3-V18_exp.mp3?v=6684b56b"}, "primary": {"id": "N3-V18", "prompt": "無理のないように、来月のスケジュールを「組んだ」。「組んだ」の読み方は？", "choices": ["くんだ", "ぐんだ"], "answer": "くんだ", "full_ja": "無理のないように、来月のスケジュールを組んだ。", "zh_meaning": "为了不至于太赶，合理编排了下个月的日程表。", "why_line": "「スケジュールを組む」表示编排日程，考词首清浊音。", "form_line": "单独动词「組む」词首永远是清音「くむ → くんだ」；只有排在复合词后半截如「番組（ばんぐみ）」才连浊。", "opt_notes": {"くんだ": "「組む（くむ）」的た形，词首清音不浊化。", "ぐんだ": "受「番組（ばんぐみ）」连浊影响产生的词首误读。"}, "q_audio": "./audio/N3-V18_q.mp3?v=4765f214", "exp_audio": "./audio/N3-V18_exp.mp3?v=6684b56b", "listen_parts": null, "is_listening": false}, "variants": []}, {"id": "N3-V20", "subject": "词汇", "point": "指示（しじ）", "point_key": "指示", "family": "kanji_reading", "modality": "write", "exam_weight": 2.7, "roi_score": 1.674, "teach": {"left": {"ja": "指示（し・じ）", "sub": "先清音 し、后浊音 じ"}, "right": {"ja": "じし", "sub": "把清浊顺序颠倒了"}, "example_ja": "災害のときは、係員の指示に従ってください。", "zh_meaning": "遇到灾害时，请听从工作人员的指示。", "audio": "./audio/N3-V20_exp.mp3?v=e72af0a4"}, "primary": {"id": "N3-V20", "prompt": "災害のときは、係員の「指示」に従ってください。「指示」の読み方は？", "choices": ["しじ", "じし"], "answer": "しじ", "full_ja": "災害のときは、係員の指示に従ってください。", "zh_meaning": "遇到灾害时，请听从工作人员的指示。", "why_line": "考职场与广播高频词「指示」两个假名的清浊顺序。", "form_line": "第一拍「指（し）」是清音，第二拍「示（じ）」是浊音，合起来「しじ」，绝不能颠倒成「じし」。", "opt_notes": {"しじ": "「指示」标准音读（①型）：指（し）＋示（じ）。", "じし": "前后清浊颠倒的典型误读。"}, "q_audio": "./audio/N3-V20_q.mp3?v=4f8354d1", "exp_audio": "./audio/N3-V20_exp.mp3?v=e72af0a4", "listen_parts": null, "is_listening": false}, "variants": []}], "words": {"私用": {"head": "私用", "kana": "しよう", "pos": "名词", "zh": "私事，私人事情", "audio": "./audio/words/w_56d2983920.mp3", "trap_hl": ["し"], "trap_tag": "短音", "zh_opaque": false}, "風邪": {"head": "風邪", "kana": "かぜ", "pos": "名词", "zh": "感冒", "audio": "./audio/words/w_334bdc29ca.mp3", "trap_hl": ["かぜ"], "trap_tag": "熟字训", "zh_opaque": true}, "会議室": {"head": "会議室", "kana": "かいぎしつ", "pos": "名词", "zh": "会议室", "audio": "./audio/words/w_9ee159da4c.mp3", "trap_hl": ["ぎ"], "trap_tag": "连浊", "zh_opaque": false}, "子ども": {"head": "子ど // Portrait guard: if the phone still auto-rotates to landscape (system lock unsupported in this launch mode),
// counter-rotate the whole app so it stays upright relative to the phone, like a real portrait-only app.
let FP_ANGLE = 0;
function currentScreenAngle() {
  try {
    if (screen && screen.orientation && typeof screen.orientation.angle === "number") return screen.orientation.angle;
  } catch (e) {}
  if (typeof window.orientation === "number") return (window.orientation + 360) % 360;
  return -1;
}
function applyPortraitGuard() {
  const root = document.documentElement;
  const w = window.innerWidth || 0;
  const h = window.innerHeight || 0;
  const sw = (screen && screen.width) || w;
  const sh = (screen && screen.height) || h;
  const phone = Math.min(sw, sh) < 600;
  const ang = currentScreenAngle();
  let a = 0;
  if (phone && w > h && (ang === 90 || ang === 270 || ang === -1)) a = ang === 270 ? 270 : 90;
  FP_ANGLE = a;
  root.classList.toggle("fp", a !== 0);
  root.classList.toggle("fp-90", a === 90);
  root.classList.toggle("fp-270", a === 270);
  if (a && root.style && root.style.setProperty) {
    root.style.setProperty("--fp-w", w + "px");
    root.style.setProperty("--fp-h", h + "px");
  }
}
function fpXY(cx, cy) {
  if (FP_ANGLE === 90) return { x: window.innerHeight - cy, y: cx };
  if (FP_ANGLE === 270) return { x: cy, y: window.innerWidth - cx };
  return { x: cx, y: cy };
}
function fpX(p) { return fpXY(p.clientX, p.clientY).x; }
function fpY(p) { return fpXY(p.clientX, p.clientY).y; }
applyPortraitGuard();
window.addEventListener("resize", applyPortraitGuard);
window.addEventListener("orientationchange", () => { tryLockPortrait(); setTimeout(applyPortraitGuard, 60); });

function mergeFlashProgTuple(st, fp) {
  if (!Array.isArray(fp) || fp.length < 3) return false;
  const cur = Array.isArray(st.flashProg) ? st.flashProg : [0, 0, 0, 0];
  const sSeen = Math.max(0, Math.floor(fp[0] || 0));
  const sTgt = Math.max(0, Math.floor(fp[1] || 0));
  const sDone = Math.max(0, Math.floor(fp[2] || 0));
  const sUpd = Math.max(0, Math.floor(fp[3] || 0));
  const nSeen = Math.max(Math.floor(cur[0] || 0), sSeen);
  const nDone = Math.max(Math.floor(cur[2] || 0), sDone);
  const nUpd = Math.max(Math.floor(cur[3] || 0), sUpd);
  let nTgt = (sUpd >= Math.floor(cur[3] || 0) && sTgt > 0) ? sTgt : (Math.floor(cur[1] || 0) || sTgt);
  nTgt = Math.max(nSeen, nTgt);
  const next = [nSeen, nTgt, nDone, nUpd];
  if (String(next) === String(cur)) return false;
  st.flashProg = next;
  return true;
}

function recomputeStatusesFromCRDT(st) {
  const rAt = Math.floor(st.resetAt || 0);
  const minTs = Math.max(MIN_REAL_TS, rAt + 1);
  DATA.points.forEach(p => {
    const ps = st.pts[p.id];
    if (!ps) return;
    ps.greenAt = Math.floor(ps.greenAt || 0);
    ps.retestAt = Math.floor(ps.retestAt || 0);
    if (ps.greenAt < MIN_REAL_TS) ps.greenAt = 0;
    if (ps.retestAt < MIN_REAL_TS) ps.retestAt = 0;
    ps.wrongCount = Math.floor(ps.wrongCount || 0);
    ps.variantIdx = Math.floor(ps.variantIdx || 0);
    if (ps.greenAt >= minTs && ps.greenAt >= ps.retestAt) {
      ps.status = "green";
      ps.retryCardId = "";
    } else if (ps.retestAt >= minTs) {
      ps.status = "learning";
      if (!ps.reqPasses || ps.reqPasses < 1) {
        ps.reqPasses = (p.primary && p.primary.is_listening && p.variants && p.variants.length > 0) ? 2 : 1;
      }
    } else {
      ps.status = "unseen";
    }
  });
}

function parseMasteryState(raw) {
  const s = String(raw || "todo").trim();
  if (s === "done") return { mstate: "done", tier: "done", streak: 3, lastDate: "" };
  if (s === "wip0") return { mstate: "wip0", tier: "wip", streak: 0, lastDate: "" };
  const parts = s.split(":");
  const head = parts[0];
  const dt = parts[1] || "";
  if (head === "wip2") return { mstate: dt ? `wip2:${dt}` : "wip2", tier: "wip", streak: 2, lastDate: dt };
  if (head === "wip1" || head === "wip") return { mstate: dt ? `wip1:${dt}` : "wip1", tier: "wip", streak: 1, lastDate: dt };
  return { mstate: dt ? `todo:${dt}` : "todo", tier: "todo", streak: 0, lastDate: dt };
}

function getEffectiveMastery(key, altKey) {
  const ov = A.masteryOverrides || {};
  const ts = A.masteryOverrideTs || {};
  const k1 = key || "";
  const k2 = altKey || "";
  let raw = "";
  if (k1 && ov[k1] && k2 && ov[k2]) {
    raw = (ts[k1] || 0) >= (ts[k2] || 0) ? ov[k1] : ov[k2];
  } else if (k1 && ov[k1]) {
    raw = ov[k1];
  } else if (k2 && ov[k2]) {
    raw = ov[k2];
  } else {
    raw = BASE_MSTATE_MAP[k1] || BASE_MSTATE_MAP[k2] || "todo";
  }
  return parseMasteryState(raw);
}

function computeNextMasteryState(curObj, action, dayTag) {
  const d = dayTag || TODAY_TAG;
  if (action === "seal") return "done";
  if (action === "fail") return `todo:${d}`;
  if (action === "recover" || curObj.mstate === `todo:${d}`) {
    return `todo:${d}`;
  }
  if (curObj.tier === "done") return "done";
  if (curObj.lastDate === d && curObj.streak >= 1) {
    return curObj.mstate;
  }
  const nextStreak = Math.min(3, (curObj.streak || 0) + 1);
  if (nextStreak >= 3) return "done";
  if (nextStreak === 2) return `wip2:${d}`;
  return `wip1:${d}`;
}

function setMasteryTier(key, mstateStr, tsSec) {
  if (!key) return;
  const ts = Math.max(TRUE_GREEN_EPOCH, Math.floor(tsSec || nowUnixSec()));
  if (ts >= (A.masteryOverrideTs[key] || 0)) {
    A.masteryOverrides[key] = String(mstateStr);
    A.masteryOverrideTs[key] = ts;

}

  const curObj = getEffectiveMastery(key, altKey);
  const nextMs = computeNextMasteryState(curObj, action, TODAY_TAG);
  const stamp = Math.max(TRUE_GREEN_EPOCH, Math.floor(tsSec || nowUnixSec()));
  if (key) setMasteryTier(key, nextMs, stamp);
  if (altKey && altKey !== key) setMasteryTier(altKey, nextMs, stamp);

}

}
function saveOutbox(arr) {
  try { localStorage.setItem(CLOUD_OUTBOX_KEY, JSON.stringify(arr.slice(-400))); } catch (e) {}
}
function recKey(item) { return `${String(item[4] || "").slice(0, 19)}|${item[0]}|${item[2]}`; }

// Every point in one compact string: id:greenAt.retestAt.dueStep.flags.wrong.variant.stamp (base36)
function encodePointStates() {
  const parts = [];
  DATA.points.forEach(p => {
    const ps = A.pts[p.id];
    if (!ps) return;
    const t = schedTupleOf(ps);
    const rawG = Math.floor(ps.greenAt || 0), rawR = Math.floor(ps.retestAt || 0);
    const g = rawG >= MIN_REAL_TS ? rawG : 0;
    const r = rawR >= MIN_REAL_TS ? rawR : 0;
    if (!g && !r && !t[0] && !t[1] && !t[2] && !t[3] && !t[4]) return;
    parts.push(`${encPid(p.id)}:${b36(g)}.${b36(r)}.${b36(t[0])}.${t[1] || ""}.${b36(t[2])}.${b36(t[3])}.${b36(t[4])}`);
  });
  return parts.join(";");
}
function decodePointStates(z) {
  const out = [];
  String(z || "").split(";").forEach(ent => {
    const i = ent.indexOf(":");
    if (i <= 0) return;
    const f = ent.slice(i + 1).split(".");
    out.push({ id: decPid(ent.slice(0, i)), g: ub36(f[0]), r: ub36(f[1]), s: [ub36(f[2]), parseInt(f[3] || "0", 10) || 0, ub36(f[4]), ub36(f[5]), ub36(f[6])] });
  });
  return out;
}

function buildCompactPacket() {
  const pkt = {
    a: "n3z",
    v: 15,
    u: nowUnixSec(),
    d: DATA.plan_date,
    r: Math.floor(A.resetAt || 0),
    m: Math.floor(A.radioMaxSec || 0),
    rp: Array.isArray(A.radioPos) ? [Math.floor(A.radioPos[0] || 0), Math.floor(A.radioPos[1] || 0)] : [0, 0],
    z: encodePointStates(),
    c: [A.cur || curPointId || "", Math.floor(A.step || 0), A.lastPointId || "", A.hotFamily || "", Math.floor(A.ct || 0)],
    sp: [A.es || expSpeed, A.rs || radioSpeed, Math.floor(A.st || 0)],
    o: {},
    l: []
  };
  if (RADIO_SIG && Array.isArray(A.radioPos) && (A.radioPos[1] || 0) > 0) {
    pkt.rsig = A.radioSig || RADIO_SIG;
  }
  let size = byteLen(JSON.stringify(pkt));
  // answers not yet confirmed by the relay go first (oldest first), never dropped
  const sentKeys = [];
  for (const item of loadOutbox()) {
    const add = byteLen(JSON.stringify(item)) + 1;
    if (size + add > CLOUD_BYTE_LIMIT - 400) break;
    pkt.l.push(item);
    sentKeys.push(recKey(item));
    size += add;
  }
  if (Array.isArray(A.flashProg) && (A.flashProg[0] > 0 || A.flashProg[2] > 0)) {
    pkt.fp = [
      Math.floor(A.flashProg[0] || 0),
      Math.floor(A.flashProg[1] || 0),
      Math.floor(A.flashProg[2] || 0),
      Math.floor(A.flashProg[3] || 0)
    ];
    size += byteLen(JSON.stringify(pkt.fp)) + 7;
  }
  if (Array.isArray(A.tappedWords) && A.tappedWords.length) {
    const twSlice = A.tappedWords.slice(-30);
    const twAdd = byteLen(JSON.stringify(twSlice)) + 7;
    if (size + twAdd <= CLOUD_BYTE_LIMIT - 120) {
      pkt.tw = twSlice;
      size += twAdd;
    }
  }
  const deltaFloor = Math.max(TRUE_GREEN_EPOCH, BAKED_EPOCH > 0 ? BAKED_EPOCH - 7200 : 0);
  const ovEntries = Object.keys(A.masteryOverrides || {})
    .map(k => [k, [String(A.masteryOverrides[k]), Math.floor((A.masteryOverrideTs && A.masteryOverrideTs[k]) || 0)]])
    .filter(kv => kv[1][1] >= TRUE_GREEN_EPOCH)
    .sort((x, y) => {
      const xd = x[1][1] >= deltaFloor ? 1 : 0;
      const yd = y[1][1] >= deltaFloor ? 1 : 0;
      if (xd !== yd) return yd - xd;
      return y[1][1] - x[1][1];
    });
  for (const kv of ovEntries) {
    const add = byteLen(JSON.stringify(kv[0]) + ":" + JSON.stringify(kv[1])) + 1;
    if (size + add > CLOUD_BYTE_LIMIT) break;
    pkt.o[kv[0]] = kv[1];
    size += add;
  }
  pkt.o = sortedMap(pkt.o);
  Object.defineProperty(pkt, "_sentKeys", { value: sentKeys, enumerable: false });
  return pkt;
}

function packetFingerprint(pkt) {
  if (!pkt || pkt.a !== "n3z") return "";
  return JSON.stringify({
    d: pkt.d || "",
    r: Math.floor(pkt.r || 0),
    m: Math.floor((pkt.m || 0) / 30),
    rp: pkt.rp || [0, 0],
    rsig: pkt.rsig || "",
    fp: Array.isArray(pkt.fp) ? [Math.floor(pkt.fp[0] || 0), Math.floor(pkt.fp[1] || 0), Math.floor(pkt.fp[2] || 0)] : [],
    z: String(pkt.z || "").split(";").filter(Boolean).sort().join(";"),
    c: pkt.c || [],
    sp: pkt.sp || [],
    tw: Array.isArray(pkt.tw) ? pkt.tw.slice().sort() : [],
    o: sortedMap(pkt.o || {}),
    g: pkt.z ? {} : sortedMap(pkt.g || {}),
    t: pkt.z ? {} : sortedMap(pkt.t || {}),
    w: pkt.z ? {} : sortedMap(pkt.w || {})
  });
}

function mergeIncomingRecords(compactList) {
  if (!Array.isArray(compactList) || !compactList.length) return;
  const seen = new Set((A.recentRecords || []).map(r => `${String(r.ts || "").slice(0, 19)}|${r.id}|${r.choice}`));
  compactList.forEach(item => {
    if (!Array.isArray(item) || item.length < 4) return;
    const rec = {
      id: String(item[0] || ""),
      point: String(item[1] || ""),
      choice: String(item[2] || ""),
      correct: item[3] ? "true" : "false",
      ask_again: "false",
      ts: String(item[4] || "")
    };
    const key = `${rec.ts.slice(0, 19)}|${rec.id}|${rec.choice}`;
    if (rec.id && !seen.has(key)) {
      seen.add(key);
      A.recentRecords.push(rec);
    }
  });
  A.recentRecords.sort((a, b) => String(a.ts || "").localeCompare(String(b.ts || "")));
  if (A.recentRecords.length > 25) A.recentRecords = A.recentRecords.slice(-25);
}

function applyIncomingPacket(pkt) {
  if (!pkt || pkt.a !== "n3z") return false;
  let changed = false;
  syncApplyingRemote = true;
  const pktVer = Math.floor(pkt.v || 0);
  try {
    if (pktVer >= 14 && pkt.o && typeof pkt.o === "object") {
      Object.keys(pkt.o).forEach(mk => {
        const v = pkt.o[mk];
        if (Array.isArray(v) && v.length === 2) {
          const tier = String(v[0]);
          const ts = Math.floor(v[1] || 0);
          if (ts < TRUE_GREEN_EPOCH) return;
          const curTs = A.masteryOverrideTs[mk] || 0;
          if (ts > curTs || (ts === curTs && String(A.masteryOverrides[mk] || "") < tier)) {
            A.masteryOverrides[mk] = tier;
            A.masteryOverrideTs[mk] = ts;
            changed = true;
          }
        }
      });
    }

    if (pkt.d !== DATA.plan_date) {
      if (changed) {
        applyMasteryOverrides();
        saveAdaptiveState();
      }
      return changed;
    }

    const rIn = Math.floor(pkt.r || 0);
    if (rIn > (A.resetAt || 0)) {
      A.resetAt = rIn;
      changed = true;
    }

    const mIn = Math.floor(pkt.m || 0);
    if (mIn > (A.radioMaxSec || 0)) {
      A.radioMaxSec = mIn;
      changed = true;
    }

    if (pktVer >= 14 && Array.isArray(pkt.fp) && mergeFlashProgTuple(A, pkt.fp)) {
      changed = true;
    }

    if ((!RADIO_SIG || String(pkt.rsig || "") === RADIO_SIG) && Array.isArray(pkt.rp) && pkt.rp.length === 2) {
      const rpSec = Math.floor(pkt.rp[0] || 0);
      const rpTs = Math.floor(pkt.rp[1] || 0);
      const myTs = (A.radioPos && A.radioPos[1]) || 0;
      if (rpTs > myTs || (rpTs === myTs && rpSec > ((A.radioPos && A.radioPos[0]) || 0))) {
        A.radioPos = [rpSec, rpTs];
        A.radioSig = RADIO_SIG;
        try { localStorage.setItem(RADIO_POS_KEY, String(rpSec)); } catch (e) {}
        if (radioInitialized && radioPlayer.paused && Math.abs((radioPlayer.currentTime || 0) - rpSec) > 1) {
          lastSavedSec = rpSec;
          radioPlayer.currentTime = rpSec;
          updateRadioLiveDisplay(rpSec);
        }
        changed = true;
      }
    }

    let ptsChanged = false;
    if (typeof pkt.z === "string") {
      decodePointStates(pkt.z).forEach(e => {
        const pid = CARD_TO_POINT_ID[e.id] || e.id;
        const ps = A.pts[pid];
        if (!ps) return;
        if (e.g >= MIN_REAL_TS && e.g > (ps.greenAt || 0)) { ps.greenAt = e.g; ptsChanged = true; }
        if (e.r >= MIN_REAL_TS && e.r > (ps.retestAt || 0)) { ps.retestAt = e.r; ptsChanged = true; }
        if (applySchedTuple(ps, e.s, A.resetAt)) ptsChanged = true;
      });
    } else {
      const gIn = pkt.g || {};
      Object.keys(gIn).forEach(rawId => {
        const pid = CARD_TO_POINT_ID[rawId] || rawId;
        const ts = Math.floor(gIn[rawId] || 0);
        if (A.pts[pid] && ts >= MIN_REAL_TS && ts > (A.pts[pid].greenAt || 0)) { A.pts[pid].greenAt = ts; ptsChanged = true; }
      });
      const tIn = pkt.t || {};
      Object.keys(tIn).forEach(rawId => {
        const pid = CARD_TO_POINT_ID[rawId] || rawId;
        const ts = Math.floor(tIn[rawId] || 0);
        if (A.pts[pid] && ts >= MIN_REAL_TS && ts > (A.pts[pid].retestAt || 0)) { A.pts[pid].retestAt = ts; ptsChanged = true; }
      });
    }
    if (ptsChanged) changed = true;

    let curChanged = false;
    if (Array.isArray(pkt.c) && applyCursorTuple(A, pkt.c)) {
      curChanged = true;
      changed = true;
    }

    if (Array.isArray(pkt.sp) && applySpeedTuple(A, pkt.sp)) {
      if (SPEEDS.includes(A.es)) expSpeed = A.es;
      if (RADIO_SPEEDS.includes(A.rs)) radioSpeed = A.rs;
      try {
        localStorage.setItem("n3_exp_speed", String(expSpeed));
        localStorage.setItem("n3_radio_speed", String(radioSpeed));
      } catch (e) {}
      radioPlayer.defaultPlaybackRate = radioSpeed;
      radioPlayer.playbackRate = radioSpeed;
      if (activeKind === "exp" || activeKind === "teach") applyPlaybackRate(activeKind);
      const sb = document.getElementById("ans-spd-btn");
      if (sb) sb.textContent = `${expSpeed}x`;
      const rb = document.getElementById("radio-spd-btn");
      if (rb) rb.textContent = `${radioSpeed}x`;
      changed = true;
    }

    if (Array.isArray(pkt.tw)) {
      if (!Array.isArray(A.tappedWords)) A.tappedWords = [];
      pkt.tw.forEach(w => {
        const ws = String(w || "").trim();
        if (ws && !A.tappedWords.includes(ws)) {
          A.tappedWords.push(ws);
          changed = true;
        }
      });
      if (A.tappedWords.length > 80) A.tappedWords = A.tappedWords.slice(-80);
    }

    mergeIncomingRecords(pkt.l);

    if (changed) {
      recomputeStatusesFromCRDT(A);
      applyMasteryOverrides();
      let shownChanged = false;
      if (viewStage === "quiz" || viewStage === "done") {
        const prevId = curPointId;
        const prevQ = activeQuizObj ? activeQuizObj.id : "";
        const prevC = currentChoices.join("|");
        const prevStage = viewStage;
        const want = (A.cur && A.pts[A.cur] && A.pts[A.cur].status !== "green") ? A.cur : "";
        const curOk = curPointId && A.pts[curPointId] && A.pts[curPointId].status !== "green";
        if (curChanged && want) setupCurrentTurn(want);
        else if (!curOk) setupCurrentTurn();
        else setupCurrentTurn(curPointId);
        shownChanged = curPointId !== prevId || viewStage !== prevStage ||
          (activeQuizObj ? activeQuizObj.id : "") !== prevQ || currentChoices.join("|") !== prevC;
        if (shownChanged) {
          stageEnteredAt = performance.now();
          if (activeKind === "q" || activeKind === "done") stopQuizAudio();
        }
      }
      saveAdaptiveState();
      renderGreenBoard();
      if (typeof refreshMarkedWordTokens === "function") refreshMarkedWordTokens();
      if (activeMode === "tutor") {
        if (shownChanged || viewStage !== "result") renderTutor();
      } else if (activeMode === "dash") {
        renderDashboard();
      } else if (activeMode === "vocab" && typeof onRemoteVocabSync === "function") {
        onRemoteVocabSync();
      }
    }
    return changed;
  } finally {
    syncApplyingRemote = false;
  }
}

function updateSyncModalBadge() {
  const el = document.getElementById("cloud-sync-status-line");
  if (!el) return;
  if (!NTFY_TOPIC) {
    el.textContent = "本地保存模式";
    return;
  }
  if (cloudSyncState === "live") {
    el.textContent = "多端实时自动同步：已连接（手机与电脑秒级对齐）";
  } else if (cloudSyncState === "synced") {
    el.textContent = "多端自动同步：已对齐最新进度";
  } else if (cloudSyncState === "offline") {
    el.textContent = "当前离线：进度已存本机，联网后自动同步";
  } else {
    el.textContent = "多端自动同步：正在对齐云端进度…";
  }
}

function pushCloudSync(useKeepalive) {
  if (!NTFY_TOPIC) return Promise.resolve(false);
  const pkt = buildCompactPacket();
  const fp = packetFingerprint(pkt);
  const hasOutbox = pkt._sentKeys.length > 0;
  if (!useKeepalive && !hasOutbox && fp === lastSyncedFp) return Promise.resolve(false);

  if (cloudInFlight && !useKeepalive) {
    cloudPendingPush = true;
    return Promise.resolve(false);
  }

  cloudInFlight = true;
  return fetch(`https://ntfy.sh/${NTFY_TOPIC}`, {
    method: "POST",
    body: JSON.stringify(pkt),
    keepalive: !!useKeepalive
  }).then(resp => {
    cloudInFlight = false;
    if (resp && resp.ok) {
      lastSyncedFp = fp;
      cloudLastSyncTs = Date.now();
      if (cloudSyncState !== "live") cloudSyncState = "synced";
      updateSyncModalBadge();
      if (hasOutbox) {
        const done = new Set(pkt._sentKeys);
        const rest = loadOutbox().filter(it => !done.has(recKey(it)));
        saveOutbox(rest);
        if (rest.length) cloudPendingPush = true;
      }
    } else if (hasOutbox) {
      setTimeout(() => scheduleCloudPush(0), 20000);
    }
    if (cloudPendingPush) {
      cloudPendingPush = false;
      scheduleCloudPush(250);
    }
    return !!(resp && resp.ok);
  }).catch(() => {
    cloudInFlight = false;
    if (cloudSyncState !== "live") cloudSyncState = "offline";
    updateSyncModalBadge();
    setTimeout(() => scheduleCloudPush(0), 15000);
    return false;
  });
}

function scheduleCloudPush(delayMs) {
  if (!NTFY_TOPIC) return;
  if (cloudPushTimer) clearTimeout(cloudPushTimer);
  cloudPushTimer = setTimeout(() => {
    cloudPushTimer = null;
    pushCloudSync(false);
  }, typeof delayMs === "number" ? delayMs : 120);
}

function pullCloudSync(pushIfLocalAhead) {
  if (!NTFY_TOPIC) return Promise.resolve(false);
  return fetch(`https://ntfy.sh/${NTFY_TOPIC}/json?poll=1&since=all`, {
    cache: "no-store"
  }).then(resp => resp.ok ? resp.text() : "").then(raw => {
    let latestRemoteFp = "";
    if (raw) {
      raw.split("\n").forEach(line => {
        const s = line.trim();
        if (!s) return;
        try {
          const env = JSON.parse(s);
          if (env && env.event === "message" && typeof env.message === "string") {
            const pkt = JSON.parse(env.message);
            if (pkt && pkt.a === "n3z") {
              if (pkt.d === DATA.plan_date) latestRemoteFp = packetFingerprint(pkt);
              applyIncomingPacket(pkt);
            }
          }
        } catch (e) {}
      });
    }
    cloudLastSyncTs = Date.now();
    if (cloudSyncState !== "live") cloudSyncState = "synced";
    updateSyncModalBadge();

    const myFp = packetFingerprint(buildCompactPacket());
    if (latestRemoteFp && myFp === latestRemoteFp && !loadOutbox().length) {
      lastSyncedFp = myFp;
      return true;
    }
    if (pushIfLocalAhead && myFp !== latestRemoteFp) {
      return pushCloudSync(false);
    }
    return true;
  }).catch(() => {
    if (cloudSyncState !== "live") cloudSyncState = "offline";
    updateSyncModalBadge();
    return false;
  });
}

function connectCloudSSE() {
  if (!NTFY_TOPIC || typeof EventSource === "undefined") return;
  if (cloudSSE && cloudSSE.readyState !== 2) return;
  try {
    if (cloudSSE) cloudSSE.close();
  } catch (e) {}

  try {
    cloudSSE = new EventSource(`https://ntfy.sh/${NTFY_TOPIC}/sse`);
    cloudSSE.onopen = () => {
      cloudSyncState = "live";
      updateSyncModalBadge();
    };
    cloudSSE.onmessage = ev => {
      if (!ev || !ev.data) return;
      try {
        const env = JSON.parse(ev.data);
        const msgStr = (env && env.event === "message" && typeof env.message === "string") ? env.message : ev.data;
        const pkt = JSON.parse(msgStr);
        if (pkt && pkt.a === "n3z") {
          const inFp = packetFingerprint(pkt);
          applyIncomingPacket(pkt);
          const myFp = packetFingerprint(buildCompactPacket());
          if (myFp === inFp) lastSyncedFp = myFp;
          cloudLastSyncTs = Date.now();
          cloudSyncState = "live";
          updateSyncModalBadge();
        }
      } catch (e) {}
    };
    cloudSSE.onerror = () => {
      try { cloudSSE.close(); } catch (e) {}
      cloudSSE = null;
      if (cloudSyncState === "live") cloudSyncState = "synced";
      updateSyncModalBadge();
      if (cloudSSERetryTimer) clearTimeout(cloudSSERetryTimer);
      cloudSSERetryTimer = setTimeout(() => {
        if (document.visibilityState === "visible") connectCloudSSE();
      }, 6000);
    };
  } catch (e) {}
}

function computeDaily120Metrics() {
  const totalCards = Math.max(1, DATA.points.length);
  const greenCnt = DATA.points.filter(p => A.pts[p.id] && A.pts[p.id].status === "green").length;
  const quizRatio = Math.min(1.0, greenCnt / totalCards);
  const quizDone = greenCnt >= totalCards;

  const radioDur = Math.max(600, DATA.radio.duration_sec || 2100);
  const targetMins = Math.max(1, Math.round(radioDur / 60));
  const listenedSec = Math.min(radioDur, Math.max(0, A.radioMaxSec || 0));
  const listenedMins = Math.min(targetMins, Math.floor(listenedSec / 60));
  const radioRatio = Math.min(1.0, listenedSec / (radioDur * 0.92));
  const radioDone = radioRatio >= 0.98;

  const vItems = (DATA.mastery && DATA.mastery.vocab && DATA.mastery.vocab.items) ? DATA.mastery.vocab.items : [];
  const liveFlashLeft = vItems.filter(it => it.tier !== "done").length;
  const defaultTarget = Math.min(VOCAB_BATCH_SIZE, Math.max(1, liveFlashLeft || VOCAB_BATCH_SIZE));
  const fp = Array.isArray(A.flashProg) ? A.flashProg : [0, 0, 0, 0];
  const sessCleared = (A.vocabSess && A.vocabSess.date === DATA.plan_date) ? Math.floor(A.vocabSess.cleared || 0) : 0;
  const sessTotal = (A.vocabSess && A.vocabSess.date === DATA.plan_date) ? Math.floor(A.vocabSess.total || 0) : 0;
  const flashSeen = Math.max(0, Math.floor(fp[0] || 0), sessCleared);
  const flashDone = (Math.floor(fp[2] || 0) > 0) || !!(A.vocabSess && A.vocabSess.done) || (liveFlashLeft === 0 && vItems.length > 0);
  const flashTarget = flashDone
    ? Math.max(flashSeen, sessTotal || Math.floor(fp[1] || 0) || defaultTarget)
    : Math.max(flashSeen, sessTotal || Math.floor(fp[1] || 0) || defaultTarget);
  const flashRatio = flashDone ? 1.0 : (flashSeen > 0 ? Math.min(0.96, flashSeen / Math.max(1, flashTarget)) : 0);

  const vDone = vItems.filter(it => it.tier === "done").length;
  const vWip = vItems.filter(it => it.tier === "wip").length;
  const baseDone = Number(DATA.vocab_base_done || 10);
  const vocabBonus = Math.min(8, Math.max(0, (vDone - baseDone) * 0.28 + Math.max(0, vWip - 35) * 0.06));

  // Combined 3-ritual daily completion: 50% quiz + 32% podcast + 18% vocab swipe
  const dailyLockPct = Math.min(100, Math.round((quizRatio * 0.50 + radioRatio * 0.32 + flashRatio * 0.18) * 100));

  // Projected JLPT N3 score (/180): 108 base + 12 quiz + 8 podcast + 4 nightly vocab + cross-day vocab mastery lift
  const projScore = Math.min(165, Math.round(108 + quizRatio * 12 + (radioDone ? 8 : radioRatio * 8) + flashRatio * 4 + vocabBonus));

  return {
    totalCards,
    greenCnt,
    quizRatio,
    quizDone,
    targetMins,
    listenedMins: radioDone ? targetMins : listenedMins,
    radioRatio: radioDone ? 1.0 : radioRatio,
    radioDone,
    flashSeen: flashDone ? Math.max(flashSeen, flashTarget) : flashSeen,
    flashTarget,
    flashRatio,
    flashDone,
    allThreeDone: quizDone && radioDone && flashDone,
    dailyLockPct,
    projScore
  };
}

function selectNextPointId(forcedId) {
  if (forcedId && A.pts[forcedId]) return forcedId;
  const remaining = DATA.points.filter(p => A.pts[p.id].status !== "green");
  if (!remaining.length) return null;
  if (remaining.length === 1) return remaining[0].id;

  const nonRepeat = remaining.filter(p => p.id !== A.lastPointId);
  const pool = nonRepeat.length ? nonRepeat : remaining;

  const dueQuizzes = pool.filter(p => {
    const s = A.pts[p.id];
    return s.status === "learning" && s.dueStep <= A.step;
  });
  if (dueQuizzes.length) {
    dueQuizzes.sort((a, b) => {
      const pa = A.pts[a.id].audioPrimed ? 1 : 0;
      const pb = A.pts[b.id].audioPrimed ? 1 : 0;
      return A.pts[a.id].dueStep - A.pts[b.id].dueStep || pb - pa || b.roi_score - a.roi_score;
    });
    return dueQuizzes[0].id;
  }

  if (A.hotFamily) {
    const famSiblings = pool.filter(p => p.family === A.hotFamily && A.pts[p.id].dueStep <= A.step);
    if (famSiblings.length) return famSiblings[0].id;
  }

  const ready = pool.filter(p => A.pts[p.id].dueStep <= A.step);
  if (ready.length) {
    ready.sort((a, b) => {
      const ma = (a.modality === "memorize" ? 0.25 : (a.modality === "both" ? 0.12 : 0)) + (A.pts[a.id].audioPrimed ? 0.10 : 0);
      const mb = (b.modality === "memorize" ? 0.25 : (b.modality === "both" ? 0.12 : 0)) + (A.pts[b.id].audioPrimed ? 0.10 : 0);
      return (b.roi_score + mb) - (a.roi_score + ma);
    });
    return ready[0].id;
  }

  pool.sort((a, b) => A.pts[a.id].dueStep - A.pts[b.id].dueStep);
  return pool[0].id;
}

function getPointById(pid) {

function getQuizForPoint(p, pState) {
  if (pState && pState.retryCardId) {
    if (p.primary && p.primary.id === pState.retryCardId) return p.primary;
    const hitV = (p.variants || []).find(v => v.id === pState.retryCardId);
    if (hitV) return hitV;
  }
  if (pState && pState.useVariant && p.variants && p.variants.length > 0) {
    return p.variants[pState.variantIdx % p.variants.length];
  }
  return p.primary;
}

function canShuffleListeningCard(qObj) {
  if (!qObj || !qObj.is_listening) return true;
  const lp = qObj.listen_parts;
  if (!lp || !lp.stem || !Array.isArray(lp.nums) || lp.nums.length < 3 || !lp.opts) return false;
  return (qObj.choices || []).length === 3 && qObj.choices.every(c => !!lp.opts[c]);
}

function prepareChoices(qObj, salt, pState) {
  const arr = (qObj.choices || []).slice();
  if (arr.length < 2 || !canShuffleListeningCard(qObj)) return arr;

  let seed = ((salt || 0) * 9973 + 17) >>> 0;
  for (let i = 0; i < qObj.id.length; i++) {
    seed = (Math.imul(seed, 31) + qObj.id.charCodeAt(i)) >>> 0;
  }
  function nextRand() {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    return seed;
  }
  for (let i = arr.length - 1; i > 0; i--) {
    const j = nextRand() % (i + 1);
    const tmp = arr[i];
    arr[i] = arr[j];
    arr[j] = tmp;
  }

  // On any retry (including missing a 2nd/3rd time), strictly guarantee a DIFFERENT option order than last attempt!
  const prev = pState && pState.lastChoiceOrder && pState.lastChoiceOrder.qid === qObj.id
    ? pState.lastChoiceOrder.order
    : null;
  if (Array.isArray(prev) && prev.length === arr.length) {
    const sameFull = arr.every((v, idx) => v === prev[idx]);
    const prevAnsIdx = prev.indexOf(qObj.answer);
    const curAnsIdx = arr.indexOf(qObj.answer);
    if (sameFull || (arr.length >= 3 && prevAnsIdx >= 0 && curAnsIdx === prevAnsIdx)) {
      const first = arr.shift();
      arr.push(first);
    }
  }
  if (pState) {
    pState.lastChoiceOrder = { qid: qObj.id, order: arr.slice() };
  }
  return arr;
}

}

const INTERJECTION_SET = new Set(["はい", "ええ", "うん", "いや", "あれ", "ほら", "あ", "え", "お"]);
const TRIVIAL_TAP_WORDS = new Set([

]);

function hasLongerContentWordAt(src, pos) {
  for (let c = 0; c < CONTENT_KEYS.length; c++) {

}

function escapeHtml(s) {
  return String(s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function isWordMarkedForReading(surface) {
  if (!surface || PARTICLE_FALLBACK[surface] || TRIVIAL_TAP_WORDS.has(surface)) return false;
  const inTapped = Array.isArray(A.tappedWords) && A.tappedWords.includes(surface);
  const inFailed = !!(A.vocabSess && Array.isArray(A.vocabSess.failedWords) && A.vocabSess.failedWords.includes(surface));
  if (!inTapped && !inFailed) return false;
  let mKey = surface;
  const vItems = (DATA.mastery && DATA.mastery.vocab && DATA.mastery.vocab.items) ? DATA.mastery.vocab.items : [];
  for (let i = 0; i < vItems.length; i++) {
    if (vItems[i].name === surface || vItems[i].key === surface) {
      mKey = vItems[i].key || surface;
      break;
    }
  }
  return getEffectiveMastery(mKey, surface).tier !== "done";
}

function renderTrapKanaHTML(surface, kana, trapHl, trapTag) {
  const kStr = String(kana || "").trim();
  if (!kStr) return "";
  const hasKanji = /[\u4e00-\u9faf\u3400-\u4dbf]/.test(String(surface || ""));
  if (!hasKanji) {
    return kStr !== surface ? escapeHtml(kStr) : "";
  }
  const hlArr = (Array.isArray(trapHl) ? trapHl : []).map(x => String(x || "")).filter(Boolean);
  const mask = new Array(kStr.length).fill(false);
  let pos = 0;
  for (let i = 0; i < hlArr.length; i++) {
    const sub = hlArr[i];
    let idx = kStr.indexOf(sub, pos);
    if (idx < 0) idx = kStr.indexOf(sub, 0);
    if (idx >= 0) {
      for (let j = idx; j < idx + sub.length; j++) mask[j] = true;
      pos = idx + sub.length;
    }
  }
  let html = "";
  let idx = 0;
  while (idx < kStr.length) {
    const flag = mask[idx];
    let end = idx + 1;
    while (end < kStr.length && mask[end] === flag) end++;
    const seg = escapeHtml(kStr.slice(idx, end));
    html += flag ? `<b class="kana-trap">${seg}</b>` : seg;
    idx = end;
  }
  const tag = String(trapTag || "").trim();
  if (tag) {
    html += `<span class="kana-tag">· ${escapeHtml(tag)}</span>`;
  }
  return html;
}

// Tokenize full sentence first so multi-character words & conjugated chunks never get split in half!
function renderJapaneseWithHighlight(text, highlightTarget) {
  const src = String(text || "");
  const target = String(highlightTarget || "").split("（")[0].trim();
  const hlIdx = (target && target.length >= 1) ? src.indexOf(target) : -1;
  const hlEnd = hlIdx >= 0 ? hlIdx + target.length : -1;

  let out = "";
  let i = 0;
  while (i < src.length) {
    let matched = null;
    for (let k = 0; k < DICT_KEYS.length; k++) {
      const w = DICT_KEYS[k];
      if (!src.startsWith(w, i)) continue;
      if (INTERJECTION_SET.has(w) && i > 0 && !"「『（(、。！？!? \n\t：:".includes(src[i - 1])) {
        continue;
      }
      if (w.length === 2 && PARTICLE_FALLBACK[w] && hasLongerContentWordAt(src, i + 1)) {
        continue;
      }
      matched = w;
      break;
    }
    if (matched) {
      const tStart = i;
      const tEnd = i + matched.length;
      const escW = escapeHtml(matched);
      let innerHtml = "";
      if (hlIdx >= 0 && tStart < hlEnd && tEnd > hlIdx) {
        const s1 = Math.max(tStart, hlIdx) - tStart;
        const s2 = Math.min(tEnd, hlEnd) - tStart;
        innerHtml =
          escapeHtml(matched.slice(0, s1)) +
          `<span class="ans-hl">${escapeHtml(matched.slice(s1, s2))}</span>` +
          escapeHtml(matched.slice(s2));
      } else {
        innerHtml = escW;
      }
      const mkCls = isWordMarkedForReading(matched) ? " marked-tok" : "";
      out += `<span class="w-tok${mkCls}" data-w="${escW}">${innerHtml}</span>`;
      i = tEnd;
    } else {
      const ch = escapeHtml(src[i]);
      if (hlIdx >= 0 && i >= hlIdx && i < hlEnd) {
        out += `<span class="ans-hl">${ch}</span>`;
      } else {
        out += ch;
      }
      i += 1;
    }
  }
  return out;
}

const SPEAKER_RE = /^\s*([男女ＡＢAB]|[^\s：:「」]{1,3})\s*[：:]\s*/;
function splitSpeakerLines(text) {
  const src = String(text || "").trim();
  if (!src) return [];
  // Break before every "男：" / "女：" style label, even if the source put them on one line
  const parts = src.split(/\n+|\s*(?=[男女][：:])|\s+(?=[^\s：:「」。、]{1,3}[：:])/).map(x => x.trim()).filter(Boolean);
  return parts.map(t => {
    const m = t.match(SPEAKER_RE);
    return m ? { who: m[1], text: t.slice(m[0].length) } : { who: "", text: t };
  });
}

function renderDialogueHTML(fullJa, ans, zh) {
  const ja = splitSpeakerLines(fullJa);
  if (ja.length < 2 || ja.some(l => !l.who)) return "";
  const zl = splitSpeakerLines(zh);
  const zhOk = zl.length === ja.length && zl.every(l => l.who);
  return `<div class="dlg">${ja.map((l, i) => {
    const isAns = ans && l.text.indexOf(ans) >= 0;
    const zhTxt = zhOk ? zl[i].text.replace(/^「|」$/g, "") : "";
    return `<div class="dlg-row${isAns ? " is-ans" : ""}"><span class="dlg-who">${escapeHtml(l.who)}</span><div><div class="dlg-ja">${renderJapaneseWithHighlight(l.text, isAns ? ans : "")}</div>${zhTxt ? `<div class="dlg-zh">${escapeHtml(zhTxt)}</div>` : ""}</div></div>`;
  }).join("")}</div>${!zhOk && zh ? `<p class="result-zh">${escapeHtml(zh)}</p>` : ""}`;
}

const audioBlobMap = new Map();
const audioFetchMap = new Map();
let playReqSeq = 0;

function warmAudio(url) {
  if (!url) return Promise.resolve("");
  if (audioBlobMap.has(url)) return Promise.resolve(audioBlobMap.get(url));
  if (audioFetchMap.has(url)) return audioFetchMap.get(url);
  const p = fetch(url)
    .then(res => (res && res.ok ? res.blob() : null))
    .then(blob => {
      audioFetchMap.delete(url);
      if (!blob || !blob.size) return url;
      if (audioBlobMap.size >= 80) {
        const oldestKey = audioBlobMap.keys().next().value;
        const oldestUrl = audioBlobMap.get(oldestKey);
        audioBlobMap.delete(oldestKey);
        try { URL.revokeObjectURL(oldestUrl); } catch (e) {}
      }
      const blobUrl = URL.createObjectURL(blob);
      audioBlobMap.set(url, blobUrl);
      return blobUrl;
    })
    .catch(() => {
      audioFetchMap.delete(url);
      return url;
    });
  audioFetchMap.set(url, p);
  return p;
}

function applyPlaybackRate(kind) {
  const rate = (kind === "exp" || kind === "teach" || kind === "done") ? expSpeed : 1.0;

}

let listenSeqQueue = [];
let listenSeqTimer = null;

function stopQuizAudio() {
  playReqSeq += 1;
  listenSeqQueue = [];
  if (listenSeqTimer) {
    clearTimeout(listenSeqTimer);
    listenSeqTimer = null;
  }
  try {
    player.pause();
    player.currentTime = 0;
    wordPlayer.pause();
  } catch (e) {}
  activeKind = null;
  syncAudioButtons();
}

function startResolvedClip(srcUrl, kind, seq) {
  if (seq !== playReqSeq) return;
  activeKind = kind;
  player.src = srcUrl;
  player.currentTime = 0;
  applyPlaybackRate(kind);
  const pr = player.play();
  if (pr && typeof pr.catch === "function") {
    pr.catch(() => {
      if (seq === playReqSeq) {
        listenSeqQueue = [];
        activeKind = null;
        syncAudioButtons();
      }
    });
  }
  syncAudioButtons();
}

function stepListeningSequence(seq) {
  if (seq !== playReqSeq) return;
  if (!listenSeqQueue.length) {
    activeKind = null;
    syncAudioButtons();
    return;
  }
  const item = listenSeqQueue.shift();
  const runUrl = url => {
    if (seq !== playReqSeq) return;
    if (audioBlobMap.has(url)) {
      startResolvedClip(audioBlobMap.get(url), "q", seq);
    } else {
      warmAudio(url).then(resolved => startResolvedClip(resolved || url, "q", seq));
    }
  };
  if (item.waitMs > 0) {
    listenSeqTimer = setTimeout(() => {
      listenSeqTimer = null;
      runUrl(item.url);
    }, item.waitMs);
  } else {
    runUrl(item.url);
  }
}

function playQuizQuestionAudio(qObj, toggleIfSame) {
  if (!qObj) return;
  if (toggleIfSame && activeKind === "q" && (!player.paused || listenSeqQueue.length > 0 || listenSeqTimer)) {
    stopQuizAudio();
    return;
  }
  if (canShuffleListeningCard(qObj) && qObj.is_listening && qObj.listen_parts && currentChoices.length === 3) {
    if (!radioPlayer.paused) radioPlayer.pause();
    if (listenSeqTimer) {
      clearTimeout(listenSeqTimer);
      listenSeqTimer = null;
    }
    const lp = qObj.listen_parts;
    const urls = [
      { url: lp.stem, waitMs: 0 },
      { url: lp.nums[0], waitMs: 460 },
      { url: lp.opts[currentChoices[0]], waitMs: 70 },
      { url: lp.nums[1], waitMs: 380 },
      { url: lp.opts[currentChoices[1]], waitMs: 70 },
      { url: lp.nums[2], waitMs: 380 },
      { url: lp.opts[currentChoices[2]], waitMs: 70 }
    ];
    urls.forEach(u => warmAudio(u.url));
    const seq = ++playReqSeq;
    listenSeqQueue = urls;
    activeKind = "q";
    syncAudioButtons();
    stepListeningSequence(seq);
    return;
  }
  playMainClip(qObj.q_audio, "q", toggleIfSame);
}

function playMainClip(url, kind, toggleIfSame) {
  if (!url) return;
  if (!radioPlayer.paused) radioPlayer.pause();
  if (toggleIfSame && activeKind === kind && !player.paused) {
    stopQuizAudio();
    return;
  }
  listenSeqQueue = [];
  if (listenSeqTimer) {
    clearTimeout(listenSeqTimer);
    listenSeqTimer = null;
  }
  const seq = ++playReqSeq;
  if (audioBlobMap.has(url)) {
    startResolvedClip(audioBlobMap.get(url), kind, seq);
    return;
  }
  activeKind = kind;
  syncAudioButtons();
  warmAudio(url).then(resolvedUrl => {
    startResolvedClip(resolvedUrl || url, kind, seq);
  });
}

player.addEventListener("play", () => {

player.addEventListener("ended", () => {
