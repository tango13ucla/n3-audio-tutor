<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="description" content="JLPT N3 · 每日做题与双人随身听" />
<meta name="theme-color" content="#F5F2EB" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+JP:wght@500;600&display=swap" rel="stylesheet" />
<title>N3</title>
<style>
  :root {
    /* Traditional Japanese Pigments (日本の伝統色): 生成り · 白練 · 墨 · 苔色 · 黄土 · 弁柄 */
    --washi: #F5F2EB;
    --sheet: #FCFBF8;
    --sumi: #1C1B18;
    --ink-2: #48443C;
    --ink-3: #847E72;
    --hairline: rgba(28, 27, 24, 0.09);
    --hairline-strong: rgba(28, 27, 24, 0.18);
    --track: #E5E0D5;
    --moss: #2B5F49;
    --moss-soft: rgba(43, 95, 73, 0.10);
    --ochre: #B07D3A;
    --bengara: #9E3E36;
    /* Editorial Bilingual Pairing: Japanese Literary Mincho + Clean Chinese Humanist Sans */
    --sans: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", -apple-system, BlinkMacSystemFont, sans-serif;
    --serif-jp: "Hiragino Mincho ProN", "YuMincho", "Noto Serif JP", serif;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--washi);
    color: var(--sumi);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    /* Eliminate Android Chrome Touch-to-Search Google bar on word tap */
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: calc(15px + env(safe-area-inset-top)) 28px calc(18px + env(safe-area-inset-bottom));
  }

  .zen-shell {
    width: 100%;
    max-width: 496px;
    height: 100%;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  @media (min-width: 860px) {
    body { padding: 34px 48px 34px; }
    .zen-shell { max-width: 590px; }
    .zen-shell.wide-mode { max-width: 800px; }
  }

  button {
    font-family: inherit;
    white-space: nowrap;
    background: none;
    border: none;
    padding: 0;
    color: inherit;
    cursor: pointer;
  }

  /* ================= 1. STRICT GRID HEADER ================= */
  .zen-header {
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--hairline);
  }

  .zen-brand {
    font-size: 15px;
    font-weight: 500;
    color: var(--ink-3);
    letter-spacing: 0.06em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .zen-brand strong {
    font-weight: 600;
    color: var(--sumi);
    margin: 0 2px;
  }

  .zen-nav {
    display: flex;
    align-items: baseline;
    gap: 24px;
  }
  .nav-link {
    font-size: 16.5px;
    font-weight: 500;
    color: var(--ink-3);
    letter-spacing: 0.04em;
    padding-bottom: 5px;
    position: relative;
    transition: color 0.2s ease;
  }
  .nav-link.active {
    color: var(--sumi);
    font-weight: 600;
  }
  .nav-link.active::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -15px;
    height: 1.5px;
    background: var(--sumi);
  }
  .nav-link.is-playing {
    color: var(--moss);
  }

  /* ================= 2. DUAL DAILY LOCK HORIZON (做题 + 随身听 -> 稳过 120) ================= */
  .zen-horizon {
    flex-shrink: 0;
    padding: 13px 0 4px;
    cursor: pointer;
  }
  .horizon-meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--ink-3);
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
    gap: 8px;
  }
  .horizon-meta b {
    font-weight: 600;
    color: var(--sumi);
  }
  .horizon-meta b.moss {
    color: var(--moss);
  }
  .horizon-track {
    width: 100%;
    height: 3px;
    background: var(--track);
    border-radius: 2px;
    position: relative;
    overflow: hidden;
  }
  .horizon-fill {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    background: var(--moss);
    transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
  }

  /* ================= 3. OPEN WASHI STAGE (余白 MA) ================= */
  .zen-panel {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .zen-panel.hidden {
    display: none;
  }

  .stage-wrap {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding-top: 16px;
    animation: fadeTurn 0.18s ease-out;
  }
  @keyframes fadeTurn {
    from { opacity: 0.48; }
    to { opacity: 1; }
  }

  .meta-bar {
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    min-height: 28px;
    gap: 12px;
  }
  .overline {
    font-size: 14.5px;
    font-weight: 500;
    letter-spacing: 0.05em;
    color: var(--ink-3);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .overline.ok { color: var(--moss); font-weight: 600; }
  .overline.ng { color: var(--bengara); font-weight: 600; }
  .overline.warm { color: var(--ochre); }

  .quiet-actions {
    display: flex;
    align-items: center;
    gap: 18px;
    flex-shrink: 0;
  }
  .text-btn {
    font-size: 14.5px;
    font-weight: 500;
    color: var(--ink-2);
    letter-spacing: 0.03em;
    font-variant-numeric: tabular-nums;
    padding: 4px 0;
  }
  .text-btn.playing {
    color: var(--moss);
    font-weight: 600;
  }

  /* Center focal space with balanced Japanese Ma (余白) */
  .focal-space {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding: 16px 0 26px;
    scrollbar-width: none;
    -webkit-mask-image: linear-gradient(to bottom, #000 0, #000 calc(100% - 26px), transparent 100%);
    mask-image: linear-gradient(to bottom, #000 0, #000 calc(100% - 26px), transparent 100%);
  }
  .focal-space::-webkit-scrollbar { display: none; }
  /* Center when it fits, start from the very top when it does not (never cut off the first line) */
  .focal-space > :first-child { margin-top: auto; }
  .focal-space > :last-child { margin-bottom: auto; }

  .action-dock {
    flex-shrink: 0;
    padding-top: 12px;
  }

  /* Desktop vs Mobile Ergonomics:
     - Mobile (<860px): Content floats comfortably above, interactive controls stay in bottom one-hand thumb zone.
     - Desktop (>=860px): Content + controls group together in the optical center right under the cursor (zero bottom-edge mouse travel!). */
  @media (min-width: 860px) {
    #tutor-view .stage-wrap {
      justify-content: flex-start;
    }
    #tutor-view .focal-space {
      flex: 0 1 auto;
      justify-content: flex-start;
      margin-top: auto;
      padding: 18px 0 0;
    }
    #tutor-view .action-dock {
      margin-bottom: auto;
      padding-top: 26px;
    }
  }

  /* -------- TEACH VIEW -------- */
  .point-heading {
    margin: 0 0 20px;
    font-family: var(--serif-jp);
    font-size: 27.5px;
    font-weight: 600;
    line-height: 1.38;
    letter-spacing: 0.03em;
    color: var(--sumi);
  }
  .zen-pair {
    border-top: 1px solid var(--hairline);
    border-bottom: 1px solid var(--hairline);
    margin-bottom: 20px;
  }
  .zen-pair-row {
    padding: 15px 0;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .zen-pair-row + .zen-pair-row {
    border-top: 1px solid var(--hairline);
  }
  .zp-ja {
    font-family: var(--serif-jp);
    font-size: 22px;
    font-weight: 600;
    color: var(--sumi);
    letter-spacing: 0.025em;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .zp-dot {
    width: 6.5px;
    height: 6.5px;
    border-radius: 50%;
    background: var(--moss);
    flex-shrink: 0;
  }
  .zp-dot.muted {
    background: transparent;
    border: 1.5px solid var(--ink-3);
  }
  .zp-sub {
    padding-left: 16.5px;
    font-size: 16.5px;
    font-weight: 400;
    color: var(--ink-2);
    line-height: 1.6;
  }

  .example-line {
    font-family: var(--serif-jp);
    font-size: 22.5px;
    font-weight: 500;
    line-height: 1.76;
    letter-spacing: 0.03em;
    color: var(--sumi);
    white-space: pre-line;
  }
  .example-zh {
    margin: 8px 0 0;
    font-size: 17px;
    color: var(--ink-2);
    line-height: 1.62;
  }

  /* -------- QUIZ VIEW (Optimal Literary Reading Scale + Blind-Ear Listening) -------- */
  .quiz-focal {
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 116px;
  }
  .quiz-ja {
    margin: 0;
    font-family: var(--serif-jp);
    font-size: 27px;
    font-weight: 600;
    line-height: 1.74;
    letter-spacing: 0.035em;
    color: var(--sumi);
  }
  @media (min-width: 860px) {
    .quiz-ja { font-size: 30px; }
  }

  .listen-medallion-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 0;
  }
  .listen-medallion {
    width: 82px;
    height: 82px;
    border-radius: 50%;
    border: 1px solid var(--hairline-strong);
    background: var(--sheet);
    color: var(--sumi);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.2s ease, transform 0.15s ease;
  }
  .listen-medallion:active { transform: scale(0.96); }
  .listen-medallion.speaking {
    border-color: var(--moss);
    color: var(--moss);
  }
  .med-ic { width: 27px; height: 27px; margin-left: 2px; }
  .med-waves { display: none; align-items: center; gap: 3.5px; height: 24px; }
  .listen-medallion.speaking .med-ic { display: none; }
  .listen-medallion.speaking .med-waves { display: flex; }
  .med-waves span {
    width: 2.5px;
    height: 8px;
    background: var(--moss);
    animation: zenWave 0.9s ease-in-out infinite;
  }
  .med-waves span:nth-child(2) { animation-delay: 0.16s; }
  .med-waves span:nth-child(3) { animation-delay: 0.32s; }
  @keyframes zenWave {
    0%, 100% { height: 6px; opacity: 0.45; }
    50% { height: 20px; opacity: 1; }
  }

  .choice-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .zen-choice {
    width: 100%;
    min-height: 62px;
    padding: 14px 22px;
    background: var(--sheet);
    border: 1px solid var(--hairline-strong);
    border-radius: 8px;
    font-family: var(--serif-jp);
    font-size: 22.5px;
    font-weight: 500;
    color: var(--sumi);
    letter-spacing: 0.03em;
    line-height: 1.44;
    text-align: left;
    white-space: normal;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: border-color 0.16s ease, background 0.16s ease;
  }
  .zen-choice:active { background: #EDEAE1; }

  .listen-num-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }
  .listen-num-btn {
    min-height: 68px;
    background: var(--sheet);
    border: 1px solid var(--hairline-strong);
    border-radius: 8px;
    font-family: var(--serif-jp);
    font-size: 25px;
    font-weight: 600;
    color: var(--sumi);
    font-variant-numeric: tabular-nums;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.16s ease, background 0.16s ease;
  }
  .listen-num-btn:active { background: #EDEAE1; }

  .unsure-btn {
    margin-top: 12px;
    width: 100%;
    min-height: 46px;
    padding: 0 18px;
    border: 1px dashed var(--hairline-strong);
    border-radius: 8px;
    font-size: 15px;
    font-weight: 500;
    color: var(--ink-2);
    letter-spacing: 0.04em;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: border-color 0.16s ease, color 0.16s ease, background 0.16s ease;
  }
  .unsure-btn:active { background: #EDEAE1; }

  .kbd-tag, .desk-hint { display: none; }
  @media (min-width: 860px) {
    .zen-choice:hover, .listen-num-btn:hover { border-color: var(--sumi); background: #FFFFFF; }
    .unsure-btn:hover { border-color: var(--sumi); color: var(--sumi); background: rgba(252, 251, 248, 0.72); }
    .kbd-tag {
      display: inline-block;
      font-family: var(--sans);
      font-size: 13px;
      color: var(--ink-3);
      font-variant-numeric: tabular-nums;
    }
    .desk-hint {
      display: inline-block;
      font-size: 12.5px;
      font-weight: 400;
      opacity: 0.68;
      letter-spacing: 0.03em;
      margin-left: 10px;
    }
  }

  /* -------- RESULT VIEW (3-Step Human Clarity: 句意 -> 为什么用 -> 变形与辨析) -------- */
  .result-ja {
    margin: 0;
    font-family: var(--serif-jp);
    font-size: 24px;
    font-weight: 500;
    line-height: 1.76;
    letter-spacing: 0.03em;
    color: var(--sumi);
    white-space: pre-line;
  }
  .ans-hl {
    color: var(--moss);
    font-weight: 600;
  }
  .result-zh {
    margin: 10px 0 0;
    font-size: 16px;
    font-weight: 400;
    color: var(--ink-2);
    line-height: 1.66;
    letter-spacing: 0.015em;
  }
  .dlg {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .dlg-row {
    display: grid;
    grid-template-columns: auto 1fr;
    column-gap: 10px;
    align-items: baseline;
  }
  .dlg-who {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-3);
    text-align: center;
    min-width: 24px;
    padding: 0 5px;
    box-sizing: border-box;
    white-space: nowrap;
    border: 1px solid var(--hairline);
    border-radius: 5px;
    line-height: 22px;
    height: 22px;
    transform: translateY(-2px);
  }
  .dlg-ja {
    font-family: var(--serif-jp);
    font-size: 20px;
    font-weight: 500;
    line-height: 1.62;
    letter-spacing: 0.02em;
    color: var(--sumi);
  }
  .dlg-row.is-ans .dlg-who {
    color: var(--moss);
    border-color: rgba(43, 95, 73, 0.35);
  }
  .dlg-zh {
    margin-top: 2px;
    font-size: 14.5px;
    font-weight: 400;
    color: var(--ink-3);
    line-height: 1.55;
    letter-spacing: 0.01em;
  }
  .listen-opt-review {
    margin-top: 16px;
    padding: 10px 14px;
    border-radius: 7px;
    background: rgba(252, 251, 248, 0.62);
    border: 1px solid var(--hairline);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .lor-row {
    font-family: var(--serif-jp);
    font-size: 15.5px;
    line-height: 1.56;
    color: var(--ink-2);
    display: flex;
    gap: 8px;
  }
  .lor-row.ok {
    color: var(--moss);
    font-weight: 600;
  }
  .lor-row.ng {
    color: var(--bengara);
  }
  .lor-num {
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }

  /* Tappable Japanese words + Instant Inline Zen Meaning Strip (Zero Google Search, Zero Small-Print Clutter) */
  .w-tok {
    border-bottom: 1px solid transparent;
    cursor: pointer;
    padding: 0 1px 1px;
    border-radius: 3px;
    transition: color 0.14s ease, background 0.14s ease, border-color 0.14s ease;
  }
  .w-tok:active, .w-tok.active-tok {
    color: var(--moss);
    background: var(--moss-soft);
    border-bottom-color: var(--moss);
  }

  .inline-lex {
    margin-top: 12px;
    min-height: 36px;
    padding: 8px 12px;
    border-radius: 7px;
    background: rgba(252, 251, 248, 0.78);
    border: 1px solid var(--hairline);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .inline-lex.empty {
    display: none;
  }
  .ilex-main {
    min-width: 0;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 6px 9px;
    line-height: 1.48;
  }
  .ilex-surf {
    font-family: var(--serif-jp);
    font-size: 18px;
    font-weight: 600;
    color: var(--sumi);
  }
  .ilex-kana {
    font-size: 14.5px;
    color: var(--moss);
    font-weight: 500;
  }
  .ilex-zh {
    font-size: 16px;
    font-weight: 500;
    color: var(--sumi);
  }
  .ilex-meta {
    width: 100%;
    font-size: 13.5px;
    color: var(--ink-3);
  }
  .ilex-speak {
    flex-shrink: 0;
    font-size: 14px;
    font-weight: 600;
    color: var(--moss);
    padding: 4px 8px;
    border-radius: 5px;
    border: 1px solid rgba(43, 95, 73, 0.25);
  }

  .result-divider {
    height: 1px;
    background: var(--hairline);
    margin: 18px 0;
  }
  .result-logic {
    display: flex;
    flex-direction: column;
    gap: 11px;
  }
  .logic-line {
    margin: 0;
    font-size: 16px;
    font-weight: 400;
    color: var(--ink-2);
    line-height: 1.74;
    letter-spacing: 0.015em;
  }

  /* Architectural Sumi Buttons */
  .dock-row {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .sumi-btn {
    flex: 1;
    height: 54px;
    background: var(--sumi);
    color: var(--sheet);
    border-radius: 8px;
    font-size: 17px;
    font-weight: 500;
    letter-spacing: 0.08em;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ghost-btn {
    height: 54px;
    padding: 0 20px;
    border: 1px solid var(--hairline-strong);
    border-radius: 8px;
    font-size: 15.5px;
    font-weight: 500;
    color: var(--ink-2);
    letter-spacing: 0.04em;
  }

  /* ================= 4. TWO-COACH PODCAST SANCTUARY ("随身听") ================= */
  .radio-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 16px;
  }
  .radio-chap {
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.12em;
    color: var(--moss);
  }
  .radio-topic {
    margin: 0;
    font-family: var(--serif-jp);
    font-size: 26px;
    font-weight: 600;
    line-height: 1.45;
    color: var(--sumi);
  }
  .radio-ja {
    margin: 0;
    font-family: var(--serif-jp);
    font-size: 22px;
    font-weight: 400;
    line-height: 1.76;
    color: var(--ink-2);
  }

  .radio-dock {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 20px;
    padding-top: 12px;
  }
  .scrub-wrap { width: 100%; }
  .zen-range {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 2px;
    background: var(--track);
    outline: none;
    margin: 10px 0;
    cursor: pointer;
  }
  .zen-range::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: var(--sumi);
    cursor: pointer;
  }
  .time-pair {
    display: flex;
    justify-content: space-between;
    font-size: 13.5px;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
  }

  .transport-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .step-time-btn {
    font-size: 15px;

 "start": 1851.8, "end": 2144.8}]}, "points": [{"id": "N3-G13", "subject": "语法", "point": "〜そうだ（伝聞 vs 様態）", "point_key": "そうだ（伝聞）", "family": "hearsay_infer", "modality": "both", "exam_weight": 3.0, "roi_score": 3.0, "teach": {"left": {"ja": "降るそうだ", "sub": "原形 ＋ そうだ ＝ 听说（配 によると）"}, "right": {"ja": "降りそうだ", "sub": "ます干 ＋ そうだ ＝ 眼看要（看乌云）"}, "example_ja": "天気予報によると、明日は一日中雨が降るそうだ。", "zh_meaning": "据天气预报说，明天一整天都会下雨。", "audio": "./audio/N3-G13_exp.mp3?v=969b944b"}, "primary": {"id": "N3-G13", "prompt": "天気予報によると、明日は一日中雨が（　　）。", "choices": ["降るそうだ", "降りそうだ"], "answer": "降るそうだ", "full_ja": "天気予報によると、明日は一日中雨が降るそうだ。", "zh_meaning": "据天气预报说，明天一整天都会下雨。", "why_line": "开头写明了「天気予報によると（根据天气预报）」，是转述听来的消息，不是抬头看乌云。", "form_line": "表「听说」保持动词原形直接接「そうだ」（降るそうだ）；把「る」变成「降りそうだ」则是亲眼看见快要下了。", "q_audio": "./audio/N3-G13_q.mp3?v=7c4690ad", "exp_audio": "./audio/N3-G13_exp.mp3?v=969b944b", "is_listening": false}, "variants": [{"id": "VAR-G13", "prompt": "空が真っ暗になってきた。今にも雨が（　　）。", "choices": ["降りそうだ", "降るそうだ"], "answer": "降りそうだ", "full_ja": "空が真っ暗になってきた。今にも雨が降りそうだ。", "zh_meaning": "天空变得一片漆黑，眼看马上就要下雨了。", "why_line": "亲眼看到天黑压压的，「今にも（眼看马上）」说明下雨的苗头就在眼前，不是听广播说的。", "form_line": "看眼前迹象表「快要、看上去很像」用ます形词干接「そうだ」（降ります → 降りそうだ）；原形「降るそうだ」是听说。", "q_audio": "./audio/VAR-G13_q.mp3?v=21d24b7f", "exp_audio": "./audio/VAR-G13_exp.mp3?v=9ab5fa3c", "is_listening": false}]}, {"id": "H-20261114-01", "subject": "活用", "point": "食べる／飲む → 召し上がる", "point_key": "K-003", "family": "keigo_give", "modality": "both", "exam_weight": 3.0, "roi_score": 3.0, "teach": {"left": {"ja": "召し上がる", "sub": "尊敬语（抬高老师/客人） · 老师您请吃：召し上がってください"}, "right": {"ja": "いただく", "sub": "谦让语（压低我自己） · 我开动领受了：いただきます"}, "example_ja": "先生、どうぞ温かいうちに召し上がってください。", "zh_meaning": "老师，请趁热吃。", "audio": "./audio/H-20261114-01_exp.mp3?v=7df45d96"}, "primary": {"id": "H-20261114-01", "prompt": "先生、どうぞ温かいうちに（　　）ください。", "choices": ["召し上がって", "いただいて"], "answer": "召し上がって", "full_ja": "先生、どうぞ温かいうちに召し上がってください。", "zh_meaning": "老师，请趁热吃。", "why_line": "动嘴吃东西的人是「老师」，描述老师或长辈的动作，必须用抬高对方的尊敬语。", "form_line": "「食べる・飲む」的尊敬语是「召し上がる」，变成请求就是「召し上がってください」；「いただく」只能用于我自己吃喝。", "q_audio": "./audio/H-20261114-01_q.mp3?v=bc7bcd87", "exp_audio": "./audio/H-20261114-01_exp.mp3?v=7df45d96", "is_listening": false}, "variants": [{"id": "VAR-H01", "prompt": "先生のお宅で、珍しい日本のお茶を（　　）。", "choices": ["いただいた", "召し上がった"], "answer": "いただいた", "full_ja": "先生のお宅で、珍しい日本のお茶をいただいた。", "zh_meaning": "在老师家里，我有幸喝到了珍贵的日本茶。", "why_line": "去老师家做客，「喝茶」这个动作是「我自己」做的，对长辈要用压低自己的谦让语。", "form_line": "自己吃喝或领受长辈款待用谦让语「いただく → いただいた」；「召し上がった」只能用于老师喝。", "q_audio": "./audio/VAR-H01_q.mp3?v=917e6c0a", "exp_audio": "./audio/VAR-H01_exp.mp3?v=1cfa5337", "is_listening": false}]}, {"id": "N3-V09", "subject": "词汇", "point": "書類（しょるい）", "point_key": "書類", "family": "kanji_reading", "modality": "memorize", "exam_weight": 2.2, "roi_score": 2.2, "teach": {"left": {"ja": "しょ・るい（書類）", "sub": "短音「しょ」！（同：辞書 じしょ、図書館 としょかん）"}, "right": {"ja": "しょうるい", "sub": "中文母语最爱误加长音 う"}, "example_ja": "大事な書類を封筒に入れた。", "zh_meaning": "把重要的文件装进了信封。", "audio": "./audio/N3-V09_exp.mp3?v=2f5f83f4"}, "primary": {"id": "N3-V09", "prompt": "大事な「書類」を封筒に入れた。「書類」の読み方は？", "choices": ["しょるい", "しょうるい"], "answer": "しょるい", "full_ja": "大事な書類を封筒に入れた。", "zh_meaning": "把重要的文件装进了信封。", "why_line": "考「書類（文件、资料）」里汉字「書」在日语中的长短音。", "form_line": "中文「书」听感较长，但日语里的「書（しょ）」是一拍短音，合起来是「しょるい」，绝不加「う」。", "q_audio": "./audio/N3-V09_q.mp3?v=8e1915c2", "exp_audio": "./audio/N3-V09_exp.mp3?v=2f5f83f4", "is_listening": false}, "variants": []}, {"id": "Q-20261114-001", "subject": "听力", "point": "〜なきゃ", "point_key": "N3L-015", "family": "listen_contract", "modality": "listen", "exam_weight": 3.0, "roi_score": 3.0, "teach": {"left": {"ja": "夕飯の支度しないと！", "sub": "＝ しないと【いけない】 · 必须赶紧去做晚饭！（100%要做）"}, "right": {"ja": "作らなくていい", "sub": "〜なくていい · 这才是「不用做也可以」"}, "example_ja": "女：あ、もう五時だ。早く帰って、夕飯の支度しないと。\n男：ほんとだ、急いで帰ろう。", "zh_meaning": "女：「啊，都五点了！得赶紧回去准备晚饭了。」 男：「真的耶，赶紧回去吧。」", "audio": "./audio/Q-20261114-001_exp.mp3?v=8c747a62"}, "primary": {"id": "Q-20261114-001", "prompt": "", "choices": ["じゃあ、今日は作らなくていいね。", "ほんとだ、急いで帰ろう。", "夕飯、おいしかったね。"], "answer": "ほんとだ、急いで帰ろう。", "full_ja": "女：あ、もう五時だ。早く帰って、夕飯の支度しないと。\n男：ほんとだ、急いで帰ろう。", "zh_meaning": "女：「啊，都五点了！得赶紧回去准备晚饭了。」 男：「真的耶，赶紧回去吧。」", "why_line": "女生看表催着赶紧回家做晚饭，男生最自然的回应就是第 2 句附和她「赶紧回去吧」。", "form_line": "口语句尾「〜しないと」省略了后面的「いけない」，意思是「必须赶紧做」，千万别听反成第 1 句「不用做了」。", "q_audio": "./audio/Q-20261114-001_q.mp3?v=9c9ad3b3", "exp_audio": "./audio/Q-20261114-001_exp.mp3?v=8c747a62", "is_listening": true}, "variants": [{"id": "VAR-L01", "prompt": "", "choices": ["うん、今すぐ払わないとね。", "じゃあ、払わなくてもいいんだね。", "昨日もう払ったよ。"], "answer": "うん、今すぐ払わないとね。", "full_ja": "男：あ、電気代の支払い、今日までだった！早く払わなくちゃ。\n女：うん、今すぐ払わないとね。", "zh_meaning": "男：「啊，电费今天截止！得赶紧交才行。」 女：「嗯，得马上交了呢。」", "why_line": "男生发现电费今天到期催着快交，第 1 句女生自然顺着附和「得马上交了」。", "form_line": "「払わなくちゃ」和「払わないと」都是口语里的「必须赶紧交」（省略了いけない）。", "q_audio": "./audio/VAR-L01_q.mp3?v=5b798b04", "exp_audio": "./audio/VAR-L01_exp.mp3?v=fffc83c4", "is_listening": true}]}, {"id": "N3-G14", "subject": "语法", "point": "〜ていく／〜てくる", "point_key": "〜ていく／〜てくる", "family": "change_flow", "modality": "both", "exam_weight": 3.0, "roi_score": 3.0, "teach": {"left": {"ja": "暖かくなってきた", "sub": "过去 → 现在（一直变暖到现在）"}, "right": {"ja": "寒くなっていく", "sub": "现在 → 未来（今后会越来越冷）"}, "example_ja": "４月に入ってから、だんだん暖かくなってきた。", "zh_meaning": "进入四月以来，天气渐渐暖和起来了。", "audio": "./audio/N3-G14_exp.mp3?v=7617e6d1"}, "primary": {"id": "N3-G14", "prompt": "４月に入ってから、だんだん暖かく（　　）。", "choices": ["なってきた", "なっていった"], "answer": "なってきた", "full_ja": "４月に入ってから、だんだん暖かくなってきた。", "zh_meaning": "进入四月以来，天气渐渐暖和起来了。", "why_line": "时间从四月初一路延续到说话的「现在」，这股变暖的趋势是朝着现在的我走过来的。", "form_line": "从过去持续到现在的变化用「てきた」（なってきた）；从现在往未来继续远去的变化才用「ていく」。", "q_audio": "./audio/N3-G14_q.mp3?v=022c66fc", "exp_audio": "./audio/N3-G14_exp.mp3?v=7617e6d1", "is_listening": false}, "variants": [{"id": "VAR-G14", "prompt": "少子化が進んで、これから子どもの数はますます減って（　　）だろう。", "choices": ["いく", "きた"], "answer": "いく", "full_ja": "少子化が進んで、これから子どもの数はますます減っていくだろう。", "zh_meaning": "随着生小孩的人越来越少（少子化加剧），今后孩子的数量大概会继续减少下去吧。", "why_line": "句中有「これから（从今往后）」和「だろう」，变化是从现在向未来继续延伸出去。", "form_line": "从现在往未来持续发展用「ていく」（減っていく）；从过去变到现在才用「てきた」。", "q_audio": "./audio/VAR-G14_q.mp3?v=8ce78544", "exp_audio": "./audio/VAR-G14_exp.mp3?v=f16483c2", "is_listening": false}]}, {"id": "H-20261114-05", "subject": "活用", "point": "五段动词 使役形（词尾あ段＋せる）", "point_key": "V-037", "family": "voice_form", "modality": "both", "exam_weight": 3.0, "roi_score": 3.0, "teach": {"left": {"ja": "休ませていただけませんか", "sub": "使役（允许我休）＋いただく · 部长，能批准我请假吗？"}, "right": {"ja": "休んでいただけませんか", "sub": "8/22 & 9/13 两次课堂实错 · 变成：部长，请您去休息好吗？"}, "example_ja": "部長、来週の金曜日、私用で会社を休ませていただけないでしょうか。", "zh_meaning": "部长，下周五我有点私事，能不能请您准我休一天假？", "audio": "./audio/H-20261114-05_exp.mp3?v=6a1b2eca"}, "primary": {"id": "H-20261114-05", "prompt": "部長、来週の金曜日、私用で会社を（　　）でしょうか。", "choices": ["休ませていただけない", "休んでいただけない", "休まれていただけない"], "answer": "休ませていただけない", "full_ja": "部長、来週の金曜日、私用で会社を休ませていただけないでしょうか。", "zh_meaning": "部长，下周五我有点私事，能不能请您准我休一天假？", "why_line": "休假的人是「我自己」，是在请求上级放行「允许我去休假」，千万不能说成「请部长您去休假」。", "form_line": "先把「休む」变成使役形「休ませて（让我休）」，再接自谦请求「いただけないでしょうか」；漏掉「させて」就会变成请部长休假。", "q_audio": "./audio/H-20261114-05_q.mp3?v=fdbc4289", "exp_audio": "./audio/H-20261114-05_exp.mp3?v=6a1b2eca", "is_listening": false}, "variants": [{"id": "VAR-H05", "prompt": "少し熱があるので、今日は早めに（　　）いただけませんか。", "choices": ["帰らせて", "帰って"], "answer": "帰らせて", "full_ja": "少し熱があるので、今日は早めに帰らせていただけませんか。", "zh_meaning": "我稍微有点发烧，今天能不能请您准我早点回去？", "why_line": "发烧想早退的人是「我自己」，向上级求批准「允许我先回去」。", "form_line": "五段动词「帰る」词尾「る」变あ段「ら」加「せて」，连成「帰らせていただけませんか」；漏掉「せて」就变成劝上级回家了。", "q_audio": "./audio/VAR-H05_q.mp3?v=5629692e", "exp_audio": "./audio/VAR-H05_exp.mp3?v=17618f8b", "is_listening": false}]}, {"id": "V-20261114-03", "subject": "词汇", "point": "内緒", "point_key": "内緒", "family": "kanji_reading", "modality": "memorize", "exam_weight": 2.2, "roi_score": 2.2, "teach": {"left": {"ja": "な・い・しょ", "sub": "3拍干脆收尾（无长音！） · 嘘🤫 保密要短促收声，绝不拖尾巴"}, "right": {"ja": "ないしょう / ないしゅ", "sub": "中文母语高频误读陷阱 · 「緒」在此处念短音 しょ，不带 う"}, "example_ja": "この話はみんなには内緒にしておいてね。", "zh_meaning": "这件事请替我向大家保密哦。", "audio": "./audio/V-20261114-03_exp.mp3?v=ae289139"}, "primary": {"id": "V-20261114-03", "prompt": "この話はみんなには「内緒」にしておいてね。", "choices": ["ないしょ", "ないしょう"], "answer": "ないしょ", "full_ja": "この話はみんなには内緒にしておいてね。", "zh_meaning": "这件事请替我向大家保密哦。", "why_line": "「内緒にしておく」是日常高频表达「替我保密、别往外说」，考汉字「緒」的长短音。", "form_line": "「内緒」只有三拍，末尾是干脆的短音「しょ」（ないしょ），后面绝对没有长音「う」。", "q_audio": "./audio/V-20261114-03_q.mp3?v=ed8ac434", "exp_audio": "./audio/V-20261114-03_exp.mp3?v=ae289139", "is_listening": false}, "variants": []}, {"id": "Q-20261114-004", "subject": "听力", "point": "〜といて", "point_key": "N3L-007", "family": "listen_contract", "modality": "listen", "exam_weight": 3.0, "roi_score": 3.0, "teach": {"left": {"ja": "コピーしといてくれる？", "sub": "〜ておいて → 口语缩成 〜といて · 开会前能帮我「提前复印好」吗？"}, "right": {"ja": "はい、コピーしておきます", "sub": "下属还原成礼貌体回应 · 好的，我马上提前复印好"}, "example_ja": "男：会議の前に、この資料、人数分コピーしといてくれる？\n女：はい、すぐコピーしておきます。", "zh_meaning": "男：「开会前，能帮我把这份资料按人数提前复印好吗？」 女：「好的，我马上复印好。」", "audio": "./audio/Q-20261114-004_exp.mp3?v=65b1770b"}, "primary": {"id": "Q-20261114-004", "prompt": "", "choices": ["昨日もう会議は終わりましたよ。", "コピー機は使いません。", "はい、すぐコピーしておきます。"], "answer": "はい、すぐコピーしておきます。", "full_ja": "男：会議の前に、この資料、人数分コピーしといてくれる？\n女：はい、すぐコピーしておきます。", "zh_meaning": "男：「开会前，能帮我把这份资料按人数提前复印好吗？」 女：「好的，我马上复印好。」", "why_line": "上司拜托开会前提前印好资料，第 3 句下属礼貌答应马上去准备最得体。", "form_line": "上司口语里的「しといて」就是「しておいて（提前做好）」，下属回答时还原成礼貌形「しておきます」。", "q_audio": "./audio/Q-20261114-004_q.mp3?v=a42f517c", "exp_audio": "./audio/Q-20261114-004_exp.mp3?v=65b1770b", "is_listening": true}, "variants": [{"id": "VAR-L04", "prompt": "", "choices": ["ホテルには泊まらないよ。", "旅行は楽しかったね。", "わかった、今すぐ予約しておくね。"], "answer": "わかった、今すぐ予約しておくね。", "full_ja": "女：来月の旅行、混む前にホテル予約しとかないとね。\n男：わかった、今すぐ予約しておくね。", "zh_meaning": "女：「下个月的旅行，趁还没订满得提前把酒店订好呢。」 男：「好，我马上提前订好。」", "why_line": "女生提醒趁早把酒店订下来，第 3 句男生立刻答应现在就去订。", "form_line": "「予約しとかないと」融合了「ておく（提前做）」的口语缩音「とく」和「ないと（必须）」。", "q_audio": "./audio/VAR-L04_q.mp3?v=9ce6295f", "exp_audio": "./audio/VAR-L04_exp.mp3?v=6ac13529", "is_listening": true}]}, {"id": "G-20261114-06", "subject": "语法", "point": "〜にしては", "point_key": "〜にしては", "family": "reason_contrast", "modality": "both", "exam_weight": 2.8, "roi_score": 2.8, "teach": {"left": {"ja": "〜にしては", "sub": "打破常规尺子（意外反差） · 只待半年，日语却意外地好"}, "right": {"ja": "〜にとって", "sub": "站在某人立场评价 · 对我来说（私にとって）很重要"}, "example_ja": "彼は日本に半年しかいなかったにしては、日本語がとても上手だ。", "zh_meaning": "他在日本只待了半年，日语却出乎意料地好。", "audio": "./audio/G-20261114-06_exp.mp3?v=2d90d3fd"}, "primary": {"id": "G-20261114-06", "prompt": "日本に半年しかいなかった（　　）、日本語が上手だ。", "choices": ["にしては", "にとって"], "answer": "にしては", "full_ja": "彼は日本に半年しかいなかったにしては、日本語がとても上手だ。", "zh_meaning": "他在日本只待了半年，日语却出乎意料地好。", "why_line": "按「只待半年」这个标准原本以为水平一般，结果却非常好，属于打破预期的反差。", "form_line": "简体小句直接接「にしては」表示「就……而言却很意外」；「にとって」表示「对某人来说」，而且前面只能接名词。", "q_audio": "./audio/G-20261114-06_q.mp3?v=8831b78e", "exp_audio": "./audio/G-20261114-06_exp.mp3?v=2d90d3fd", "is_listening": false}, "variants": [{"id": "VAR-G06", "prompt": "このスマホは値段が高い（　　）、あまり使いやすくない。", "choices": ["にしては", "にとって"], "answer": "にしては", "full_ja": "このスマホは値段が高いにしては、あまり使いやすくない。", "zh_meaning": "这台手机价格挺贵的，用起来却不怎么顺手。", "why_line": "按「高价」这个标准原本以为很好用，结果却不好用，与预期标准相反。", "form_line": "い形容词「高い」直接接「にしては」表示就高价而言却不怎样；「にとって」只能接人或群体表立场。", "q_audio": "./audio/VAR-G06_q.mp3?v=56873b1a", "exp_audio": "./audio/VAR-G06_exp.mp3?v=a631c226", "is_listening": false}]}, {"id": "N3-H09", "subject": "活用", "point": "五段可能形（え段＋る）", "point_key": "V-027", "family": "potential_form", "modality": "memorize", "exam_weight": 3.0, "roi_score": 3.0, "teach": {"left": {"ja": "読む → 読める", "sub": "五段可能形：词尾 u段 → e段＋る"}, "right": {"ja": "読む → 読まれる", "sub": "あ段＋れる 是受身/尊敬，不是能读"}, "example_ja": "辞書がなくても、日本の新聞が少し読めるようになった。", "zh_meaning": "就算不用词典，也渐渐能读懂一点日本报纸了。", "audio": "./audio/N3-H09_exp.mp3?v=befb5eea"}, "primary": {"id": "N3-H09", "prompt": "辞書がなくても、日本の新聞が少し（　　）ようになった。", "choices": ["読める", "読まれる"], "answer": "読める", "full_ja": "辞書がなくても、日本の新聞が少し読めるようになった。", "zh_meaning": "就算不用词典，也渐渐能读懂一点日本报纸了。", "why_line": "句尾接「ようになった」，描述个人能力从不会变成「能读了」，要用可能形。", "form_line": "五段动词「読む」把词尾う段「む」推到え段「め」加「る」＝「読める（能读）」；「読まれる」是被动或尊敬。", "q_audio": "./audio/N3-H09_q.mp3?v=18bc0f9d", "exp_audio": "./audio/N3-H09_exp.mp3?v=befb5eea", "is_listening": false}, "variants": []}, {"id": "V-20261114-08", "subject": "词汇", "point": "出張", "point_key": "出張", "family": "kanji_reading", "modality": "memorize", "exam_weight": 2.2, "roi_score": 2.2, "teach": {"left": {"ja": "出張 → しゅっちょう", "sub": "有促音「っ」＋有长音「う」 · 出（しゅつ）遇ち音变促音＝出差"}, "right": {"ja": "主張 → しゅちょう", "sub": "无促音「っ」＋有长音「う」 · "}, "example_ja": "来週から三日間、大阪へ出張します。", "zh_meaning": "下周起要去大阪出差三天。", "audio": "./audio/V-20261114-08_exp.mp3?v=2c77697a"}, "primary": {"id": "V-20261114-08", "prompt": "来週から三日間、大阪へ「出張」します。「出張」の読み方は？", "choices": ["しゅっちょう", "しゅちょう", "しゅっちょ"], "answer": "しゅっちょう", "full_ja": "来週から三日間、大阪へ出張します。", "zh_meaning": "下周起要去大阪出差三天。", "why_line": "考高频职场词「出張（出差）」的促音与长音组合。", "form_line": "「出（しゅっ）」带促音停顿，「張（ちょう）」带长音，合起来是「しゅっちょう」；漏掉促音念「しゅちょう」就变成「主張（主张观点）」。", "q_audio": "./audio/V-20261114-08_q.mp3?v=6aab3604", "exp_audio": "./audio/V-20261114-08_exp.mp3?v=2c77697a", "is_listening": false}, "variants": []}, {"id": "Q-20261114-005", "subject": "听力", "point": "〜させていただきます", "point_key": "N3L-199", "family": "listen_intent", "modality": "listen", "exam_weight": 2.9, "roi_score": 2.9, "teach": {"left": {"ja": "休ませていただけませんか", "sub": "下属求批准：能让我休假吗？ · 对应回应：做好交接（引き継ぎ）就可以"}, "right": {"ja": "休んでいただけませんか", "sub": "劝对方休息：能请您休息吗？ · 选2就是故意调侃这种错法的陷阱项"}, "example_ja": "男：部長、実は来週の金曜日、私用で会社を休ませていただけないでしょうか。\n女：うん、引き継ぎをしておけば大丈夫だよ。", "zh_meaning": "男：「部长，其实下周五我有点私事，不知能否批我休假一天？」 女：「嗯，只要提前做好工作交接就没问题。」", "audio": "./audio/Q-20261114-005_exp.mp3?v=ebd1e6f8"}, "primary": {"id": "Q-20261114-005", "prompt": "", "choices": ["うん、引き継ぎをしておけば大丈夫だよ。", "えっ、私に来週休んでほしいの？", "金曜日ならもう休みましたよ。"], "answer": "うん、引き継ぎをしておけば大丈夫だよ。", "full_ja": "男：部長、実は来週の金曜日、私用で会社を休ませていただけないでしょうか。\n女：うん、引き継ぎをしておけば大丈夫だよ。", "zh_meaning": "男：「部长，其实下周五我有点私事，不知能否批我休假一天？」 女：「嗯，只要提前做好工作交接就没问题。」", "why_line": "下属向部长请「下周五」的假，第 1 句女部长准假并叮嘱提前交接工作完全吻合。", "form_line": "「休ませていただけないでしょうか」是请求上级批准自己休假；部长用「引き継ぎをしておけば」提醒提前做好交接。", "q_audio": "./audio/Q-20261114-005_q.mp3?v=5d7cbaf2", "exp_audio": "./audio/Q-20261114-005_exp.mp3?v=ebd1e6f8", "is_listening": true}, "variants": []}, {"id": "G-20261114-09", "subject": "语法", "point": "〜わけだ", "point_key": "〜わけだ", "family": "hearsay_infer", "modality": "both", "exam_weight": 2.8, "roi_score": 2.8, "teach": {"left": {"ja": "ダメ【な】＋わけだ", "sub": "な形容词＋な＋形式名词わけ · 难怪减肥不行 / 也就是说不行"}, "right": {"ja": "ダメわけだ", "sub": "课堂原话口误（漏掉な） · 名词前不能把な形容词词干直接裸贴上去"}, "example_ja": "毎日夜遅くまで甘い物を食べていたら、ダイエットにはダメなわけだよ。", "zh_meaning": "要是每天吃甜食吃到大半夜，对减肥当然是不行的啦。", "audio": "./audio/G-20261114-09_exp.mp3?v=8b9ec221"}, "primary": {"id": "G-20261114-09", "prompt": "毎日夜遅くまで甘い物を食べていたら、ダイエットには（　　）よ。", "choices": ["ダメなわけだ", "ダメわけだ", "ダメだわけだ"], "answer": "ダメなわけだ", "full_ja": "毎日夜遅くまで甘い物を食べていたら、ダイエットにはダメなわけだよ。", "zh_meaning": "要是每天吃甜食吃到大半夜，对减肥当然是不行的啦。", "why_line": "顺着前面的原因推出顺理成章的结论（「难怪不行、当然没戏」），用「わけだ」。", "form_line": "「わけ」本质是名词，な形容词「ダメ」修饰名词时中间必须保留「な」，变成「ダメなわけだ」，不能漏掉「な」。", "q_audio": "./audio/G-20261114-09_q.mp3?v=98bcdb0c", "exp_audio": "./audio/G-20261114-09_exp.mp3?v=8b9ec221", "is_listening": false}, "variants": [{"id": "VAR-G09", "prompt": "彼は日本に１０年も住んでいたから、日本の事情に詳しい（　　）。", "choices": ["わけだ", "わけがない"], "answer": "わけだ", "full_ja": "彼は日本に１０年も住んでいたから、日本の事情に詳しいわけだ。", "zh_meaning": "他在日本住了足足十年，难怪这么熟悉日本的情况。", "why_line": "前面给出原因「住了整整十年」，自然推出合情合理的结果「难怪这么懂」。", "form_line": "い形容词「詳しい」直接接「わけだ」表示怪不得、理所当然；「わけがない」是绝不可能懂，意思反了。", "q_audio": "./audio/VAR-G09_q.mp3?v=833c0219", "exp_audio": "./audio/VAR-G09_exp.mp3?v=1e1ecd1d", "is_listening": false}]}, {"id": "H-20261114-06", "subject": "活用", "point": "五段使役受身短形（〜される）与正式形", "point_key": "V-045", "family": "voice_form", "modality": "memorize", "exam_weight": 2.9, "roi_score": 2.9, "teach": {"left": {"ja": "話す → 話させられた", "sub": "す结尾五段动词唯一合法形 · 绝不缩约！完整保留させられた"}, "right": {"ja": "話さされた", "sub": "ささ连撞拗口，日语严禁这样缩"}, "example_ja": "昨日のパーティーで、急にみんなの前で日本語でスピーチを話させられた。", "zh_meaning": "昨天派对上，突然在大家面前被迫用日语讲了话。", "audio": "./audio/H-20261114-06_exp.mp3?v=e738b1a9"}, "primary": {"id": "H-20261114-06", "prompt": "昨日のパーティーで、急にみんなの前で日本語でスピーチを（　　）。", "choices": ["話させられた", "話さされた", "話しさせられた"], "answer": "話させられた", "full_ja": "昨日のパーティーで、急にみんなの前で日本語でスピーチを話させられた。", "zh_meaning": "昨天派对上，突然在大家面前被迫用日语讲了话。", "why_line": "原本没打算上台，是被大家起哄推上去「被迫发言」，要用使役受身形。", "form_line": "五段动词「話す」以「す」结尾，变使役受身不能缩约，只能先变「話させ」再加「られた」＝「話させられた」。", "q_audio": "./audio/H-20261114-06_q.mp3?v=333c6c76", "exp_audio": "./audio/H-20261114-06_exp.mp3?v=e738b1a9", "is_listening": false}, "variants": [{"id": "VAR-H06", "prompt": "子どもの頃、母に嫌いな牛乳を毎日（　　）。", "choices": ["飲まされた", "飲みさせられた"], "answer": "飲まされた", "full_ja": "子どもの頃、母に嫌いな牛乳を毎日飲まされた。", "zh_meaning": "小时候，每天都被妈妈逼着喝讨厌的牛奶。", "why_line": "自己不想喝却被妈妈要求喝，「被迫做某事」要用使役受身形。", "form_line": "非「す」结尾的五段动词「飲む」，词尾「む」变あ段「ま」加缩约形「された」＝「飲まされた」，绝没有「飲みさせられた」。", "q_audio": "./audio/VAR-H06_q.mp3?v=2e92da8b", "exp_audio": "./audio/VAR-H06_exp.mp3?v=cdc21fe9", "is_listening": false}]}, {"id": "N3-V10", "subject": "词汇", "point": "ぎりぎり", "point_key": "ぎりぎり", "family": "kana_adverb", "modality": "listen", "exam_weight": 2.1, "roi_score": 2.1, "teach": {"left": {"ja": "ぎりぎり間に合う", "sub": "卡着死线最后一秒勉强赶上"}, "right": {"ja": "ぴったり合う", "sub": "尺寸/时间严丝合缝刚刚好"}, "example_ja": "駅まで走って、終電にぎりぎり間に合った。", "zh_meaning": "一路跑到车站，卡着最后一刻勉强赶上了末班车。", "audio": "./audio/N3-V10_exp.mp3?v=a2e99793"}, "primary": {"id": "N3-V10", "prompt": "駅まで走って、終電に（　　）間に合った。", "choices": ["ぎりぎり", "ぐっすり"], "answer": "ぎりぎり", "full_ja": "駅まで走って、終電にぎりぎり間に合った。", "zh_meaning": "一路跑到车站，卡着最后一刻勉强赶上了末班车。", "why_line": "一路跑过去才赶上末班车，说明时间「卡在极限边缘、差一点就没赶上」。", "form_line": "「ぎりぎり」表示卡着极限勉强赶上（常配間に合う）；「ぐっすり」形容睡得香甜熟睡。", "q_audio": "./audio/N3-V10_q.mp3?v=ee760d69", "exp_audio": "./audio/N3-V10_exp.mp3?v=a2e99793", "is_listening": false}, "variants": [{"id": "VAR-V10", "prompt": "このシャツは私の体にサイズが（　　）だ。", "choices": ["ぴったり", "ぎりぎり"], "answer": "ぴったり", "full_ja": "このシャツは私の体にサイズがぴったりだ。", "zh_meaning": "这件衬衫穿在我身上尺码严丝合缝刚刚好。", "why_line": "形容衣服合身、尺寸或时间「分毫不差、刚刚好贴合」。", "form_line": "「ぴったり」表示严丝合缝刚刚好；「ぎりぎり」是卡在极限边缘差一点就不够。", "q_audio": "./audio/VAR-V10_q.mp3?v=9a3b538c", "exp_audio": "./audio/VAR-V10_exp.mp3?v=29ecad21", "is_listening": false}]}, {"id": "N3-L06", "subject": "听力", "point": "聴解「まず／後にして」顺序", "point_key": "N3L-087", "family": "listen_seq", "modality": "listen", "exam_weight": 3.0, "roi_score": 2.76, "teach": {"left": {"ja": "先に ／ まず ／ その前に", "sub": "★ 第一顺位马上做（正确答案！）"}, "right": {"ja": "A は後にして", "sub": "陷阱！意思是「A先缓一缓晚点做」"}, "example_ja": "女：課長、会議室の準備と資料の印刷、どちらを先にしましょうか。\n男：会議室は後にして、先に資料を印刷してくれる？", "zh_meaning": "女：「课长，布置会议室和打印资料，先做哪个？」 男：「会议室先放后面，你先打印资料好吗？」", "audio": "./audio/N3-L06_exp.mp3?v=c2cd3aa6"}, "primary": {"id": "N3-L06", "prompt": "", "choices": ["会議室を準備する", "資料を印刷する", "課長にメールする"], "answer": "資料を印刷する", "full_ja": "女：課長、会議室の準備と資料の印刷、どちらを先にしましょうか。\n男：会議室は後にして、先に資料を印刷してくれる？", "zh_meaning": "女：「课长，布置会议室和打印资料，先做哪个？」 男：「会议室先放后面，你先打印资料好吗？」", "why_line": "课长虽然嘴里先提到会议室，但紧接着说「放到后面」，真正让第一步先做的是第 2 项打印资料。", "form_line": "听力顺序题抓转折词：「〜は後にして（这个先放后面）」，跟在「先に（先）」后面的动作才是第一顺位。", "q_audio": "./audio/N3-L06_q.mp3?v=6ff09357", "exp_audio": "./audio/N3-L06_exp.mp3?v=c2cd3aa6", "is_listening": true}, "variants": [{"id": "VAR-L06", "prompt": "", "choices": ["銀行へ行く", "昼ご飯を食べる", "メールを返信する"], "answer": "メールを返信する", "full_ja": "男：先輩、先に銀行へ行ってきてもいいですか。\n女：あ、その前にこのメールだけ返信しといて。銀行はその後でね。", "zh_meaning": "男：「前辈，我可以先去趟银行吗？」 女：「啊，那之前先把这封邮件回一下，银行等那之后再去。」", "why_line": "前辈明确要求「去银行之前先把邮件回了」，所以选第 3 项先回复邮件。", "form_line": "抓顺序词：「その前に（在那之前）」后面跟的是第一顺位，「その後で（那之后）」排在第二顺位。", "q_audio": "./audio/VAR-L06_q.mp3?v=7123f04a", "exp_audio": "./audio/VAR-L06_exp.mp3?v=99f1ca90", "is_listening": true}]}, {"id": "G-20261114-10", "subject": "语法", "point": "〜はずだ", "point_key": "〜はずだ", "family": "hearsay_infer", "modality": "both", "exam_weight": 2.8, "roi_score": 2.8, "teach": {"left": {"ja": "あるはずなんですが", "sub": "按理说应该有…（但却找不到） · 肯定预期＋转折（你真正想表达的意思）"}, "right": {"ja": "あるはずない", "sub": "绝对不可能有！（100%否定）"}, "example_ja": "さっき財布に入れたから、レシートはここにあるはずなのだが、見つからない。", "zh_meaning": "刚才明明放进钱包了，小票按理应该在这里，却找不到。", "audio": "./audio/G-20261114-10_exp.mp3?v=b4e09e38"}, "primary": {"id": "G-20261114-10", "prompt": "さっき財布に入れたから、レシートはここに（　　）が見つからない。", "choices": ["あるはずなのだが", "あるはずないのだが", "あるわけないのだが"], "answer": "あるはずなのだが", "full_ja": "さっき財布に入れたから、レシートはここにあるはずなのだが、見つからない。", "zh_meaning": "刚才明明放进钱包了，小票按理应该在这里，却找不到。", "why_line": "前半句有明确依据「刚才亲手放进去了」，后半句转折「却找不到」，中间必须是肯定推测「按理应该在」。", "form_line": "肯定推测「あるはずだ」接转折「が」时变为「あるはずなのだが」；若用「はずない」就变成「按理不在却找不到」，前后矛盾。", "q_audio": "./audio/G-20261114-10_q.mp3?v=e98d18b4", "exp_audio": "./audio/G-20261114-10_exp.mp3?v=b4e09e38", "is_listening": false}, "variants": [{"id": "VAR-G10", "prompt": "田中さんは今日海外出張中だから、会社にいる（　　）よ。", "choices": ["はずがない", "はずだ"], "answer": "はずがない", "full_ja": "田中さんは今日海外出張中だから、会社にいるはずがないよ。", "zh_meaning": "田中今天正在国外出差，绝不可能在公司里哦。", "why_line": "前面有铁证「人正在国外出差」，逻辑上完全排除他在公司的可能。", "form_line": "动词原形「いる」接「はずがない」表示按道理绝不可能在；「はずだ」是应该在，与在国外出差矛盾。", "q_audio": "./audio/VAR-G10_q.mp3?v=6f548632", "exp_audio": "./audio/VAR-G10_exp.mp3?v=e9c1d628", "is_listening": false}]}, {"id": "H-20261114-07", "subject": "活用", "point": "終わる ↔ 終える／終わらせる", "point_key": "T-006", "family": "transitivity", "modality": "both", "exam_weight": 2.8, "roi_score": 2.8, "teach": {"left": {"ja": "仕事を終わらせる", "sub": "宾语を＋使役他动化（把工作干完） · 也可说书面他动词：仕事を終える"}, "right": {"ja": "仕事が終わる", "sub": "主语が＋自动词（工作自然结束）"}, "example_ja": "旅行に行く前に、今週中にこの仕事を全部終わらせてしまいたい。", "zh_meaning": "去旅行之前，我想在本周内把这项工作全部做完。", "audio": "./audio/H-20261114-07_exp.mp3?v=cd2ecd52"}, "primary": {"id": "H-20261114-07", "prompt": "旅行に行く前に、今週中にこの仕事を全部（　　）しまいたい。", "choices": ["終わらせて", "終わって", "終わられて"], "answer": "終わらせて", "full_ja": "旅行に行く前に、今週中にこの仕事を全部終わらせてしまいたい。", "zh_meaning": "去旅行之前，我想在本周内把这项工作全部做完。", "why_line": "前面有宾语「この仕事を」，表达「人主动把活儿干完」，不能直接用自动词「終わって」。", "form_line": "自动词「終わる」变成使役形「終わらせる → 終わらせて」，才能带宾语「仕事を」表示把工作做完。", "q_audio": "./audio/H-20261114-07_q.mp3?v=1aef9f11", "exp_audio": "./audio/H-20261114-07_exp.mp3?v=cd2ecd52", "is_listening": false}, "variants": []}, {"id": "V-20261114-07", "subject": "词汇", "point": "つい", "point_key": "つい", "family": "kana_adverb", "modality": "listen", "exam_weight": 2.1, "roi_score": 2.1, "teach": {"left": {"ja": "つい（食べてしまう）", "sub": "① 不知不觉、一时没忍住 · 本不想做却顺手犯了小错"}, "right": {"ja": "わざと（壊した）", "sub": "① 故意地、存心地 · 明知故犯、蓄意去做"}, "example_ja": "ダイエット中なのに、目の前にケーキがあるとつい食べてしまう。", "zh_meaning": "明明在减肥，眼前一有蛋糕还是没忍住吃掉了。", "audio": "./audio/V-20261114-07_exp.mp3?v=c6e4e39d"}, "primary": {"id": "V-20261114-07", "prompt": "ダイエット中なのに、目の前にケーキがあると（　　）食べてしまう。", "choices": ["つい", "やっと", "わざと"], "answer": "つい", "full_ja": "ダイエット中なのに、目の前にケーキがあるとつい食べてしまう。", "zh_meaning": "明明在减肥，眼前一有蛋糕还是没忍住吃掉了。", "why_line": "理智上不想吃，手却没管住，「不知不觉、不由自主」做了某事，常配「てしまう」。", "form_line": "「つい」是没忍住下意识做了；「やっと」是好不容易终于；「わざと」则是故意去做。", "q_audio": "./audio/V-20261114-07_q.mp3?v=f9760f93", "exp_audio": "./audio/V-20261114-07_exp.mp3?v=c6e4e39d", "is_listening": false}, "variants": []}, {"id": "Q-20261114-003", "subject": "听力", "point": "〜んだって", "point_key": "N3L-025", "family": "listen_contract", "modality": "listen", "exam_weight": 2.9, "roi_score": 1.798, "teach": {"left": {"ja": "閉まっちゃうんだって", "sub": "ちゃった/ちゃう ＋ んだって · 听说要关门歇业了！（转告传闻）"}, "right": {"ja": "あそこ好きだったのに", "sub": "句尾 のに 表遗憾惋惜 · 诶真的假的？明明很喜欢那家的…"}, "example_ja": "女：ねえ、聞いた？駅前のパン屋さん、来月で閉まっちゃうんだって。\n男：えっ、本当？あそこ好きだったのに。", "zh_meaning": "女：「喂你听说了吗？车站前那家面包店听说下个月就要关门了。」 男：「啊真的假的？我明明很喜欢那家的。」", "audio": "./audio/Q-20261114-003_exp.mp3?v=a39ba4c3"}, "primary": {"id": "Q-20261114-003", "prompt": "", "choices": ["えっ、本当？あそこ好きだったのに。", "うん、私が閉めたんだよ。", "パン、買ってきてくれたの？"], "answer": "えっ、本当？あそこ好きだったのに。", "full_ja": "女：ねえ、聞いた？駅前のパン屋さん、来月で閉まっちゃうんだって。\n男：えっ、本当？あそこ好きだったのに。", "zh_meaning": "女：「喂你听说了吗？车站前那家面包店听说下个月就要关门了。」 男：「啊真的假的？我明明很喜欢那家的。」", "why_line": "女生带来老店即将歇业的传闻，第 1 句男生露出惊讶和惋惜最自然。", "form_line": "「閉まっちゃう」是「閉まってしまう（遗憾关门）」的口语缩约，句尾「〜んだって」等于「听说」。", "q_audio": "./audio/Q-20261114-003_q.mp3?v=185260dd", "exp_audio": "./audio/Q-20261114-003_exp.mp3?v=a39ba4c3", "is_listening": true}, "variants": []}, {"id": "N3-G15", "subject": "语法", "point": "〜ば〜ほど", "point_key": "〜ば〜ほど", "family": "star_syntax", "modality": "memorize", "exam_weight": 3.0, "roi_score": 2.76, "teach": {"left": {"ja": "読めば ＋ 読むほど", "sub": "假定形ば ＋ 原形ほど ＝ 越…越…"}, "right": {"ja": "読むと読むほど", "sub": "「ほど」前面绝不配「と」"}, "example_ja": "この本は読めば読むほど面白くなる。", "zh_meaning": "这本书越读越有意思。", "audio": "./audio/N3-G15_exp.mp3?v=7a3d160a"}, "primary": {"id": "N3-G15", "prompt": "この本は（　　）読むほど面白くなる。", "choices": ["読めば", "読むと"], "answer": "読めば", "full_ja": "この本は読めば読むほど面白くなる。", "zh_meaning": "这本书越读越有意思。", "why_line": "表达「越……就越……」的递进关系时，同一个动词要在前后重复出现两次。", "form_line": "前一个词变假定形「ば」（読む → 読めば），后一个词保持原形接「ほど」（読むほど），「ほど」前面不能配「と」。", "q_audio": "./audio/N3-G15_q.mp3?v=d125db0a", "exp_audio": "./audio/N3-G15_exp.mp3?v=7a3d160a", "is_listening": false}, "variants": []}, {"id": "H-20261114-03", "subject": "活用", "point": "落ちる ↔ 落とす", "point_key": "T-044", "family": "transitivity", "modality": "both", "exam_weight": 3.0, "roi_score": 1.86, "teach": {"left": {"ja": "鍵を 落とす", "sub": "を ＋ す结尾（他动词） · 人不小心「把钥匙弄掉了」"}, "right": {"ja": "鍵が 落ちる", "sub": "が ＋ る结尾（自动词） · 钥匙自己「掉下来了」"}, "example_ja": "走っている途中で、ポケットから鍵を落としてしまった。", "zh_meaning": "跑步途中，不小心把钥匙从口袋里弄掉了。", "audio": "./audio/H-20261114-03_exp.mp3?v=8611e1a9"}, "primary": {"id": "H-20261114-03", "prompt": "ポケットから鍵を（　　）しまった。", "choices": ["落として", "落ちて"], "answer": "落として", "full_ja": "走っている途中で、ポケットから鍵を落としてしまった。", "zh_meaning": "跑步途中，不小心把钥匙从口袋里弄掉了。", "why_line": "前面紧跟着宾语「鍵を」，表达人不小心「把钥匙弄掉了」，必须配他动词。", "form_line": "带「す」尾的「落とす → 落として」是他动词（配を，把某物弄掉）；「落ちる → 落ちて」是自动词（配が，某物自己掉）。", "q_audio": "./audio/H-20261114-03_q.mp3?v=53faa7c9", "exp_audio": "./audio/H-20261114-03_exp.mp3?v=8611e1a9", "is_listening": false}, "variants": [{"id": "VAR-H03", "prompt": "階段で手が滑って、スマホが下に（　　）しまった。", "choices": ["落ちて", "落として"], "answer": "落ちて", "full_ja": "階段で手が滑って、スマホが下に落ちてしまった。", "zh_meaning": "在楼梯上手一滑，手机掉下去了。", "why_line": "后半句主语是「スマホが（手机）」，客观描述手机滑落下去，要配自动词。", "form_line": "前面是「スマホが」必配自动词「落ちる → 落ちて」；前面若是「スマホを」才配他动词「落として」。", "q_audio": "./audio/VAR-H03_q.mp3?v=618abb1e", "exp_audio": "./audio/VAR-H03_exp.mp3?v=50046720", "is_listening": false}]}, {"id": "N3-V11", "subject": "词汇", "point": "こっそり", "point_key": "こっそり", "family": "kana_adverb", "modality": "listen", "exam_weight": 2.0, "roi_score": 2.0, "teach": {"left": {"ja": "こっそり食べる／抜け出す", "sub": "瞒着别人悄悄地、偷偷地"}, "right": {"ja": "街でばったり会う", "sub": "转角迎面偶遇、撞个正着"}, "example_ja": "ダイエット中なのに、夜中にこっそりケーキを食べた。", "zh_meaning": "明明在减肥，半夜却背着人偷偷吃了蛋糕。", "audio": "./audio/N3-V11_exp.mp3?v=adbc6a64"}, "primary": {"id": "N3-V11", "prompt": "ダイエット中なのに、夜中に（　　）ケーキを食べた。", "choices": ["こっそり", "ばったり"], "answer": "こっそり", "full_ja": "ダイエット中なのに、夜中にこっそりケーキを食べた。", "zh_meaning": "明明在减肥，半夜却背着人偷偷吃了蛋糕。", "why_line": "怕被人看见，半夜「悄悄地、偷偷摸摸地」溜去吃。", "form_line": "「こっそり」表示悄悄、偷偷；「ばったり」则是在街上毫无防备偶遇熟人。", "q_audio": "./audio/N3-V11_q.mp3?v=a144106d", "exp_audio": "./audio/N3-V11_exp.mp3?v=adbc6a64", "is_listening": false}, "variants": [{"id": "VAR-V11", "prompt": "旅行先の京都で、大学の友達に（　　）会った。", "choices": ["ばったり", "こっそり"], "answer": "ばったり", "full_ja": "旅行先の京都で、大学の友達にばったり会った。", "zh_meaning": "在旅行地京都，居然迎面偶遇了大学朋友。", "why_line": "事先毫无约定，在外地街头「撞个正着、意外巧遇」。", "form_line": "「ばったり会う」是固定搭配（意外偶遇）；「こっそり」是背着别人偷偷摸摸。", "q_audio": "./audio/VAR-V11_q.mp3?v=bcf49acd", "exp_audio": "./audio/VAR-V11_exp.mp3?v=7f3cce22", "is_listening": false}]}, {"id": "Q-20261114-002", "subject": "听力", "point": "「いいわ/いいよ(不要)」", "point_key": "N3L-071", "family": "listen_intent", "modality": "listen", "exam_weight": 2.8, "roi_score": 0.56, "teach": {"left": {"ja": "あ、袋はいいです", "sub": "✋ 委婉拒绝 ＝ いらない（不用了） · レシートはいいです / お茶はいいよ"}, "right": {"ja": "お願いします", "sub": "接受提议 ＝ ください（麻烦给我） · 想要袋子时绝不说「はいいです」"}, "example_ja": "店員：袋にお入れしましょうか？\n客：あ、袋はいいです。そのまま持って帰りますから。", "zh_meaning": "店员：「需要给您装袋吗？」 客人：「啊，袋子不用了，我就这样直接拿回去。」", "audio": "./audio/Q-20261114-002_exp.mp3?v=8409389b"}, "primary": {"id": "Q-20261114-002", "prompt": "", "choices": ["袋をもらう。", "袋はいらない。", "大きい袋に変える。"], "answer": "袋はいらない。", "full_ja": "店員：袋にお入れしましょうか？\n客：あ、袋はいいです。そのまま持って帰りますから。", "zh_meaning": "店员：「需要给您装袋吗？」 客人：「啊，袋子不用了，我就这样直接拿回去。」", "why_line": "客人后半句明确补了「直接拿回去」，所以选第 2 项「不要袋子」。", "form_line": "店员问要不要某物时，回答「袋はいいです／大丈夫です」一律是委婉拒绝「不用了」，不是「好的我要」。", "q_audio": "./audio/Q-20261114-002_q.mp3?v=831d8a09", "exp_audio": "./audio/Q-20261114-002_exp.mp3?v=8409389b", "is_listening": true}, "variants": []}, {"id": "G-20261114-07", "subject": "语法", "point": "★排序・〜ずにはいられない", "point_key": "〜ずにはいられない", "family": "star_syntax", "modality": "memorize", "exam_weight": 2.9, "roi_score": 2.668, "teach": {"left": {"ja": "泣かず・には・いられない", "sub": "固定铁板四连块 · 情不自禁、忍不住哭了"}, "right": {"ja": "★排序必背语序", "sub": "Vない去ない ＋ ず ＋ には ＋ いられない · 注意：する → せずにはいられな…"}, "example_ja": "その映画のラストシーンは感動的で、見ていて泣かずにはいられなかった。", "zh_meaning": "那部电影的结局太感人，看着看着忍不住哭了出来。", "audio": "./audio/G-20261114-07_exp.mp3?v=82d7e3ee"}, "primary": {"id": "G-20261114-07", "prompt": "感動的で、見ていて（　　）。", "choices": ["泣かずにはいられなかった", "泣かないではいなかった"], "answer": "泣かずにはいられなかった", "full_ja": "その映画のラストシーンは感動的で、見ていて泣かずにはいられなかった。", "zh_meaning": "那部电影的结局太感人，看着看着忍不住哭了出来。", "why_line": "情绪自然涌上来控制不住，日语表达「情不自禁、忍不住做某事」有固定句式。", "form_line": "把否定形「泣かない」的「ない」换成古语否定「ず」，再接「にはいられない」，连成「泣かずにはいられなかった」。", "q_audio": "./audio/G-20261114-07_q.mp3?v=48e44ba5", "exp_audio": "./audio/G-20261114-07_exp.mp3?v=82d7e3ee", "is_listening": false}, "variants": []}, {"id": "H-20261114-04", "subject": "活用", "point": "消える ↔ 消す", "point_key": "T-004", "family": "transitivity", "modality": "both", "exam_weight": 3.0, "roi_score": 1.86, "teach": {"left": {"ja": "火が 消えた", "sub": "が ＋ 自然に（自动词） · 风吹过来，火苗自己灭了"}, "right": {"ja": "火を 消した", "sub": "を ＋ す结尾（他动词） · 人伸手去，把火吹灭/关掉"}, "example_ja": "強い風が吹いて、ろうそくの火が自然に消えた。", "zh_meaning": "刮起一阵大风，蜡烛的火自然灭了。", "audio": "./audio/H-20261114-04_exp.mp3?v=7ab71144"}, "primary": {"id": "H-20261114-04", "prompt": "強い風が吹いて、ろうそくの火が自然に（　　）。", "choices": ["消えた", "消した"], "answer": "消えた", "full_ja": "強い風が吹いて、ろうそくの火が自然に消えた。", "zh_meaning": "刮起一阵大风，蜡烛的火自然灭了。", "why_line": "风吹过来之后「火苗自己熄灭了」，前面是主语「火が」加「自然に」，要用自动词。", "form_line": "「消える → 消えた」是自动词（火自己灭，配が）；带「す」的「消す → 消した」是他动词（人去把火弄灭，配を）。", "q_audio": "./audio/H-20261114-04_q.mp3?v=57e6cbd5", "exp_audio": "./audio/H-20261114-04_exp.mp3?v=7ab71144", "is_listening": false}, "variants": [{"id": "VAR-H04", "prompt": "寝る前に、部屋の電気をちゃんと（　　）ください。", "choices": ["消して", "消えて"], "answer": "消して", "full_ja": "寝る前に、部屋の電気をちゃんと消してください。", "zh_meaning": "睡觉前，请把房间的灯关好。", "why_line": "嘱咐对方伸手「把灯关掉」，前面有宾格助词「電気を」，必须用他动词。", "form_line": "他动词「消す → 消して」配「電気を」；自动词「消えて」表示灯自己灭了，不能用来让人关灯。", "q_audio": "./audio/VAR-H04_q.mp3?v=636b3d3c", "exp_audio": "./audio/VAR-H04_exp.mp3?v=a643575d", "is_listening": false}]}, {"id": "V-20261114-01", "subject": "词汇", "point": "しゃがむ", "point_key": "しゃがむ", "family": "vocab_action", "modality": "listen", "exam_weight": 2.0, "roi_score": 2.0, "teach": {"left": {"ja": "しゃがむ → しゃがんで", "sub": "🦐 像「虾」弓身屈膝蹲下 · ひざを曲げてしゃがむ（弯膝蹲下）"}, "right": {"ja": "うなずく → うなずいて", "sub": "🙂 轻轻点头表赞同 · 首を縦に振ってうなずく（点头回应）"}, "example_ja": "小さな子どもと目線を合わせるために、ひざを曲げてしゃがんで話しかけた。", "zh_meaning": "为了和小朋友视线平齐，弯下膝盖蹲下来跟他说话。", "audio": "./audio/V-20261114-01_exp.mp3?v=c415347f"}, "primary": {"id": "V-20261114-01", "prompt": "子どもと目線を合わせるために、ひざを曲げて（　　）話しかけた。", "choices": ["しゃがんで", "うなずいて"], "answer": "しゃがんで", "full_ja": "小さな子どもと目線を合わせるために、ひざを曲げてしゃがんで話しかけた。", "zh_meaning": "为了和小朋友视线平齐，弯下膝盖蹲下来跟他说话。", "why_line": "前面已经说了「弯下膝盖、和小孩平视」，对应的身体动作就是「蹲下」。", "form_line": "「しゃがむ（蹲下）」词尾「む」变て形发生拨音便，变成「しゃがんで」；「うなずいて」是点头。", "q_audio": "./audio/V-20261114-01_q.mp3?v=d3df2933", "exp_audio": "./audio/V-20261114-01_exp.mp3?v=c415347f", "is_listening": false}, "variants": []}, {"id": "G-20261114-08", "subject": "语法", "point": "★排序・〜さえ〜ば", "point_key": "〜さえ〜ば", "family": "star_syntax", "modality": "memorize", "exam_weight": 2.9, "roi_score": 2.668, "teach": {"left": {"ja": "〜さえ 〜ば", "sub": "最低唯一条件呼应 · 只要有手机，就万事OK"}, "right": {"ja": "〜こそ", "sub": "单独强调主语/原因 · 今年こそ（今年一定要）/ からこそ"}, "example_ja": "スマホさえあれば、いつでもわからない言葉を調べられる。", "zh_meaning": "只要有手机，随时都能查不懂的词。", "audio": "./audio/G-20261114-08_exp.mp3?v=79165ad7"}, "primary": {"id": "G-20261114-08", "prompt": "スマホ（　　）あれば、いつでも調べられる。", "choices": ["さえ", "こそ"], "answer": "さえ", "full_ja": "スマホさえあれば、いつでもわからない言葉を調べられる。", "zh_meaning": "只要有手机，随时都能查不懂的词。", "why_line": "后半句有假定形「あれば」，表达「只要满足这一个最低条件，其他都不是问题」。", "form_line": "「名词＋さえ＋あれば」是固定呼应（只要有……就）；「こそ」只表强调，不能和「ば」搭成只要条件。", "q_audio": "./audio/G-20261114-08_q.mp3?v=fd3dd44f", "exp_audio": "./audio/G-20261114-08_exp.mp3?v=79165ad7", "is_listening": false}, "variants": [{"id": "VAR-G08", "prompt": "薬を飲み（　　）すれば、すぐ熱が下がりますよ。", "choices": ["さえ", "しか"], "answer": "さえ", "full_ja": "薬を飲みさえすれば、すぐ熱が下がりますよ。", "zh_meaning": "只要把药吃了，很快就会退烧的。", "why_line": "表达「只要完成吃药这一个动作，退烧就自然解决」。", "form_line": "动词用「ます形去掉ます（飲み）＋さえすれば」表示只要做……就；「しか」必须配否定，不能接「すれば」。", "q_audio": "./audio/VAR-G08_q.mp3?v=6bccf4c0", "exp_audio": "./audio/VAR-G08_exp.mp3?v=e87b6b2c", "is_listening": false}]}, {"id": "H-20261114-02", "subject": "活用", "point": "五段动词 受身形（词尾あ段＋れる）", "point_key": "V-032", "family": "voice_form", "modality": "both", "exam_weight": 3.0, "roi_score": 0.6, "teach": {"left": {"ja": "踏まれる（れ＝受身）", "sub": "受害被动：我倒霉被踩 · 隣の人に足を踏まれた"}, "right": {"ja": "踏ませる（せ＝使役）", "sub": "s音＝使唤/强迫别人做 · 逼别人去踩（意思全反了！）"}, "example_ja": "満員電車の中で、隣の人に足を踏まれて痛かった。", "zh_meaning": "在挤满人的电车里，被旁边的人踩了脚，很疼。", "audio": "./audio/H-20261114-02_exp.mp3?v=4facde86"}, "primary": {"id": "H-20261114-02", "prompt": "満員電車の中で、隣の人に足を（　　）痛かった。", "choices": ["踏まれて", "踏ませて"], "answer": "踏まれて", "full_ja": "満員電車の中で、隣の人に足を踏まれて痛かった。", "zh_meaning": "在挤满人的电车里，被旁边的人踩了脚，很疼。", "why_line": "我是倒霉挨踩的受害者，「被别人踩了脚」要用受身（被动），不可能是我指使别人来踩我。", "form_line": "五段动词「踏む」词尾「む」变あ段「ま」加「れる」，て形就是「踏まれて」；带「せ」的「踏ませて」是使役（让别人踩）。", "q_audio": "./audio/H-20261114-02_q.mp3?v=8a769293", "exp_audio": "./audio/H-20261114-02_exp.mp3?v=4facde86", "is_listening": false}, "variants": [{"id": "VAR-H02", "prompt": "母は野菜嫌いの子どもにピーマンを（　　）。", "choices": ["食べさせた", "食べられた"], "answer": "食べさせた", "full_ja": "母は野菜嫌いの子どもにピーマンを食べさせた。", "zh_meaning": "妈妈让讨厌吃蔬菜的孩子把青椒吃下去了。", "why_line": "主语是「妈妈」，妈妈督促要求孩子去吃，属于「让别人做某事」的使役句。", "form_line": "一段动词「食べる」去掉「る」加「させる」，过去式就是「食べさせた」；「食べられた」是被动被吃掉。", "q_audio": "./audio/VAR-H02_q.mp3?v=cae95ff3", "exp_audio": "./audio/VAR-H02_exp.mp3?v=e2e66202", "is_listening": false}]}, {"id": "V-20261114-05", "subject": "词汇", "point": "はっきり", "point_key": "はっきり", "family": "kana_adverb", "modality": "listen", "exam_weight": 2.0, "roi_score": 2.0, "teach": {"left": {"ja": "はっきり", "sub": "🔍 清晰明确（声音/视线/态度） · はっきり言う・富士山がはっきり見える"}, "right": {"ja": "うっかり", "sub": "💭 一走神犯迷糊 · うっかり忘れる・うっかり乗り過ごす"}, "example_ja": "後ろの席まで聞こえるように、もっと大きな声ではっきり返事をしてください。", "zh_meaning": "为了让后排座位也听得见，请更大声、更清楚地回答。", "audio": "./audio/V-20261114-05_exp.mp3?v=d339840f"}, "primary": {"id": "V-20261114-05", "prompt": "後ろの席まで聞こえるように、もっと大きな声で（　　）返事をしてください。", "choices": ["はっきり", "うっかり"], "answer": "はっきり", "full_ja": "後ろの席まで聞こえるように、もっと大きな声ではっきり返事をしてください。", "zh_meaning": "为了让后排座位也听得见，请更大声、更清楚地回答。", "why_line": "要求声音洪亮、吐字「清清楚楚、明明白白」。", "form_line": "「はっきり」表示清楚分明；「うっかり」表示一时走神、疏忽大意。", "q_audio": "./audio/V-20261114-05_q.mp3?v=4e5da4a6", "exp_audio": "./audio/V-20261114-05_exp.mp3?v=d339840f", "is_listening": false}, "variants": []}, {"id": "G-20261114-11", "subject": "语法", "point": "〜らしい", "point_key": "〜らしい", "family": "hearsay_infer", "modality": "both", "exam_weight": 2.9, "roi_score": 2.668, "teach": {"left": {"ja": "あるらしい / 便利らしい", "sub": "动词原形・な形词干直接＋らしい · 听说有活动 / 听说很方便"}, "right": {"ja": "あるとらしい ❌ / 便利だらしい", "sub": "8/23 & 9/12 两次课堂口误 · 把「〜と聞いた」的と或だ混进来了"}, "example_ja": "ニュースによると、来週また大きなイベントがあるらしいよ。", "zh_meaning": "据新闻说，听说下周又有大型活动哦。", "audio": "./audio/G-20261114-11_exp.mp3?v=56585a8e"}, "primary": {"id": "G-20261114-11", "prompt": "ニュースによると、来週また大きなイベントが（　　）よ。", "choices": ["あるらしい", "あるとらしい", "あるだらしい"], "answer": "あるらしい", "full_ja": "ニュースによると、来週また大きなイベントがあるらしいよ。", "zh_meaning": "据新闻说，听说下周又有大型活动哦。", "why_line": "开头有消息来源「ニュースによると（据新闻说）」，是在转述客观传闻。", "form_line": "传闻「らしい」直接接动词简体原形「ある」，连成「あるらしい」；中间绝不能加引用的「と」或「だ」。", "q_audio": "./audio/G-20261114-11_q.mp3?v=74925166", "exp_audio": "./audio/G-20261114-11_exp.mp3?v=56585a8e", "is_listening": false}, "variants": [{"id": "VAR-G11", "prompt": "うわさによると、あの二人は来月結婚する（　　）。", "choices": ["らしい", "とらしい"], "answer": "らしい", "full_ja": "うわさによると、あの二人は来月結婚するらしい。", "zh_meaning": "据传言说，那两个人好像下个月要结婚了。", "why_line": "开头有「うわさによると（据传闻）」，属于转述别人传来的消息。", "form_line": "动词简体「結婚する」直接接「らしい」，中间不能多加引用的「と」。", "q_audio": "./audio/VAR-G11_q.mp3?v=a8ee63ff", "exp_audio": "./audio/VAR-G11_exp.mp3?v=5fa58e69", "is_listening": false}]}, {"id": "N3-H10", "subject": "活用", "point": "閉まる ↔ 閉める", "point_key": "T-002", "family": "transitivity", "modality": "both", "exam_weight": 3.0, "roi_score": 0.6, "teach": {"left": {"ja": "ドアが 閉まる", "sub": "が ＋ まる ＝ 门自己关上（自动）"}, "right": {"ja": "ドアを 閉める", "sub": "を ＋ める ＝ 人把门关上（他动）"}, "example_ja": "風が強くて、ドアが勝手に閉まった。", "zh_meaning": "风很大，门自己关上了。", "audio": "./audio/N3-H10_exp.mp3?v=12792222"}, "primary": {"id": "N3-H10", "prompt": "風が強くて、ドアが勝手に（　　）。", "choices": ["閉まった", "閉めた"], "answer": "閉まった", "full_ja": "風が強くて、ドアが勝手に閉まった。", "zh_meaning": "风很大，门自己关上了。", "why_line": "不是人去关门，而是风吹得「门自己关上了」，前面配「ドアが勝手に」，要用自动词。", "form_line": "「閉まる → 閉まった」是自动词（门自己关，配が）；「閉める → 閉めた」是他动词（人伸手关门，配を）。", "q_audio": "./audio/N3-H10_q.mp3?v=25e30ebb", "exp_audio": "./audio/N3-H10_exp.mp3?v=12792222", "is_listening": false}, "variants": [{"id": "VAR-H10", "prompt": "エアコンをつけるから、窓を（　　）ください。", "choices": ["閉めて", "閉まって"], "answer": "閉めて", "full_ja": "エアコンをつけるから、窓を閉めてください。", "zh_meaning": "要开空调了，请把窗户关上。", "why_line": "请对方动手「把窗户关上」，前面有宾格助词「窓を」，必须配他动词。", "form_line": "他动词「閉める → 閉めて」配「窓を」；自动词「閉まって」是门窗自己关着。", "q_audio": "./audio/VAR-H10_q.mp3?v=f43ea8a4", "exp_audio": "./audio/VAR-H10_exp.mp3?v=2af0a767", "is_listening": false}]}, {"id": "V-20261114-06", "subject": "词汇", "point": "うっかり", "point_key": "うっかり", "family": "kana_adverb", "modality": "listen", "exam_weight": 2.0, "roi_score": 2.0, "teach": {"left": {"ja": "うっかり", "sub": "💭 分神失误（配 忘れる/乗り過ごす） · 聊嗨了一不留神坐过站"}, "right": {"ja": "しっかり", "sub": "🪨 牢靠踏实（配 持つ/勉強する） · 抓牢扶手 / 踏实准备考试"}, "example_ja": "おしゃべりに夢中になって、うっかり降りる駅を乗り過ごしてしまった。", "zh_meaning": "光顾着聊天太投入，一不小心坐过了站。", "audio": "./audio/V-20261114-06_exp.mp3?v=f544d338"}, "primary": {"id": "V-20261114-06", "prompt": "おしゃべりに夢中になって、（　　）駅を乗り過ごした。", "choices": ["うっかり", "しっかり"], "answer": "うっかり", "full_ja": "おしゃべりに夢中になって、うっかり降りる駅を乗り過ごしてしまった。", "zh_meaning": "光顾着聊天太投入，一不小心坐过了站。", "why_line": "聊天聊忘了神，「一不留神、疏忽大意」犯了小错，常和句尾「てしまった」呼应。", "form_line": "「うっかり」是不小心走神；「しっかり」意思正好相反，表示牢牢抓稳、踏实可靠。", "q_audio": "./audio/V-20261114-06_q.mp3?v=2e4a8ff7", "exp_audio": "./audio/V-20261114-06_exp.mp3?v=f544d338", "is_listening": false}, "variants": [{"id": "VAR-V06", "prompt": "電車が揺れるので、手すりに（　　）つかまってください。", "choices": ["しっかり", "うっかり"], "answer": "しっかり", "full_ja": "電車が揺れるので、手すりにしっかりつかまってください。", "zh_meaning": "电车摇晃，请牢牢抓紧扶手。", "why_line": "电车晃动时广播提醒乘客「稳稳地、牢牢地」扶好扶手。", "form_line": "「しっかり」表示牢牢地、稳当地；「うっかり」是一不留神走神大意。", "q_audio": "./audio/VAR-V06_q.mp3?v=8c24e39c", "exp_audio": "./audio/VAR-V06_exp.mp3?v=f5304672", "is_listening": false}]}, {"id": "N3-G20", "subject": "语法", "point": "〜ことになっている", "point_key": "〜ことになっている", "family": "rule_decide", "modality": "both", "exam_weight": 2.9, "roi_score": 2.668, "teach": {"left": {"ja": "〜ことになっている", "sub": "校规/制度/日程（外部定好的规矩）"}, "right": {"ja": "〜ことにしている", "sub": "个人主观坚持的习惯（我每天跑步）"}, "example_ja": "この寮では、夜１１時以降は静かにすることになっている。", "zh_meaning": "这栋宿舍规定，晚上十一点以后要保持安静。", "audio": "./audio/N3-G20_exp.mp3?v=11201bbb"}, "primary": {"id": "N3-G20", "prompt": "この寮では、夜１１時以降は静かにする（　　）。", "choices": ["ことになっている", "ことにしている"], "answer": "ことになっている", "full_ja": "この寮では、夜１１時以降は静かにすることになっている。", "zh_meaning": "这栋宿舍规定，晚上十一点以后要保持安静。", "why_line": "开头点明「この寮では（在这栋宿舍里）」，讲的是外部定好的公共规矩，不是个人习惯。", "form_line": "校规、制度等客观规定用「ことになっている」；个人主观坚持的日常习惯才用「ことにしている」。", "q_audio": "./audio/N3-G20_q.mp3?v=f5748176", "exp_audio": "./audio/N3-G20_exp.mp3?v=11201bbb", "is_listening": false}, "variants": [{"id": "VAR-G20", "prompt": "健康のために、私は毎日寝る前にストレッチをする（　　）。", "choices": ["ことにしている", "ことになっている"], "answer": "ことにしている", "full_ja": "健康のために、私は毎日寝る前にストレッチをすることにしている。", "zh_meaning": "为了健康，我养成习惯每天睡前做拉伸。", "why_line": "主语是「私は」，是为了健康自己给自己定下并坚持的日常习惯。", "form_line": "个人主动坚持的习惯用「ことにしている」；外部定下的公共规则才用「ことになっている」。", "q_audio": "./audio/VAR-G20_q.mp3?v=926a3876", "exp_audio": "./audio/VAR-G20_exp.mp3?v=188adc18", "is_listening": false}]}, {"id": "HQ-20261114-01", "subject": "活用", "point": "来る 可能形", "point_key": "V-030", "family": "potential_form", "modality": "memorize", "exam_weight": 2.8, "roi_score": 0.56, "teach": {"left": {"ja": "来られる（こられる）", "sub": "JLPT 卷面唯一标准形 · 来る・見る・食べる 必须带「ら」"}, "right": {"ja": "来れる（これる）", "sub": "口语偷懒「ら抜き言葉」 · 语法选择题里选它必扣分"}, "example_ja": "明日の会議に、来られますか。", "zh_meaning": "明天的会议，您能来吗？", "audio": "./audio/HQ-20261114-01_exp.mp3?v=5136375a"}, "primary": {"id": "HQ-20261114-01", "prompt": "明日の会議に、九時までに（　　）か。", "choices": ["来られる（こられる）", "来れる（これる）"], "answer": "来られる（こられる）", "full_ja": "明日の会議に、来られますか。", "zh_meaning": "明天的会议，您能来吗？", "why_line": "询问对方「能不能来」，需要把不规则动词「来る（くる）」变成正式书面的可能形。", "form_line": "「来る」的标准可能形必须保留「ら」，写作「来られる（こられる）」；「来れる（これる）」是日常口语吞音，考试卷面判错。", "q_audio": "./audio/HQ-20261114-01_q.mp3?v=e0689683", "exp_audio": "./audio/HQ-20261114-01_exp.mp3?v=5136375a", "is_listening": false}, "variants": []}, {"id": "V-20261114-04", "subject": "词汇", "point": "貯める", "point_key": "貯める", "family": "kanji_reading", "modality": "memorize", "exam_weight": 2.2, "roi_score": 0.44, "teach": {"left": {"ja": "貯める（ためる）", "sub": "单字带假名尾巴 → 训读 · お金をためる（把钱攒起来）"}, "right": {"ja": "貯金（ちょきん）", "sub": "双汉字合成词 → 音读 · 銀行にちょきんする（存款）"}, "example_ja": "将来のために毎月少しずつお金を貯める。", "zh_meaning": "为了将来，每个月一点一点存钱。", "audio": "./audio/V-20261114-04_exp.mp3?v=1282cf15"}, "primary": {"id": "V-20261114-04", "prompt": "毎月少しずつお金を「貯める」。", "choices": ["ためる", "ちょめる"], "answer": "ためる", "full_ja": "将来のために毎月少しずつお金を貯める。", "zh_meaning": "为了将来，每个月一点一点存钱。", "why_line": "「お金を貯める」表示把钱或积分积攒起来，考单汉字动词的训读发音。", "form_line": "单独带假名尾巴「〜める」走训读「ためる」；只有组成双汉字名词「貯金」时才读音读「ちょきん」。", "q_audio": "./audio/V-20261114-04_q.mp3?v=aa7645f1", "exp_audio": "./audio/V-20261114-04_exp.mp3?v=1282cf15", "is_listening": false}, "variants": []}, {"id": "GQ-20261114-02", "subject": "语法", "point": "〜ように言う", "point_key": "〜ように言う", "family": "hearsay_infer", "modality": "both", "exam_weight": 2.6, "roi_score": 2.6, "teach": {"left": {"ja": "飲むように言われた", "sub": "V原形/ない形 ＋ ように言う · 医生叮嘱/要求我「要按时吃药」"}, "right": {"ja": "飲んだそうだ", "sub": "简体句 ＋ そうだ / んだって · 传闻「听说他吃药了」"}, "example_ja": "医者に薬を飲むように言われた。", "zh_meaning": "被医生叮嘱要按时吃药。", "audio": "./audio/GQ-20261114-02_exp.mp3?v=54442c6b"}, "primary": {"id": "GQ-20261114-02", "prompt": "医者に薬を飲むように言われた。", "choices": ["被医生叮嘱要吃药", "听说医生吃了药"], "answer": "被医生叮嘱要吃药", "full_ja": "医者に薬を飲むように言われた。", "zh_meaning": "被医生叮嘱要按时吃药。", "why_line": "这里的「ように言う」表示叮嘱、劝告、要求某人去做某事，并不是比喻也不是听说。", "form_line": "动词原形「飲む」加「ように」，再配被动形「言われた（我被医生告知）」，合起来就是医生嘱咐我要吃药。", "q_audio": "./audio/GQ-20261114-02_q.mp3?v=09f9cf8b", "exp_audio": "./audio/GQ-20261114-02_exp.mp3?v=54442c6b", "is_listening": false}, "variants": []}, {"id": "V-20261114-02", "subject": "词汇", "point": "がらがら", "point_key": "がらがら", "family": "kana_adverb", "modality": "listen", "exam_weight": 1.9, "roi_score": 0.38, "teach": {"left": {"ja": "がらがら", "sub": "□□□□ 空荡荡没人 · 电车/电影院座位空空如也（反义：ぎっしり）"}, "right": {"ja": "ばらばら", "sub": "∴∵ 散落零乱・不一致 · 东西散落一地 / 大家意见不一"}, "example_ja": "あの映画館は人気がなくて、日曜日なのに客席はがらがらだった。", "zh_meaning": "那家电影院没人气，明明是周日，观众席却空荡荡的。", "audio": "./audio/V-20261114-02_exp.mp3?v=9ce037b9"}, "primary": {"id": "V-20261114-02", "prompt": "日曜日なのに客席は（　　）だった。", "choices": ["がらがら", "ばらばら"], "answer": "がらがら", "full_ja": "あの映画館は人気がなくて、日曜日なのに客席はがらがらだった。", "zh_meaning": "那家电影院没人气，明明是周日，观众席却空荡荡的。", "why_line": "形容电影院、餐厅或电车车厢里「冷冷清清、空无一人」。", "form_line": "空间空荡没人用「がらがら」；「ばらばら」形容东西散落一地，或者大家意见零散不统一。", "q_audio": "./audio/V-20261114-02_q.mp3?v=cb57751b", "exp_audio": "./audio/V-20261114-02_exp.mp3?v=9ce037b9", "is_listening": false}, "variants": []}, {"id": "N3-G16", "subject": "语法", "point": "〜しだい（一…就立即）", "point_key": "〜しだい", "family": "aspect_time", "modality": "memorize", "exam_weight": 2.6, "roi_score": 2.6, "teach": {"left": {"ja": "決まり ＋ しだい", "sub": "ます形词干 ＋ しだい ＝ 一…就立刻"}, "right": {"ja": "決まったしだい", "sub": "不能接过去式「た形」表一…就"}, "example_ja": "日程が決まりしだい、すぐメールでご連絡します。", "zh_meaning": "日程一定下来，我立刻发邮件联系您。", "audio": "./audio/N3-G16_exp.mp3?v=22c9056b"}, "primary": {"id": "N3-G16", "prompt": "日程が（　　）、すぐメールでご連絡します。", "choices": ["決まりしだい", "決まったしだい"], "answer": "決まりしだい", "full_ja": "日程が決まりしだい、すぐメールでご連絡します。", "zh_meaning": "日程一定下来，我立刻发邮件联系您。", "why_line": "职场里礼貌表达「一旦前事落定，紧接着立刻去做下一步」，固定用「しだい」。", "form_line": "「しだい」前面必须接动词ます形去掉「ます」（決まります → 決まりしだい），绝不能接过去式「決まった」。", "q_audio": "./audio/N3-G16_q.mp3?v=5c67dbea", "exp_audio": "./audio/N3-G16_exp.mp3?v=22c9056b", "is_listening": false}, "variants": []}, {"id": "N3-G17", "subject": "语法", "point": "〜どころか", "point_key": "〜どころか", "family": "reason_contrast", "modality": "both", "exam_weight": 2.6, "roi_score": 2.6, "teach": {"left": {"ja": "暇どころか…時間もない", "sub": "别说清闲了，甚至连吃饭都没空"}, "right": {"ja": "〜おかげで", "sub": "多亏了…（正面感谢原因）"}, "example_ja": "今週は暇どころか、昼ご飯を食べる時間もない。", "zh_meaning": "这周别说清闲了，连吃午饭的时间都没有。", "audio": "./audio/N3-G17_exp.mp3?v=304b21e9"}, "primary": {"id": "N3-G17", "prompt": "今週は暇（　　）、昼ご飯を食べる時間もない。", "choices": ["どころか", "おかげで"], "answer": "どころか", "full_ja": "今週は暇どころか、昼ご飯を食べる時間もない。", "zh_meaning": "这周别说清闲了，连吃午饭的时间都没有。", "why_line": "前后反差极大：先推翻「清闲」的猜测，再甩出完全相反的事实「忙到没空吃饭」。", "form_line": "名词「暇」直接接「どころか」表示「别说……甚至正相反」；「おかげで」是正面感谢「多亏了」，意思完全不对。", "q_audio": "./audio/N3-G17_q.mp3?v=8b71a4a3", "exp_audio": "./audio/N3-G17_exp.mp3?v=304b21e9", "is_listening": false}, "variants": []}, {"id": "N3-G18", "subject": "语法", "point": "〜めったに〜ない", "point_key": "〜めったに〜ない", "family": "star_syntax", "modality": "memorize", "exam_weight": 2.6, "roi_score": 2.6, "teach": {"left": {"ja": "めったに ＋ 飲まない", "sub": "100% 配否定（极少、难得）"}, "right": {"ja": "たいてい ＋ 飲む", "sub": "通常配肯定（大抵、一般）"}, "example_ja": "父はお酒をめったに飲まない。", "zh_meaning": "父亲极少喝酒。", "audio": "./audio/N3-G18_exp.mp3?v=dc0aefba"}, "primary": {"id": "N3-G18", "prompt": "父はお酒を（　　）飲まない。", "choices": ["めったに", "たいてい"], "answer": "めったに", "full_ja": "父はお酒をめったに飲まない。", "zh_meaning": "父亲极少喝酒。", "why_line": "句尾是否定「飲まない」，表达频率极低、「难得、极少做某事」。", "form_line": "「めったに」必须和句尾的否定「ない」配对使用；「たいてい（通常、大抵）」一般搭配肯定句。", "q_audio": "./audio/N3-G18_q.mp3?v=877e122d", "exp_audio": "./audio/N3-G18_exp.mp3?v=dc0aefba", "is_listening": false}, "variants": []}, {"id": "G-20261114-05", "subject": "语法", "point": "〜にしたがって", "point_key": "〜にしたがって", "family": "change_flow", "modality": "both", "exam_weight": 2.8, "roi_score": 2.576, "teach": {"left": {"ja": "〜にしたがって", "sub": "↗ 伴随同步渐变 · 台风越近，风雨越强（配 だんだん）"}, "right": {"ja": "〜ついでに", "sub": "🚶 人顺手做第二件事 · 散步顺便寄封信（自然现象禁用！）"}, "example_ja": "台風が近づくにしたがって、風も雨もだんだん強くなってきた。", "zh_meaning": "随着台风靠近，风和雨都渐渐变大了。", "audio": "./audio/G-20261114-05_exp.mp3?v=67120090"}, "primary": {"id": "G-20261114-05", "prompt": "台風が近づく（　　）、風も雨も強くなってきた。", "choices": ["にしたがって", "ついでに"], "answer": "にしたがって", "full_ja": "台風が近づくにしたがって、風も雨もだんだん強くなってきた。", "zh_meaning": "随着台风靠近，风和雨都渐渐变大了。", "why_line": "台风越走越近，风雨也跟着越来越大，两边是同步渐变的关系。", "form_line": "动词原形接「にしたがって」表示随着一方变化另一方也跟着变；「ついでに」是人做一件事时顺手做另一件事，自然现象不能用。", "q_audio": "./audio/G-20261114-05_q.mp3?v=772003c0", "exp_audio": "./audio/G-20261114-05_exp.mp3?v=67120090", "is_listening": false}, "variants": [{"id": "VAR-G05", "prompt": "スーパーへ買い物に行く（　　）、郵便局で手紙を出した。", "choices": ["ついでに", "にしたがって"], "answer": "ついでに", "full_ja": "スーパーへ買い物に行くついでに、郵便局で手紙を出した。", "zh_meaning": "去超市买东西的时候，顺便在邮局寄了封信。", "why_line": "去超市是主要行程，寄信只是半路顺手办的小事，属于「顺便做某事」。", "form_line": "动词原形接「ついでに」表示顺便；「にしたがって」则是随着一方变化另一方同步渐变。", "q_audio": "./audio/VAR-G05_q.mp3?v=a62d0247", "exp_audio": "./audio/VAR-G05_exp.mp3?v=b60b729e", "is_listening": false}]}, {"id": "GQ-20261114-01", "subject": "语法", "point": "〜っぱなし", "point_key": "〜っぱなし", "family": "aspect_time", "modality": "listen", "exam_weight": 2.5, "roi_score": 2.5, "teach": {"left": {"ja": "つけっぱなし", "sub": "Vます去ます ＋ っぱなし · 开着不管（电视没关就睡了）"}, "right": {"ja": "つけたばかり", "sub": "Vた ＋ ばかり / ところ · 刚刚才打开"}, "example_ja": "テレビをつけっぱなしで寝た。", "zh_meaning": "电视一直开着没关就睡着了。", "audio": "./audio/GQ-20261114-01_exp.mp3?v=73e5a7a3"}, "primary": {"id": "GQ-20261114-01", "prompt": "テレビをつけっぱなしで寝た。", "choices": ["一直开着没关", "刚刚才打开"], "answer": "一直开着没关", "full_ja": "テレビをつけっぱなしで寝た。", "zh_meaning": "电视一直开着没关就睡着了。", "why_line": "「っぱなし」专门描绘做完打开、摊开等动作后，就一直晾在那里没去收拾。", "form_line": "动词ます形「つけます」去掉「ます」接「っぱなし」就是一直开着；「刚刚才打开」日语要说「つけたばかり」。", "q_audio": "./audio/GQ-20261114-01_q.mp3?v=491bdf98", "exp_audio": "./audio/GQ-20261114-01_exp.mp3?v=73e5a7a3", "is_listening": false}, "variants": []}, {"id": "N3-G21", "subject": "语法", "point": "〜ことはない", "point_key": "〜ことはない", "family": "modal_end", "modality": "listen", "exam_weight": 2.4, "roi_score": 2.4, "teach": {"left": {"ja": "心配することはない", "sub": "原形 ＋ ことはない ＝ 没必要、用不着"}, "right": {"ja": "〜はずがない", "sub": "按理绝对不可能（100%否定推断）"}, "example_ja": "軽い風邪だから、そんなに心配することはないよ。", "zh_meaning": "只是轻微感冒，用不着那么担心哦。", "audio": "./audio/N3-G21_exp.mp3?v=9fbb9e73"}, "primary": {"id": "N3-G21", "prompt": "軽い風邪だから、そんなに心配する（　　）よ。", "choices": ["ことはない", "はずがない"], "answer": "ことはない", "full_ja": "軽い風邪だから、そんなに心配することはないよ。", "zh_meaning": "只是轻微感冒，用不着那么担心哦。", "why_line": "说话人是在温言宽慰对方「没必要那么紧张」，而不是推断「对方绝不可能担心」。", "form_line": "动词原形接「ことはない」意思是没必要、用不着；「はずがない」则是按理绝对不可能发生。", "q_audio": "./audio/N3-G21_q.mp3?v=485b6ad1", "exp_audio": "./audio/N3-G21_exp.mp3?v=9fbb9e73", "is_listening": false}, "variants": []}, {"id": "N3-G19", "subject": "语法", "point": "〜がちだ", "point_key": "〜がちだ", "family": "aspect_time", "modality": "both", "exam_weight": 2.4, "roi_score": 2.208, "teach": {"left": {"ja": "風邪をひきがち", "sub": "ます干/名词 ＋ がち ＝ 动不动就（负面）"}, "right": {"ja": "〜最中だ", "sub": "正在最酣处（接 ている）"}, "example_ja": "冬は空気が乾燥して、風邪をひきがちだ。", "zh_meaning": "冬天空气干燥，动不动就容易感冒。", "audio": "./audio/N3-G19_exp.mp3?v=f3ca9fc3"}, "primary": {"id": "N3-G19", "prompt": "冬は空気が乾燥して、風邪を（　　）だ。", "choices": ["ひきがち", "ひく最中"], "answer": "ひきがち", "full_ja": "冬は空気が乾燥して、風邪をひきがちだ。", "zh_meaning": "冬天空气干燥，动不动就容易感冒。", "why_line": "生病、迟到、忘带东西这类不太好的消极毛病「动不动就容易发生」，用「がち」。", "form_line": "动词ます形去掉「ます」加「がち」（ひきます → ひきがち）；「最中」表示正在做某事最起劲的当口，意思不通。", "q_audio": "./audio/N3-G19_q.mp3?v=dda9df3b", "exp_audio": "./audio/N3-G19_exp.mp3?v=f3ca9fc3", "is_listening": false}, "variants": []}, {"id": "G-20261114-12", "subject": "语法", "point": "〜ことになる", "point_key": "〜ことになる", "family": "rule_decide", "modality": "both", "exam_weight": 2.9, "roi_score": 1.798, "teach": {"left": {"ja": "行く＋こと＋になった", "sub": "动词原形＋形式名词こと＋になる · 定下来要去东京出差了"}, "right": {"ja": "行きますになった", "sub": "动词ます形不能直接接〜になった"}, "example_ja": "急な仕事が入って、来月から東京へ出張に行くことになった。", "zh_meaning": "突然来了紧急工作，定下来下个月去东京出差。", "audio": "./audio/G-20261114-12_exp.mp3?v=164a1236"}, "primary": {"id": "G-20261114-12", "prompt": "急な仕事が入って、来月から東京へ出張に（　　）。", "choices": ["行くことになった", "行きますになった", "行くものになった"], "answer": "行くことになった", "full_ja": "急な仕事が入って、来月から東京へ出張に行くことになった。", "zh_meaning": "突然来了紧急工作，定下来下个月去东京出差。", "why_line": "不是自己随心起意，而是公司或工作安排定下来的结果，日语用「ことになった」。", "form_line": "动词原形「行く」不能直接接「になった」，中间必须先加「こと」把动作名词化，说成「行くことになった」。", "q_audio": "./audio/G-20261114-12_q.mp3?v=a2818238", "exp_audio": "./audio/G-20261114-12_exp.mp3?v=164a1236", "is_listening": false}, "variants": [{"id": "VAR-G12", "prompt": "会議で話し合った結果、来週のイベントは中止する（　　）。", "choices": ["ことになった", "になった"], "answer": "ことになった", "full_ja": "会議で話し合った結果、来週のイベントは中止することになった。", "zh_meaning": "经过开会商讨，决定取消下周的活动。", "why_line": "经过会议集体商量后拍板定下来的组织决定，用「ことになった」。", "form_line": "动词「中止する」后面必须先加形式名词「こと」再接「になった」，不能直接说「中止するになった」。", "q_audio": "./audio/VAR-G12_q.mp3?v=ae704f27", "exp_audio": "./audio/VAR-G12_exp.mp3?v=96a40946", "is_listening": false}]}, {"id": "G-20261114-01", "subject": "语法", "point": "〜てくれる／もらう", "point_key": "〜てくれる／もらう", "family": "keigo_give", "modality": "both", "exam_weight": 3.0, "roi_score": 0.6, "teach": {"left": {"ja": "先輩に ＋ もらった", "sub": "我是主语（私は） · 我从前辈那儿「得到教导」"}, "right": {"ja": "先輩が ＋ くれた", "sub": "别人是主语（先輩が） · 前辈主动「教给了我」"}, "example_ja": "わからない問題があったので、私は先輩に解き方を教えてもらった。", "zh_meaning": "因为有不会的题，我请前辈教了我解法。", "audio": "./audio/G-20261114-01_exp.mp3?v=4cd91d0f"}, "primary": {"id": "G-20261114-01", "prompt": "私は先輩に解き方を教えて（　　）。", "choices": ["もらった", "くれた"], "answer": "もらった", "full_ja": "わからない問題があったので、私は先輩に解き方を教えてもらった。", "zh_meaning": "因为有不会的题，我请前辈教了我解法。", "why_line": "整句话的主语是「我」，前辈后面标了「に」，是站在「我从前辈那里得到帮助」的角度在说。", "form_line": "我得到帮助接「もらった」（教えてもらった）；只有主语是前辈主动帮我（先輩が）才用「くれた」。", "q_audio": "./audio/G-20261114-01_q.mp3?v=8bf34a3e", "exp_audio": "./audio/G-20261114-01_exp.mp3?v=4cd91d0f", "is_listening": false}, "variants": [{"id": "VAR-G01", "prompt": "道に迷っていたら、親切な人が駅まで案内して（　　）。", "choices": ["くれた", "もらった"], "answer": "くれた", "full_ja": "道に迷っていたら、親切な人が駅まで案内してくれた。", "zh_meaning": "正迷路的时候，一位热心人主动带我去了车站。", "why_line": "句子主语是「親切な人が（热心人）」，别人主动向我伸出援手，站在对方给我的方向说。", "form_line": "「别人が＋てくれた」（别人主动帮我）对应「私が＋てもらった」（我请别人帮我）。", "q_audio": "./audio/VAR-G01_q.mp3?v=586f1c26", "exp_audio": "./audio/VAR-G01_exp.mp3?v=54120a4c", "is_listening": false}]}, {"id": "G-20261114-02", "subject": "语法", "point": "〜ところだ", "point_key": "〜ところだ", "family": "aspect_time", "modality": "both", "exam_weight": 2.6, "roi_score": 0.52, "teach": {"left": {"ja": "食べたところ", "sub": "た形 ＋ ところ · 刚刚才做完（配 たった今）"}, "right": {"ja": "食べるところ", "sub": "原形 ＋ ところ · 正要开始做（配 これから）"}, "example_ja": "「昼ごはん、もう食べた？」「うん、たった今、食べたところだよ。」", "zh_meaning": "「午饭吃了吗？」「嗯，刚刚才吃完。」", "audio": "./audio/G-20261114-02_exp.mp3?v=91bec3be"}, "primary": {"id": "G-20261114-02", "prompt": "うん、たった今、食べた（　　）だよ。", "choices": ["ところ", "ばかりか"], "answer": "ところ", "full_ja": "「昼ごはん、もう食べた？」「うん、たった今、食べたところだよ。」", "zh_meaning": "「午饭吃了吗？」「嗯，刚刚才吃完。」", "why_line": "前面有「たった今（就在刚才）」，说明筷子刚放下没几秒钟。", "form_line": "动词过去式「食べた」加「ところだ」表示刚刚做完；「ばかりか」是「不仅如此反而」的意思，用在这里完全不通。", "q_audio": "./audio/G-20261114-02_q.mp3?v=81693f18", "exp_audio": "./audio/G-20261114-02_exp.mp3?v=91bec3be", "is_listening": false}, "variants": [{"id": "VAR-G02", "prompt": "「もう出発した？」「ううん、今から家を出る（　　）だよ。」", "choices": ["ところ", "ばかり"], "answer": "ところ", "full_ja": "「もう出発した？」「ううん、今から家を出るところだよ。」", "zh_meaning": "「已经出发了吗？」「还没呢，现在正要出门。」", "why_line": "前面说了「ううん、今から（还没，现在开始）」，说明脚刚迈出去、马上要出门。", "form_line": "动词原形「出る」接「ところだ」表示正要做某事；过去式「出たところ」才是刚刚出了门。", "q_audio": "./audio/VAR-G02_q.mp3?v=cfb854b5", "exp_audio": "./audio/VAR-G02_exp.mp3?v=efe2ddc3", "is_listening": false}]}, {"id": "G-20261114-03", "subject": "语法", "point": "〜からこそ", "point_key": "〜からこそ", "family": "reason_contrast", "modality": "both", "exam_weight": 2.4, "roi_score": 0.48, "teach": {"left": {"ja": "〜からこそ", "sub": "正向唯一核心原因 · 正因为苦练 → 才夺冠（〜のだ）"}, "right": {"ja": "〜くせに", "sub": "逆接＋责备不满 · 明明知道 → 却故意不说"}, "example_ja": "毎日こつこつ練習したからこそ、今日の試合で優勝できたのだ。", "zh_meaning": "正因为每天踏踏实实练习，今天比赛才拿到了冠军。", "audio": "./audio/G-20261114-03_exp.mp3?v=6a4f6980"}, "primary": {"id": "G-20261114-03", "prompt": "毎日こつこつ練習した（　　）、優勝できたのだ。", "choices": ["からこそ", "くせに"], "answer": "からこそ", "full_ja": "毎日こつこつ練習したからこそ、今日の試合で優勝できたのだ。", "zh_meaning": "正因为每天踏踏实实练习，今天比赛才拿到了冠军。", "why_line": "前后是积极的因果关系，想突出「正是靠着前面的努力，才换来后面的好结果」。", "form_line": "「から」表原因，「こそ」表强调，合起来「からこそ」就是正因为；「くせに」带责备语气（明明却），不能用来夸奖。", "q_audio": "./audio/G-20261114-03_q.mp3?v=d3af80cd", "exp_audio": "./audio/G-20261114-03_exp.mp3?v=6a4f6980", "is_listening": false}, "variants": []}, {"id": "G-20261114-04", "subject": "语法", "point": "〜ものだ", "point_key": "〜ものだ", "family": "modal_end", "modality": "listen", "exam_weight": 2.3, "roi_score": 0.46, "teach": {"left": {"ja": "泣くものだ", "sub": "自然天性・世间常理 · 小宝宝本来就是会哭的"}, "right": {"ja": "早く寝ることだ", "sub": "对别人的忠告建议 · 你最好早点睡觉"}, "example_ja": "赤ん坊は泣くものだから、そんなに心配しなくてもいいよ。", "zh_meaning": "小宝宝本来就是爱哭的，不用那么担心。", "audio": "./audio/G-20261114-04_exp.mp3?v=59801253"}, "primary": {"id": "G-20261114-04", "prompt": "赤ん坊は泣く（　　）だから、心配しなくてもいいよ。", "choices": ["もの", "こと"], "answer": "もの", "full_ja": "赤ん坊は泣くものだから、そんなに心配しなくてもいいよ。", "zh_meaning": "小宝宝本来就是爱哭的，不用那么担心。", "why_line": "说话人在宽慰对方：婴儿爱哭是自然天性和世间常理，不是什么异常情况。", "form_line": "动词原形接「ものだ」表示天性与常理（泣くものだ）；接「ことだ」则是忠告别人「你最好去做某事」。", "q_audio": "./audio/G-20261114-04_q.mp3?v=59407af1", "exp_audio": "./audio/G
