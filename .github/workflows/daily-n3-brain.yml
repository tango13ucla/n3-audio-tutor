name: Daily JLPT N3 Brain Refresh

on:
  schedule:
    # 07:00 AM PT (15:00 UTC in PST) and 09:00 PM PT (05:00 UTC in PST)
    - cron: '0 15 * * *'
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-brain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Neural TTS dependency
        run: pip install --quiet edge-tts certifi

      - name: Run N3 Brain Algorithm & Rebuild PWA
        run: python run_brain_algorithm.py

      - name: Commit & Push Updated State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add n3_live_state.json index.html audio/
          if ! git diff --cached --quiet; then
            git commit -m "chore(brain): daily N3 countdown & tutor refresh"
            git push
          else
            echo "No changes to commit."
          fi
