name: Daily JLPT N3 Brain Refresh

on:
  push:
    branches: [main]
    paths:
      - 'tutor_prefs.json'
      - 'radio_salon_*.py'
      - 'radio_dialogue_bank.py'
      - 'weak_expansion_*.py'
      - 'weak_explanations_bank.py'
      - 'clear_explanations.py'
      - 'phrase_and_word_lexicon.py'
      - 'sentence_lexicon.py'
      - 'compose_qq_music.py'
      - 'generate_daily_radio.py'
      - 'radio_review_builder.py'
      - 'radio_visual_studio.py'
      - 'visual_storyboards_vault.py'
      - 'jp_video_scripts_extra.py'
      - 'immersion_vocab_engine.py'
      - 'daily_news_salon_gen.py'
      - 'auto_author_daily_content.py'
      - 'public_memory_catalog.json'
      - 'world_perspective_catalog.json'
      - 'qq_corpus_knowledge.json'
      - 'generate_neural_audio.py'
      - 'build_html.py'
      - 'vocab_cards.py'
      - 'run_brain_algorithm.py'
      - 'sync_cloud_store.py'
      - 'tests_ci_guard.py'
      - 'audio/qq_real_*.wav'
      - '.github/workflows/daily-n3-brain.yml'
  schedule:
    # 12 SEPARATE independent cron entries (even UTC hours, odd non-zero minutes).
    # Why 12 separate entries instead of one `13,43 * * * *`?
    # Empirical Actions forensics (2026-11-18..21) proved GitHub serializes/deduplicates a single
    # cron expression while it sits in a 5-9h queue, creating a 7-9h dead zone after every run.
    # Distinct cron entries each get their own independent queue slot, and paired with
    # `morning-refresh-alarm.yml` (12 complementary slots) + the Overnight Precision Bridge
    # (01:00-03:59 PT -> hold to 04:05 AM PT), morning content is guaranteed live by ~04:10 AM PT!
    - cron: '11 0 * * *'
    - cron: '23 2 * * *'
    - cron: '37 4 * * *'
    - cron: '19 6 * * *'
    - cron: '41 8 * * *'
    - cron: '17 10 * * *'
    - cron: '7 12 * * *'
    - cron: '29 14 * * *'
    - cron: '43 16 * * *'
    - cron: '13 18 * * *'
    - cron: '31 20 * * *'
    - cron: '49 22 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Refresh mode (full, night_summary, radio_only, or quiz_only)'
        required: false
        default: 'full'

permissions:
  contents: write
  actions: read

jobs:
  refresh-brain:
    runs-on: ubuntu-latest
    timeout-minutes: 165
    concurrency:
      group: daily-n3-brain-active
      cancel-in-progress: false
    outputs:
      action_mode: ${{ steps.brain_step.outputs.action_mode }}
      chain_morning: ${{ steps.brain_step.outputs.chain_morning }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Fast Static & Practice-Log Regression Guard
        run: python tests_ci_guard.py

      - name: Run 02:00 AM Night Summary or 04:00+ AM Full N3 Brain Refresh
        id: brain_step
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          CRON_SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          DECISION=$(python - <<'PY'
          import datetime, json, os, subprocess, time, urllib.request
          from zoneinfo import ZoneInfo

          PT = ZoneInfo("America/Los_Angeles")
          now_pt = datetime.datetime.now(PT)
          study_pt = (now_pt - datetime.timedelta(hours=4)).strftime("%Y-%m-%d")
          ev = os.environ.get("EVENT_NAME", "")
          inp = os.environ.get("INPUT_MODE", "full")

          def bridge_already_active() -> bool:
              tok = os.environ.get("GITHUB_TOKEN", "")
              repo = os.environ.get("GITHUB_REPOSITORY", "")
              my_run = str(os.environ.get("GITHUB_RUN_ID", ""))
              if not tok or not repo:
                  return False
              try:
                  url = f"https://api.github.com/repos/{repo}/actions/runs?per_page=25"
                  req = urllib.request.Request(url, headers={
                      "Authorization": f"Bearer {tok}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "n3-brain-scheduler",
                  })
                  with urllib.request.urlopen(req, timeout=8) as r:
                      runs = json.loads(r.read().decode("utf-8")).get("workflow_runs") or []
                  for run in runs:
                      if run.get("status") not in ("queued", "in_progress", "waiting"):
                          continue
                      rid = str(run.get("id") or "")
                      if not rid or rid == my_run:
                          continue
                      jurl = f"https://api.github.com/repos/{repo}/actions/runs/{rid}/jobs"
                      jreq = urllib.request.Request(jurl, headers={
                          "Authorization": f"Bearer {tok}",
                          "Accept": "application/vnd.github+json",
                          "User-Agent": "n3-brain-scheduler",
                      })
                      with urllib.request.urlopen(jreq, timeout=8) as jr:
                          jobs = json.loads(jr.read().decode("utf-8")).get("jobs") or []
                      for jb in jobs:
                          if jb.get("name") == "morning-handoff" and jb.get("status") in ("queued", "in_progress", "waiting"):
                              return True
              except Exception:
                  pass
              return False

          if ev == "workflow_dispatch" and inp in ("quiz_only", "radio_only", "night_summary", "full"):
              print(f"{inp}|false")
              raise SystemExit(0)

          def read_night_closed() -> str:
              if os.path.exists("night_summary.json"):
                  try:
                      return str(json.load(open("night_summary.json", encoding="utf-8")).get("closed_study_day") or "")
                  except Exception:
                      return ""
              return ""

          night_closed = read_night_closed()

          # Stage 1 (00:05-03:59 AM PT): Widened Overnight Precision Bridge (nearly 4h catch net)!
          # If a tick lands at 00:05-01:59 PT, hold cleanly until 02:02 PT before closing out the day.
          # Once closed (or if already closed during 02:00-03:59 PT), arm the `morning-handoff` bridge
          # so today's new episode & 50 questions ALWAYS launch at 04:05 AM PT sharp regardless of cron lag!
          in_overnight_bridge = (now_pt.hour == 0 and now_pt.minute >= 5) or (1 <= now_pt.hour < 4)
          if ev == "schedule" and in_overnight_bridge:
              if now_pt.hour < 2:
                  if bridge_already_active():
                      print("noop|false")
                      raise SystemExit(0)
                  target_2am = now_pt.replace(hour=2, minute=2, second=0, microsecond=0)
                  wait_s = int((target_2am - now_pt).total_seconds())
                  if 0 < wait_s <= 7500:
                      time.sleep(wait_s)
                  subprocess.run(["git", "fetch", "origin", "main", "--quiet"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=False)
                  subprocess.run(["git", "reset", "--hard", "origin/main", "--quiet"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=False)
                  now_pt = datetime.datetime.now(PT)
                  study_pt = (now_pt - datetime.timedelta(hours=4)).strftime("%Y-%m-%d")
                  night_closed = read_night_closed()
              need_bridge = not bridge_already_active()
              if night_closed != study_pt:
                  print(f"night_summary|{'true' if need_bridge else 'false'}")
              elif need_bridge:
                  print("noop|true")
              else:
                  print("noop|false")
              raise SystemExit(0)

          if 2 <= now_pt.hour < 4 and night_closed != study_pt:
              print("night_summary|false")
              raise SystemExit(0)

          meta_date = ""
          radio_ver = ""
          if os.path.exists("audio/daily_radio_meta.json"):
              try:
                  _rm = json.load(open("audio/daily_radio_meta.json", encoding="utf-8"))
                  meta_date = _rm.get("date", "")
                  radio_ver = _rm.get("radio_ver", "")
              except Exception:
                  meta_date = ""

          # Stage 2 (>=04:00 AM PT): study_pt has flipped to the new day; flip immediately in pure cloud mode
          # unless the 04:05 AM PT morning-handoff bridge is already actively synthesizing today's edition.
          import re as _re_ver
          expected_ver_num = 47 if study_pt >= "2026-11-27" else (43 if study_pt >= "2026-11-26" else (42 if study_pt >= "2026-11-25" else (41 if study_pt >= "2026-11-23" else (40 if study_pt >= "2026-11-22" else 36))))
          _m_ver = _re_ver.match(r"^v(\d+)_", str(radio_ver or ""))
          cur_ver_num = int(_m_ver.group(1)) if _m_ver else 0
          if meta_date != study_pt or (study_pt >= "2026-11-19" and cur_ver_num < expected_ver_num):
              if ev == "schedule" and bridge_already_active():
                  print("noop|false")
              else:
                  print("full|false")
              raise SystemExit(0)

          need_new_vol = False
          need_new_cards = False
          need_listen_parts = False
          today_has_uchi = False
          try:
              from radio_dialogue_bank import SALON_STORIES
              rhist = (json.load(open("audio/radio_history.json", encoding="utf-8")).get("recent_days") or {}) if os.path.exists("audio/radio_history.json") else {}
              today_sids = set(rhist.get(study_pt) or [])
              today_has_uchi = any(str(s).startswith("uchi") or str(s).startswith("live_nhk_news_") for s in today_sids)
              past_sids = {sid for d, sids in rhist.items() if d < study_pt for sid in (sids or [])}
              if SALON_STORIES and not today_has_uchi:
                  top_st = SALON_STORIES[0]
                  top_id = str(top_st.get("id") or "")
                  if (top_id.startswith("uchi") or top_st.get("tier") == "uchi_intellectual") and top_id not in past_sids and top_id not in today_sids:
                      need_new_vol = True
          except Exception:
              pass
          try:
              import re
              from clear_explanations import CARDS_75
              from weak_explanations_bank import NEW_CARDS_AUDIO
              mf = json.load(open("audio/audio_manifest.json", encoding="utf-8")) if os.path.exists("audio/audio_manifest.json") else {}
              for cid in NEW_CARDS_AUDIO:
                  q_rel = (mf.get(f"meta:{cid}") or {}).get("q_audio", "")
                  q_clean = q_rel.split("?")[0].lstrip("./") if q_rel else ""
                  if not q_clean or not os.path.exists(q_clean):
                      need_new_cards = True
                      break
              for cid, cobj in CARDS_75.items():
                  qt = cobj.get("q_turns") or []
                  if len(cobj.get("choices") or []) == 3 and sum(1 for s, t in qt if s in ("JF", "JM") and re.match(r"^(?:いち|に|さん)[。、\s]", str(t))) == 3:
                      if not (mf.get(f"meta:{cid}") or {}).get("listen_parts"):
                          need_listen_parts = True
                          break
          except Exception:
              pass
          if need_new_vol:
              print("full|false")
              raise SystemExit(0)
          if need_new_cards or need_listen_parts:
              # Today's edition is already live; quietly pre-bake new card MP3s & listen_parts without touching active HTML!
              print("prebake_cards|false")
              raise SystemExit(0)
          if ev == "schedule":
              baked_epoch = 0
              if os.path.exists("n3_live_state.json"):
                  try:
                      baked_epoch = int(json.load(open("n3_live_state.json", encoding="utf-8")).get("_baked_epoch") or 0)
                  except Exception:
                      baked_epoch = 0
              age_sec = int(now_pt.timestamp()) - baked_epoch
              if now_pt.hour < 6 or age_sec < 3 * 3600:
                  print("noop|false")
                  raise SystemExit(0)
          print("sync_check|false")
          PY
          )
          ACTION_MODE="${DECISION%%|*}"
          CHAIN_MORNING="${DECISION##*|}"
          echo "[mode] ACTION_MODE=$ACTION_MODE CHAIN_MORNING=$CHAIN_MORNING"
          echo "action_mode=$ACTION_MODE" >> "$GITHUB_OUTPUT"
          echo "chain_morning=$CHAIN_MORNING" >> "$GITHUB_OUTPUT"
          if [ "$ACTION_MODE" = "noop" ]; then
            echo "[noop] Today's content & recent sync are already up to date (chain_morning=$CHAIN_MORNING)."
            exit 0
          elif [ "$ACTION_MODE" = "night_summary" ]; then
            python auto_author_daily_content.py --mode night-summary
            if python - <<'PY'
          import json, os, sys
          st = json.load(open("n3_live_state.json", encoding="utf-8"))
          mf = json.load(open("audio/audio_manifest.json", encoding="utf-8")) if os.path.exists("audio/audio_manifest.json") else {}
          vc_mf = mf.get("vocab_cards") or {}
          missing = [p["word"] for p in st.get("vocab_tracked", []) if p.get("word") and p["word"] not in vc_mf]
          sys.exit(0 if missing else 1)
          PY
            then
              sudo apt-get update -qq
              sudo apt-get install -y -qq --no-install-recommends ffmpeg
              pip install --quiet -U edge-tts certifi pykakasi
              python generate_neural_audio.py
            fi
          elif [ "$ACTION_MODE" = "prebake_cards" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg
            pip install --quiet -U edge-tts certifi pykakasi
            python generate_neural_audio.py
          elif [ "$ACTION_MODE" = "quiz_only" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg
            pip install --quiet -U edge-tts certifi pykakasi
            python run_brain_algorithm.py --quiz-only
          elif [ "$ACTION_MODE" = "radio_only" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-noto-cjk
            pip install --quiet -U numpy scipy pillow edge-tts certifi google-genai pykakasi jieba
            python run_brain_algorithm.py --radio-only
          elif [ "$ACTION_MODE" = "full" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-noto-cjk
            pip install --quiet -U numpy scipy pillow edge-tts certifi google-genai pykakasi jieba
            python auto_author_daily_content.py --mode morning-prepare
            for try_i in 1 2; do
              if python run_brain_algorithm.py; then
                break
              fi
              echo "[retry] run_brain_algorithm attempt ${try_i} failed, retrying in 15s..."
              sleep 15
              [ "$try_i" -eq 2 ] && exit 1
            done
          else
            python run_brain_algorithm.py --sync-only
            if python - <<'PY'
          import json, os, sys
          st = json.load(open("n3_live_state.json", encoding="utf-8"))
          mf = json.load(open("audio/audio_manifest.json", encoding="utf-8")) if os.path.exists("audio/audio_manifest.json") else {}
          vc_mf = mf.get("vocab_cards") or {}
          missing = [p["word"] for p in st.get("vocab_tracked", []) if p.get("word") and p["word"] not in vc_mf]
          if missing:
              print(f"[auto-audio] {len(missing)} newly enrolled vocab words need studio MP3s: {missing[:8]}")
              sys.exit(0)
          sys.exit(1)
          PY
            then
              sudo apt-get update -qq
              sudo apt-get install -y -qq --no-install-recommends ffmpeg
              pip install --quiet -U edge-tts certifi pykakasi
              python generate_neural_audio.py
            fi
          fi

      - name: Commit & Push Updated State
        if: steps.brain_step.outputs.action_mode != 'noop'
        env:
          ACTION_MODE: ${{ steps.brain_step.outputs.action_mode }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          STAGE_DIR=$(mktemp -d)
          cp -a audio "$STAGE_DIR/"
          [ -d video ] && cp -a video "$STAGE_DIR/" || true
          [ -d img ] && cp -a img "$STAGE_DIR/" || true
          for f in n3_live_state.json practice_log.jsonl cloud_sync_config.json cloud_state_snapshot.json tutor_prefs.json night_summary.json lookup_weakness_ledger.md qq_corpus_knowledge.json grok_daily_brief.md grok_daily_brief.json brain_plan_*.json; do
            [ -f "$f" ] && cp -a "$f" "$STAGE_DIR/" || true
          done
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp -a "$STAGE_DIR/audio/." audio/
            if [ -d "$STAGE_DIR/video" ]; then rm -rf video && cp -a "$STAGE_DIR/video" ./; fi
            if [ -d "$STAGE_DIR/img" ]; then mkdir -p img && cp -a "$STAGE_DIR/img/." img/; fi
            for sf in "$STAGE_DIR"/*.json "$STAGE_DIR"/*.jsonl "$STAGE_DIR"/*.md; do
              [ -f "$sf" ] && cp -a "$sf" ./ || true
            done
            if [ "$ACTION_MODE" = "full" ] || [ "$ACTION_MODE" = "quiz_only" ] || [ "$ACTION_MODE" = "radio_only" ]; then
              python build_html.py
            fi
            git add n3_live_state.json practice_log.jsonl cloud_sync_config.json cloud_state_snapshot.json tutor_prefs.json grok_daily_brief.md grok_daily_brief.json brain_plan_*.json index.html sw.js audio/
            [ -d video ] && git add -A video/ || true
            [ -d img ] && git add -A img/ || true
            [ -f night_summary.json ] && git add night_summary.json || true
            [ -f lookup_weakness_ledger.md ] && git add lookup_weakness_ledger.md || true
            [ -f qq_corpus_knowledge.json ] && git add qq_corpus_knowledge.json || true
            if git diff --cached --quiet; then
              echo "No changes to commit."
              break
            fi
            git commit -m "chore(sync): ${ACTION_MODE} N3 progress & studio audio sync"
            if git push origin main; then
              break
            fi
            sleep 2
          done
          rm -rf "$STAGE_DIR"

  morning-handoff:
    name: morning-handoff
    needs: refresh-brain
    if: needs.refresh-brain.outputs.chain_morning == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 210
    concurrency:
      group: daily-n3-morning-bridge
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Wait Precisely Until 04:05 AM PT Then Synthesize & Launch New Day
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          NEED_RUN=$(python - <<'PY'
          import datetime, json, subprocess, sys, time
          from zoneinfo import ZoneInfo

          PT = ZoneInfo("America/Los_Angeles")
          now_pt = datetime.datetime.now(PT)
          target_pt = now_pt.replace(hour=4, minute=5, second=0, microsecond=0)
          if now_pt.hour >= 4:
              target_pt = now_pt
          print(f"[bridge] Armed at {now_pt.strftime('%Y-%m-%d %H:%M:%S %Z')}, launching at {target_pt.strftime('%Y-%m-%d %H:%M:%S %Z')}", file=sys.stderr, flush=True)
          while True:
              now_pt = datetime.datetime.now(PT)
              rem = (target_pt - now_pt).total_seconds()
              if rem <= 0:
                  break
              time.sleep(min(60, rem))
              if int(rem) % 300 < 60:
                  subprocess.run(["git", "fetch", "origin", "main", "--quiet"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=False)
                  subprocess.run(["git", "reset", "--hard", "origin/main", "--quiet"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=False)
                  study_target = target_pt.strftime("%Y-%m-%d")
                  try:
                      md = json.load(open("audio/daily_radio_meta.json", encoding="utf-8")).get("date", "")
                      if md == study_target:
                          print("already_done")
                          raise SystemExit(0)
                  except Exception:
                      pass
          subprocess.run(["git", "fetch", "origin", "main", "--quiet"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=False)
          subprocess.run(["git", "reset", "--hard", "origin/main", "--quiet"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=False)
          now_pt = datetime.datetime.now(PT)
          study_pt = (now_pt - datetime.timedelta(hours=4)).strftime("%Y-%m-%d")
          try:
              md = json.load(open("audio/daily_radio_meta.json", encoding="utf-8")).get("date", "")
              if md == study_pt:
                  print("already_done")
                  raise SystemExit(0)
          except Exception:
              pass
          print("run_full")
          PY
          )
          NEED_RUN=$(echo "$NEED_RUN" | tail -n 1)
          echo "[bridge] status=$NEED_RUN"
          if [ "$NEED_RUN" != "run_full" ]; then
            echo "[bridge] Today's morning refresh is already live; exiting cleanly."
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-noto-cjk
          pip install --quiet -U numpy scipy pillow edge-tts certifi google-genai pykakasi jieba
          python auto_author_daily_content.py --mode morning-prepare
          for try_i in 1 2; do
            if python run_brain_algorithm.py; then
              break
            fi
            echo "[retry] run_brain_algorithm attempt ${try_i} failed, retrying in 15s..."
            sleep 15
            [ "$try_i" -eq 2 ] && exit 1
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          STAGE_DIR=$(mktemp -d)
          cp -a audio "$STAGE_DIR/"
          [ -d video ] && cp -a video "$STAGE_DIR/" || true
          [ -d img ] && cp -a img "$STAGE_DIR/" || true
          for f in n3_live_state.json practice_log.jsonl cloud_sync_config.json cloud_state_snapshot.json tutor_prefs.json night_summary.json lookup_weakness_ledger.md qq_corpus_knowledge.json grok_daily_brief.md grok_daily_brief.json brain_plan_*.json; do
            [ -f "$f" ] && cp -a "$f" "$STAGE_DIR/" || true
          done
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp -a "$STAGE_DIR/audio/." audio/
            if [ -d "$STAGE_DIR/video" ]; then rm -rf video && cp -a "$STAGE_DIR/video" ./; fi
            if [ -d "$STAGE_DIR/img" ]; then mkdir -p img && cp -a "$STAGE_DIR/img/." img/; fi
            for sf in "$STAGE_DIR"/*.json "$STAGE_DIR"/*.jsonl "$STAGE_DIR"/*.md; do
              [ -f "$sf" ] && cp -a "$sf" ./ || true
            done
            python build_html.py
            git add n3_live_state.json practice_log.jsonl cloud_sync_config.json cloud_state_snapshot.json tutor_prefs.json grok_daily_brief.md grok_daily_brief.json brain_plan_*.json index.html sw.js audio/
            [ -d video ] && git add -A video/ || true
            [ -d img ] && git add -A img/ || true
            [ -f night_summary.json ] && git add night_summary.json || true
            [ -f lookup_weakness_ledger.md ] && git add lookup_weakness_ledger.md || true
            [ -f qq_corpus_knowledge.json ] && git add qq_corpus_knowledge.json || true
            if git diff --cached --quiet; then
              echo "No changes to commit."
              break
            fi
            git commit -m "chore(sync): morning-bridge 04:05 PT N3 full refresh"
            if git push origin main; then
              break
            fi
            sleep 2
          done
          rm -rf "$STAGE_DIR"
