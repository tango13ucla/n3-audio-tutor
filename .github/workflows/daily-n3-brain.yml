name: Daily JLPT N3 Brain Refresh

on:
  schedule:
    # Early-morning full episode + daily deck synthesis at 05:35 AM PT (13:35 UTC) + 07:00 AM PT backup (15:00 UTC)
    - cron: '35 13 * * *'
    - cron: '0 15 * * *'
    # Archive multi-platform cloud answers & self-heal daily build every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-brain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Cloud Sync or Full N3 Brain Audio Refresh
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          CRON_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if python - <<'PY'
          import datetime, json, os, sys
          from zoneinfo import ZoneInfo
          now_pt = datetime.datetime.now(ZoneInfo("America/Los_Angeles"))
          study_pt = (now_pt - datetime.timedelta(hours=5)).strftime("%Y-%m-%d")
          ev = os.environ.get("EVENT_NAME", "")
          meta_date = ""
          if os.path.exists("audio/daily_radio_meta.json"):
              try:
                  meta_date = json.load(open("audio/daily_radio_meta.json", encoding="utf-8")).get("date", "")
              except Exception:
                  meta_date = ""
          need_full = (ev == "workflow_dispatch") or (meta_date != study_pt)
          print(f"[schedule-check] now_pt={now_pt.strftime('%Y-%m-%d %H:%M PT')}, study_pt={study_pt}, meta_date={meta_date}, event={ev} -> need_full={need_full}")
          sys.exit(0 if need_full else 1)
          PY
          then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg
            pip install --quiet -U edge-tts certifi google-genai pykakasi
            python run_brain_algorithm.py
          else
            python run_brain_algorithm.py --sync-only
          fi

      - name: Commit & Push Updated State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          STAGE_DIR=$(mktemp -d)
          cp -a audio "$STAGE_DIR/"
          for f in n3_live_state.json practice_log.jsonl cloud_sync_config.json cloud_state_snapshot.json; do
            [ -f "$f" ] && cp -a "$f" "$STAGE_DIR/" || true
          done
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp -a "$STAGE_DIR/audio/." audio/
            for f in n3_live_state.json practice_log.jsonl cloud_sync_config.json cloud_state_snapshot.json; do
              [ -f "$STAGE_DIR/$f" ] && cp -a "$STAGE_DIR/$f" "$f" || true
            done
            python build_html.py
            git add n3_live_state.json practice_log.jsonl cloud_sync_config.json cloud_state_snapshot.json index.html sw.js audio/
            if git diff --cached --quiet; then
              echo "No changes to commit."
              break
            fi
            git commit -m "chore(sync): multi-platform N3 progress & studio audio sync"
            if git push origin main; then
              break
            fi
            sleep 2
          done
          rm -rf "$STAGE_DIR"
