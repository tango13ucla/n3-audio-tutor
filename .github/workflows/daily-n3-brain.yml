name: Daily JLPT N3 Brain Refresh

on:
  schedule:
    # Archive multi-platform cloud sync every 4 hours + full daily audio refresh at 07:00 AM PT (15:00 UTC)
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-brain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Cloud Sync or Full N3 Brain Audio Refresh
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          CRON_SCHEDULE: ${{ github.event.schedule }}
        run: |
          HOUR_UTC=$(date -u +%H)
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$HOUR_UTC" = "15" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg
            pip install --quiet -U edge-tts certifi google-genai
            python run_brain_algorithm.py
          else
            python run_brain_algorithm.py --sync-only
          fi

      - name: Commit & Push Updated State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add n3_live_state.json practice_log.jsonl cloud_sync_config.json cloud_state_snapshot.json index.html sw.js audio/
          if ! git diff --cached --quiet; then
            git pull --rebase origin main || true
            git commit -m "chore(sync): multi-platform N3 progress & studio audio sync"
            git push
          else
            echo "No changes to commit."
          fi
