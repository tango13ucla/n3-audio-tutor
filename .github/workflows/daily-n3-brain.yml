name: Daily JLPT N3 Brain Refresh

on:
  push:
    branches: [main]
    paths:
      - 'tutor_prefs.json'
      - 'radio_salon_*.py'
      - 'radio_dialogue_bank.py'
      - 'weak_expansion_*.py'
      - 'weak_explanations_bank.py'
  schedule:
    # Early-morning full episode + daily deck synthesis at 05:11 AM, 05:23 AM, 06:18 AM, and 07:00 AM PT
    - cron: '11 13 * * *'
    - cron: '23 13 * * *'
    - cron: '18 14 * * *'
    - cron: '0 15 * * *'
    # Ingest cloud answers + Grok ntfy batches & refresh Grok daily brief every 4 hours (off-peak minute :17)
    - cron: '17 */4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Refresh mode (full, radio_only, or quiz_only)'
        required: false
        default: 'full'

concurrency:
  group: daily-n3-brain
  cancel-in-progress: false

permissions:
  contents: write
  models: read

jobs:
  refresh-brain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Cloud Sync or Full N3 Brain Audio Refresh
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          CRON_SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          ACTION_MODE=$(python - <<'PY'
          import datetime, json, os
          from zoneinfo import ZoneInfo
          now_pt = datetime.datetime.now(ZoneInfo("America/Los_Angeles"))
          study_pt = (now_pt - datetime.timedelta(hours=5)).strftime("%Y-%m-%d")
          ev = os.environ.get("EVENT_NAME", "")
          inp = os.environ.get("INPUT_MODE", "full")
          if ev == "workflow_dispatch" and inp in ("quiz_only", "radio_only"):
              print(inp)
              raise SystemExit(0)
          meta_date = ""
          if os.path.exists("audio/daily_radio_meta.json"):
              try:
                  meta_date = json.load(open("audio/daily_radio_meta.json", encoding="utf-8")).get("date", "")
              except Exception:
                  meta_date = ""
          if ev == "workflow_dispatch" or meta_date != study_pt:
              print("full")
              raise SystemExit(0)
          need_new_vol = False
          need_new_cards = False
          try:
              from radio_dialogue_bank import SALON_STORIES
              rhist = (json.load(open("audio/radio_history.json", encoding="utf-8")).get("recent_days") or {}) if os.path.exists("audio/radio_history.json") else {}
              today_sids = set(rhist.get(study_pt) or [])
              past_sids = {sid for d, sids in rhist.items() if d < study_pt for sid in (sids or [])}
              if SALON_STORIES:
                  top_st = SALON_STORIES[0]
                  top_id = str(top_st.get("id") or "")
                  if (top_id.startswith("uchi") or top_st.get("tier") == "uchi_intellectual") and top_id not in past_sids and top_id not in today_sids:
                      need_new_vol = True
          except Exception:
              pass
          try:
              from weak_explanations_bank import NEW_CARDS_AUDIO
              mf = json.load(open("audio/audio_manifest.json", encoding="utf-8")) if os.path.exists("audio/audio_manifest.json") else {}
              for cid in NEW_CARDS_AUDIO:
                  q_rel = (mf.get(f"meta:{cid}") or {}).get("q_audio", "")
                  if not q_rel or not os.path.exists(q_rel):
                      need_new_cards = True
                      break
          except Exception:
              pass
          if need_new_vol:
              print("full")
              raise SystemExit(0)
          if need_new_cards:
              print("quiz_only")
              raise SystemExit(0)
          print("sync_check")
          PY
          )
          echo "[mode] ACTION_MODE=$ACTION_MODE"
          if [ "$ACTION_MODE" = "quiz_only" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg
            pip install --quiet -U edge-tts certifi pykakasi
            python run_brain_algorithm.py --quiz-only
          elif [ "$ACTION_MODE" = "radio_only" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg
            pip install --quiet -U numpy edge-tts certifi google-genai pykakasi
            python run_brain_algorithm.py --radio-only
          elif [ "$ACTION_MODE" = "full" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg
            pip install --quiet -U numpy edge-tts certifi google-genai pykakasi
            python run_brain_algorithm.py
          else
            python run_brain_algorithm.py --sync-only
            if python - <<'PY'
          import json, os, sys
          st = json.load(open("n3_live_state.json", encoding="utf-8"))
          mf = json.load(open("audio/audio_manifest.json", encoding="utf-8")) if os.path.exists("audio/audio_manifest.json") else {}
          vc_mf = mf.get("vocab_cards") or {}
          missing = [p["word"] for p in st.get("vocab_tracked", []) if p.get("word") and p["word"] not in vc_mf]
          if missing:
              print(f"[auto-audio] {len(missing)} newly enrolled vocab words need studio MP3s: {missing[:8]}")
              sys.exit(0)
          sys.exit(1)
          PY
            then
              sudo apt-get update -qq
              sudo apt-get install -y -qq --no-install-recommends ffmpeg
              pip install --quiet -U edge-tts certifi pykakasi
              python generate_neural_audio.py
              python build_html.py
            fi
          fi

      - name: Commit & Push Updated State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          STAGE_DIR=$(mktemp -d)
          cp -a audio "$STAGE_DIR/"
          for f in n3_live_state.json practice_log.jsonl cloud_sync_config.json cloud_state_snapshot.json grok_daily_brief.md grok_daily_brief.json brain_plan_*.json; do
            [ -f "$f" ] && cp -a "$f" "$STAGE_DIR/" || true
          done
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp -a "$STAGE_DIR/audio/." audio/
            for sf in "$STAGE_DIR"/*.json "$STAGE_DIR"/*.jsonl "$STAGE_DIR"/*.md; do
              [ -f "$sf" ] && cp -a "$sf" ./ || true
            done
            python build_html.py
            git add n3_live_state.json practice_log.jsonl cloud_sync_config.json cloud_state_snapshot.json grok_daily_brief.md grok_daily_brief.json brain_plan_*.json index.html sw.js audio/
            if git diff --cached --quiet; then
              echo "No changes to commit."
              break
            fi
            git commit -m "chore(sync): multi-platform N3 progress & studio audio sync"
            if git push origin main; then
              break
            fi
            sleep 2
          done
          rm -rf "$STAGE_DIR"
